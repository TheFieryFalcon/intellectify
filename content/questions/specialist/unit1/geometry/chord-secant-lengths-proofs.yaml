- id: spec.geometry.chord-secant-lengths.power-inside
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1600
  responseSkills: { reasoning: 1590, proof: 1590, clarity: 1550 }
  stem: |
    $X$ is a point inside a circle with center $O$ and radius $r$, with $OX = d$. Prove that every chord $AB$ through $X$ has $AX \times XB = r^2 - d^2$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [0.883, -1.794], B: [1.214, 1.59], X: [1, -0.6], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: O, to: X, label: 'd', dashed: true }
      - { type: segment, from: O, to: A, label: 'r', dashed: true }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: X, label: 'X', pos: se }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'diameter', description: "The diameter through X meets the circle at points r − d and r + d from X", points: 2, dimension: reasoning }
          - { id: 'product', description: "Intersecting chords with that diameter: AX × XB = (r − d)(r + d)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "= r² − d², the same for every chord through X", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    The diameter through $X$ (any diameter, if $X = O$) meets the circle at $P$ and $Q$ with $XP = r - d$ and $XQ = r + d$. For any chord $AB$ through $X$, the intersecting chords theorem gives $AX \times XB = XP \times XQ = (r - d)(r + d) = r^2 - d^2$.

- id: spec.geometry.chord-secant-lengths.power-outside
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1520
  responseSkills: { reasoning: 1510, proof: 1510, clarity: 1470 }
  stem: |
    $M$ is a point outside a circle with center $O$ and radius $r$, with $OM = d$. Prove that every secant from $M$, cutting the circle at $A$ and $B$, has $MA \times MB = d^2 - r^2$.

    ```diagram
    view: [-2.45, 4.05, -2.45, 2.45]
    width: 230
    points: { M: [3.6, 0], A: [1.908, 0.598], B: [-1.108, 1.665], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: B }
      - { type: segment, from: O, to: M, label: 'd', dashed: true, side: right }
      - { type: segment, from: O, to: B, label: 'r', dashed: true }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: A, label: 'A', pos: s }
      - { type: point, at: B, label: 'B', pos: sw }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'tangent', description: "A tangent MT has MT ⟂ OT, so MT² = d² − r² (Pythagoras)", points: 2, dimension: reasoning }
          - { id: 'secant', description: "Tangent–secant theorem: MA × MB = MT²", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "So MA × MB = d² − r² for every secant", points: 1, dimension: proof }
