  stem: |
    Forces ${{a1}}\mathbf{i} + ({{a2}})\mathbf{j}$ N and ${{b1}}\mathbf{i} + {{b2}}\mathbf{j}$ N act on a particle. Find the third force that keeps the particle in equilibrium.
  parts:
    - id: a
      answer: { type: vector, key: ['-({{a1}}+({{b1}}))', '-({{a2}}+{{b2}})'] }
