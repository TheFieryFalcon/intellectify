- id: spec.geometry.circle-angles.triangle-center
  skills: {primary: spec.geometry.circle-angles}
  rating: 1500
  responseSkills: {calculation: 1480, reasoning: 1490, synthesis: 1460}
  stem: |
    Triangle $ABC$ is drawn inside a circle with center $O$, with all three corners on the circle. $\angle BAC = 50^\circ$ and $\angle ABC = 70^\circ$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-0.684, 1.879], B: [-1.638, -1.147], C: [1.638, -1.147], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: polygon, points: [A, B, C] }
      - { type: segment, from: O, to: B, color: muted }
      - { type: segment, from: O, to: C, color: muted }
      - { type: angle, at: A, from: B, to: C, label: '50^\circ', radius: 22 }
      - { type: angle, at: B, from: C, to: A, label: '70^\circ', radius: 22 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: O, label: 'O', pos: n }
    ```
  parts:
  - id: a
    prompt: Find $\angle BOC$ (°).
    answer: {type: numeric, key: '100'}
  - id: b
    prompt: Find $\angle OBC$ (°).
    answer: {type: numeric, key: '40'}
  solution: |
    (a) $\angle BOC = 2\angle BAC = 100^\circ$ (angle at the center; the triangle's angles are all acute, so $O$ and $A$ are on the same side of $BC$).
    (b) $OB = OC$ (radii): $\angle OBC = \tfrac{1}{2}(180^\circ - 100^\circ) = 40^\circ$.
  verify: |
    def answers():
        # Central angles: BC = 2*50 = 100, CA = 2*70 = 140, AB = 2*60 = 120.
        B = on_circle(220)
        C = on_circle(220 + 100)
        A = on_circle(220 + 100 + 140)
        assert abs(angle_at(B, A, C) - 50) < 1e-9 and abs(angle_at(A, B, C) - 70) < 1e-9
        O = (0, 0)
        return {"a": approx(angle_at(B, O, C)), "b": approx(angle_at(O, B, C))}
- id: spec.geometry.circle-angles.cyclic-proof
  skills: {primary: spec.geometry.circle-angles}
  rating: 1530
  responseSkills: {reasoning: 1520, proof: 1520, clarity: 1450}
  stem: |
    Use the angle-at-the-center theorem to prove that the opposite angles of a cyclic quadrilateral add to $180^\circ$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: setup, description: Cyclic quadrilateral ABCD with center O; joins OB and OD, points: 1, dimension: reasoning}
      - {id: double, description: ∠BOD (one side) = 2∠A and the reflex ∠BOD (other side) = 2∠C, points: 2, dimension: reasoning}
      - {id: sum, description: 'These make a full turn: 2∠A + 2∠C = 360°, so ∠A + ∠C = 180°', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Let $ABCD$ be cyclic with center $O$. Join $OB$ and $OD$. $\angle A$ stands on arc $BCD$ and $\angle C$ on arc $BAD$. The angles at the center on these arcs are $2\angle A$ and $2\angle C$, and together they make a full turn: $2\angle A + 2\angle C = 360^\circ$. So $\angle A + \angle C = 180^\circ$, and likewise $\angle B + \angle D = 180^\circ$.
- id: spec.geometry.circle-angles.obc-general
  skills: {primary: spec.geometry.circle-angles}
  rating: 1580
  responseSkills: {calculation: 1520, reasoning: 1570, synthesis: 1570}
  stem: |
    Triangle $ABC$ has all three corners on a circle with center $O$, and $\angle BAC = x^\circ$ is acute. Find $\angle OBC$ in terms of $x$.
  parts:
  - id: a
    prompt: $\angle OBC$ (°)
    answer:
      type: expression
      key: 90-x
      vars:
        x:
          domain: [10, 80]
  solution: |
    $\angle BOC = 2x^\circ$ (angle at the center; $x$ is acute, so $A$ and $O$ are on the same side of $BC$). $OB = OC$, so $\angle OBC = \tfrac{1}{2}(180^\circ - 2x^\circ) = (90 - x)^\circ$.
  verify: |
    def answers():
        x = symbols("x")
        for xv in (20, 35, 50, 70):
            B, C, A = on_circle(270 - xv), on_circle(270 + xv), on_circle(90 + 15)
            assert abs(angle_at(B, A, C) - xv) < 1e-9
            assert abs(angle_at((0, 0), B, C) - (90 - xv)) < 1e-9
        return {"a": 90 - x}
- id: spec.geometry.circle-angles.equal-sides-angle
  skills: {primary: spec.geometry.circle-angles}
  rating: 1620
  responseSkills: {calculation: 1560, reasoning: 1610, synthesis: 1600}
  stem: |
    $ABCD$ is a cyclic quadrilateral with $AB = BC$ and $\angle ABC = 110^\circ$. Find $\angle BDC$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.879, 0.684], B: [0, 2], C: [1.879, 0.684], D: [-0, -2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: polygon, points: [A, B, C, D] }
      - { type: segment, from: B, to: D }
      - { type: segment, from: A, to: B, ticks: 1 }
      - { type: segment, from: B, to: C, ticks: 1 }
      - { type: angle, at: B, from: C, to: A, label: '110^\circ', radius: 16 }
      - { type: angle, at: D, from: B, to: C, radius: 26 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
  - id: a
    prompt: $\angle BDC$ (°)
    answer: {type: numeric, key: '35'}
  solution: |
    Join $AC$. Triangle $ABC$ is isosceles with $AB = BC$, so $\angle BAC = \angle BCA = \tfrac{1}{2}(180^\circ - 110^\circ) = 35^\circ$. $\angle BDC$ and $\angle BAC$ stand on the same arc $BC$: $\angle BDC = 35^\circ$.
  verify: |
    def answers():
        B = on_circle(90)
        A, C = on_circle(90 + 70), on_circle(90 - 70)
        D = on_circle(270)
        assert abs(angle_at(A, B, C) - 110) < 1e-9 and abs(dist(A, B) - dist(B, C)) < 1e-9
        return {"a": approx(angle_at(B, D, C))}
- id: spec.geometry.circle-angles.bow-tie
  skills: {primary: spec.geometry.circle-angles}
  rating: 1650
