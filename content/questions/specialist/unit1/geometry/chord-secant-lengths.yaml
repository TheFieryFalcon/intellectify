- id: spec.geometry.chord-secant-lengths.prove-tangent-secant
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1600
  responseSkills: {proof: 1590, clarity: 1500}
  stem: |
    From an outside point $M$, a tangent touches a circle at $T$ and a secant cuts it at $A$ and $B$ ($A$ nearer $M$). Prove that $MT^2 = MA \times MB$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: join, description: Joins TA and TB, points: 1, dimension: proof}
      - {id: angles, description: ∠MTA = ∠MBT (alternate segment) and the angle at M is common, points: 2, dimension: proof}
      - {id: similar, description: 'Triangles MTA and MBT are similar, so MT/MB = MA/MT', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Join $TA$ and $TB$. By the alternate segment theorem, $\angle MTA = \angle TBA = \angle MBT$. The angle at $M$ is common. So triangles $MTA$ and $MBT$ are similar, and $\dfrac{MT}{MB} = \dfrac{MA}{MT}$, giving $MT^2 = MA \times MB$.
