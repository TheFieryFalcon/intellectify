- id: spec.geometry.logic.rational-plus-irrational
  skills: { primary: spec.geometry.logic, secondary: [spec.geometry.proof-methods] }
  subsection: "Implication, converse and contrapositive"
  rating: 1560
  responseSkills: { reasoning: 1550, proof: 1550, clarity: 1510, synthesis: 1540 }
  stem: |
    Prove that if $x$ is rational and $y$ is irrational, then $x + y$ is irrational.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'assume', description: "Assumes, for contradiction, that x + y = r is rational", points: 1, dimension: proof }
          - { id: 'solve', description: "Then y = r − x", points: 1, dimension: reasoning }
          - { id: 'rational', description: "A difference of two rationals is rational (a/b − c/d = (ad − bc)/bd), so y would be rational", points: 1, dimension: reasoning }
          - { id: 'contra', description: "Contradicts y irrational", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Suppose, for contradiction, that $x + y = r$ is rational. Then $y = r - x$. Writing $r = \tfrac{a}{b}$ and $x = \tfrac{c}{d}$ with integers $a, b, c, d$ ($b, d \ne 0$), $y = \tfrac{ad - bc}{bd}$ is rational. This contradicts $y$ being irrational, so $x + y$ is irrational.

- id: spec.geometry.logic.product-even-contrapositive
  skills: { primary: spec.geometry.logic, secondary: [spec.geometry.proof-methods] }
  subsection: "Implication, converse and contrapositive"
  rating: 1600
  responseSkills: { reasoning: 1590, proof: 1590, clarity: 1550, precision: 1550, synthesis: 1580 }
  stem: |
    Prove, using the contrapositive, that for all integers $a$ and $b$: if $ab$ is even, then $a$ is even or $b$ is even.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'form', description: "States the contrapositive: if a and b are both odd, then ab is odd", points: 2, dimension: precision }
          - { id: 'compute', description: "(2m + 1)(2n + 1) = 2(2mn + m + n) + 1, which is odd", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "The contrapositive is true, so the original is true", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    The contrapositive of "if $ab$ is even, then $a$ is even or $b$ is even" is "if $a$ is odd and $b$ is odd, then $ab$ is odd" (the negation of "$a$ even or $b$ even" is "$a$ odd and $b$ odd").

    Let $a = 2m + 1$, $b = 2n + 1$. Then $ab = 4mn + 2m + 2n + 1 = 2(2mn + m + n) + 1$, which is odd. The contrapositive is true, so the original statement is true.

- id: spec.geometry.logic.squares-order
  skills: { primary: spec.geometry.logic }
  subsection: "For all and there exists"
  rating: 1650
  responseSkills: { reasoning: 1640, proof: 1640, clarity: 1600 }
  stem: |
    Show that "for all real $a$ and $b$, if $a > b$ then $a^2 > b^2$" is false. Then prove that it becomes true if we also require $b \ge 0$.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'example', description: "Counterexample, e.g. a = 1, b = −2: a > b but a² = 1 < 4 = b²", points: 2, dimension: reasoning }
          - { id: 'factor', description: "With a > b ≥ 0: a² − b² = (a − b)(a + b)", points: 1, dimension: reasoning }
          - { id: 'signs', description: "a − b > 0 and a + b > 0 (since a > b ≥ 0), so the product is positive", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes a² > b²", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    False: $a = 1$, $b = -2$ has $a > b$ but $a^2 = 1 < 4 = b^2$.

    Now suppose $a > b \ge 0$. Then $a^2 - b^2 = (a - b)(a + b)$. Here $a - b > 0$, and $a + b > 0$ because $a > 0$ and $b \ge 0$. So $a^2 - b^2 > 0$, i.e. $a^2 > b^2$.

- id: spec.geometry.logic.chain-implications
  skills: { primary: spec.geometry.logic }
  subsection: "Implication, converse and contrapositive"
  rating: 1720
  responseSkills: { reasoning: 1710, clarity: 1670 }
  stem: |
    Statements $P$, $Q$ and $R$ satisfy: $P \Rightarrow Q$ and $Q \Rightarrow R$ are both true. Explain why $P \Rightarrow R$ must be true. Then give an example of statements like these for which $R \Rightarrow P$ is false.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'chain', description: "If P is true, then Q is true (first implication), so R is true (second): P ⇒ R", points: 2, dimension: reasoning }
          - { id: 'example', description: "Valid example, e.g. P: n = 4, Q: n is even, R: n² is even, for a whole number n", points: 1, dimension: reasoning }
          - { id: 'fails', description: "Shows R ⇒ P fails in the example, e.g. n = 2 makes R true and P false", points: 1, dimension: reasoning }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Suppose $P$ is true. Since $P \Rightarrow Q$, $Q$ is true. Since $Q \Rightarrow R$, $R$ is true. So whenever $P$ is true, $R$ is true: $P \Rightarrow R$.

    Example, for a whole number $n$: $P$: "$n = 4$", $Q$: "$n$ is even", $R$: "$n^2$ is even". Then $P \Rightarrow Q$ and $Q \Rightarrow R$ are true, but $R \Rightarrow P$ is false: $n = 2$ has $n^2$ even and $n \ne 4$.

- id: spec.geometry.logic.quadratic-between
  skills: { primary: spec.geometry.logic }
  subsection: "If and only if"
  rating: 1800
  responseSkills: { reasoning: 1790, proof: 1790, clarity: 1750 }
  stem: |
    Prove that for real numbers $x$, $x^2 - 5x + 6 < 0 \Leftrightarrow 2 < x < 3$.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'factor', description: "Factorizes: x² − 5x + 6 = (x − 2)(x − 3)", points: 1, dimension: reasoning }
          - { id: 'forward', description: "⇒: a negative product needs factors of opposite signs; x − 3 < 0 < x − 2 is the only possibility (x − 2 > x − 3), giving 2 < x < 3", points: 2, dimension: reasoning }
          - { id: 'back', description: "⇐: if 2 < x < 3 then x − 2 > 0 and x − 3 < 0, so the product is negative", points: 1, dimension: reasoning }
          - { id: 'both', description: "Both directions shown", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $x^2 - 5x + 6 = (x - 2)(x - 3)$.

    ($\Leftarrow$) If $2 < x < 3$, then $x - 2 > 0$ and $x - 3 < 0$, so their product is negative.

    ($\Rightarrow$) If $(x - 2)(x - 3) < 0$, the two factors have opposite signs. Since $x - 2 > x - 3$, the larger one must be positive and the smaller negative: $x - 2 > 0$ and $x - 3 < 0$, i.e. $2 < x < 3$.

    Both directions hold, so the equivalence is true.
