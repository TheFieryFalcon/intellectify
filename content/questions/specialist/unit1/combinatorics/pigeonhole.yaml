    {{who}} has {{n}} pairs of gloves, each pair a different color, all mixed up in a box. Left and right gloves are different. Taking gloves without looking, how many must {{who}} take to be **sure** of getting a matching left and right glove of the same color?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    {{who}} could take all {{n}} left gloves and still have no match. The next glove is a right glove, and its left partner is already out: ${{n}} + 1 = {{v}}$.
  verify: |
    from itertools import combinations
    def answers(n, v):
        gloves = [(c, side) for c in range(n) for side in 'LR']
        for m in range(1, 2 * n + 1):
            if all(any((c, 'L') in s and (c, 'R') in s for c in range(n)) for s in map(set, combinations(gloves, m))):
                return {"a": m}

- id: spec.combinatorics.pigeonhole.birthday-trio
  skills: { primary: spec.combinatorics.pigeonhole }
