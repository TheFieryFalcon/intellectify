        return {"a": solve(x*kk + p*y, kk)[0]}

# ─────────────── Tier 2 ───────────────
- id: spec.vectors-2d.scalar-product.parallel-or-perpendicular
  title: "Parallel, Perpendicular or Neither?"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Perpendicular and parallel vectors"
  rating: 1260
  responseSkills: { reading: 1250, calculation: 1220 }
  variants:
    - { a1: 6, a2: -4, b1: -9, b2: 6, key: a }
    - { a1: 6, a2: -4, b1: 2, b2: 3, key: b }
    - { a1: 6, a2: -4, b1: 3, b2: 4, key: c }
  stem: |
    Are ${{a1}}\mathbf{i} + ({{a2}})\mathbf{j}$ and ${{b1}}\mathbf{i} + {{b2}}\mathbf{j}$ parallel, perpendicular or neither?
  parts:
    - id: a
      options:
        - { id: a, text: 'Parallel' }
        - { id: b, text: 'Perpendicular' }
        - { id: c, text: 'Neither' }
      answer: { type: mcq, key: '{{key}}' }
  solution: |
    Parallel if one is a multiple of the other; perpendicular if the dot product, $({{a1}})({{b1}}) + ({{a2}})({{b2}})$, is 0.
  verify: |
    def answers(a1, a2, b1, b2, key):
        a, b = Matrix([a1, a2]), Matrix([b1, b2])
        if a1*b2 - a2*b1 == 0: k = "a"
        elif a.dot(b) == 0: k = "b"
        else: k = "c"
        return {"a": k}

- id: spec.vectors-2d.scalar-product.angle-1dp
  title: "Angle Between Two Vectors"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Angle between vectors"
  rating: 1280
  responseSkills: { calculation: 1280 }
  requiresCalculator: true
  variants:
    - { a1: 2, a2: 3, b1: 4, b2: -1, v: 70.3 }
    - { a1: -1, a2: 4, b1: 3, b2: 1, v: 85.6 }
  stem: |
    Find the angle between ${{a1}}\mathbf{i} + {{a2}}\mathbf{j}$ and ${{b1}}\mathbf{i} + ({{b2}})\mathbf{j}$, correct to one decimal place.
  parts:
    - id: a
      prompt: Angle (°)
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    $\cos\theta = \dfrac{({{a1}})({{b1}}) + ({{a2}})({{b2}})}{\sqrt{ {{a1}}^2 + {{a2}}^2 }\sqrt{ {{b1}}^2 + {{b2}}^2 }}$, so $\theta \approx {{v}}^\circ$.
  verify: |
    def answers(a1, a2, b1, b2, v):
        a, b = Matrix([a1, a2]), Matrix([b1, b2])
        return {"a": round(float(deg(acos(a.dot(b) / (a.norm()*b.norm())))), 1)}

- id: spec.vectors-2d.scalar-product.angle-exact
  title: "Exact Angle Between Two Vectors"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Angle between vectors"
  rating: 1310
  responseSkills: { calculation: 1300 }
  variants:
    - { a: '\sqrt{3}\mathbf{i} + \mathbf{j}', b: '\sqrt{3}\mathbf{i} - \mathbf{j}', av: '[sqrt(3), 1]', bv: '[sqrt(3), -1]', t: 60 }
    - { a: '\mathbf{i}', b: '-\mathbf{i} + \sqrt{3}\mathbf{j}', av: '[1, 0]', bv: '[-1, sqrt(3)]', t: 120 }
    - { a: '2\mathbf{i} + 2\mathbf{j}', b: '-3\mathbf{j}', av: '[2, 2]', bv: '[0, -3]', t: 135 }
  stem: |
    Find the exact angle between ${{a}}$ and ${{b}}$, in degrees.
  parts:
    - id: a
      prompt: Angle (°)
      answer: { type: numeric, key: '{{t}}' }
  solution: |
    Use $\cos\theta = \dfrac{\mathbf{a}\cdot\mathbf{b}}{|\mathbf{a}|\,|\mathbf{b}|}$, which gives an exact value of cosine, so $\theta = {{t}}^\circ$.
  verify: |
    def answers(a, b, av, bv, t):
        u, v = Matrix(sympify(av)), Matrix(sympify(bv))
        return {"a": deg(acos(simplify(u.dot(v) / (u.norm()*v.norm()))))}

- id: spec.vectors-2d.scalar-product.unit-perpendicular
  title: "Perpendicular Unit Vector"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Perpendicular and parallel vectors"
  rating: 1340
  responseSkills: { calculation: 1320, reading: 1320 }
  variants:
    - { x: 3, y: 4, m: 5, r1: 4, r2: -3 }
    - { x: 5, y: -12, m: 13, r1: 12, r2: 5 }
  stem: |
    Find the unit vector that is perpendicular to ${{x}}\mathbf{i} + ({{y}})\mathbf{j}$ and has a positive $\mathbf{i}$-component.
  parts:
    - id: a
      answer: { type: vector, key: ['\frac{ {{r1}} }{ {{m}} }', '\frac{ {{r2}} }{ {{m}} }'] }
  solution: |
    Swapping the components and changing one sign gives the perpendicular vectors $\pm\left(({{y}})\mathbf{i} - {{x}}\mathbf{j}\right)$. Take the one with a positive $\mathbf{i}$-component, ${{r1}}\mathbf{i} + ({{r2}})\mathbf{j}$, and divide by its magnitude, {{m}}.
  verify: |
    def answers(x, y, m, r1, r2):
        p = Matrix([y, -x])
        if p[0] < 0: p = -p
        return {"a": list(p / p.norm())}

- id: spec.vectors-2d.scalar-product.expand
  title: "Expanding a Scalar Product"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Calculating the scalar product"
  rating: 1360
  responseSkills: { calculation: 1340, reading: 1330 }
  variants:
    - { p: 3, q: 2, d: 4 }
    - { p: 5, q: 1, d: -2 }
  stem: |
    $|\mathbf{a}| = {{p}}$, $|\mathbf{b}| = {{q}}$ and $\mathbf{a}\cdot\mathbf{b} = {{d}}$. Find $(\mathbf{a} + 2\mathbf{b})\cdot(\mathbf{a} - \mathbf{b})$.
  parts:
    - id: a
      answer: { type: numeric, key: '{{p}}^2+{{d}}-2\cdot{{q}}^2' }
  solution: |
    Expand like brackets: $\mathbf{a}\cdot\mathbf{a} - \mathbf{a}\cdot\mathbf{b} + 2\,\mathbf{b}\cdot\mathbf{a} - 2\,\mathbf{b}\cdot\mathbf{b} = |\mathbf{a}|^2 + \mathbf{a}\cdot\mathbf{b} - 2|\mathbf{b}|^2 = {{p}}^2 + ({{d}}) - 2({{q}})^2$.
  verify: |
    def answers(p, q, d):
        return {"a": p**2 + d - 2*q**2}

- id: spec.vectors-2d.scalar-product.perpendicular-quadratic
  title: "Perpendicular Vectors with a Quadratic in k"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Perpendicular and parallel vectors"
  rating: 1390
  responseSkills: { calculation: 1380 }
  stem: |
    Find all values of $k$ for which $k\mathbf{i} + 2\mathbf{j}$ and $(k - 1)\mathbf{i} - 6\mathbf{j}$ are perpendicular.
  parts:
    - id: a
      answer: { type: set, key: ['4', '-3'] }
  solution: |
    $k(k - 1) - 12 = 0$, so $k^2 - k - 12 = (k - 4)(k + 3) = 0$, and $k = 4$ or $k = -3$.
  verify: |
    def answers():
        k = symbols("k")
        return {"a": solve(k*(k - 1) - 12, k)}

# ─────────────── Tier 3 ───────────────
- id: spec.vectors-2d.scalar-product.right-angle-corner
  title: "Which Corner Is a Right Angle"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Perpendicular and parallel vectors"
  rating: 1410
  responseSkills: { calculation: 1390, reading: 1400 }
  stem: |
    $A(2, 1)$, $B(5, 5)$ and $C(-2, 4)$ form a triangle. At which corner, if any, is there a right angle?
  parts:
    - id: a
      options:
        - { id: a, text: '$A$' }
        - { id: b, text: '$B$' }
        - { id: c, text: '$C$' }
        - { id: d, text: 'None' }
      answer: { type: mcq, key: a }
  solution: |
    $\overrightarrow{AB} = 3\mathbf{i} + 4\mathbf{j}$ and $\overrightarrow{AC} = -4\mathbf{i} + 3\mathbf{j}$, with dot product $-12 + 12 = 0$. So the angle at $A$ is $90^\circ$.
  verify: |
    def answers():
        A, B, C = Matrix([2, 1]), Matrix([5, 5]), Matrix([-2, 4])
        corners = {"a": (B - A).dot(C - A), "b": (A - B).dot(C - B), "c": (A - C).dot(B - C)}
        right = [k for k, v in corners.items() if v == 0]
        return {"a": right[0] if right else "d"}

- id: spec.vectors-2d.scalar-product.perpendicular-given-length
  title: "Perpendicular Vector of a Given Length"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Perpendicular and parallel vectors"
  rating: 1420
  responseSkills: { calculation: 1400, synthesis: 1400 }
  stem: |
    Find the vector $\mathbf{b}$ with $|\mathbf{b}| = \sqrt{40}$ that is perpendicular to $\mathbf{a} = \mathbf{i} + 3\mathbf{j}$ and has a positive $\mathbf{i}$-component.
  parts:
    - id: a
      answer: { type: vector, key: ['6', '-2'] }
  solution: |
    $3\mathbf{i} - \mathbf{j}$ is perpendicular to $\mathbf{a}$ (dot product $3 - 3 = 0$) and has magnitude $\sqrt{10}$. Doubling it gives magnitude $2\sqrt{10} = \sqrt{40}$: $\mathbf{b} = 6\mathbf{i} - 2\mathbf{j}$.
  verify: |
    def answers():
        x, y = symbols("x y", real=True)
        sols = solve([x + 3*y, x**2 + y**2 - 40], [x, y], dict=True)
        s = [t for t in sols if t[x] > 0][0]
        return {"a": [s[x], s[y]]}

- id: spec.vectors-2d.scalar-product.magnitude-combination
  title: "Length of a Combination from an Angle"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Magnitudes and the scalar product"
  rating: 1440
  responseSkills: { calculation: 1420, reading: 1420 }
  variants:
    - { p: 4, q: 5, v: 7 }
    - { p: 3, q: 8, v: '2\sqrt{13}' }
  stem: |
    $|\mathbf{a}| = {{p}}$, $|\mathbf{b}| = {{q}}$ and the angle between them is $120^\circ$. Find the exact value of $|2\mathbf{a} + \mathbf{b}|$.
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}', form: [exact] }
  solution: |
    $\mathbf{a}\cdot\mathbf{b} = {{p}} \times {{q}} \times \cos 120^\circ$. Then
    $|2\mathbf{a} + \mathbf{b}|^2 = 4|\mathbf{a}|^2 + 4\,\mathbf{a}\cdot\mathbf{b} + |\mathbf{b}|^2$, so $|2\mathbf{a} + \mathbf{b}| = {{v}}$.
  verify: |
    def answers(p, q, v):
        d = p*q*cos(2*pi/3)
        return {"a": sqrt(4*p**2 + 4*d + q**2)}

- id: spec.vectors-2d.scalar-product.triangle-angle
  title: "Angle of a Triangle from Its Corners"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Angle between vectors"
  rating: 1450
  responseSkills: { calculation: 1430, reading: 1420 }
  requiresCalculator: true
  stem: |
    Triangle $ABC$ has corners $A(1, 2)$, $B(4, 6)$ and $C(6, 1)$. Find angle $BAC$, correct to one decimal place.
  parts:
    - id: a
      prompt: Angle (°)
      answer: { type: numeric, key: 64.4 }
  solution: |
    Use the two vectors starting at $A$: $\overrightarrow{AB} = 3\mathbf{i} + 4\mathbf{j}$ and $\overrightarrow{AC} = 5\mathbf{i} - \mathbf{j}$.
    $\cos\angle BAC = \dfrac{15 - 4}{5\sqrt{26}} = \dfrac{11}{5\sqrt{26}}$, so $\angle BAC \approx 64.4^\circ$.
  verify: |
    def answers():
        A, B, C = Matrix([1, 2]), Matrix([4, 6]), Matrix([6, 1])
        u, v = B - A, C - A
        return {"a": round(float(deg(acos(u.dot(v) / (u.norm()*v.norm())))), 1)}

- id: spec.vectors-2d.scalar-product.difference-of-squares
  title: "Sum and Difference of Equal-Length Vectors"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Perpendicular and parallel vectors"
  rating: 1470
  responseSkills: {reasoning: 1460, proof: 1460, clarity: 1400}
  stem: |
    Prove that $(\mathbf{a} + \mathbf{b})\cdot(\mathbf{a} - \mathbf{b}) = |\mathbf{a}|^2 - |\mathbf{b}|^2$, and hence that if $|\mathbf{a}| = |\mathbf{b}|$, then $\mathbf{a} + \mathbf{b}$ and $\mathbf{a} - \mathbf{b}$ are perpendicular (when neither is zero).
  parts:
    - id: a
      rubric:
        criteria:
          - { id: expand, description: "Expands (a + b)·(a − b) correctly (e.g. a·a − a·b + b·a − b·b)", points: 1, dimension: reasoning }
          - { id: simplify, description: "Simplifies to |a|² − |b|² (e.g. using a·b = b·a and a·a = |a|²)", points: 1, dimension: reasoning }
          - { id: hence, description: "Concludes the dot product is 0 when |a| = |b|, so the (non-zero) vectors are perpendicular", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with each step justified", points: 1, dimension: clarity }
  solution: |
    $(\mathbf{a} + \mathbf{b})\cdot(\mathbf{a} - \mathbf{b}) = \mathbf{a}\cdot\mathbf{a} - \mathbf{a}\cdot\mathbf{b} + \mathbf{b}\cdot\mathbf{a} - \mathbf{b}\cdot\mathbf{b} = |\mathbf{a}|^2 - |\mathbf{b}|^2$, since $\mathbf{a}\cdot\mathbf{b} = \mathbf{b}\cdot\mathbf{a}$.
    If $|\mathbf{a}| = |\mathbf{b}|$, this is 0. Two non-zero vectors with a dot product of 0 are perpendicular.

