  parts:
  - id: a
    rubric:
      criteria:
      - {id: ratio, description: Rewrites as AX/CX = XD/XB, points: 1, dimension: reasoning}
      - {id: similar, description: 'With ∠AXC = ∠DXB (vertically opposite), triangles AXC and DXB are similar (two sides in ratio, included angle)', points: 2, dimension: reasoning}
