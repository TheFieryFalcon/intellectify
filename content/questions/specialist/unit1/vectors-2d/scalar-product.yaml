- id: spec.vectors-2d.scalar-product.given-dot-and-length
  title: "Vector from a Scalar Product and a Length"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Magnitudes and the scalar product"
  rating: 1560
  responseSkills: {calculation: 1540, reasoning: 1540, synthesis: 1520}
  stem: |
    $\mathbf{a} = 2\mathbf{i} + \mathbf{j}$. The vector $\mathbf{b}$ has $|\mathbf{b}| = 5$ and $\mathbf{a}\cdot\mathbf{b} = 5$. If $\mathbf{b}$ has a negative $\mathbf{j}$-component, find $\mathbf{b}$.
  parts:
    - id: a
      answer: { type: vector, key: ['4', '-3'] }
  solution: |
    Let $\mathbf{b} = x\mathbf{i} + y\mathbf{j}$. Then $2x + y = 5$ and $x^2 + y^2 = 25$. Substituting $y = 5 - 2x$: $5x^2 - 20x = 0$, so $x = 0$ or $x = 4$, giving $\mathbf{b} = 5\mathbf{j}$ or $4\mathbf{i} - 3\mathbf{j}$. Only the second has a negative $\mathbf{j}$-component.
  verify: |
    def answers():
        x, y = symbols("x y", real=True)
        sols = solve([2*x + y - 5, x**2 + y**2 - 25], [x, y], dict=True)
        s = [t for t in sols if t[y] < 0][0]
        return {"a": [s[x], s[y]]}

- id: spec.vectors-2d.scalar-product.difference-from-sum
  title: "Length of a Difference from Another Length"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Magnitudes and the scalar product"
  rating: 1590
  responseSkills: {calculation: 1560, reasoning: 1570, synthesis: 1570}
  stem: |
    $|\mathbf{a}| = 3$, $|\mathbf{b}| = 5$ and $|2\mathbf{a} + \mathbf{b}| = 7$. Find the exact value of $|\mathbf{a} - \mathbf{b}|$.
  parts:
    - id: a
      answer: { type: numeric, key: '2\sqrt{10}', form: [exact] }
  solution: |
    $|2\mathbf{a} + \mathbf{b}|^2 = 4|\mathbf{a}|^2 + 4\,\mathbf{a}\cdot\mathbf{b} + |\mathbf{b}|^2$, so $49 = 36 + 4\,\mathbf{a}\cdot\mathbf{b} + 25$ and $\mathbf{a}\cdot\mathbf{b} = -3$.
    Then $|\mathbf{a} - \mathbf{b}|^2 = 9 - 2(-3) + 25 = 40$, so $|\mathbf{a} - \mathbf{b}| = 2\sqrt{10}$.
  verify: |
    def answers():
        d = symbols("d")
        dv = solve(4*9 + 4*d + 25 - 49, d)[0]
        return {"a": sqrt(9 - 2*dv + 25)}

- id: spec.vectors-2d.scalar-product.angle-45-check
  title: "Vectors at 45°"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Angle between vectors"
  rating: 1610
  responseSkills: {calculation: 1580, reasoning: 1590, synthesis: 1600}
  stem: |
    Find all values of $k$ for which the angle between $k\mathbf{i} + \mathbf{j}$ and $\mathbf{i} + \mathbf{j}$ is $45^\circ$.
  parts:
    - id: a
      prompt: $k =$
      answer: { type: numeric, key: 0 }
  solution: |
    $\cos 45^\circ = \dfrac{k + 1}{\sqrt{k^2 + 1}\,\sqrt{2}}$, so $\dfrac{k + 1}{\sqrt{k^2 + 1}} = 1$. This needs $k + 1 > 0$. Squaring: $k^2 + 2k + 1 = k^2 + 1$, so $k = 0$, which satisfies $k + 1 > 0$. The only value is $k = 0$.
  verify: |
    def answers():
        k = symbols("k", real=True)
        sols = [s for s in solve((k + 1)**2 - (k**2 + 1), k) if s + 1 > 0]
        return {"a": sols[0]}

- id: spec.vectors-2d.scalar-product.perpendicular-combination
  title: "Angle from Perpendicular Combinations"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Perpendicular and parallel vectors"
  rating: 1630
  responseSkills: {calculation: 1580, reasoning: 1610, synthesis: 1620}
  stem: |
    $\mathbf{a}$ and $\mathbf{b}$ are non-zero vectors with $|\mathbf{a}| = |\mathbf{b}|$, and $\mathbf{a} + 2\mathbf{b}$ is perpendicular to $5\mathbf{a} - 4\mathbf{b}$. Find the angle between $\mathbf{a}$ and $\mathbf{b}$, in degrees.
  parts:
    - id: a
      answer: { type: numeric, key: 60 }
  solution: |
    Let $|\mathbf{a}| = |\mathbf{b}| = r$. Then $(\mathbf{a} + 2\mathbf{b})\cdot(5\mathbf{a} - 4\mathbf{b}) = 5r^2 + 6\,\mathbf{a}\cdot\mathbf{b} - 8r^2 = 0$, so $\mathbf{a}\cdot\mathbf{b} = \tfrac{1}{2}r^2$.
    Then $\cos\theta = \dfrac{\tfrac{1}{2}r^2}{r^2} = \tfrac{1}{2}$, so $\theta = 60^\circ$.
  verify: |
    def answers():
        c = symbols("c")
