- id: spec.combinatorics.permutations.repeated-letters
  skills: { primary: spec.combinatorics.permutations }
  subsection: "Repeated objects"
  rating: 1290
  responseSkills: { calculation: 1280, reading: 1290 }
  variants:
    - { w: BANANA, v: 60 }
    - { w: LETTER, v: 180 }
    - { w: COMMITTEE, v: 45360 }
  stem: |
    How many different arrangements of the letters of the word **{{w}}** are there?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Divide the factorial of the number of letters by the factorial of each repeated letter's count. This gives {{v}}.
  verify: |
    from sympy.utilities.iterables import multiset_permutations
    def answers(w, v):
        return {"a": sum(1 for _ in multiset_permutations(list(w)))}

- id: spec.combinatorics.permutations.pair-together
  skills: { primary: spec.combinatorics.permutations }
  subsection: "Objects together or apart"
  rating: 1330
  responseSkills: { calculation: 1300, reading: 1330 }
  words: { p1: person, p2: person }
  variants:
    - { n: 6, v: 240 }
    - { n: 7, v: 1440 }
    - { n: 8, v: 10080 }
  stem: |
    {{n}} friends, including {{p1}} and {{p2}}, stand in a row for a photo. In how many ways can they stand if {{p1}} and {{p2}} must be next to each other?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Glue {{p1}} and {{p2}} into one block: $({{n}}-1)!$ arrangements of the blocks, times 2 for the order inside the pair. That's {{v}}.
  verify: |
    from itertools import permutations
    def answers(n, v):
        return {"a": sum(1 for p in permutations(range(n)) if abs(p.index(0) - p.index(1)) == 1)}

- id: spec.combinatorics.permutations.pair-apart
  skills: { primary: spec.combinatorics.permutations }
  subsection: "Objects together or apart"
