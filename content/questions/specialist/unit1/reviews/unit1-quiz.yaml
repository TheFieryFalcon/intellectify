- id: spec.u1.quiz.committee-with-chair
  title: "Committee with a Chair"
  pool: unit-quiz
  skills: { primary: spec.combinatorics.combinations }
  subsection: "Splitting into groups and roles"
  rating: 1460
  responseSkills: { reading: 1440, calculation: 1440, reasoning: 1450 }
  stem: |
    A committee of 4, one of whom is the chair, is chosen from 9 people. How many ways are there?
  parts:
    - id: a
      answer: { type: numeric, key: 504 }
  solution: |
    Choose the 4 members, $\binom{9}{4} = 126$, then the chair from them, 4 ways: $126 \times 4 = 504$.
  verify: |
    def answers():
