    Find the exact values of $k$ for which the angle between $k\mathbf{i} + \mathbf{j}$ and $\mathbf{i} + k\mathbf{j}$ is $60^\circ$.
  parts:
    - id: a
      answer: { type: set, key: ['2+\sqrt{3}', '2-\sqrt{3}'], form: [exact] }
  solution: |
    Both vectors have magnitude $\sqrt{k^2 + 1}$, and their dot product is $2k$. So $\dfrac{2k}{k^2 + 1} = \cos 60^\circ = \tfrac{1}{2}$, giving $k^2 - 4k + 1 = 0$ and $k = 2 \pm \sqrt{3}$.
    Both values are positive, so $\cos\theta > 0$ as needed, and both work.
  verify: |
    def answers():
        k = symbols("k", real=True)
        return {"a": [s for s in solve(2*k/(k**2 + 1) - Rational(1, 2), k)]}

- id: spec.vectors-2d.scalar-product.minimize
  skills: { primary: spec.vectors-2d.scalar-product }
  rating: 1720
  responseSkills: { synthesis: 1710, calculation: 1660 }
  stem: |
    $\mathbf{a}$ and $\mathbf{b}$ are unit vectors with an angle of $60^\circ$ between them. Find the real number $t$ that makes $|\mathbf{a} + t\mathbf{b}|$ as small as possible, and the exact smallest value.
  parts:
    - id: a
      prompt: $t =$
      answer: { type: numeric, key: '-\frac{1}{2}' }
    - id: b
      prompt: Smallest value
      answer: { type: numeric, key: '\frac{\sqrt{3}}{2}', form: [exact] }
  solution: |
    $\mathbf{a}\cdot\mathbf{b} = \cos 60^\circ = \tfrac{1}{2}$, so $|\mathbf{a} + t\mathbf{b}|^2 = 1 + 2t\left(\tfrac{1}{2}\right) + t^2 = t^2 + t + 1 = \left(t + \tfrac{1}{2}\right)^2 + \tfrac{3}{4}$.
    This is smallest when $t = -\tfrac{1}{2}$, with value $\sqrt{\tfrac{3}{4}} = \tfrac{\sqrt{3}}{2}$.
  verify: |
    def answers():
        t = symbols("t", real=True)
        f = 1 + t + t**2
        t0 = solve(diff(f, t), t)[0]
        return {"a": t0, "b": sqrt(f.subs(t, t0))}

- id: spec.vectors-2d.scalar-product.closed-triangle
  skills: { primary: spec.vectors-2d.scalar-product }
  rating: 1750
  responseSkills: { synthesis: 1750, calculation: 1680 }
  stem: |
    Vectors $\mathbf{a}$, $\mathbf{b}$ and $\mathbf{c}$ satisfy $\mathbf{a} + \mathbf{b} + \mathbf{c} = \mathbf{0}$, with $|\mathbf{a}| = 3$, $|\mathbf{b}| = 5$ and $|\mathbf{c}| = 7$.
  parts:
    - id: a
      prompt: Find $\mathbf{a}\cdot\mathbf{b} + \mathbf{b}\cdot\mathbf{c} + \mathbf{c}\cdot\mathbf{a}$.
      answer: { type: numeric, key: '-\frac{83}{2}' }
    - id: b
      prompt: Find the angle between $\mathbf{a}$ and $\mathbf{b}$, in degrees.
      answer: { type: numeric, key: 60 }
  solution: |
    Dot $\mathbf{a} + \mathbf{b} + \mathbf{c}$ with itself: $0 = |\mathbf{a}|^2 + |\mathbf{b}|^2 + |\mathbf{c}|^2 + 2(\mathbf{a}\cdot\mathbf{b} + \mathbf{b}\cdot\mathbf{c} + \mathbf{c}\cdot\mathbf{a})$. So the sum is $-\tfrac{9 + 25 + 49}{2} = -\tfrac{83}{2}$.
    For the angle, $\mathbf{c} = -(\mathbf{a} + \mathbf{b})$, so $49 = 9 + 2\,\mathbf{a}\cdot\mathbf{b} + 25$ and $\mathbf{a}\cdot\mathbf{b} = \tfrac{15}{2}$. Then $\cos\theta = \dfrac{15/2}{3 \times 5} = \tfrac{1}{2}$, so $\theta = 60^\circ$.
  verify: |
    def answers():
        d = solve(9 + 2*symbols("d") + 25 - 49, symbols("d"))[0]
        return {"a": -Rational(9 + 25 + 49, 2), "b": deg(acos(d / 15))}
