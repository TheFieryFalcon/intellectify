  stem: |
    A standard deck has 52 cards, 13 in each of 4 suits. How many 5-card hands contain at least one card of every suit?
  parts:
  - id: a
    answer: {type: numeric, key: '685464'}
  solution: |
    Five cards over four suits with every suit present means one suit has 2 cards and the others 1. Choose the doubled suit (4 ways) and its 2 cards ($\dbinom{13}{2} = 78$), then one card from each other suit ($13^3$). Total $4 \times 78 \times 2197 = 685\,464$.
  verify: |
    def answers():
        from itertools import product
        # count hands by suit pattern (2,1,1,1) directly
        return {"a": sum(binomial(13, a) * binomial(13, b) * binomial(13, c) * binomial(13, d)
                         for a, b, c, d in product(range(1, 6), repeat=4) if a + b + c + d == 5)}
