# Section quiz pool: Geometry (1.1). Never served in practice (SPEC §8.1a).

- id: spec.geometry.sq.rain-contrapositive
  title: "Contrapositive of \"If It Rains\""
  pool: section-quiz
  skills: { primary: spec.geometry.logic }
  subsection: "Implication, converse and contrapositive"
  rating: 1050
  responseSkills: { reading: 1040 }
  stem: |
    Which statement is the contrapositive of "If it rains, then the ground is wet"?
  parts:
    - id: a
      options:
        - { id: a, text: 'If the ground is wet, then it rains.' }
        - { id: b, text: 'If it does not rain, then the ground is not wet.' }
        - { id: c, text: 'If the ground is not wet, then it does not rain.' }
        - { id: d, text: 'If it rains, then the ground is not wet.' }
      answer: { type: mcq, key: c }
  solution: |
    The contrapositive of $P \Rightarrow Q$ is "not $Q \Rightarrow$ not $P$": swap the two parts and negate both. (a) is the converse and (b) the inverse.
  verify: |
    def answers():
        return {"a": "c"}

- id: spec.geometry.sq.center-from-38
  title: "Angle at the Center from the Circumference (Quiz)"
  pool: section-quiz
  skills: { primary: spec.geometry.circle-angles }
  subsection: "Angle at the center"
  rating: 1080
  responseSkills: { reading: 1060, calculation: 1040 }
  variants:
    - { x: 32, v: 64, _A: '-1.532, -1.286', _B: '0.484, -1.941' }
    - { x: 38, v: 76, _A: '-1.532, -1.286', _B: '0.877, -1.798' }
    - { x: 44, v: 88, _A: '-1.532, -1.286', _B: '1.231, -1.576' }
    - { x: 51, v: 102, _A: '-1.532, -1.286', _B: '1.576, -1.231' }
    - { x: 57, v: 114, _A: '-1.532, -1.286', _B: '1.798, -0.877' }
  stem: |
    $A$, $B$ and $C$ lie on a circle with center $O$, with $C$ on the major arc. $\angle ACB = {{x}}^\circ$. Find $\angle AOB$, in degrees.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    alt: "Angle ACB of 38 degrees at the circumference; angle AOB at the center"
    points: { A: [{{_A}}], B: [{{_B}}], C: [0, 2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: C, to: A }
      - { type: segment, from: C, to: B }
      - { type: segment, from: O, to: A, color: muted }
      - { type: segment, from: O, to: B, color: muted }
      - { type: angle, at: C, from: A, to: B, label: '{{x}}^\circ', radius: 30 }
      - { type: angle, at: O, from: A, to: B, label: '?', radius: 16 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: O, label: 'O', pos: n }
    ```
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    The angle at the center is twice the angle at the circumference on the same arc: $\angle AOB = 2 \times {{x}}^\circ = {{v}}^\circ$.
  verify: |
    def answers(x, v):
        A, B, C = on_circle(220), on_circle(220 + 2*x), on_circle(90)
        assert abs(angle_at(A, C, B) - x) < 1e-9
        return {"a": approx(angle_at(A, (0, 0), B))}

