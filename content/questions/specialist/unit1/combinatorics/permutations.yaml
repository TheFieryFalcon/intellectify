    - { a: 2, b: 2, c: 3, v: 144 }
    - { a: 3, b: 3, c: 2, v: 432 }
  stem: |
    {{who}} has {{a}} different {{s1}} books, {{b}} different {{s2}} books and {{c}} different {{s3}} books, and puts them all on one shelf so that each subject's books are together. In how many ways can the shelf be arranged?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Order the three subject blocks: $3!$. Then order the books inside each block: ${{a}}!$, ${{b}}!$ and ${{c}}!$. Total $3! \times {{a}}! \times {{b}}! \times {{c}}! = {{v}}$.
  verify: |
    from itertools import permutations
    def answers(a, b, c, v):
        books = [0] * a + [1] * b + [2] * c
