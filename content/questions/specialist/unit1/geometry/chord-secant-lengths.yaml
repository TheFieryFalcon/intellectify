    - { ma: 4, mb: 9, mc: 3, p: 36, v: 12, _view: '-2.55, 3.57, -2.5, 2.5', _M: '3.023, 0', _A: '1.795, -0.881', _B: '0.261, -1.983', _C: '1.961, 0.395', _D: '-1.226, 1.58' }
    - { ma: 2, mb: 12, mc: 3, p: 24, v: 8, _view: '-2.55, 3.15, -2.5, 2.5', _M: '2.603, 0', _A: '1.981, -0.275', _B: '-1.128, -1.652', _C: '1.87, 0.709', _D: '0.649, 1.892' }
    - { ma: 4, mb: 15, mc: 5, p: 60, v: 12, _view: '-2.55, 3.67, -2.5, 2.5', _M: '3.12, 0', _A: '1.956, -0.418', _B: '-1.244, -1.566', _C: '1.818, 0.833', _D: '-0.004, 2' }
    - { ma: 3, mb: 16, mc: 4, p: 48, v: 12, _view: '-2.55, 3.25, -2.5, 2.5', _M: '2.699, 0', _A: '1.976, -0.306', _B: '-1.154, -1.634', _C: '1.888, 0.661', _D: '0.266, 1.982' }
  stem: |
    From $M$, two secants cut a circle at $A$, $B$ and at $C$, $D$. $MA = {{ma}}$, $MB = {{mb}}$ and $MC = {{mc}}$. Find $MD$.

    ```diagram
    view: [{{_view}}]
    width: 260
    points: { M: [{{_M}}], A: [{{_A}}], B: [{{_B}}], C: [{{_C}}], D: [{{_D}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: B }
      - { type: segment, from: M, to: D }
      - { type: point, at: M, label: 'M' }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
  - id: a
    prompt: $MD$
    answer: {type: numeric, key: '{{v}}'}
  solution: |
    $MA \times MB = MC \times MD$, so ${{p}} = {{mc}} \times MD$ and $MD = {{v}}$.
  verify: |
    def answers(ma, mb, mc, p, v):
        import math
        # M at the origin; the first secant along the x-axis meets a circle at x = ma and x = mb.
        c = ((ma + mb) / 2, 1.3 * mb)
        R = math.dist(c, (ma, 0))
        def near_far(th):
            dx, dy = math.cos(th), math.sin(th)
            b = -2 * (c[0] * dx + c[1] * dy); q = c[0] ** 2 + c[1] ** 2 - R * R
            disc = b * b - 4 * q
            return None if disc < 0 else ((-b - math.sqrt(disc)) / 2, (-b + math.sqrt(disc)) / 2)
        # Scan directions for a second secant whose near point is at distance mc, then refine.
        best = None
        for n in range(1, 200000):
            th = -math.pi / 2 + math.pi * n / 200000
            nf = near_far(th)
            if nf and nf[0] > 0 and (best is None or abs(nf[0] - mc) < abs(best[1][0] - mc)): best = (th, nf)
        lo, hi = best[0] - math.pi / 200000, best[0] + math.pi / 200000
        f = lambda th: (near_far(th) or (math.inf, 0))[0] - mc
        for _ in range(100):
            mid = (lo + hi) / 2
            lo, hi = (mid, hi) if (f(lo) < 0) == (f(mid) < 0) else (lo, mid)
        return {"a": approx(near_far(lo)[1], 6)}
