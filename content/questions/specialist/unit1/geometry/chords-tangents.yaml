        A, C = on_circle(90, 2), on_circle(90 - 2*b, 2)
        B = on_circle(90 + 2*(f + b), 2)
        tdir = (-A[1], A[0])
        Pt = line_meet(A, (A[0] + tdir[0], A[1] + tdir[1]), B, C)
        assert abs(angle_at(A, Pt, B) - f) < 1e-6 and abs(angle_at(A, B, C) - b) < 1e-6
        return {"a": approx(angle_at(A, C, B), 4)}

- id: spec.geometry.chords-tangents.touching-circles-bisect
  title: "Circles Touching Inside, and an Angle Bisector"
  skills: {primary: spec.geometry.chords-tangents}
  subsection: "The alternate segment theorem"
  rating: 1810
  responseSkills: {reasoning: 1810, proof: 1810, clarity: 1680, synthesis: 1790}
  stem: |
    Two circles touch on the inside at $T$ (the smaller circle is inside the larger, and they share a tangent at $T$). A chord $AB$ of the larger circle touches the smaller circle at $C$. Prove that $TC$ bisects $\angle ATB$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { T: [0, -2], S1: [0, -1], A: [1.735, -0.994], B: [-1.528, 1.291], C: [0.574, -0.181], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: circle, center: S1, radius: 1 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: T, to: A }
      - { type: segment, from: T, to: B }
      - { type: segment, from: T, to: C }
      - { type: point, at: T, label: 'T', pos: s }
      - { type: point, at: A, label: 'A', pos: ne }
      - { type: point, at: B, label: 'B', pos: w }
      - { type: point, at: C, label: 'C', pos: e }
    ```
  parts:
  - id: a
    rubric:
      criteria:
      - {id: tangent, description: "Sets up the figure usefully (e.g. the common tangent at T, and P, Q where TA and TB cross the small circle)", points: 1, dimension: synthesis}
      - {id: parallel, description: "Finds a key parallel or angle relation (e.g. alternate segment theorem in both circles gives PQ ∥ AB)", points: 2, dimension: reasoning}
      - {id: alt, description: "Brings in the tangent at C (e.g. alternate segment theorem: ∠ACP = ∠CTP and ∠BCQ = ∠CTQ)", points: 2, dimension: reasoning}
      - {id: conclude, description: Combines these to show ∠ATC = ∠CTB, points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Let $TA$ and $TB$ meet the small circle again at $P$ and $Q$. Let $\ell$ be the common tangent at $T$.
    By the alternate segment theorem in each circle, the angle between $\ell$ and $TA$ equals both $\angle TBA$ (large circle) and $\angle TQP$ (small circle). So $\angle TQP = \angle TBA$, and $PQ \parallel AB$.
    Now $AB$ touches the small circle at $C$. By the alternate segment theorem, $\angle ACP = \angle CTP$, i.e. $\angle ACP = \angle ATC$. Also $\angle ACP = \angle CPQ$ (alternate angles, $PQ \parallel AB$), and $\angle CPQ = \angle CTQ$ (same arc $CQ$ of the small circle). So $\angle ATC = \angle CTQ = \angle CTB$: $TC$ bisects $\angle ATB$.
