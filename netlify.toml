[build]
  command = "pnpm build"
  publish = "apps/web/build"
  # Save deploy credits: cancel the build (exit 0) when nothing that ends up on the site changed,
  # e.g. a push that only touches docs/. A first build or a retry (same commit) always builds.
  ignore = """
    test "$CACHED_COMMIT_REF" != "$COMMIT_REF" && \
    git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- \
      apps/web packages content netlify package.json pnpm-lock.yaml pnpm-workspace.yaml netlify.toml
  """

[build.environment]
  NODE_VERSION = "22"

# The marking function reads question files from disk: fetching them over HTTP from its own
# deploy fails where deploys need a login (deploy previews behind team SSO return 401).
[functions]
  included_files = ["apps/web/build/content/**"]

# Single-page app: every route is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
