- id: spec.vectors-2d.projection.both-ways
  skills: { primary: spec.vectors-2d.projection }
  rating: 1320
  responseSkills: { calculation: 1300, reading: 1310 }
  stem: |
    $\mathbf{a} = 3\mathbf{i} + 4\mathbf{j}$ and $\mathbf{b} = 6\mathbf{i} - 8\mathbf{j}$. Find:
  parts:
    - id: a
      prompt: the scalar projection of $\mathbf{a}$ onto $\mathbf{b}$
      answer: { type: numeric, key: -1.4 }
    - id: b
      prompt: the scalar projection of $\mathbf{b}$ onto $\mathbf{a}$
      answer: { type: numeric, key: -2.8 }
  solution: |
    $\mathbf{a}\cdot\mathbf{b} = 18 - 32 = -14$, $|\mathbf{a}| = 5$ and $|\mathbf{b}| = 10$.
    Onto $\mathbf{b}$: divide by $|\mathbf{b}|$, giving $-1.4$. Onto $\mathbf{a}$: divide by $|\mathbf{a}|$, giving $-2.8$.
  verify: |
    def answers():
        a, b = Matrix([3, 4]), Matrix([6, -8])
        return {"a": a.dot(b) / b.norm(), "b": a.dot(b) / a.norm()}

- id: spec.vectors-2d.projection.perpendicular-part
  skills: { primary: spec.vectors-2d.projection }
  rating: 1360
  responseSkills: { calculation: 1340, reading: 1340 }
  variants:
    - { a1: 5, a2: 1, b1: 1, b2: 1 }
    - { a1: 1, a2: 8, b1: 2, b2: 1 }
  stem: |
    $\mathbf{a} = {{a1}}\mathbf{i} + {{a2}}\mathbf{j}$ and $\mathbf{b} = {{b1}}\mathbf{i} + {{b2}}\mathbf{j}$. Write $\mathbf{a}$ as the sum of a vector parallel to $\mathbf{b}$ and a vector perpendicular to $\mathbf{b}$.
  parts:
    - id: par
      prompt: Parallel part
      answer: { type: vector, key: ['\frac{ {{a1}}\cdot({{b1}})+{{a2}}\cdot{{b2}} }{ ({{b1}})^2+({{b2}})^2 }\cdot({{b1}})', '\frac{ {{a1}}\cdot({{b1}})+{{a2}}\cdot{{b2}} }{ ({{b1}})^2+({{b2}})^2 }\cdot{{b2}}'] }
    - id: perp
      prompt: Perpendicular part
      answer: { type: vector, key: ['{{a1}}-\frac{ {{a1}}\cdot({{b1}})+{{a2}}\cdot{{b2}} }{ ({{b1}})^2+({{b2}})^2 }\cdot({{b1}})', '{{a2}}-\frac{ {{a1}}\cdot({{b1}})+{{a2}}\cdot{{b2}} }{ ({{b1}})^2+({{b2}})^2 }\cdot{{b2}}'] }
  solution: |
    The parallel part is the vector projection of $\mathbf{a}$ onto $\mathbf{b}$. The perpendicular part is $\mathbf{a}$ minus that; check that its dot product with $\mathbf{b}$ is 0.
  verify: |
    def answers(a1, a2, b1, b2):
        a, b = Matrix([a1, a2]), Matrix([b1, b2])
        p = a.dot(b) / b.dot(b) * b
        assert (a - p).dot(b) == 0
        return {"par": list(p), "perp": list(a - p)}

