- id: spec.combinatorics.combinations.route-via-shop
  skills: { primary: spec.combinatorics.combinations }
  subsection: "Paths on a grid"
  rating: 1600
  responseSkills: { reading: 1590, calculation: 1560, reasoning: 1590 }
  words: { who: person, venue: venue, shop: shop }
  stem: |
    {{who}} walks through a grid of streets from home to the {{venue}}, which is 6 blocks east and 4 blocks north, using only steps east or north. On the way, {{who}} wants to stop at the {{shop}}, which is 2 blocks east and 2 blocks north of home. How many routes pass the {{shop}}?
  parts:
    - id: a
      answer: { type: numeric, key: 90 }
  solution: |
    Home to the {{shop}}: 2 east and 2 north in some order, $\dbinom{4}{2} = 6$. The {{shop}} to the {{venue}}: 4 east and 2 north, $\dbinom{6}{2} = 15$. Total $6 \times 15 = 90$.
  verify: |
    from itertools import combinations
    def answers():
        count = 0
        for north in combinations(range(10), 4):
            x = y = 0
            through = False
            for i in range(10):
                if i in north: y += 1
                else: x += 1
                if (x, y) == (2, 2): through = True
            count += through
        return {"a": count}

- id: spec.combinatorics.combinations.route-avoiding-roadworks
