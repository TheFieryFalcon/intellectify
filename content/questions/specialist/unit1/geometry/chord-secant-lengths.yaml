        return {"a": approx(t[1] - t[0])}
- id: spec.geometry.chord-secant-lengths.point-inside
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1440
  responseSkills: {calculation: 1420, reasoning: 1430, synthesis: 1420}
  stem: |
    A point $X$ is 6 cm from the center of a circle of radius 10 cm. A chord $AB$ passes through $X$ with $AX = 4$ cm. Find $XB$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [1.028, -1.715], B: [-1.029, 1.715], X: [0.617, -1.029], R: [-1.732, 1], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: A, to: X, label: '4', side: right }
      - { type: segment, from: O, to: X, label: '6', dashed: true }
      - { type: segment, from: O, to: R, label: '10', dashed: true }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: X, label: 'X', pos: s }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
    ```
  parts:
  - id: a
    prompt: $XB$ (cm)
    answer: {type: numeric, key: '16'}
  solution: |
    The diameter through $X$ is cut into $10 - 6 = 4$ and $10 + 6 = 16$. Intersecting chords: $AX \times XB = 4 \times 16 = 64$, so $XB = \tfrac{64}{4} = 16$ cm.
