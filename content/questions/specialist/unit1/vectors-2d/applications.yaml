  solution: |
    The {{craft}} must point east of north to cancel the wind, so its velocity through the air is $70\mathbf{i} + v\mathbf{j}$, with magnitude 250. Then $v = \sqrt{250^2 - 70^2} = 240$, and the ground velocity is $240\mathbf{j}$ {{u.speed}}.
    Bearing: east of north by $\sin^{-1}\tfrac{70}{250} \approx 16.3^\circ$, i.e. $016.3^\circ\text{T}$. Time: $\tfrac{400}{240}$ h $= 100$ minutes.
