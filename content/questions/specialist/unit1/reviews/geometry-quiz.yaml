- id: spec.geometry.sq.negate-for-every-y
  title: "Negating \"For Every x There Is a y\""
  pool: section-quiz
  skills: { primary: spec.geometry.logic }
  subsection: "Negation"
  rating: 1450
  responseSkills: { reading: 1440, reasoning: 1430, precision: 1420 }
  stem: |
    Which statement is the negation of "For every real number $x$, there is a real number $y$ with $y > x^2$"?
  parts:
    - id: a
      options:
        - { id: a, text: 'For every real number $x$, there is a real number $y$ with $y \le x^2$.' }
        - { id: b, text: 'There is a real number $x$ such that every real number $y$ has $y \le x^2$.' }
        - { id: c, text: 'There is a real number $x$ and a real number $y$ with $y \le x^2$.' }
        - { id: d, text: 'For every real number $x$ and every real number $y$, $y < x^2$.' }
      answer: { type: mcq, key: b }
  solution: |
    Negating swaps each quantifier and negates what follows: "for every $x$" becomes "there is an $x$", "there is a $y$ with $y > x^2$" becomes "every $y$ has $y \le x^2$". That is (b).
  verify: |
    def answers():
        return {"a": "b"}

- id: spec.geometry.sq.prime-2p-plus-1
  title: "When 2p + 1 Isn't Prime"
  pool: section-quiz
