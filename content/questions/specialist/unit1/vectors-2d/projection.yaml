- id: spec.vectors-2d.projection.two-projections
  skills: { primary: spec.vectors-2d.projection }
  rating: 1580
  responseSkills: { synthesis: 1570, calculation: 1530 }
  requiresCalculator: true
  stem: |
    The scalar projection of $\mathbf{a}$ onto $\mathbf{b}$ is 3, and the scalar projection of $\mathbf{b}$ onto $\mathbf{a}$ is 6. Also, $|\mathbf{a}| = 4$.
  parts:
    - id: a
      prompt: Find $|\mathbf{b}|$.
      answer: { type: numeric, key: 8 }
    - id: b
      prompt: Find the angle between $\mathbf{a}$ and $\mathbf{b}$, correct to one decimal place (°).
      answer: { type: numeric, key: 41.4 }
  solution: |
    $\dfrac{\mathbf{a}\cdot\mathbf{b}}{|\mathbf{a}|} = 6$, so $\mathbf{a}\cdot\mathbf{b} = 24$. Then $\dfrac{24}{|\mathbf{b}|} = 3$, so $|\mathbf{b}| = 8$.
    $\cos\theta = \dfrac{24}{4 \times 8} = \tfrac{3}{4}$, so $\theta \approx 41.4^\circ$.
  verify: |
    def answers():
        d = 6 * 4
        nb = d / 3
        return {"a": nb, "b": round(float(deg(acos(Rational(d, 4) / nb))), 1)}

- id: spec.vectors-2d.projection.from-projection-and-length
  skills: { primary: spec.vectors-2d.projection }
  rating: 1600
  responseSkills: { synthesis: 1590, calculation: 1540 }
  stem: |
    The vector projection of $\mathbf{a}$ onto $\mathbf{i} + \mathbf{j}$ is $3\mathbf{i} + 3\mathbf{j}$, and $|\mathbf{a}| = \sqrt{26}$. If the $\mathbf{i}$-component of $\mathbf{a}$ is larger than its $\mathbf{j}$-component, find $\mathbf{a}$.
  parts:
    - id: a
      answer: { type: vector, key: ['5', '1'] }
  solution: |
    $\mathbf{a}$ is its projection plus a part perpendicular to $\mathbf{i} + \mathbf{j}$, which is a multiple of $\mathbf{i} - \mathbf{j}$: $\mathbf{a} = (3 + t)\mathbf{i} + (3 - t)\mathbf{j}$.
    $|\mathbf{a}|^2 = 18 + 2t^2 = 26$, so $t = \pm 2$. The $\mathbf{i}$-component is larger when $t = 2$: $\mathbf{a} = 5\mathbf{i} + \mathbf{j}$.
  verify: |
    def answers():
        x, y = symbols("x y", real=True)
        b = Matrix([1, 1])
        sols = solve([(x + y) / 2 - 3, x**2 + y**2 - 26], [x, y], dict=True)
        s = [t for t in sols if t[x] > t[y]][0]
        a = Matrix([s[x], s[y]])
        assert a.dot(b) / b.dot(b) * b == Matrix([3, 3])
        return {"a": list(a)}

- id: spec.vectors-2d.projection.triangle-area
  skills: { primary: spec.vectors-2d.projection }
  rating: 1620
  responseSkills: { synthesis: 1610, calculation: 1560 }
  stem: |
    Use projections to find the area of the triangle with corners $O(0, 0)$, $A(4, 1)$ and $B(1, 3)$.
  parts:
    - id: a
      answer: { type: numeric, key: 5.5 }
  solution: |
    Take $OA$ as the base, with length $\sqrt{17}$. The height is the length of the part of $\overrightarrow{OB}$ perpendicular to $\overrightarrow{OA}$.
    Vector projection of $\overrightarrow{OB}$ onto $\overrightarrow{OA}$: $\tfrac{7}{17}(4\mathbf{i} + \mathbf{j})$. Perpendicular part: $\left(1 - \tfrac{28}{17}\right)\mathbf{i} + \left(3 - \tfrac{7}{17}\right)\mathbf{j} = \tfrac{11}{17}(-\mathbf{i} + 4\mathbf{j})$, with length $\tfrac{11}{\sqrt{17}}$.
    Area $= \tfrac{1}{2} \times \sqrt{17} \times \tfrac{11}{\sqrt{17}} = 5.5$.
  verify: |
    def answers():
        A, B = Matrix([4, 1]), Matrix([1, 3])
        h = (B - B.dot(A) / A.dot(A) * A).norm()
        area = A.norm() * h / 2
        assert simplify(area - abs(A[0]*B[1] - A[1]*B[0]) / 2) == 0
        return {"a": simplify(area)}

- id: spec.vectors-2d.projection.altitude
  skills: { primary: spec.vectors-2d.projection }
  rating: 1660
  responseSkills: { synthesis: 1640, calculation: 1600 }
  stem: |
    Triangle $ABC$ has $A(0, 0)$, $B(5, 0)$ and $C(1, 4)$. $D$ is the point on $BC$ for which $AD$ is perpendicular to $BC$.
  parts:
    - id: a
      prompt: Find the position vector of $D$.
      answer: { type: vector, key: ['2.5', '2.5'] }
    - id: b
      prompt: Hence find the area of the triangle.
      answer: { type: numeric, key: 10 }
  solution: |
    $\overrightarrow{BC} = -4\mathbf{i} + 4\mathbf{j}$ and $\overrightarrow{BA} = -5\mathbf{i}$. The vector projection of $\overrightarrow{BA}$ onto $\overrightarrow{BC}$ is $\tfrac{20}{32}(-4\mathbf{i} + 4\mathbf{j}) = -2.5\mathbf{i} + 2.5\mathbf{j}$, which is $\overrightarrow{BD}$.
    So $\overrightarrow{OD} = 5\mathbf{i} + (-2.5\mathbf{i} + 2.5\mathbf{j}) = 2.5\mathbf{i} + 2.5\mathbf{j}$.
    Area $= \tfrac{1}{2}|BC|\,|AD| = \tfrac{1}{2}(4\sqrt{2})(2.5\sqrt{2}) = 10$.
  verify: |
    def answers():
        A, B, C = Matrix([0, 0]), Matrix([5, 0]), Matrix([1, 4])
        d = C - B
        D = B + (A - B).dot(d) / d.dot(d) * d
        assert (D - A).dot(d) == 0
        return {"a": list(D), "b": d.norm() * (D - A).norm() / 2}

- id: spec.vectors-2d.projection.reflection
  skills: { primary: spec.vectors-2d.projection }
  rating: 1690
  responseSkills: { synthesis: 1690, calculation: 1620 }
  stem: |
    A line passes through the origin in the direction $2\mathbf{i} + \mathbf{j}$. Find the position vector of the mirror image of $P(5, 1)$ in the line (the point the same distance from the line, directly opposite $P$ on the other side).
  parts:
    - id: a
      answer: { type: vector, key: ['3.8', '3.4'] }
  solution: |
    The vector projection of $\mathbf{p} = 5\mathbf{i} + \mathbf{j}$ onto $2\mathbf{i} + \mathbf{j}$ is $\tfrac{11}{5}(2\mathbf{i} + \mathbf{j})$: the point $F$ on the line closest to $P$.
    The image is as far beyond $F$ as $P$ is before it, so it is $2\overrightarrow{OF} - \mathbf{p} = \left(\tfrac{44}{5} - 5\right)\mathbf{i} + \left(\tfrac{22}{5} - 1\right)\mathbf{j} = 3.8\mathbf{i} + 3.4\mathbf{j}$.
  verify: |
    def answers():
        p, d = Matrix([5, 1]), Matrix([2, 1])
        F = p.dot(d) / d.dot(d) * d
        Q = 2*F - p
        assert Q.norm() == p.norm()
        return {"a": list(Q)}

