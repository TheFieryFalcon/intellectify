# Converses and circle geometry problems (1.1.14, 1.1.15).

- id: spec.geometry.circle-problems.which-cyclic
  skills: {primary: spec.geometry.circle-problems}
  rating: 1080
  responseSkills: {reading: 1070}
  stem: |
    Which quadrilateral must be cyclic? Its angles are listed in order around the shape.
  parts:
  - id: a
    options:
    - {id: a, text: '$80^\circ, 100^\circ, 80^\circ, 100^\circ$'}
    - {id: b, text: '$75^\circ, 95^\circ, 105^\circ, 85^\circ$'}
    - {id: c, text: '$90^\circ, 80^\circ, 100^\circ, 90^\circ$'}
    - {id: d, text: '$70^\circ, 80^\circ, 100^\circ, 110^\circ$'}
    answer: {type: mcq, key: b}
  solution: |
    A quadrilateral is cyclic if a pair of opposite angles (first and third, or second and fourth) adds to $180^\circ$. Only (b) works: $75^\circ + 105^\circ = 180^\circ$. The opposite pairs add to $160^\circ$ and $200^\circ$ in (a), $190^\circ$ and $170^\circ$ in (c), and $170^\circ$ and $190^\circ$ in (d).
  verify: |
    def answers():
        opts = {"a": (80, 100, 80, 100), "b": (75, 95, 105, 85), "c": (90, 80, 100, 90), "d": (70, 80, 100, 110)}
        good = [k for k, a in opts.items() if a[0] + a[2] == 180]
        return {"a": good[0] if len(good) == 1 else "ambiguous"}
- id: spec.geometry.circle-problems.right-angle-on-circle
  skills: {primary: spec.geometry.circle-problems}
  rating: 1110
  responseSkills: {reading: 1100, calculation: 1080}
  variants:
  - {ab: 10}
  - {ab: 14}
  stem: |
    $A$ and $B$ are {{ab}} cm apart, and $M$ is the midpoint of $AB$. A point $P$ has $\angle APB = 90^\circ$. How far is $P$ from $M$?
  parts:
  - id: a
    prompt: $PM$ (cm)
    answer: {type: numeric, key: '\frac{ {{ab}} }{2}'}
  solution: |
    By the converse of the angle in a semicircle, $P$ lies on the circle with diameter $AB$. Its center is $M$ and its radius is $\tfrac{ {{ab}} }{2}$ cm, so $PM = \tfrac{ {{ab}} }{2}$ cm.
  verify: |
    def answers(ab):
        import math
        A, B = (-ab / 2, 0.0), (ab / 2, 0.0)
        # Any P with a right angle at P: search along a ray from M for the point where angle APB = 90.
        best = min((((ab * k / 4000) * math.cos(1.1), (ab * k / 4000) * math.sin(1.1)) for k in range(1, 4000)),
                   key=lambda Q: abs(angle_at(A, Q, B) - 90))
        return {"a": round(dist(best, (0, 0)), 1)}
- id: spec.geometry.circle-problems.equal-angles-concyclic
  skills: {primary: spec.geometry.circle-problems}
  rating: 1150
  responseSkills: {reading: 1140}
  stem: |
    $A$, $B$, $C$ and $D$ are four points with $C$ and $D$ on the same side of line $AB$, and $\angle ACB = \angle ADB = 35^\circ$. What can you conclude?
  parts:
  - id: a
    options:
    - {id: a, text: $ABCD$ is a parallelogram}
    - {id: b, text: '$A$, $B$, $C$ and $D$ lie on a circle'}
    - {id: c, text: $AC = BD$}
    - {id: d, text: Nothing}
    answer: {type: mcq, key: b}
  solution: |
    $AB$ subtends equal angles at $C$ and $D$ on the same side, so by the converse of angles on the same arc, the four points are concyclic.
- id: spec.geometry.circle-problems.cyclic-exterior
  skills: {primary: spec.geometry.circle-problems}
  rating: 1200
  responseSkills: {reading: 1190, calculation: 1150}
  variants:
  - {e: 70}
  - {e: 112}
  stem: |
    A quadrilateral $ABCD$ has an exterior angle at $C$ (between $DC$ and $BC$ extended) of ${{e}}^\circ$, and $\angle DAB = {{e}}^\circ$. Is $ABCD$ cyclic?
  parts:
  - id: a
    options:
    - {id: a, text: 'Yes'}
    - {id: b, text: 'No'}
    - {id: c, text: Not enough information}
    answer: {type: mcq, key: a}
  solution: |
    The interior angle at $C$ is $180^\circ - {{e}}^\circ$, so $\angle DAB + \angle BCD = 180^\circ$. By the converse of the cyclic quadrilateral theorem, $ABCD$ is cyclic.
- id: spec.geometry.circle-problems.triangle-from-center-angles
  skills: {primary: spec.geometry.circle-problems}
  rating: 1300
  responseSkills: {reading: 1280, calculation: 1290, reasoning: 1290}
  stem: |
    Triangle $ABC$ has its corners on a circle with center $O$ inside the triangle. $\angle AOB = 140^\circ$ and $\angle BOC = 100^\circ$. Find the angles of the triangle.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-0.684, -1.879], B: [1.732, 1], C: [-1.286, 1.532], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: polygon, points: [A, B, C] }
      - { type: segment, from: O, to: A, color: muted }
      - { type: segment, from: O, to: B, color: muted }
      - { type: segment, from: O, to: C, color: muted }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: O, label: 'O', pos: e }
    ```
  parts:
  - id: a
    prompt: $\angle BAC$ (°)
    answer: {type: numeric, key: '50'}
  - id: b
    prompt: $\angle ABC$ (°)
    answer: {type: numeric, key: '60'}
  - id: c
    prompt: $\angle ACB$ (°)
    answer: {type: numeric, key: '70'}
  solution: |
    $\angle COA = 360^\circ - 140^\circ - 100^\circ = 120^\circ$. Each angle of the triangle is half the angle at the center on the opposite side: $\angle BAC = \tfrac{1}{2} \times 100^\circ = 50^\circ$, $\angle ABC = \tfrac{1}{2} \times 120^\circ = 60^\circ$ and $\angle ACB = \tfrac{1}{2} \times 140^\circ = 70^\circ$.
  verify: |
    def answers():
        A = on_circle(0)
        B = on_circle(140)
        C = on_circle(240)
        return {"a": approx(angle_at(B, A, C)), "b": approx(angle_at(A, B, C)), "c": approx(angle_at(A, C, B))}
- id: spec.geometry.circle-problems.tangent-cyclic
  skills: {primary: spec.geometry.circle-problems}
  rating: 1320
  responseSkills: {reading: 1310, calculation: 1300, reasoning: 1310}
  variants:
  - {t: 70}
  - {t: 54}
  stem: |
    $ABCD$ is a cyclic quadrilateral. The tangent at $A$ makes an angle of {{t}}° with $AB$, on the side away from $D$. Find $\angle ADB$ and $\angle ACB$.
  parts:
  - id: a
    prompt: $\angle ADB$ (°)
    answer: {type: numeric, key: '{{t}}'}
  - id: b
    prompt: $\angle ACB$ (°)
    answer: {type: numeric, key: '{{t}}'}
  solution: |
    By the alternate segment theorem, the tangent–chord angle equals any angle on chord $AB$ in the alternate segment. $C$ and $D$ both lie in it, so $\angle ADB = \angle ACB = {{t}}^\circ$.
  verify: |
    def answers(t):
        A = on_circle(270)
        B = on_circle(270 + 2*t)
        C, D = on_circle(120), on_circle(200)
        Y = (3, -1)
        assert abs(angle_at(Y, A, B) - t) < 1e-9
        return {"a": approx(angle_at(A, D, B)), "b": approx(angle_at(A, C, B))}
- id: spec.geometry.circle-problems.cyclic-four-angles
  skills: {primary: spec.geometry.circle-problems}
  rating: 1350
  responseSkills: {reading: 1330, calculation: 1340, reasoning: 1340}
  stem: |
    $ABCD$ is cyclic with $\angle DAB = (x + 20)^\circ$, $\angle ABC = (3x - 40)^\circ$ and $\angle BCD = (2x + 10)^\circ$. Find $\angle CDA$.
  parts:
  - id: a
    prompt: $\angle CDA$ (°)
    answer: {type: numeric, key: '70'}
  solution: |
    Opposite angles: $(x + 20) + (2x + 10) = 180$, so $x = 50$. Then $\angle ABC = 110^\circ$ and $\angle CDA = 180^\circ - 110^\circ = 70^\circ$.
  verify: |
    def answers():
        x = symbols("x")
        xv = solve(x + 20 + 2*x + 10 - 180, x)[0]
        return {"a": 180 - (3*xv - 40)}
- id: spec.geometry.circle-problems.find-x-if-cyclic
