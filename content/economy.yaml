# §13.5 Corollaries: +(points ÷ 10)% per achievement, +5% per level tier, +10% per completed era set.
corollaries: {perAchievementPoint: 0.001, perLevelTier: 0.05, perEraSet: 0.10}

# §13.7 Packs: 3 cards from one era. Odds per card (percent). The last card is the guaranteed Gold or
# better, with Platinum and Diamond at the usual odds. Guarantees by pack count, per era: a Diamond by the
# 80th pack without one, and a Platinum or better by the 10th. Law of Large Numbers takes 5% of each base
# off per level (at level 10: Diamond 40, Platinum 5).
packs:
  size: 3
  odds:
    common: {silver: 72, gold: 20, platinum: 6.5, diamond: 1.5}
    last: {silver: 0, gold: 92, platinum: 6.5, diamond: 1.5}
  pity: {diamond: 80, platinum: 10, step: 0.05}
  foilOneIn: 25
  duplicate: {silver: 20, gold: 60, platinum: 200, diamond: 600}
  # Era: 0 Antiquity … 6 Space Age, capped at the latest unlocked, released era.
  levelTier:
    bronze: {packs: 1, era: 0}
    silver: {packs: 2, era: 0}
    gold: {packs: 3, era: 1}
    platinum: {packs: 8, era: 2}
    diamond: {packs: 12, era: 3}
    ruby: {packs: 15, era: 4}
    tanzanite: {packs: 40, era: 5}
    vibranium: {packs: 54, era: 6}
    solarium: {packs: 67, era: 6}
    antimatter: {packs: 226, era: 6}
  achievement:
    platinum: {packs: 1, era: 0}
    diamond: {packs: 2, era: 1}
    ruby: {packs: 3, era: 2}
    tanzanite: {packs: 5, era: 3}
    vibranium: {packs: 8, era: 4}
    solarium: {packs: 12, era: 5}
    antimatter: {packs: 20, era: 6}
  challenge: 1
  fullWeek: 1

