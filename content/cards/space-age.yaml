# Space Age Pack: 1955 on (docs/SPEC.md §13.7). First draft.
era: space-age
cards:
  # ── Diamond ───────────────────────────────────────────
  - id: hawking
    name: Stephen Hawking
    born: 1942
    died: 2018
    work: 1974
    fields: [Physics, Astronomy]
    rarity: diamond
    portrait: null
    blurb: >-
      Showed that black holes are not fully black but slowly glow and evaporate, joining gravity, quantum
      theory and heat. A Brief History of Time made him the world's most famous scientist, working for
      decades despite motor neurone disease.

  - id: deleuze
    name: Gilles Deleuze
    born: 1925
    died: 1995
    work: 1968
    fields: [Philosophy]
    rarity: diamond
    portrait: null
    blurb: >-
      In Difference and Repetition he put difference before identity, seeing the world as becoming
      rather than fixed things. With Félix Guattari he wrote Anti-Oedipus and A Thousand Plateaus,
      reshaping thought on desire, power and networks.

  - id: noam-chomsky
    name: Noam Chomsky
    born: 1928
    work: 1957
    fields: [Linguistics, Philosophy, Psychology]
    rarity: diamond
    portrait: null
    blurb: >-
      Argued that every human language shares a deep structure that children are born ready to learn,
      overturning the idea that language is learned by imitation alone. Syntactic Structures founded
      modern linguistics, and his hierarchy of grammars is still basic computer science.

  - id: foucault
    name: Michel Foucault
    born: 1926
    died: 1984
    work: 1975
    fields: [Philosophy, History]
    rarity: diamond
    portrait: null
    blurb: >-
      Studied how prisons, hospitals and schools shape people, and how knowledge and power support each
      other. Discipline and Punish is among the most cited books in the humanities.

  # ── Platinum ──────────────────────────────────────────
  - id: grothendieck
    name: Alexander Grothendieck
    born: 1928
    died: 2014
    work: 1960
    fields: [Mathematics]
    rarity: platinum
    portrait: null
    blurb: >-
      Rebuilt algebraic geometry on new foundations of great generality, which led to the proof of the
      Weil Conjectures. He later left mathematics and lived as a recluse in the Pyrenees.

  - id: roger-penrose
    name: Roger Penrose
    born: 1931
    work: 1965
    fields: [Mathematics, Physics]
    rarity: platinum
    portrait: null
    blurb: >-
      Showed in 1965 that black holes are an unavoidable prediction of general relativity, which won him
      a share of the 2020 Nobel Prize in Physics. He also found Penrose tilings, patterns that cover the
      plane but never repeat.

  - id: andrew-wiles
    name: Andrew Wiles
    born: 1953
    work: 1994
    fields: [Mathematics]
    rarity: platinum
    portrait: null
    related: [spec.real-complex.number-proofs]
    blurb: >-
      Proved Fermat's Last Theorem in 1994, after seven years of working on it in secret and closing a
      final gap with Richard Taylor. The proof joined elliptic curves and modular forms, two distant
      parts of mathematics.

  - id: tim-berners-lee
    name: Tim Berners-Lee
    born: 1955
    work: 1989
    fields: [Computing]
    rarity: platinum
    portrait: null
    blurb: >-
      Invented the World Wide Web at CERN in 1989, with web pages, links and the first browser, and gave
      it away free. He founded the consortium that still sets the web's open standards.

  - id: kuhn
    name: Thomas Kuhn
    born: 1922
    died: 1996
    work: 1962
    fields: [Philosophy, History]
    rarity: platinum
    portrait: null
    blurb: >-
      The Structure of Scientific Revolutions argued that science advances through paradigm shifts, not
      just steady accumulation. He made paradigm an everyday word.

  - id: derrida
    name: Jacques Derrida
    born: 1930
    died: 2004
    work: 1967
    fields: [Philosophy]
    rarity: platinum
    portrait: null
    blurb: >-
      Founded deconstruction, reading texts closely to show how their meanings depend on oppositions they
      cannot hold apart. It reshaped literary theory, law and architecture.

  # ── Gold ──────────────────────────────────────────────
  - id: chien-shiung-wu
    name: Chien-Shiung Wu
    born: 1912
    died: 1997
    work: 1957
    fields: [Physics]
    rarity: gold
    portrait: null
    blurb: >-
      Her 1957 experiment showed that nature can tell left from right, overturning the conservation of
      parity. She was a leading experimental physicist of beta decay.

  - id: mandelbrot
    name: Benoit Mandelbrot
    born: 1924
    died: 2010
    work: 1982
    fields: [Mathematics]
    rarity: gold
    portrait: null
    related: [spec.complex.loci]
    blurb: >-
      Coined the word fractal for shapes whose detail repeats at every scale, like coastlines and clouds.
      The Mandelbrot set, a region of the complex plane, is the most famous example.

  - id: erdos
    name: Paul Erdős
    born: 1913
    died: 1996
    work: 1959
    fields: [Mathematics]
    rarity: gold
    portrait: null
    related: [spec.combinatorics.pigeonhole]
    blurb: >-
      Wrote about 1,500 papers with over 500 coauthors, living out of a suitcase and moving from one
      collaborator to the next. He founded much of combinatorics, random graph theory and probabilistic methods; the Erdős
      number measures distance from him.

  - id: hannah-arendt
    name: Hannah Arendt
    born: 1906
    died: 1975
    work: 1963
    fields: [Philosophy, History]
    rarity: gold
    portrait: null
    blurb: >-
      Reporting on the trial of the Nazi organizer Adolf Eichmann, she wrote of the banality of evil: great
      crimes done by ordinary people not thinking. The Origins of Totalitarianism traced how Nazism and
      Stalinism arose.

  - id: john-rawls
    name: John Rawls
    born: 1921
    died: 2002
    work: 1971
    fields: [Philosophy]
    rarity: gold
    portrait: null
    blurb: >-
      A Theory of Justice asked what rules we would choose behind a veil of ignorance, not knowing our
      place in society. It revived political philosophy in the English-speaking world.

  - id: daniel-kahneman
    name: Daniel Kahneman
    born: 1934
    died: 2024
    work: 1979
    fields: [Psychology, Economics]
    rarity: gold
    portrait: null
    blurb: >-
      With Amos Tversky, showed that people judge risk and probability with predictable biases, not as
      the perfectly rational agents economics assumed. Their prospect theory won him the Nobel Prize in
      economics.

  - id: terence-tao
    name: Terence Tao
    born: 1975
    work: 2004
    fields: [Mathematics]
    rarity: gold
    portrait: null
    blurb: >-
      Born in Adelaide, he won an International Mathematical Olympiad gold medal at 13, and with Ben
      Green proved that the primes contain evenly spaced runs of any length. He won the Fields Medal in
      2006 and works across an unusually wide range of mathematics.

  - id: grigori-perelman
    name: Grigori Perelman
    born: 1966
    work: 2003
    fields: [Mathematics]
    rarity: gold
    portrait: null
    blurb: >-
      Proved the Poincaré Conjecture, posting his proof online in 2002 and 2003 rather than in a journal.
      He turned down both the Fields Medal and a million-dollar Millennium Prize.

  - id: rachel-carson
    name: Rachel Carson
    born: 1907
    died: 1964
    work: 1962
    fields: [Biology]
    rarity: gold
    portrait: null
    blurb: >-
      Silent Spring showed how pesticides such as DDT were poisoning birds, rivers and food chains. It
      launched the modern environmental movement and led to DDT being banned for farm use in the United
      States.

  - id: lyotard
    name: Jean-François Lyotard
    born: 1924
    died: 1998
    work: 1979
    fields: [Philosophy]
    rarity: gold
    portrait: null
    blurb: >-
      The Postmodern Condition defined the postmodern as incredulity toward grand narratives, the big
      stories of progress and liberation that once justified knowledge. It made postmodernism a key word
      of late twentieth-century thought.

  # ── Silver ────────────────────────────────────────────
  - id: grace-hopper
    name: Grace Hopper
    born: 1906
    died: 1992
    work: 1959
    fields: [Computing, Mathematics]
    rarity: silver
    portrait: null
    blurb: >-
      Wrote one of the first compilers and pushed for programming in English-like words, which led to
      COBOL. She helped popularize the term debugging.

  - id: dorothy-hodgkin
    name: Dorothy Hodgkin
    born: 1910
    died: 1994
    work: 1956
    fields: [Chemistry]
    rarity: silver
    portrait: null
    blurb: >-
      Used X-ray crystallography to find the structures of penicillin, vitamin B12 and insulin. She won
      the 1964 Nobel Prize in Chemistry.

  - id: jonas-salk
    name: Jonas Salk
    born: 1914
    died: 1995
    work: 1955
    fields: [Medicine]
    rarity: silver
    portrait: null
    blurb: >-
      Developed the first effective polio vaccine and chose not to patent it. Mass vaccination cut polio
      cases dramatically within a few years.

  - id: peter-higgs
    name: Peter Higgs
    born: 1929
    died: 2024
    work: 1964
    fields: [Physics]
    rarity: silver
    portrait: null
    blurb: >-
      Predicted the particle, now named after him, behind the way fundamental particles get mass. It was
      found at CERN in 2012, and he shared the Nobel Prize the next year.

  - id: john-conway
    name: John Horton Conway
    born: 1937
    died: 2020
    work: 1970
    fields: [Mathematics]
    rarity: silver
    portrait: null
    blurb: >-
      Invented the Game of Life, where simple rules on a grid produce endlessly complex patterns, and the
      surreal numbers. He also did deep work on symmetry groups and knots.

  - id: maryam-mirzakhani
    name: Maryam Mirzakhani
    born: 1977
    died: 2017
    work: 2014
    fields: [Mathematics]
    rarity: silver
    portrait: null
    blurb: >-
      Studied the geometry of curved surfaces and how paths move across them. In 2014 she became the
      first woman, and first Iranian, to win the Fields Medal.

  - id: carl-sagan
    name: Carl Sagan
    born: 1934
    died: 1996
    work: 1980
    fields: [Astronomy]
    rarity: silver
    portrait: null
    blurb: >-
      Studied planetary atmospheres, including the greenhouse heat of Venus, and helped plan NASA's
      missions. His series Cosmos brought science to hundreds of millions of viewers.

  - id: jane-goodall
    name: Jane Goodall
    born: 1934
    died: 2025
    work: 1960
    fields: [Biology]
    rarity: silver
    portrait: null
    blurb: >-
      Lived among the chimpanzees of Gombe in Tanzania from 1960 and found that they make and use tools,
      overturning the idea that only humans do. She spent her later life campaigning for conservation.
