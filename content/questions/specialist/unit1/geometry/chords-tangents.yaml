- id: spec.geometry.chords-tangents.tangent-both-sides
  title: "Chords on Both Sides of a Tangent"
  skills: {primary: spec.geometry.chords-tangents}
  subsection: "The alternate segment theorem"
  rating: 1350
  responseSkills: {reading: 1340, calculation: 1330, reasoning: 1340}
  variants:
    - { p: 44, q: 56, a: 80, _A: '-1.999, -0.07', _B: '1.854, 0.749' }
    - { p: 48, q: 50, a: 82, _A: '-1.989, 0.209', _B: '1.97, 0.347' }
