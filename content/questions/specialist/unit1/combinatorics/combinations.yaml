- id: spec.combinatorics.combinations.all-four-suits
  skills: {primary: spec.combinatorics.combinations}
  subsection: "Choosing from categories"
  rating: 1620
  responseSkills: {calculation: 1570, reasoning: 1600, synthesis: 1610}
