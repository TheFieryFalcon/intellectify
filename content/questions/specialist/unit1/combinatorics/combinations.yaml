# ─────────────── Tier 4 ───────────────
- id: spec.combinatorics.combinations.whole-number-solutions
  skills: { primary: spec.combinatorics.combinations }
  rating: 1580
  responseSkills: { synthesis: 1580, calculation: 1500 }
  stem: |
    Consider the equation $x + y + z = 10$.
  parts:
    - id: a
      prompt: How many solutions have $x$, $y$ and $z$ all whole numbers ($\ge 0$)?
      marks: 1
      answer: { type: numeric, key: 66 }
    - id: b
      prompt: How many solutions have $x$, $y$ and $z$ all positive whole numbers ($\ge 1$)?
      marks: 2
      answer: { type: numeric, key: 36 }
  solution: |
    **(a)** Place 2 dividers among 10 identical objects: $\dbinom{12}{2} = 66$.

    **(b)** Give each variable 1 first, leaving 7 to share freely: $\dbinom{9}{2} = 36$.
  verify: |
    def answers():
        a = sum(1 for x in range(11) for y in range(11) if 10 - x - y >= 0)
        b = sum(1 for x in range(1, 11) for y in range(1, 11) if 10 - x - y >= 1)
        return {"a": a, "b": b}

- id: spec.combinatorics.combinations.more-women
  skills: { primary: spec.combinatorics.combinations }
  rating: 1560
  responseSkills: { calculation: 1520, reading: 1550 }
  stem: |
    A committee of 6 is chosen from 7 men and 5 women. How many committees contain more women than men?
  parts:
    - id: a
      answer: { type: numeric, key: 112 }
  solution: |
    More women than men in 6 people means 4 or 5 women.

    - 4 women and 2 men: $\dbinom{5}{4}\dbinom{7}{2} = 105$.
    - 5 women and 1 man: $1 \times 7 = 7$.

    Total $112$.
  verify: |
    def answers():
        return {"a": sum(binomial(5, w) * binomial(7, 6 - w) for w in range(6) if w > 6 - w)}

