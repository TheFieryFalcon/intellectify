  stem: |
    $OABC$ is a parallelogram, with $\overrightarrow{OA} = \mathbf{a}$ and $\overrightarrow{OC} = \mathbf{c}$. $N$ is the midpoint of $BC$. Find $\overrightarrow{ON}$ in terms of $\mathbf{a}$ and $\mathbf{c}$.
  parts:
    - id: a
      answer: { type: expression, key: 'c+\frac{1}{2}a', vars: { a: {}, c: {} } }
  solution: |
    $\overrightarrow{CB} = \overrightarrow{OA} = \mathbf{a}$, so $\overrightarrow{CN} = \tfrac{1}{2}\mathbf{a}$. Then $\overrightarrow{ON} = \overrightarrow{OC} + \overrightarrow{CN} = \mathbf{c} + \tfrac{1}{2}\mathbf{a}$.
  verify: |
