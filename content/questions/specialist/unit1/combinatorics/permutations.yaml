- id: spec.combinatorics.permutations.equation-consonants
  skills: { primary: spec.combinatorics.permutations }
  rating: 1460
  responseSkills: { calculation: 1450, reading: 1460 }
  stem: |
    The word **EQUATION** has 8 different letters. How many of its arrangements:
  parts:
    - id: a
      prompt: begin and end with a consonant?
      marks: 2
      answer: { type: numeric, key: 4320 }
    - id: b
      prompt: have all five vowels together?
      marks: 2
      answer: { type: numeric, key: 2880 }
  solution: |
    The consonants are Q, T and N; the vowels are E, U, A, I and O.

    **(a)** Choose and order the first and last letters from the 3 consonants: $3 \times 2 = 6$. Arrange the other 6 letters in the middle: $6! = 720$. Total $4320$.

    **(b)** Glue the vowels into one block: 4 objects in all, so $4! = 24$, times $5! = 120$ orders inside the block. Total $2880$.
  verify: |
    from itertools import permutations
    def answers():
        perms = list(permutations("EQUATION"))
        cons = set("QTN")
        a = sum(1 for p in perms if p[0] in cons and p[-1] in cons)
        vowel_positions = lambda p: sorted(i for i, ch in enumerate(p) if ch not in cons)
        b = sum(1 for p in perms if (lambda v: v[-1] - v[0] == 4)(vowel_positions(p)))
        return {"a": a, "b": b}

- id: spec.combinatorics.permutations.round-table
  skills: { primary: spec.combinatorics.permutations }
  rating: 1500
  responseSkills: { calculation: 1450, reading: 1500 }
  variants:
    - { n: 7, all: 720, apart: 480 }
    - { n: 8, all: 5040, apart: 3600 }
  stem: |
    {{n}} people sit around a round table. Only the positions relative to each other matter, so rotating everyone counts as the same arrangement.
  parts:
    - id: a
      prompt: How many seating arrangements are there?
      marks: 1
      answer: { type: numeric, key: '{{all}}' }
    - id: b
      prompt: In how many are two particular people **not** sitting next to each other?
      marks: 2
      answer: { type: numeric, key: '{{apart}}' }
  solution: |
    **(a)** Fix one person's seat and arrange the rest: $({{n}}-1)! = {{all}}$.

    **(b)** Arrangements with the pair together: glue them, giving $({{n}}-2)!$ circular arrangements, times 2: $2({{n}}-2)!$. So the answer is ${{all}} - 2({{n}}-2)! = {{apart}}$.
  verify: |
    from itertools import permutations
    def answers(n, all, apart):
        # Fix person 0 in seat 0; seats are in a circle.
        arr = [(0,) + p for p in permutations(range(1, n))]
        adj = lambda p: abs(p.index(0) - p.index(1)) in (1, n - 1)
        return {"a": len(arr), "b": sum(1 for p in arr if not adj(p))}

- id: spec.combinatorics.permutations.greater-than
  skills: { primary: spec.combinatorics.permutations }
  rating: 1520
  responseSkills: { calculation: 1480, reading: 1520 }
  stem: |
    Numbers are formed using the digits 1, 2, 3, 4 and 5, each used **at most once**. How many such numbers are greater than 4000?
  parts:
    - id: a
      answer: { type: numeric, key: 168 }
  solution: |
    - **4-digit numbers above 4000:** the first digit is 4 or 5 (2 options), then $4 \times 3 \times 2$, giving 48.
    - **5-digit numbers:** all are above 4000: $5! = 120$.

    Total $48 + 120 = 168$.
  verify: |
    from itertools import permutations
    def answers():
        nums = {int("".join(p)) for r in range(1, 6) for p in permutations("12345", r)}
        return {"a": sum(1 for x in nums if x > 4000)}

