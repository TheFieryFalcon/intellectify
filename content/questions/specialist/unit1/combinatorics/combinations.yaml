  solution: |
    Write the chosen numbers as $x < y < z$ with $y \ge x + 2$ and $z \ge y + 2$. Then $x$, $y - 1$, $z - 2$ are three **different** numbers from 1 to 18, and every such choice comes from exactly one valid $(x, y, z)$. So there are $\dbinom{18}{3} = 816$ choices.
  verify: |
