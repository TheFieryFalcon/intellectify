    $MS = \sqrt{5^2 - 3^2} = 4$. $OM$ cuts $ST$ at right angles at its midpoint $N$ (by symmetry, as triangles $OSM$ and $OTM$ are congruent). In right-angled triangle $OSM$, the height to the hypotenuse is $SN = \dfrac{OS \times MS}{OM} = \dfrac{3 \times 4}{5} = 2.4$ (two expressions for the area). So $ST = 4.8$.
  verify: |
    def answers():
        M = (5, 0)
        S, T = tangent_point_toward((0, 0), 3, M, 1), tangent_point_toward((0, 0), 3, M, -1)
        return {"a": approx(dist(S, T))}
- id: spec.geometry.chords-tangents.common-tangent
  skills: {primary: spec.geometry.chords-tangents}
  rating: 1730
  responseSkills: {synthesis: 1720, calculation: 1670}
  stem: |
    Two circles of radius 4 and 9 touch each other on the outside. A straight line touches both circles, at $A$ and $B$, without passing between them. Find $AB$.
  parts:
  - id: a
    prompt: $AB$
    answer: {type: numeric, key: '12'}
  solution: |
    The centers $P$ and $Q$ are $4 + 9 = 13$ apart. $PA$ and $QB$ are both perpendicular to $AB$, so $PABQ$ is a trapezium with right angles at $A$ and $B$. Draw the line from $P$ parallel to $AB$, meeting $QB$ at $R$: $QR = 9 - 4 = 5$ and $PR = AB$. By Pythagoras, $AB = \sqrt{13^2 - 5^2} = 12$.
  verify: |
    def answers():
        import math
        P, Q = (0.0, 0.0), (13.0, 0.0)
        # A line n·x = c (|n| = 1) with distance 4 from P and 9 from Q, both on the same side.
        c = 4.0
        cosphi = (c - 9) / 13
        n = (cosphi, math.sqrt(1 - cosphi**2))
        A = (c * n[0], c * n[1])
        B = (Q[0] + 9 * n[0], Q[1] + 9 * n[1])
        assert abs(dist(P, A) - 4) < 1e-9 and abs(dist(Q, B) - 9) < 1e-9
        return {"a": approx(dist(A, B))}
- id: spec.geometry.chords-tangents.tangent-secant-angles
  skills: {primary: spec.geometry.chords-tangents}
  rating: 1700
  responseSkills: {synthesis: 1690, calculation: 1640}
  stem: |
    The tangent at $A$ to a circle meets the line $BC$, extended beyond $C$, at $P$, where $B$ and $C$ are on the circle. $\angle APB = 30^\circ$ and $\angle ABC = 40^\circ$. Find $\angle ACB$.
  parts:
  - id: a
    prompt: $\angle ACB$ (°)
    answer: {type: numeric, key: '70'}
  solution: |
    By the alternate segment theorem, $\angle PAC = \angle ABC = 40^\circ$. In triangle $APC$, $\angle ACP = 180^\circ - 30^\circ - 40^\circ = 110^\circ$. So $\angle ACB = 180^\circ - 110^\circ = 70^\circ$ (angles on a straight line).
  verify: |
    def answers():
        import math
        # Build triangle ABC with angles B = 40, C = 70 (so A = 70) on a circle, then find P and check angle APB.
        B = on_circle(270 - 70, 2)   # arc AC (not containing B) = 2*40 = 80; arc AB = 2*70 = 140; arc BC = 140
        C = on_circle(270 + 70, 2)
        A = on_circle(270 + 70 + 80, 2)
        assert abs(angle_at(A, B, C) - 40) < 1e-6 and abs(angle_at(A, C, B) - 70) < 1e-6
        tdir = (-A[1], A[0])   # tangent at A is perpendicular to OA
        P = line_meet(A, (A[0] + tdir[0], A[1] + tdir[1]), B, C)
        assert abs(angle_at(A, P, B) - 30) < 1e-6
        return {"a": approx(angle_at(A, C, B), 4)}
- id: spec.geometry.chords-tangents.touching-circles-bisect
  skills: {primary: spec.geometry.chords-tangents}
  rating: 1810
  responseSkills: {proof: 1810, synthesis: 1790, clarity: 1680}
  stem: |
    Two circles touch on the inside at $T$ (the smaller circle is inside the larger, and they share a tangent at $T$). A chord $AB$ of the larger circle touches the smaller circle at $C$. Prove that $TC$ bisects $\angle ATB$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: tangent, description: 'Uses the common tangent at T, and names where TA and TB cross the small circle (P and Q)', points: 1, dimension: synthesis}
      - {id: parallel, description: Alternate segment theorem in both circles shows PQ ∥ AB (or equivalent), points: 2, dimension: proof}
      - {id: alt, description: 'Alternate segment theorem for tangent AB at C: ∠ACP = ∠CTP and ∠BCQ = ∠CTQ (or equivalent)', points: 2, dimension: proof}
      - {id: conclude, description: Combines these to show ∠ATC = ∠CTB, points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Let $TA$ and $TB$ meet the small circle again at $P$ and $Q$. Let $\ell$ be the common tangent at $T$.
    By the alternate segment theorem in each circle, the angle between $\ell$ and $TA$ equals both $\angle TBA$ (large circle) and $\angle TQP$ (small circle). So $\angle TQP = \angle TBA$, and $PQ \parallel AB$.
    Now $AB$ touches the small circle at $C$. By the alternate segment theorem, $\angle ACP = \angle CTP$, i.e. $\angle ACP = \angle ATC$. Also $\angle ACP = \angle CPQ$ (alternate angles, $PQ \parallel AB$), and $\angle CPQ = \angle CTQ$ (same arc $CQ$ of the small circle). So $\angle ATC = \angle CTQ = \angle CTB$: $TC$ bisects $\angle ATB$.
