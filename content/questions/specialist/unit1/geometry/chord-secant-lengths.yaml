    def near_far(M, c, R, th):
        import math
        dx, dy = math.cos(th), math.sin(th)
        fx, fy = M[0] - c[0], M[1] - c[1]
        b = 2 * (fx * dx + fy * dy); q = fx * fx + fy * fy - R * R
        disc = b * b - 4 * q
        if disc < 0: return None
        return (-b - math.sqrt(disc)) / 2, (-b + math.sqrt(disc)) / 2

    def far_for_near(M, c, R, near, lo, hi):
        """Bisect the direction angle so the near intersection is at distance `near`; return the far one."""
        for _ in range(200):
            mid = (lo + hi) / 2
            nf = near_far(M, c, R, mid)
            if nf is None or nf[0] > near: hi = mid
            else: lo = mid
        return near_far(M, c, R, lo)[1]

    def answers(t, ma, t2, mb, v):
        import math
        # Circle of radius t centered at (sqrt(2) t, 0): the tangent from M = origin has length t.
