  stem: |
    $ABCD$ is a trapezium with $AB \parallel DC$ and $AD = BC$, and $\angle DAB = {{t}}^\circ$. Find $\angle BCD$, and decide whether $ABCD$ is cyclic.

    ```diagram
    view: [-2.45, 4.45, -2.45, 2.45]
    width: 260
    points: { A: [0, 0], B: [4, 0], C: [{{_C}}], D: [{{_D}}] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C, ticks: 1 }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A, ticks: 1 }
      - { type: angle, at: A, from: B, to: D, label: '{{t}}^\circ', radius: 22 }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: se }
      - { type: point, at: C, label: 'C', pos: ne }
      - { type: point, at: D, label: 'D', pos: nw }
    ```
  parts:
  - id: a
    prompt: $\angle BCD$ (°)
    answer: {type: numeric, key: '{{v}}'}
  - id: b
    prompt: Is it cyclic?
    options:
    - {id: a, text: Cyclic}
    - {id: b, text: Not cyclic}
    answer: {type: mcq, key: a}
  solution: |
    In an isosceles trapezium the base angles are equal: $\angle ABC = {{t}}^\circ$. Co-interior angles between the parallel sides add to $180^\circ$: $\angle BCD = 180^\circ - {{t}}^\circ = {{v}}^\circ$. So $\angle DAB + \angle BCD = 180^\circ$, and $ABCD$ is cyclic.
  verify: |
    def answers(t, v):
        import math
        A, B = (0, 0), (4, 0)
        D = (2 * math.cos(math.radians(t)), 2 * math.sin(math.radians(t)))
        C = (4 - D[0], D[1])
        assert abs(angle_at(B, A, D) - t) < 1e-9 and abs(dist(A, D) - dist(B, C)) < 1e-9
        # Cyclic: does C lie on the circle through A, B and D?
        ux = 2.0
        uy = (D[0] ** 2 + D[1] ** 2 - 2 * ux * D[0]) / (2 * D[1])
        on = abs(dist((ux, uy), C) - dist((ux, uy), A)) < 1e-9
        return {"a": approx(angle_at(B, C, D)), "b": "a" if on else "b"}

