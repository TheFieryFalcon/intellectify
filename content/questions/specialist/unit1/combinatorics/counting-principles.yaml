- id: spec.combinatorics.counting-principles.mixed-code
  skills: { primary: spec.combinatorics.counting-principles }
  subsection: "Multiplication principle"
  rating: 1600
  responseSkills: {calculation: 1550, reasoning: 1580, synthesis: 1580}
  stem: |
    A code has 4 symbols, each a letter (A–Z) or a digit (0–9), and symbols may repeat. How many codes contain **at least one letter and at least one digit**?
  parts:
    - id: a
      answer: { type: numeric, key: 1212640 }
  solution: |
    All codes: $36^4$. Remove the codes with no digit (all letters, $26^4$) and those with no letter (all digits, $10^4$). These two groups can't overlap, so the answer is $36^4 - 26^4 - 10^4 = 1\,679\,616 - 456\,976 - 10\,000 = 1\,212\,640$.
  verify: |
    def answers():
        return {"a": 36**4 - 26**4 - 10**4}

