        a, c = symbols("a c")
        return {"a": c + a / 2}

- id: spec.vectors-2d.geometric.bearing-resultant
  title: "Distance and Bearing After Two Legs"
  skills: { primary: spec.vectors-2d.geometric }
  subsection: "Magnitudes from the triangle rule"
  rating: 1300
  responseSkills: {reading: 1300, calculation: 1280, reasoning: 1280}
  requiresCalculator: true
  variants:
    - { s: 5, e: 12, d: 13, b: 112.6 }
    - { s: 8, e: 15, d: 17, b: 118.1 }
  stem: |
    A ship sails {{s}} km due south, then {{e}} km due east. Find the ship's distance from its starting point, and the true bearing of its final position from the start, correct to one decimal place.
  parts:
    - id: a
      prompt: Distance (km)
      answer: { type: numeric, key: '{{d}}' }
    - id: b
      prompt: Bearing (°T)
      answer: { type: numeric, key: '{{b}}' }
  solution: |
    Distance: $\sqrt{ {{s}}^2 + {{e}}^2 } = {{d}}$ km. The final position is east of due south by angle $\theta$, where $\tan\theta = \tfrac{ {{e}} }{ {{s}} }$. The bearing is $180^\circ - \theta \approx {{b}}^\circ\text{T}$.
  verify: |
    def answers(s, e, d, b):
        theta = deg(atan(Rational(e, s)))
        return {"a": sqrt(s**2 + e**2), "b": round(float(180 - theta), 1)}

- id: spec.vectors-2d.geometric.divide-side
  title: "Point Dividing a Side in a Ratio"
  skills: { primary: spec.vectors-2d.geometric }
  subsection: "Points dividing a line"
  rating: 1350
  responseSkills: {reading: 1340, calculation: 1300, reasoning: 1330}
  variants:
    - { p: 1, q: 2 }
    - { p: 3, q: 1 }
    - { p: 2, q: 3 }
  stem: |
    In triangle $OAB$, $\overrightarrow{OA} = \mathbf{a}$ and $\overrightarrow{OB} = \mathbf{b}$. $P$ lies on $AB$ with $AP : PB = {{p}} : {{q}}$. Find $\overrightarrow{OP}$ in terms of $\mathbf{a}$ and $\mathbf{b}$.
  parts:
    - id: a
      answer: { type: expression, key: '\frac{ {{q}} }{ {{p}}+{{q}} }a+\frac{ {{p}} }{ {{p}}+{{q}} }b', vars: { a: {}, b: {} } }
  solution: |
    $\overrightarrow{AB} = \mathbf{b} - \mathbf{a}$, and $P$ is $\tfrac{ {{p}} }{ {{p}} + {{q}} }$ of the way from $A$ to $B$. So
    $\overrightarrow{OP} = \mathbf{a} + \tfrac{ {{p}} }{ {{p}} + {{q}} }(\mathbf{b} - \mathbf{a}) = \tfrac{ {{q}} }{ {{p}} + {{q}} }\mathbf{a} + \tfrac{ {{p}} }{ {{p}} + {{q}} }\mathbf{b}$.
  verify: |
    def answers(p, q):
        a, b = symbols("a b")
        return {"a": a + Rational(p, p + q) * (b - a)}

- id: spec.vectors-2d.geometric.sum-60
  title: "Length of a Sum from an Angle"
  skills: { primary: spec.vectors-2d.geometric }
  subsection: "Magnitudes from the triangle rule"
  rating: 1380
  responseSkills: {reading: 1360, calculation: 1370, reasoning: 1360}
  variants:
    - { p: 3, q: 5, v: 7 }
    - { p: 7, q: 8, v: 13 }
    - { p: 5, q: 16, v: 19 }
  stem: |
    $|\mathbf{a}| = {{p}}$, $|\mathbf{b}| = {{q}}$, and the angle between $\mathbf{a}$ and $\mathbf{b}$ is $60^\circ$. Find $|\mathbf{a} + \mathbf{b}|$.
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Placed head to tail, the angle inside the triangle is $180^\circ - 60^\circ = 120^\circ$. By the cosine rule,
    $|\mathbf{a} + \mathbf{b}|^2 = {{p}}^2 + {{q}}^2 - 2({{p}})({{q}})\cos 120^\circ = {{p}}^2 + {{q}}^2 + {{p}}\times{{q}}$, so the answer is ${{v}}$.
  verify: |
    def answers(p, q, v):
        return {"a": sqrt(p**2 + q**2 - 2*p*q*cos(2*pi/3))}

