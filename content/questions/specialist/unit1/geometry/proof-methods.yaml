  stem: |
    To show that a statement of the form "for all $x$, ..." is false, what do you need?
  parts:
  - id: a
    options:
    - {id: a, text: One counterexample}
    - {id: b, text: Several examples where it is true}
    - {id: c, text: A proof by contradiction}
    - {id: d, text: Its converse}
    answer: {type: mcq, key: a}
  solution: |
