  stem: |
    $ABCD$ is a cyclic quadrilateral with $\angle ABC = ({{e1}})^\circ$ and $\angle ADC = ({{e2}})^\circ$. Find $x$, in degrees.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    alt: "Cyclic quadrilateral ABCD; angle B is 2x + 10 degrees and angle D is 3x - 5 degrees"
    points: { A: [{{_A}}], B: [{{_B}}], C: [{{_C}}], D: [{{_D}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: polygon, points: [A, B, C, D] }
      - { type: angle, at: B, from: C, to: A, label: '({{e1}})^\circ', radius: 20 }
      - { type: angle, at: D, from: A, to: C, label: '({{e2}})^\circ', radius: 20 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
