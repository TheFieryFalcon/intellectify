  solution: |
    Let the tangent lengths from $A$, $B$ and $C$ be $a$, $b$ and $c$ (tangents from one point are equal). Then $a + b = {{ab}}$, $b + c = {{bc}}$ and $c + a = {{ca}}$. Adding: $2(a + b + c) = {{p}}$, so $a + b + c = {{h}}$ and $a = {{h}} - {{bc}} = {{v}}$.
