- id: spec.combinatorics.combinations.solve-ncr
  skills: { primary: spec.combinatorics.combinations }
  subsection: "Choosing a group"
  rating: 1330
  responseSkills: { calculation: 1330 }
  variants:
    - { v: 45, n: 10, w: 90 }
    - { v: 28, n: 8, w: 56 }
    - { v: 66, n: 12, w: 132 }
  stem: |
    Find $n$ if $\dbinom{n}{2} = {{v}}$.
  parts:
    - id: a
      prompt: $n =$
      answer: { type: numeric, key: '{{n}}' }
  solution: |
    $\dfrac{n(n-1)}{2} = {{v}}$, so $n^2 - n - {{w}} = 0$, giving $n = {{n}}$ (the positive solution).
  verify: |
    def answers(v, n, w):
        x = symbols("x")
        return {"a": [s for s in solve(x * (x - 1) / 2 - v, x) if s > 0][0]}

