- id: spec.combinatorics.permutations.alternate-round-couple
  skills: { primary: spec.combinatorics.permutations }
  rating: 1720
  responseSkills: { synthesis: 1710, calculation: 1660 }
  stem: |
    5 men and 5 women, all different, sit around a round table so that men and women alternate. One particular man and woman are a couple and must sit next to each other. Rotations of the whole table count as the same seating. How many seatings are possible?
  parts:
    - id: a
      answer: { type: numeric, key: 1152 }
  solution: |
    Seat the man from the couple first; since rotations count as the same, his seat can be taken as fixed. Seats alternate man–woman, so his partner must take one of the 2 women's seats beside him: 2 ways.
    The other 4 men fill the remaining men's seats in $4! = 24$ ways, and the other 4 women fill the remaining women's seats in $4! = 24$ ways. Total: $2 \times 24 \times 24 = 1152$.
  verify: |
    from itertools import permutations
    def answers():
        # Fix man 0 in seat 0 (removes rotations). Seats 0..9 around the table; even seats men, odd seats women.
        count = 0
        for men in permutations(range(1, 5)):
            for women in permutations(range(5)):
                seat = [None] * 10
                seat[0] = ("m", 0)
                for i, m in enumerate(men): seat[2 * (i + 1)] = ("m", m)
                for i, w in enumerate(women): seat[2 * i + 1] = ("w", w)
                k = seat.index(("w", 0))
                if k in (1, 9): count += 1
        return {"a": count}

- id: spec.combinatorics.permutations.mathematics-no-repeats
  skills: { primary: spec.combinatorics.permutations, secondary: [spec.combinatorics.inclusion-exclusion] }
  rating: 1770
  responseSkills: { synthesis: 1760, calculation: 1700 }
  stem: |
    How many arrangements of the letters of **MATHEMATICS** have no two identical letters next to each other?
  parts:
    - id: a
      answer: { type: numeric, key: 2772000 }
  solution: |
    MATHEMATICS has 11 letters, with M, A and T each appearing twice. All arrangements: $\dfrac{11!}{2!\,2!\,2!} = 4\,989\,600$.
    Let $A_M$, $A_A$, $A_T$ be the arrangements where that pair is together.
    - One pair taped: $\dfrac{10!}{2!\,2!} = 907\,200$, for each of 3 pairs.
    - Two pairs taped: $\dfrac{9!}{2!} = 181\,440$, for each of 3 choices.
    - All three taped: $8! = 40\,320$.

    By inclusion–exclusion, $|A_M \cup A_A \cup A_T| = 2\,721\,600 - 544\,320 + 40\,320 = 2\,217\,600$. So $4\,989\,600 - 2\,217\,600 = 2\,772\,000$ arrangements have no equal neighbors.
  verify: |
    def answers():
        # Count arrangements of a multiset with no equal neighbors by dynamic programming over remaining counts.
        from functools import lru_cache
        counts = {}
        for ch in "MATHEMATICS": counts[ch] = counts.get(ch, 0) + 1
        letters = sorted(counts)
        @lru_cache(None)
        def go(rem, last):
            if sum(rem) == 0: return 1
            total = 0
            for i, r in enumerate(rem):
                if r and i != last:
                    nxt = list(rem); nxt[i] -= 1
                    total += go(tuple(nxt), i)
            return total
        return {"a": go(tuple(counts[c] for c in letters), -1)}

- id: spec.combinatorics.permutations.exactly-one-fixed
  skills: { primary: spec.combinatorics.permutations, secondary: [spec.combinatorics.inclusion-exclusion] }
  rating: 1820
  responseSkills: { synthesis: 1820, calculation: 1720 }
  stem: |
    The numbers 1 to 7 are arranged in a row. In how many arrangements is **exactly one** number in its own position (the number $k$ in position $k$)?
  parts:
    - id: a
      answer: { type: numeric, key: 1855 }
  solution: |
    First count arrangements of $n$ numbers with **no** number in its own position; call this $D_n$. By inclusion–exclusion over the sets "number $k$ is in place $k$":
    $$D_n = n! - \binom{n}{1}(n-1)! + \binom{n}{2}(n-2)! - \cdots = n!\left(1 - \tfrac{1}{1!} + \tfrac{1}{2!} - \cdots + \tfrac{(-1)^n}{n!}\right).$$
    So $D_6 = 720 - 720 + 360 - 120 + 30 - 6 + 1 = 265$.
    For exactly one fixed number: pick which number stays put (7 ways), then arrange the other 6 with none in place ($D_6 = 265$ ways). Total: $7 \times 265 = 1855$.
  verify: |
    from itertools import permutations
    def answers():
        return {"a": sum(1 for p in permutations(range(7)) if sum(p[i] == i for i in range(7)) == 1)}
