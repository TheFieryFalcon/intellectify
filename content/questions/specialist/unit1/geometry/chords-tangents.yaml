# Chords and the alternate segment (1.1.10, 1.1.11).

- id: spec.geometry.chords-tangents.tangent-radius
  skills: {primary: spec.geometry.chords-tangents}
  rating: 1050
  responseSkills: {calculation: 1040, reading: 1040}
  variants:
  - {x: 52}
  - {x: 37}
  stem: |
    A tangent touches a circle with center $O$ at $T$. $M$ is a point on the tangent, and $\angle TOM = {{x}}^\circ$. Find $\angle TMO$.

    ```diagram
    view: [-2.5, 3.1, -2.6, 2.5]
    width: 230
    points: { T: [-0, -2], M: [2.6, -2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: O, to: T }
      - { type: segment, from: O, to: M }
      - { type: segment, from: T, to: M }
      - { type: angle, at: T, from: M, to: O, right: true }
      - { type: angle, at: O, from: T, to: M, label: '{{x}}^\circ', radius: 18 }
      - { type: point, at: T, label: 'T' }
      - { type: point, at: M, label: 'M' }
      - { type: point, at: O, label: 'O', pos: n }
    ```
  parts:
  - id: a
    prompt: $\angle TMO$ (°)
    answer: {type: numeric, key: '90-{{x}}'}
  solution: |
    A tangent is perpendicular to the radius at the point of contact, so $\angle OTM = 90^\circ$ and $\angle TMO = 180^\circ - 90^\circ - {{x}}^\circ$.
  verify: |
    def answers(x):
        import math
        T, O = (0, -2), (0, 0)
        M = (2 * math.tan(math.radians(x)), -2)
        assert abs(angle_at(T, O, M) - x) < 1e-9
        return {"a": approx(angle_at(T, M, O))}
- id: spec.geometry.chords-tangents.equal-tangents
  skills: {primary: spec.geometry.chords-tangents}
  rating: 1080
  responseSkills: {reading: 1080}
  variants:
  - {d: 7}
  - {d: 11}
  stem: |
    Two tangents are drawn from a point $M$ to a circle, touching it at $S$ and $T$. $MS = {{d}}$ cm. Find $MT$.
  parts:
  - id: a
    prompt: $MT$ (cm)
    answer: {type: numeric, key: '{{d}}'}
  solution: |
    The two tangents from one outside point are equal in length.
  verify: |
    def answers(d):
        import math
        M = (0, -math.hypot(d, 2))
        S, T = tangent_point_toward((0, 0), 2, M, 1), tangent_point_toward((0, 0), 2, M, -1)
        assert abs(dist(M, S) - d) < 1e-9
        return {"a": approx(dist(M, T))}
- id: spec.geometry.chords-tangents.alternate-segment
  skills: {primary: spec.geometry.chords-tangents}
  rating: 1120
  responseSkills: {reading: 1110, calculation: 1080}
  variants:
  - {t: 52}
  - {t: 68}
  stem: |
    A tangent touches a circle at $T$. Chord $TB$ makes an angle of ${{t}}^\circ$ with the tangent, and $A$ is on the circle in the alternate segment. Find $\angle TAB$.

    ```diagram
    view: [-2.9, 2.9, -2.5, 2.5]
    width: 230
    points: { T: [-0, -2], A: [-1.732, 1], B: [1.941, 0.484], X: [-2.8, -2], Y: [2.8, -2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: X, to: Y }
      - { type: segment, from: T, to: A }
      - { type: segment, from: T, to: B }
      - { type: segment, from: A, to: B }
      - { type: angle, at: T, from: Y, to: B, label: '{{t}}^\circ', radius: 24 }
      - { type: angle, at: A, from: T, to: B, radius: 20 }
      - { type: point, at: T, label: 'T' }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
    ```
  parts:
  - id: a
    prompt: $\angle TAB$ (°)
    answer: {type: numeric, key: '{{t}}'}
  solution: |
    By the alternate segment theorem, the angle between the tangent and the chord $TB$ equals the angle $TAB$ in the alternate segment.
  verify: |
    def answers(t):
        T, Y = (0, -2), (3, -2)
        B, A = on_circle(270 + 2*t, 2), on_circle(160, 2)
        assert abs(angle_at(Y, T, B) - t) < 1e-9
        return {"a": approx(angle_at(T, A, B))}
- id: spec.geometry.chords-tangents.equal-chords
  skills: {primary: spec.geometry.chords-tangents}
  rating: 1160
  responseSkills: {reading: 1150}
  variants:
  - {c: 74}
  - {c: 118}
  stem: |
    In a circle with center $O$, chords $AB$ and $CD$ have equal length, and $\angle AOB = {{c}}^\circ$. Find $\angle COD$.
  parts:
  - id: a
    prompt: $\angle COD$ (°)
    answer: {type: numeric, key: '{{c}}'}
  solution: |
    Equal chords subtend equal angles at the center.
  verify: |
    def answers(c):
        A, B = on_circle(0), on_circle(c)
        C = on_circle(200)
        # Find D on the circle with CD = AB by search, not by assuming equal angles.
        D = min((on_circle(200 + k / 100) for k in range(1, 18000)), key=lambda Q: abs(dist(C, Q) - dist(A, B)))
        return {"a": round(angle_at(C, (0, 0), D))}
