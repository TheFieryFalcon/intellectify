  skills: { primary: spec.geometry.circle-problems }
  subsection: "Proving points lie on a circle"
  rating: 1700
  responseSkills: { reasoning: 1690, proof: 1690, clarity: 1650 }
  stem: |
    The bisectors of the four angles of a convex quadrilateral $ABCD$ meet in pairs to form a quadrilateral $PQRS$, where $P$ is where the bisectors from $A$ and $B$ meet, $Q$ from $B$ and $C$, $R$ from $C$ and $D$, and $S$ from $D$ and $A$. Assuming $PQRS$ is a genuine quadrilateral, prove that it is cyclic.

    ```diagram
    view: [-3.25, 3.35, -2.45, 2.45]
    width: 280
    points: { A: [-2.8, -1], B: [2.6, -1.3], C: [2.9, 1.1], D: [-2.4, 1], P: [0.33, 1.422], Q: [1.585, -0.083], R: [-0.173, -1.664], S: [-1.542, -0.026] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: segment, from: A, to: P, dashed: true }
      - { type: segment, from: A, to: S, dashed: true }
      - { type: segment, from: B, to: P, dashed: true }
      - { type: segment, from: B, to: Q, dashed: true }
      - { type: segment, from: C, to: Q, dashed: true }
      - { type: segment, from: C, to: R, dashed: true }
      - { type: segment, from: D, to: R, dashed: true }
      - { type: segment, from: D, to: S, dashed: true }
      - { type: segment, from: P, to: Q }
      - { type: segment, from: Q, to: R }
      - { type: segment, from: R, to: S }
      - { type: segment, from: S, to: P }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: se }
      - { type: point, at: C, label: 'C', pos: ne }
      - { type: point, at: D, label: 'D', pos: nw }
      - { type: point, at: P, label: 'P', pos: s }
      - { type: point, at: Q, label: 'Q', pos: e }
      - { type: point, at: R, label: 'R', pos: n }
      - { type: point, at: S, label: 'S', pos: w }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'p', description: "Finds one angle of PQRS from the bisected angles (e.g. triangle ABP: ∠APB = 180° − ½(∠A + ∠B))", points: 1, dimension: reasoning }
          - { id: 'r', description: "Finds the opposite angle the same way (e.g. triangle CDR: ∠CRD = 180° − ½(∠C + ∠D))", points: 1, dimension: reasoning }
          - { id: 'sum', description: "Shows the two add to 180° (e.g. 360° − ½(∠A + ∠B + ∠C + ∠D) = 180°)", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "Concludes PQRS is cyclic (e.g. opposite angles add to 180°, converse)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    The angle of $PQRS$ at $P$ is $\angle APB$, and in triangle $ABP$ the angles at $A$ and $B$ are half the quadrilateral's: $\angle APB = 180^\circ - \tfrac{1}{2}(\angle A + \angle B)$. Likewise the angle at $R$ is $\angle CRD = 180^\circ - \tfrac{1}{2}(\angle C + \angle D)$.

    The angles of $ABCD$ add to $360^\circ$, so $\angle P + \angle R = 360^\circ - \tfrac{1}{2} \times 360^\circ = 180^\circ$. Opposite angles add to $180^\circ$, so $PQRS$ is cyclic.

- id: spec.geometry.circle-problems.tangent-parallel-to-chord
  title: "Tangent Parallel to a Chord of Another Circle"
