  parts:
  - id: a
    prompt: $CD$
    answer: {type: numeric, key: '{{v}}'}
  solution: |
    A diameter perpendicular to a chord cuts it in half, so $CX = XD$. Intersecting chords: $CX^2 = AX \times XB = {{a}} \times {{b}}$, so $CX = \sqrt{ {{a}} \times {{b}} }$ and $CD = 2 \times CX = {{v}}$.
  verify: |
    def answers(a, b, v):
        r = (a + b) / 2
        X = (-r + a, 0.0)
        t = line_circle(X, 90, r)
        return {"a": approx(t[1] - t[0])}
- id: spec.geometry.chord-secant-lengths.find-chord-from-tangent
