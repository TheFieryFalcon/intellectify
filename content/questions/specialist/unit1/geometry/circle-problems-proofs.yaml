      - { type: point, at: A, label: 'A', pos: n }
      - { type: point, at: B, label: 'B', pos: s }
      - { type: point, at: C, label: 'C', pos: ne }
      - { type: point, at: D, label: 'D', pos: se }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'alt', description: "Relates the tangent at P to the first circle (e.g. alternate segment: the angle between it and PA equals ∠PBA)", points: 1, dimension: reasoning }
          - { id: 'exterior', description: "Carries that angle into the second circle (e.g. ABDC cyclic with P, B, D collinear, so the exterior angle ∠PBA equals ∠ACD)", points: 2, dimension: reasoning }
          - { id: 'alternate', description: "Finds equal alternate (or corresponding) angles for CD and the tangent", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes CD is parallel to the tangent", points: 1, dimension: proof }
