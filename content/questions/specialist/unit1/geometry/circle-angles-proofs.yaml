          - { id: 'diameter', description: "Makes a construction that splits the angles into manageable parts (e.g. the diameter CE through C)", points: 1, dimension: proof }
          - { id: 'isosceles', description: "Relates each part at O to a part at C (e.g. isosceles triangles OAC and OBC: ∠AOE = 2∠ACE and ∠BOE = 2∠BCE, exterior angles)", points: 2, dimension: reasoning }
