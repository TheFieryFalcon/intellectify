    - { m: 6, k: -2, v: 12 }
    - { m: 5, k: 4, v: 20 }
  stem: |
    $|\mathbf{a}| = {{m}}$. Find $|{{k}}\mathbf{a}|$.
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    $|k\mathbf{a}| = |k|\,|\mathbf{a}| = |{{k}}| \times {{m}}$. The sign of $k$ only changes the direction.
  verify: |
