  stem: |
    From $M$, a tangent $MT = 12$ touches a circle, and a secant cuts the circle at $A$ and $B$ with $MA = 8$. Find the length of the chord $AB$.

    ```diagram
    view: [-2.45, 4.57, -2.45, 2.45]
    width: 260
    points: { M: [4.11825, 0], T: [0.971, 1.748], A: [1.845, -0.771], B: [-0.996, -1.735], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: T, label: '12' }
      - { type: segment, from: M, to: A, label: '8', side: right }
      - { type: segment, from: A, to: B }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: T, label: 'T', pos: n }
      - { type: point, at: A, label: 'A', pos: s }
      - { type: point, at: B, label: 'B', pos: sw }
    ```
  parts:
  - id: a
    prompt: $AB$
    answer: {type: numeric, key: '10'}
