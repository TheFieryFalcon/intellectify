  stem: |
    A tangent from $M$ touches a circle with center $O$ at $T$. The radius is {{r}} and $OM = {{d}}$. Find $MT$.

    ```diagram
    view: [{{_view}}]
    width: 280
    alt: "Radius OT = 5 meets the tangent MT at a right angle; OM = 13"
    points: { M: [{{_M}}], T: [{{_T}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: O, to: T, label: '{{r}}', color: muted }
