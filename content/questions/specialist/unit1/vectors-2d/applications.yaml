- id: spec.vectors-2d.applications.plane-crosswind
  skills: { primary: spec.vectors-2d.applications }
  rating: 1340
  responseSkills: { calculation: 1320, reading: 1340 }
  words: { who: person, craft: aircraft, u: units }
  requiresCalculator: true
  stem: |
    {{who}} flies {{craft.a}} that points due north with an airspeed (speed through the air) of 300 {{u.speed}}. A wind blows from the west at 50 {{u.speed}}, so the air moves due east. Find the {{craft}}'s ground speed, and the bearing of its actual path, each correct to one decimal place.
  parts:
    - id: a
      prompt: Ground speed ({{u.speed}})
      answer: { type: numeric, key: 304.1 }
    - id: b
      prompt: Bearing (°T)
      answer: { type: numeric, key: 9.5 }
  solution: |
    Ground velocity $= 50\mathbf{i} + 300\mathbf{j}$, so the speed is $\sqrt{50^2 + 300^2} \approx 304.1$ {{u.speed}}.
    The path is east of north by $\tan^{-1}\tfrac{50}{300} \approx 9.5^\circ$: bearing $009.5^\circ\text{T}$.
  verify: |
    def answers():
        g = Matrix([50, 300])
        return {"a": round(float(g.norm()), 1), "b": round(float(deg(atan2(g[0], g[1]))), 1)}

- id: spec.vectors-2d.applications.two-legs
  skills: { primary: spec.vectors-2d.applications }
  rating: 1380
  responseSkills: { calculation: 1360, reading: 1360 }
  stem: |
    A yacht sails 5 km on a bearing of $030^\circ\text{T}$, then 5 km on a bearing of $150^\circ\text{T}$. Find the distance and true bearing of its final position from the start.
  parts:
    - id: a
      prompt: Distance (km)
      answer: { type: numeric, key: 5 }
    - id: b
      prompt: Bearing (°T)
      answer: { type: numeric, key: 90 }
  solution: |
    Leg 1: $5\sin 30^\circ\,\mathbf{i} + 5\cos 30^\circ\,\mathbf{j} = 2.5\mathbf{i} + \tfrac{5\sqrt{3}}{2}\mathbf{j}$. Leg 2: $5\sin 150^\circ\,\mathbf{i} + 5\cos 150^\circ\,\mathbf{j} = 2.5\mathbf{i} - \tfrac{5\sqrt{3}}{2}\mathbf{j}$.
    The sum is $5\mathbf{i}$: 5 km due east, on a bearing of $090^\circ\text{T}$.
  verify: |
    def answers():
        leg = lambda d, b: Matrix([d*sin(rad(b)), d*cos(rad(b))])
        r = simplify(leg(5, 30) + leg(5, 150))
        return {"a": r.norm(), "b": deg(atan2(r[0], r[1])) % 360}

