- id: spec.vectors-2d.projection.closest-to-origin
  skills: { primary: spec.vectors-2d.projection }
  rating: 1730
  responseSkills: { synthesis: 1720, calculation: 1680 }
  stem: |
    Find the position vector of the point on the line through $A(1, 2)$ and $B(7, 5)$ that is closest to the origin.
  parts:
    - id: a
      answer: { type: vector, key: ['-\frac{3}{5}', '\frac{6}{5}'] }
  solution: |
    The closest point $P$ has $\overrightarrow{OP}$ perpendicular to the line. $\overrightarrow{AB} = 6\mathbf{i} + 3\mathbf{j}$, so $\overrightarrow{AP}$ is the vector projection of $\overrightarrow{AO} = -\mathbf{i} - 2\mathbf{j}$ onto $\overrightarrow{AB}$:
    $\dfrac{-6 - 6}{45}(6\mathbf{i} + 3\mathbf{j}) = -\tfrac{4}{15}(6\mathbf{i} + 3\mathbf{j}) = -\tfrac{8}{5}\mathbf{i} - \tfrac{4}{5}\mathbf{j}$.
    So $\overrightarrow{OP} = (\mathbf{i} + 2\mathbf{j}) + \left(-\tfrac{8}{5}\mathbf{i} - \tfrac{4}{5}\mathbf{j}\right) = -\tfrac{3}{5}\mathbf{i} + \tfrac{6}{5}\mathbf{j}$. Check: $\left(-\tfrac{3}{5}\right)(6) + \tfrac{6}{5}(3) = 0$. ✓
  verify: |
    def answers():
        A, B, O = Matrix([1, 2]), Matrix([7, 5]), Matrix([0, 0])
        d = B - A
        P = A + (O - A).dot(d) / d.dot(d) * d
        assert P.dot(d) == 0
        return {"a": list(P)}

- id: spec.vectors-2d.projection.unit-vector-from-projection
  skills: { primary: spec.vectors-2d.projection }
  rating: 1750
  responseSkills: { synthesis: 1750, calculation: 1680 }
  stem: |
    The scalar projection of $3\mathbf{i} + 4\mathbf{j}$ onto the unit vector $\mathbf{u}$ is 4. One possibility is $\mathbf{u} = \mathbf{j}$. Find the other.
  parts:
    - id: a
      answer: { type: vector, key: ['\frac{24}{25}', '\frac{7}{25}'] }
  solution: |
    Let $\mathbf{u} = x\mathbf{i} + y\mathbf{j}$ with $x^2 + y^2 = 1$. The scalar projection onto a unit vector is just the dot product, so $3x + 4y = 4$.
    Substituting $x = \tfrac{4 - 4y}{3}$: $\tfrac{16(1 - y)^2}{9} + y^2 = 1$, which gives $25y^2 - 32y + 7 = 0$, so $(y - 1)(25y - 7) = 0$.
    $y = 1$ gives $\mathbf{j}$. The other is $y = \tfrac{7}{25}$, $x = \tfrac{24}{25}$: $\mathbf{u} = \tfrac{24}{25}\mathbf{i} + \tfrac{7}{25}\mathbf{j}$.
  verify: |
    def answers():
        x, y = symbols("x y", real=True)
        sols = solve([3*x + 4*y - 4, x**2 + y**2 - 1], [x, y], dict=True)
        s = [t for t in sols if t[y] != 1][0]
        return {"a": [s[x], s[y]]}
