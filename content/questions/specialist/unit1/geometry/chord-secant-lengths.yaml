      - { type: circle, center: P2, radius: 1.6 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: Q, to: K, dashed: true }
      - { type: point, at: A, label: 'A', pos: nw }
      - { type: point, at: B, label: 'B', pos: ne }
      - { type: point, at: P, label: 'P', pos: ne }
      - { type: point, at: Q, label: 'Q', pos: se }
    ```
  parts:
  - id: a
    rubric:
      criteria:
      - {id: meet, description: "Names the point to study (e.g. N, where PQ extended meets AB)", points: 1, dimension: proof}
      - {id: power1, description: "Relates NA to the common chord (e.g. tangent–secant in the first circle: NA² = NP × NQ)", points: 2, dimension: reasoning}
      - {id: power2, description: "Relates NB the same way (e.g. tangent–secant in the second circle: NB² = NP × NQ)", points: 1, dimension: reasoning}
      - {id: conclude, description: "Concludes NA = NB", points: 1, dimension: reasoning}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Let $PQ$ extended meet $AB$ at $N$. From $N$, line $NA$ is a tangent to the first circle and $NPQ$ is a secant, so $NA^2 = NP \times NQ$. Likewise $NB^2 = NP \times NQ$ for the second circle. So $NA^2 = NB^2$ and $NA = NB$: $N$ is the midpoint of $AB$.
- id: spec.geometry.chord-secant-lengths.converse-concyclic
  title: "Equal Products Put Four Points on a Circle"
  skills: {primary: spec.geometry.chord-secant-lengths}
  subsection: "Intersecting chords"
  rating: 1780
  responseSkills: {reasoning: 1780, proof: 1780, clarity: 1660, synthesis: 1760}
  stem: |
    Lines $AB$ and $CD$ meet at $X$, with $X$ between $A$ and $B$ and between $C$ and $D$, and $AX \times XB = CX \times XD$. Prove that $A$, $B$, $C$ and $D$ lie on a circle.

    ```diagram
    view: [-2.2, 2.2, -1.6, 2.6]
    width: 220
    points: { A: [-1.6, 0.5], B: [1.45, -0.453], C: [-0.451, -1.003], D: [0.95, 2.111], X: [0, 0] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: C, to: D }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: X, label: 'X', pos: se }
    ```
  parts:
  - id: a
    rubric:
      criteria:
      - {id: ratio, description: "Rewrites the condition as a ratio of sides (e.g. AX/CX = XD/XB)", points: 1, dimension: reasoning}
      - {id: similar, description: "Shows two triangles are similar (e.g. AXC and DXB: two sides in ratio and the included vertically opposite angle)", points: 2, dimension: reasoning}
      - {id: angles, description: "Gets equal angles from the similarity (e.g. ∠XAC = ∠XDB, i.e. ∠BAC = ∠BDC)", points: 1, dimension: proof}
      - {id: converse, description: "Concludes the points are concyclic (e.g. BC subtends equal angles at A and D on the same side: converse of angles on the same arc)", points: 1, dimension: synthesis}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    From $AX \times XB = CX \times XD$, $\dfrac{AX}{CX} = \dfrac{XD}{XB}$. Also $\angle AXC = \angle DXB$ (vertically opposite), so triangles $AXC$ and $DXB$ are similar (two pairs of sides in the same ratio with the included angles equal). Hence $\angle CAX = \angle BDX$, i.e. $\angle CAB = \angle CDB$.
    Segment $BC$ subtends equal angles at $A$ and $D$, which are on the same side of $BC$. By the converse of angles on the same arc, $A$, $B$, $C$ and $D$ are concyclic.
- id: spec.geometry.chord-secant-lengths.harmonic-quadrilateral
  title: "Tangents, a Secant and Equal Products"
  skills: {primary: spec.geometry.chord-secant-lengths}
  subsection: "Tangent and secant"
  rating: 1790
  responseSkills: {reasoning: 1790, proof: 1790, clarity: 1680, synthesis: 1780}
  stem: |
    From an outside point $M$, tangents touch a circle at $S$ and $T$, and a secant cuts it at $A$ and $B$. Prove that $SA \times TB = SB \times TA$.

    ```diagram
    view: [-2.45, 4.05, -2.45, 2.45]
    width: 230
    points: { M: [3.6, 0], A: [1.994, -0.157], B: [-1.926, -0.54], S: [1.111, 1.663], T: [1.111, -1.663], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: S }
      - { type: segment, from: M, to: T }
      - { type: segment, from: M, to: B }
      - { type: segment, from: S, to: A }
      - { type: segment, from: S, to: B }
      - { type: segment, from: T, to: A }
      - { type: segment, from: T, to: B }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: S, label: 'S', pos: n }
      - { type: point, at: T, label: 'T', pos: s }
      - { type: point, at: A, label: 'A', pos: ne }
      - { type: point, at: B, label: 'B', pos: w }
    ```
  parts:
  - id: a
    rubric:
      criteria:
      - {id: sim1, description: "Relates SA/SB to the tangent length (e.g. triangles MSA and MBS similar by alternate segment and common angle, so SA/SB = MS/MB)", points: 2, dimension: reasoning}
      - {id: sim2, description: "Relates TA/TB the same way (e.g. triangles MTA and MBT give TA/TB = MT/MB)", points: 1, dimension: reasoning}
      - {id: equal, description: "Links the two (e.g. MS = MT, equal tangents, so SA/SB = TA/TB)", points: 1, dimension: proof}
      - {id: conclude, description: Cross-multiplies to the result, points: 1, dimension: clarity}
  solution: |
    Triangles $MSA$ and $MBS$ share the angle at $M$, and $\angle MSA = \angle MBS$ by the alternate segment theorem. So they are similar, and $\dfrac{SA}{BS} = \dfrac{MS}{MB}$. In the same way, $\dfrac{TA}{BT} = \dfrac{MT}{MB}$.
    The tangents are equal, $MS = MT$, so $\dfrac{SA}{SB} = \dfrac{TA}{TB}$, i.e. $SA \times TB = SB \times TA$.
