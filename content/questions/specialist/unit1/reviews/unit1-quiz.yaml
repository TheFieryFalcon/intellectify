# Unit quiz pool: Unit 1. Never served in practice (SPEC §8.1a).

- id: spec.u1.quiz.codes-3-letters
  title: "Three-Letter Codes"
  pool: unit-quiz
  skills: { primary: spec.combinatorics.counting-principles }
  subsection: "Multiplication principle"
  rating: 1040
  responseSkills: { calculation: 1020 }
  stem: |
    How many 3-letter codes can be made from the letters A to E, if letters may repeat?
  parts:
    - id: a
      answer: { type: numeric, key: 125 }
  solution: |
    Each of the 3 places has 5 options: $5^3 = 125$.
  verify: |
    def answers():
        return {'a': 5 ** 3}

- id: spec.u1.quiz.angle-semicircle
  title: "Angle in a Semicircle (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.geometry.circle-angles }
  subsection: "Angle in a semicircle"
  rating: 1080
  responseSkills: { reading: 1070, calculation: 1050 }
  stem: |
    $AB$ is a diameter of a circle and $C$ is on the circle with $\angle CAB = 34^\circ$. Find $\angle CBA$, in degrees.
  parts:
    - id: a
      answer: { type: numeric, key: 56 }
  solution: |
    $\angle ACB = 90^\circ$ (angle in a semicircle), so $\angle CBA = 180^\circ - 90^\circ - 34^\circ = 56^\circ$.
  verify: |
    def answers():
        A, B, C = on_circle(180, 1), on_circle(0, 1), on_circle(2 * 34, 1)
        return {'a': approx(angle_at(C, B, A), 4)}

