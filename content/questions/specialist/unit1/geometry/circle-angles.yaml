        x = symbols("x")
        return {"a": solve(sympify(e1.replace("x", "*x").lstrip("*")) + sympify(e2.replace("x", "*x").lstrip("*")) - 180, x)[0]}

- id: spec.geometry.circle-angles.exterior-angle
  title: "Exterior Angle of a Cyclic Quadrilateral: Find It"
  skills: {primary: spec.geometry.circle-angles}
  subsection: "Cyclic quadrilaterals"
  rating: 1330
  responseSkills: {reading: 1320, calculation: 1280, reasoning: 1320}
  variants:
    - { e: 60, _A: '-2, 0', _B: '1, -1.732', _C: '2, 0', _D: '1, 1.732', _E: '2.55, 0.953' }
    - { e: 73, _A: '-2, 0', _B: '0.585, -1.913', _C: '2, 0', _D: '0.585, 1.913', _E: '2.778, 1.052' }
    - { e: 87, _A: '-2, 0', _B: '0.105, -1.997', _C: '2, 0', _D: '0.105, 1.997', _E: '3.042, 1.098' }
    - { e: 107, _A: '-2, 0', _B: '-0.585, -1.913', _C: '2, 0', _D: '-0.585, 1.913', _E: '3.422, 1.052' }
    - { e: 120, _A: '-2, 0', _B: '-1, -1.732', _C: '2, 0', _D: '-1, 1.732', _E: '3.65, 0.953' }
  stem: |
    $ABCD$ is a cyclic quadrilateral. Side $BC$ is extended beyond $C$ to $E$, and $\angle DCE = {{e}}^\circ$. Find $\angle DAB$.

    ```diagram
    view: [-2.45, 3.13, -2.45, 2.45]
    width: 230
    points: { A: [{{_A}}], B: [{{_B}}], C: [{{_C}}], D: [{{_D}}], E: [{{_E}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: segment, from: C, to: E }
      - { type: angle, at: C, from: E, to: D, label: '{{e}}^\circ', radius: 24 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: E, label: 'E' }
    ```
  parts:
  - id: a
    prompt: $\angle DAB$ (°)
    answer: {type: numeric, key: '{{e}}'}
  solution: |
    $\angle BCD = 180^\circ - {{e}}^\circ$ (angles on a straight line), and $\angle DAB = 180^\circ - \angle BCD$ (opposite angles of a cyclic quadrilateral). So $\angle DAB = {{e}}^\circ$: the exterior angle equals the interior opposite angle.
  verify: |
    def answers(e):
        # Interior angle at C is 180 - e; build the quadrilateral from that and measure the angle at A.
        c = 180 - e
        C = on_circle(0)
        B, D = on_circle(-(180 - c)), on_circle(180 - c)
        A = on_circle(180)
        assert abs(angle_at(B, C, D) - c) < 1e-9
        return {"a": approx(angle_at(B, A, D))}

