  subsection: "Paths on a grid"
  rating: 1700
  responseSkills: { reading: 1690, calculation: 1660, reasoning: 1690 }
  words: { who: person, venue: venue }
  stem: |
    {{who}} walks through a grid of streets from home to the {{venue}}, 6 blocks east and 4 blocks north, using only steps east or north. The corner 3 blocks east and 1 block north of home is closed for roadworks. How many routes avoid it?
  parts:
    - id: a
      answer: { type: numeric, key: 130 }
  solution: |
    All routes: $\dbinom{10}{4} = 210$. Routes through the closed corner: home to it, $\dbinom{4}{1} = 4$, then on to the {{venue}} (3 east, 3 north), $\dbinom{6}{3} = 20$, so $80$. Avoiding it: $210 - 80 = 130$.
  verify: |
    from itertools import combinations
    def answers():
        count = 0
        for north in combinations(range(10), 4):
            x = y = 0
            bad = False
            for i in range(10):
                if i in north: y += 1
                else: x += 1
                if (x, y) == (3, 1): bad = True
            count += not bad
        return {"a": count}

