- id: spec.vectors-2d.components.parallel-unknown
  skills: { primary: spec.vectors-2d.components }
  rating: 1290
  responseSkills: { calculation: 1270, reading: 1280 }
  variants:
    - { p: 2, q: -3, n: 6, m: -4 }
    - { p: 5, q: 2, n: -4, m: -10 }
  stem: |
    Find $m$ so that $\begin{pmatrix} m \\ {{n}} \end{pmatrix}$ is parallel to $\begin{pmatrix} {{p}} \\ {{q}} \end{pmatrix}$.
  parts:
    - id: a
      prompt: $m =$
      answer: { type: numeric, key: '{{m}}' }
  solution: |
    Parallel means $\begin{pmatrix} m \\ {{n}} \end{pmatrix} = k\begin{pmatrix} {{p}} \\ {{q}} \end{pmatrix}$. The second components give $k = \tfrac{ {{n}} }{ {{q}} }$, so $m = {{p}}k = {{m}}$.
  verify: |
    def answers(p, q, n, m):
        k = Rational(n, q)
        return {"a": p * k}

- id: spec.vectors-2d.components.from-polar
  skills: { primary: spec.vectors-2d.components }
  rating: 1310
  responseSkills: { calculation: 1300 }
  variants:
