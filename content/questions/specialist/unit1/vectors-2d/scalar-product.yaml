    Let $\mathbf{v} = x\mathbf{i} + y\mathbf{j}$. Then $2x + y = \sqrt{10} \times \sqrt{5} \times \cos 45^\circ = 5$, and $x^2 + y^2 = 10$.
    Substituting $y = 5 - 2x$: $5x^2 - 20x + 15 = 0$, so $x = 1$ or $x = 3$, giving $\mathbf{i} + 3\mathbf{j}$ or $3\mathbf{i} - \mathbf{j}$. Only the first has a positive $\mathbf{j}$-component.
  verify: |
    def answers():
        x, y = symbols("x y", real=True)
