  responseSkills: { calculation: 1320, reading: 1330 }
  variants:
    - { p: 2, q: 3, n: 100, v: 67 }
    - { p: 4, q: 6, n: 120, v: 40 }
  stem: |
    How many integers from 1 to {{n}} are divisible by {{p}} or {{q}}?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Count the multiples of {{p}}, plus the multiples of {{q}}, minus the multiples of their **lowest common multiple**. That gives {{v}}.
  verify: |
    def answers(p, q, n, v):
        return {"a": sum(1 for k in range(1, n + 1) if k % p == 0 or k % q == 0)}

- id: spec.combinatorics.inclusion-exclusion.three-languages
  skills: { primary: spec.combinatorics.inclusion-exclusion }
  subsection: "Three sets"
  rating: 1440
  responseSkills: {reading: 1440, calculation: 1400, reasoning: 1420}
  stem: |
    Of 100 students, 45 study French, 40 German and 35 Japanese. 15 study French and German, 12 French and Japanese, 10 German and Japanese, and 5 study all three.
  parts:
    - id: a
      prompt: How many study at least one of these languages?
      marks: 2
      answer: { type: numeric, key: 88 }
    - id: b
      prompt: How many study **exactly one** of them?
      marks: 2
      answer: { type: numeric, key: 61 }
  solution: |
    **(a)** $45 + 40 + 35 - 15 - 12 - 10 + 5 = 88$.

    **(b)** Fill in a Venn diagram from the middle out.

    - Exactly two languages: French and German only $15 - 5 = 10$, French and Japanese only $12 - 5 = 7$, German and Japanese only $10 - 5 = 5$.
    - Exactly one: French only $45 - 10 - 7 - 5 = 23$, German only $40 - 10 - 5 - 5 = 20$, Japanese only $35 - 7 - 5 - 5 = 18$.

    So $23 + 20 + 18 = 61$ study exactly one. Check: $61 + 22 + 5 = 88$. ✓
  verify: |
    def answers():
        F, G, J, FG, FJ, GJ, FGJ = 45, 40, 35, 15, 12, 10, 5
        at_least_one = F + G + J - FG - FJ - GJ + FGJ
        exactly_one = (F - FG - FJ + FGJ) + (G - FG - GJ + FGJ) + (J - FJ - GJ + FGJ)
        return {"a": at_least_one, "b": exactly_one}

