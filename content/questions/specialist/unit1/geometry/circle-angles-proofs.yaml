          - { id: 'each', description: "Expresses each interior angle in those terms (e.g. ∠A is half the arc from B to F not containing A)", points: 2, dimension: reasoning }
          - { id: 'sum', description: "Shows the three angles add to 360° (e.g. adding ∠A, ∠C, ∠E counts every arc twice)", points: 2, dimension: reasoning }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $a, b, c, d, e, f$ be the angles at the center on arcs $AB, BC, CD, DE, EF, FA$, so $a + b + c + d + e + f = 360^\circ$.

    $\angle A = \angle FAB$ stands on the arc from $B$ to $F$ not containing $A$, which is made of arcs $BC, CD, DE, EF$: $\angle A = \tfrac{1}{2}(b + c + d + e)$. Likewise $\angle C = \tfrac{1}{2}(d + e + f + a)$ and $\angle E = \tfrac{1}{2}(f + a + b + c)$.

    Adding, each of $a, \dots, f$ appears exactly twice: $\angle A + \angle C + \angle E = \tfrac{1}{2} \times 2 \times 360^\circ = 360^\circ$.

- id: spec.geometry.circle-angles.opposite-bisectors-diameter
  title: "Opposite Angle Bisectors Meet the Circle at a Diameter"
  skills: { primary: spec.geometry.circle-angles }
  subsection: "Cyclic quadrilaterals"
  rating: 1780
  responseSkills: { reasoning: 1770, proof: 1770, clarity: 1730 }
  stem: |
    $ABCD$ is a cyclic quadrilateral. The bisector of angle $A$ meets the circle again at $P$, and the bisector of angle $C$ meets it again at $Q$. Prove that $PQ$ is a diameter.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-2, 0], B: [-1, -1.732], C: [-0, -2], D: [1, 1.732], P: [1.732, -1], Q: [-1.732, 1], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: segment, from: A, to: P }
      - { type: segment, from: C, to: Q }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: P, label: 'P' }
      - { type: point, at: Q, label: 'Q' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'p', description: "Locates P (e.g. ∠BAP = ∠PAD, so chords BP = PD: P is the midpoint of arc BD containing C)", points: 2, dimension: reasoning }
          - { id: 'q', description: "Locates Q the same way (e.g. the midpoint of arc BD containing A)", points: 1, dimension: reasoning }
          - { id: 'diameter', description: "Concludes PQ passes through the center (e.g. P and Q are both on the perpendicular bisector of chord BD)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "States the conclusion", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $AP$ bisects $\angle BAD$, so $\angle BAP = \angle PAD$; equal angles at the circumference stand on equal chords, so $PB = PD$. $P$ lies on the arc $BD$ that doesn't contain $A$.

    Likewise $CQ$ bisects $\angle BCD$, so $QB = QD$, with $Q$ on the arc $BD$ that doesn't contain $C$, i.e. the other arc.

    Points equidistant from $B$ and $D$ lie on the perpendicular bisector of $BD$, which passes through the center $O$. That line meets the circle in two points, one on each arc $BD$: these are $P$ and $Q$. So $PQ$ is a chord through $O$, a diameter.

- id: spec.geometry.circle-angles.exterior-angle-proof
  title: "Exterior Angle of a Cyclic Quadrilateral"
  skills: { primary: spec.geometry.circle-angles }
  subsection: "Cyclic quadrilaterals"
  rating: 1480
  bookwork: true
  responseSkills: { reasoning: 1470, proof: 1470, clarity: 1410 }
  stem: |
    $ABCD$ is a cyclic quadrilateral, and side $DC$ is extended beyond $C$ to $E$. Prove that $\angle BCE = \angle BAD$.

    ```diagram
    view: [-2.45, 3.88, -2.45, 2.45]
    width: 230
    points: { A: [-1.879, -0.684], B: [0.684, -1.879], C: [1.97, 0.347], D: [-0.684, 1.879], E: [3.43, -0.496], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: segment, from: C, to: E }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: E, label: 'E' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: line, description: "Relates ∠BCE to ∠BCD (e.g. ∠BCE = 180° − ∠BCD, angles on a straight line)", points: 1, dimension: reasoning }
          - { id: cyclic, description: "Relates ∠BAD to ∠BCD (e.g. ∠BAD = 180° − ∠BCD, opposite angles of a cyclic quadrilateral)", points: 2, dimension: reasoning }
          - { id: conclude, description: "So ∠BCE = ∠BAD", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $D$, $C$, $E$ lie on a line, so $\angle BCE = 180^\circ - \angle BCD$. Opposite angles of a cyclic quadrilateral add to $180^\circ$, so $\angle BAD = 180^\circ - \angle BCD$. Hence $\angle BCE = \angle BAD$.
