  stem: |
    From $M$, one secant cuts a circle at $A$ and $B$ with $MA = x$ and $AB = 7$. Another cuts it at $C$ and $D$ with $MC = 5$ and $CD = 7$. Find $x$.

    ```diagram
    view: [-2.45, 4.47, -2.45, 2.45]
    width: 280
    points: { M: [4.01871, 0], A: [1.877, -0.69], B: [-1.121, -1.656], C: [1.877, 0.69], D: [-1.121, 1.656], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: A, label: 'x', side: left }
      - { type: segment, from: A, to: B, label: '7', side: right }
      - { type: segment, from: M, to: C, label: '5', side: right }
      - { type: segment, from: C, to: D, label: '7' }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: A, label: 'A', pos: n }
      - { type: point, at: B, label: 'B', pos: nw }
      - { type: point, at: C, label: 'C', pos: s }
      - { type: point, at: D, label: 'D', pos: sw }
    ```
  parts:
  - id: a
    prompt: $x =$
    answer: {type: numeric, key: '5'}
  solution: |
    $MA \times MB = MC \times MD$: $x(x + 7) = 5 \times 12 = 60$. So $x^2 + 7x - 60 = 0$, i.e. $(x + 12)(x - 5) = 0$, and $x = 5$. (So the secants are equally long: they are mirror images in the line through $M$ and the center.)
  verify: |
    def answers():
        x = symbols("x")
        return {"a": [s for s in solve(x*(x + 7) - 60, x) if s > 0][0]}
- id: spec.geometry.chord-secant-lengths.through-center
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1550
  responseSkills: {calculation: 1530, reasoning: 1540, synthesis: 1520}
  stem: |
    A point $M$ is 13 units from the center of a circle of radius 5. A secant from $M$ passes through the center, cutting the circle at $A$ and $B$.

    ```diagram
    view: [-2.45, 5.65, -2.45, 2.45]
    width: 300
    points: { M: [5.2, 0], A: [2, 0], B: [-2, 0], R: [-1, 1.732], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: B, to: M }
      - { type: segment, from: O, to: R, label: '5', dashed: true }
      - { type: segment, from: O, to: M, label: '13', side: right }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: A, label: 'A', pos: ne }
      - { type: point, at: B, label: 'B', pos: w }
    ```
  parts:
  - id: a
    prompt: Find $MA$.
    answer: {type: numeric, key: '8'}
  - id: b
    prompt: Find $MB$.
    answer: {type: numeric, key: '18'}
  - id: c
    prompt: Find the length of a tangent from $M$.
    answer: {type: numeric, key: '12'}
  solution: |
    $MA = 13 - 5 = 8$ and $MB = 13 + 5 = 18$. Then $MT^2 = 8 \times 18 = 144$, so $MT = 12$ (which matches Pythagoras: $13^2 - 5^2 = 144$).
