- id: spec.u1.quiz.same-arc
  title: "Angles on the Same Arc (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.geometry.circle-angles }
  subsection: "Angles on the same arc"
  rating: 1350
  responseSkills: { reading: 1330, calculation: 1320 }
  stem: |
    $A$, $B$, $C$ and $D$ lie on a circle, with $C$ and $D$ on the same side of chord $AB$. $\angle ACB = 47^\circ$. Find $\angle ADB$, in degrees.
  parts:
    - id: a
      answer: { type: numeric, key: 47 }
  solution: |
