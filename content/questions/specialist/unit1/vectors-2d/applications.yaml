  solution: |
    Let the tensions be $T_1$ (at $30^\circ$) and $T_2$ (at $60^\circ$). The three forces add to zero.
    Sideways: $T_1\sin 30^\circ = T_2\sin 60^\circ$, so $T_1 = \sqrt{3}\,T_2$.
    Up and down: $T_1\cos 30^\circ + T_2\cos 60^\circ = 196$, so $\tfrac{3}{2}T_2 + \tfrac{1}{2}T_2 = 196$ and $T_2 = 98$ N. Then $T_1 = 98\sqrt{3} \approx 169.7$ N.
  verify: |
    def answers():
        t1, t2 = symbols("t1 t2", positive=True)
        s = solve([t1*sin(pi/6) - t2*sin(pi/3), t1*cos(pi/6) + t2*cos(pi/3) - 196], [t1, t2], dict=True)[0]
