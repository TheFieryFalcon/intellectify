- id: spec.vectors-2d.scalar-product.components
  title: "Scalar Product in Components"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Calculating the scalar product"
  rating: 1030
  responseSkills: { calculation: 1030 }
  variants:
    - { a1: 3, a2: -2, b1: 4, b2: 5 }
    - { a1: -1, a2: 6, b1: 2, b2: 3 }
    - { a1: 5, a2: 2, b1: -3, b2: 7 }
  stem: |
    Find $({{a1}}\mathbf{i} + ({{a2}})\mathbf{j}) \cdot ({{b1}}\mathbf{i} + {{b2}}\mathbf{j})$.
  parts:
    - id: a
      answer: { type: numeric, key: '{{a1}}\cdot{{b1}}+({{a2}})\cdot{{b2}}' }
  solution: |
    Multiply matching components and add: $({{a1}})({{b1}}) + ({{a2}})({{b2}})$.
  verify: |
    def answers(a1, a2, b1, b2):
        return {"a": Matrix([a1, a2]).dot(Matrix([b1, b2]))}

- id: spec.vectors-2d.scalar-product.self-dot
  title: "A Vector Dotted with Itself"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Calculating the scalar product"
  rating: 1060
  responseSkills: { calculation: 1060 }
  variants:
    - { x: 2, y: -5, v: 29 }
    - { x: -3, y: 4, v: 25 }
  stem: |
    $\mathbf{a} = {{x}}\mathbf{i} + ({{y}})\mathbf{j}$. Find $\mathbf{a}\cdot\mathbf{a}$.
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    $\mathbf{a}\cdot\mathbf{a} = ({{x}})^2 + ({{y}})^2 = {{v}}$, which is $|\mathbf{a}|^2$.
  verify: |
    def answers(x, y, v):
        return {"a": x**2 + y**2}

- id: spec.vectors-2d.scalar-product.from-angle
  title: "Scalar Product from Lengths and an Angle"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Calculating the scalar product"
  rating: 1080
  responseSkills: { calculation: 1080 }
  variants:
    - { p: 4, q: 5, t: 60, v: 10 }
    - { p: 6, q: 3, t: 120, v: -9 }
    - { p: 2, q: 7, t: 90, v: 0 }
  stem: |
    $|\mathbf{a}| = {{p}}$, $|\mathbf{b}| = {{q}}$ and the angle between $\mathbf{a}$ and $\mathbf{b}$ is ${{t}}^\circ$. Find $\mathbf{a}\cdot\mathbf{b}$.
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    $\mathbf{a}\cdot\mathbf{b} = |\mathbf{a}|\,|\mathbf{b}|\cos\theta = {{p}} \times {{q}} \times \cos {{t}}^\circ = {{v}}$.
  verify: |
    def answers(p, q, t, v):
        return {"a": p*q*cos(rad(t))}

- id: spec.vectors-2d.scalar-product.which-perpendicular
  title: "Which Pair Is Perpendicular"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Perpendicular and parallel vectors"
  rating: 1110
  responseSkills: { calculation: 1100, reading: 1100 }
  stem: |
    Which pair of vectors is perpendicular?
  parts:
    - id: a
      options:
        - { id: a, text: '$2\mathbf{i} + 3\mathbf{j}$ and $3\mathbf{i} + 2\mathbf{j}$' }
        - { id: b, text: '$4\mathbf{i} - \mathbf{j}$ and $\mathbf{i} + 4\mathbf{j}$' }
        - { id: c, text: '$\mathbf{i} + \mathbf{j}$ and $\mathbf{i} + 2\mathbf{j}$' }
        - { id: d, text: '$5\mathbf{i} - 2\mathbf{j}$ and $-5\mathbf{i} + 2\mathbf{j}$' }
      answer: { type: mcq, key: b }
  solution: |
    Perpendicular means the dot product is 0. Only $(4)(1) + (-1)(4) = 0$. (Option d is parallel: the second vector is $-1$ times the first.)

- id: spec.vectors-2d.scalar-product.sign
  title: "What a Negative Scalar Product Means"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Calculating the scalar product"
  rating: 1150
  responseSkills: { reading: 1150 }
  stem: |
    Non-zero vectors $\mathbf{a}$ and $\mathbf{b}$ have $\mathbf{a}\cdot\mathbf{b} = -6$. What kind of angle is there between them?
  parts:
    - id: a
      options:
        - { id: a, text: 'Acute' }
