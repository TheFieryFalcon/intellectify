# The Lemma economy (docs/SPEC.md §13). Formulas are in packages/engine/src/economy.ts; values are here.
# Tune against the calibration targets in §13.3 with scripts/economy_sim.py.

# §13.2 Theorems. Level n + 1 costs base × growth^n. x, y place each node on the hand-drawn proof tree
# (a 1000 × 640 page): two proofs side by side, Successor Function's on top and Pigeonhole's below.
theorems:
  - id: successor
    name: Successor Function
    statement: 'S(n) = n + 1'
    boosts: Resolved questions
    base: 50
    growth: 1.15
    requires: null
    x: 110
    y: 200
  - id: distributive
    name: Distributive Law
    statement: 'a(b + c) = ab + ac'
    boosts: Quiz, unit quiz and Challenge bonuses
    base: 200
    growth: 1.15
    requires: {theorem: successor, level: 5}
    x: 330
    y: 110
  - id: geometric
    name: Geometric Series
    statement: '1 + r + r^2 + \dots = \tfrac{1}{1 - r}'
    boosts: Daily problem
    base: 300
    growth: 1.15
    requires: {theorem: successor, level: 5}
    x: 330
    y: 300
  - id: ivt
    name: Intermediate Value Theorem
    statement: 'f(a) < 0 < f(b) \implies \exists\, c \in (a, b):\ f(c) = 0'
    boosts: Rank-ups
    base: 400
    growth: 1.15
    requires: {theorem: distributive, level: 3}
    x: 560
    y: 60
  - id: binomial
    name: Binomial Theorem
    statement: '(x + y)^n = \sum_{k=0}^{n} \binom{n}{k} x^{n-k} y^k'
    boosts: Games
    base: 500
    growth: 1.15
    requires: {theorem: distributive, level: 3}
    unavailable: true
    x: 560
    y: 180
  - id: euler
    name: Euler's Identity
    statement: 'e^{i\pi} + 1 = 0'
    boosts: Achievements
    base: 500
    growth: 1.15
    requires: {theorem: ivt, level: 3}
    x: 800
    y: 60
  - id: harmonic
    name: Harmonic Series
    statement: 'H_n = 1 + \tfrac12 + \tfrac13 + \dots + \tfrac1n'
    boosts: All active sources
    base: 1000
    growth: 1.2
    requires: {theorem: geometric, level: 5}
    x: 560
    y: 300
  - id: golden
    name: Golden Ratio
    statement: '\varphi = \tfrac{1 + \sqrt5}{2} \approx 1.618'
    boosts: All sources
    base: 5000
    growth: 1.618
    requires: {theorem: harmonic, level: 10}
    x: 800
    y: 300
  - id: pigeonhole
    name: Pigeonhole Principle
    statement: 'n + 1 \text{ pigeons in } n \text{ holes} \implies \text{a hole holds two}'
    boosts: Duplicate cards
    base: 300
    growth: 1.15
    requires: null
    x: 110
    y: 500
  - id: lln
    name: Law of Large Numbers
    statement: '\bar X_n \to \mu \text{ as } n \to \infty'
    boosts: Packs
    base: 2000
    growth: 2
    maxLevel: 10
    requires: {theorem: pigeonhole, level: 5}
    x: 330
    y: 450
  - id: recurrence
    name: Recurrence Relation
    statement: 'F_{n+1} = F_n + F_{n-1}'
    boosts: Research
    base: 1000
    growth: 1.3
    requires: {theorem: pigeonhole, level: 3}
    x: 330
    y: 580

# §13.3 Institutes, one per era. Copy n + 1 costs base × 1.15^n.
# packPrice (§13.7): an eighth of the era's institute (Antiquity 250 ∴), rising 15× an era like the institutes.
# economy_sim.py buys packs when they're the best value.
institutes:
  growth: 1.15
eras:
  - {id: antiquity, name: Antiquity, years: to 500, packPrice: 250, institute: {id: academy, name: Academy, base: 2000, output: 2.5}}
  - {id: golden-age, name: Golden Age, years: 500–1400, packPrice: 3750, institute: {id: house-of-wisdom, name: House of Wisdom, base: 30000, output: 20}}
  - {id: renaissance, name: Renaissance, years: 1400–1650, packPrice: 56250, institute: {id: observatory, name: Observatory, base: 450000, output: 160}}
  - {id: enlightenment, name: Enlightenment, years: 1650–1800, packPrice: 843750, institute: {id: learned-society, name: Learned Society, base: 6750000, output: 1280}}
  - {id: steam-age, name: Steam Age, years: 1800–1880, packPrice: 12656250, institute: {id: polytechnic, name: Polytechnic, base: 101250000, output: 10240}}
  - {id: machine-age, name: Machine Age, years: 1880–1945, packPrice: 189843750, institute: {id: research-institute, name: Research Institute, base: 1518750000, output: 81920}}
  - {id: space-age, name: Space Age, years: 1945 on, packPrice: 2847656250, institute: {id: particle-accelerator, name: Particle Accelerator, base: 22781250000, output: 655360}}

# Staff slots (§13.3): 1 slot per copy, up to 12 (half a set) at the 12th copy, as fitted with
# scripts/economy_sim.py (slot_copies, slot_cap).
staff:
  boost: {silver: 0.02, gold: 0.06, platinum: 0.15, diamond: 0.30}
  foilFactor: 2
  copiesPerSlot: 1
  maxSlots: 12

timeWarp: {xp: 600, hours: 12}

# §13.4 Conjectures: the first costs 50 M, each next 10× the last; each multiplies Research by 2.5.
# Only the last, P versus NP, is still open (proved: null).
conjectures:
  first: 50000000
  step: 10
  multiplier: 2.5
  list:
    - {id: bertrand, name: "Bertrand's Postulate", statement: "For every n > 1 there's a prime between n and 2n", proved: "1852, Chebyshev"}
    - {id: pnt, name: Prime Number Theorem, statement: "The number of primes up to x is about x / ln x", proved: "1896, Hadamard and de la Vallée Poussin"}
    - {id: weil, name: Weil Conjectures, statement: "Counting solutions of polynomial equations over finite fields obeys a Riemann Hypothesis of its own", proved: "1960–1974, Dwork, Grothendieck and Deligne"}
    - {id: four-color, name: Four Color Theorem, statement: "Every map can be colored with four colors so no neighbors match", proved: "1976, Appel and Haken"}
    - {id: mordell, name: Mordell Conjecture, statement: "A curve of genus 2 or more has only finitely many rational points", proved: "1983, Faltings"}
    - {id: flt, name: "Fermat's Last Theorem", statement: "aⁿ + bⁿ = cⁿ has no positive whole-number solutions for n > 2", proved: "1994, Wiles (with Taylor)"}
    - {id: kepler, name: Kepler Conjecture, statement: "No packing of equal spheres is denser than the grocer's stack", proved: "1998, Hales"}
    - {id: catalan, name: "Catalan's Conjecture", statement: "8 and 9 are the only consecutive perfect powers", proved: "2002, Mihăilescu"}
    - {id: poincare, name: Poincaré Conjecture, statement: "Every simply connected, closed 3-manifold is a 3-sphere", proved: "2003, Perelman"}
    - {id: weak-goldbach, name: Weak Goldbach Conjecture, statement: "Every odd number greater than 5 is a sum of three primes", proved: "2013, Helfgott"}
    - {id: riemann, name: Riemann Hypothesis, statement: "Every nontrivial zero of ζ(s) has real part ½", proved: "2026, Alpöge (with AI; formally verified in Lean)"}
    - {id: p-vs-np, name: P versus NP, statement: "Is every problem whose answer can be checked quickly also quick to solve?", proved: null}

# §13.6 Axioms: milestones of lifetime Lemmas, each +5% to all sources once proven, with 3 to 5 cosmetics
# (the first themed on the Axiom, the rest simply good-looking); some also unlock a color (below).
axioms:
  bonus: 0.05
  list:
    - id: extensionality
      name: Extensionality
      at: 10000
      hours: 14
      group: zfc
      statement: Sets with the same elements are equal
      title: null
      cosmetics:
        - {id: venn, slot: banner, name: Venn, description: Two circles slide together and become one}
        - {id: dawn, slot: banner, name: Dawn, description: 'Peach fading into lavender, drifting slowly', style: {kind: gradient, colors: ['#ffcfa8', '#f7b2c4', '#c9b6f2'], motion: drift}}
        - {id: copper-icon, slot: lemmaIcon, name: Copper ∴, description: The ∴ in warm brushed copper, style: {kind: glyph, colors: ['#b8693a', '#e7a272']}}
    - id: regularity
      name: Regularity
      at: 30000
      hours: 26
      group: zfc
      statement: Every nonempty set has an element disjoint from it, so there's no endless ∈-descent
