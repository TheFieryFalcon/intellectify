      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
  - id: a
    rubric:
      criteria:
      - {id: right1, description: "Finds the angle at B in the first circle (e.g. ∠ABC = 90°, angle in a semicircle)", points: 2, dimension: reasoning}
      - {id: right2, description: "Finds the angle at B in the second circle (e.g. ∠ABD = 90°, angle in a semicircle)", points: 1, dimension: proof}
      - {id: line, description: "Concludes C, B, D are collinear (e.g. the two right angles add to 180°)", points: 2, dimension: synthesis}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Join $AB$. $AC$ is a diameter of the first circle and $B$ is on it, so $\angle ABC = 90^\circ$ (angle in a semicircle). Likewise $\angle ABD = 90^\circ$ in the second circle. $C$ and $D$ are on opposite sides of $AB$, so $\angle CBD = 90^\circ + 90^\circ = 180^\circ$: $C$, $B$ and $D$ are collinear.
- id: spec.geometry.circle-angles.altitude-center
  title: "Altitude and the Line to the Center"
  skills: {primary: spec.geometry.circle-angles}
  subsection: "Angle at the center"
  rating: 1780
  responseSkills: {reasoning: 1780, proof: 1780, clarity: 1660, synthesis: 1760}
  stem: |
    Triangle $ABC$ is acute, with all three corners on a circle with center $O$. $D$ is the point on $BC$ with $AD$ perpendicular to $BC$. Prove that $\angle BAD = \angle OAC$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-0.347, 1.97], B: [-1.638, -1.147], C: [1.638, -1.147], D: [-0.347, -1.147], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: A }
      - { type: segment, from: A, to: D }
      - { type: segment, from: O, to: A }
      - { type: angle, at: D, from: C, to: A, right: true }
      - { type: point, at: O, label: 'O', pos: e }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D', pos: s }
    ```
  parts:
  - id: a
    rubric:
      criteria:
      - {id: bad, description: "Finds ∠BAD in terms of ∠ABC (e.g. right triangle ABD: ∠BAD = 90° − ∠ABC)", points: 1, dimension: reasoning}
      - {id: center, description: "Finds ∠AOC in terms of ∠ABC (e.g. ∠AOC = 2∠ABC, angle at the center)", points: 2, dimension: reasoning}
      - {id: iso, description: "Finds ∠OAC and matches it to ∠BAD (e.g. OA = OC, so ∠OAC = ½(180° − 2∠ABC) = 90° − ∠ABC)", points: 2, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Let $\angle ABC = \beta$. In right-angled triangle $ABD$, $\angle BAD = 90^\circ - \beta$.
    $\angle AOC = 2\beta$ (angle at the center on arc $AC$). $OA = OC$ (radii), so $\angle OAC = \tfrac{1}{2}(180^\circ - 2\beta) = 90^\circ - \beta$. So $\angle BAD = \angle OAC$.
