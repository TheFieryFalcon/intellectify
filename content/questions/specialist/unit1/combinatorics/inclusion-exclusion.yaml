- id: spec.combinatorics.inclusion-exclusion.not-in-place
  skills: { primary: spec.combinatorics.inclusion-exclusion, secondary: [spec.combinatorics.permutations] }
  subsection: "Arrangements with conditions"
  rating: 1600
  responseSkills: {calculation: 1520, reasoning: 1580, synthesis: 1600}
  stem: |
    The numbers 1 to 6 are arranged in a row. In how many arrangements is 1 **not** first, 2 **not** second and 3 **not** third?
  parts:
    - id: a
      answer: { type: numeric, key: 426 }
  solution: |
    Let $A_k$ be the arrangements with $k$ in position $k$, for $k = 1, 2, 3$. Then $|A_k| = 5! = 120$, each pair overlaps in $4! = 24$, and all three overlap in $3! = 6$. So $|A_1 \cup A_2 \cup A_3| = 360 - 72 + 6 = 294$, and the answer is $720 - 294 = 426$.
  verify: |
    from itertools import permutations
    def answers():
        return {"a": sum(1 for p in permutations(range(1, 7)) if p[0] != 1 and p[1] != 2 and p[2] != 3)}

- id: spec.combinatorics.inclusion-exclusion.every-letter
  skills: { primary: spec.combinatorics.inclusion-exclusion }
