      answer: { type: numeric, key: 53.1 }
    - id: b
      prompt: Time (s)
      answer: { type: numeric, key: 83.3 }
  solution: |
    Let the heading make angle $\theta$ upstream from straight across. The swimmer's velocity over the riverbed has across part $2\cos\theta$ and upstream part $2\sin\theta - 1$.
    To land 50 m upstream after 100 m across, the upstream part must be half the across part: $2\sin\theta - 1 = \cos\theta$.
    Solving (e.g. with a calculator) gives $\sin\theta = 0.8$, $\cos\theta = 0.6$, so $\theta \approx 53.1^\circ$. The across speed is $1.2$ m/s, so the time is $\tfrac{100}{1.2} \approx 83.3$ s.
  verify: |
    def answers():
        th = symbols("th")
        sols = [s for s in solve(2*sin(th) - 1 - cos(th), th) if 0 < s.evalf() < pi/2]
        t0 = sols[0]
        return {"a": round(float(deg(t0)), 1), "b": round(float(100 / (2*cos(t0))), 1)}

- id: spec.vectors-2d.applications.plane-track
  skills: { primary: spec.vectors-2d.applications }
  rating: 1760
  responseSkills: {calculation: 1700, reasoning: 1740, synthesis: 1760}
  requiresCalculator: true
  stem: |
    A plane flies from $P$ to $Q$, which is 960 km from $P$ on a bearing of $060^\circ\text{T}$. Its airspeed is 380 km/h, and a 100 km/h wind blows from the north (so the air moves due south). Find the bearing the plane must point on, correct to one decimal place, and the flight time.
  parts:
    - id: a
      prompt: Bearing (°T)
      answer: { type: numeric, key: 46.8 }
    - id: b
      prompt: Time (hours)
      answer: { type: numeric, key: 3 }
  solution: |
    The ground velocity is $s(\sin 60^\circ\,\mathbf{i} + \cos 60^\circ\,\mathbf{j})$ for some ground speed $s$. The velocity through the air is that minus the wind: $\mathbf{p} = \tfrac{\sqrt{3}}{2}s\,\mathbf{i} + \left(\tfrac{1}{2}s + 100\right)\mathbf{j}$.
    $|\mathbf{p}| = 380$: $\tfrac{3}{4}s^2 + \tfrac{1}{4}s^2 + 100s + 10\,000 = 144\,400$, so $s^2 + 100s - 134\,400 = 0$, i.e. $(s - 320)(s + 420) = 0$ and $s = 320$ km/h. The time is $960 \div 320 = 3$ hours.
    Then $\mathbf{p} = 160\sqrt{3}\,\mathbf{i} + 260\,\mathbf{j}$, which is east of north by $\tan^{-1}\tfrac{160\sqrt{3}}{260} \approx 46.8^\circ$: bearing $046.8^\circ\text{T}$.
  verify: |
    def answers():
        s = symbols("s", positive=True)
        d = Matrix([sin(pi/3), cos(pi/3)])
        w = Matrix([0, -100])
        p = s*d - w
        s0 = [v for v in solve(expand(p.dot(p)) - 380**2, s)][0]
        pv = p.subs(s, s0)
        return {"a": round(float(deg(atan2(pv[0], pv[1]))), 1), "b": 960 / s0}

- id: spec.vectors-2d.applications.two-strings
