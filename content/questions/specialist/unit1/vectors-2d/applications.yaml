- id: spec.vectors-2d.applications.intercept-fixed-time
  skills: { primary: spec.vectors-2d.applications }
  rating: 1550
  responseSkills: { synthesis: 1530, calculation: 1500 }
  stem: |
    At noon, a patrol boat is at the origin and a ship is at $6\mathbf{i} + 8\mathbf{j}$ km, moving with velocity $-2\mathbf{i}$ km/h. The patrol boat leaves at noon at constant velocity and meets the ship at 2 pm. Find the patrol boat's velocity and its speed.
  parts:
    - id: a
      prompt: Velocity (km/h)
      answer: { type: vector, key: ['1', '4'] }
    - id: b
      prompt: Speed (km/h)
      answer: { type: numeric, key: '\sqrt{17}' }
  solution: |
    At 2 pm the ship is at $(6\mathbf{i} + 8\mathbf{j}) + 2(-2\mathbf{i}) = 2\mathbf{i} + 8\mathbf{j}$. The patrol boat covers that displacement in 2 hours, so its velocity is $\mathbf{i} + 4\mathbf{j}$ km/h, with speed $\sqrt{17} \approx 4.12$ km/h.
  verify: |
    def answers():
        meet = Matrix([6, 8]) + 2*Matrix([-2, 0])
        v = meet / 2
        return {"a": list(v), "b": v.norm()}

- id: spec.vectors-2d.applications.plane-due-north
  skills: { primary: spec.vectors-2d.applications }
  rating: 1580
  responseSkills: { synthesis: 1560, calculation: 1540 }
  requiresCalculator: true
  stem: |
    A town is 400 km due north of an airport. A plane with an airspeed of 250 km/h flies there, with a wind of 70 km/h blowing from the east (so the air moves due west). Find the bearing the plane must point on, correct to one decimal place, and the flight time in minutes.
  parts:
    - id: a
      prompt: Bearing (°T)
      answer: { type: numeric, key: 16.3 }
    - id: b
      prompt: Flight time (minutes)
      answer: { type: numeric, key: 100 }
  solution: |
    The plane must point east of north to cancel the wind, so its velocity through the air is $70\mathbf{i} + v\mathbf{j}$, with magnitude 250. Then $v = \sqrt{250^2 - 70^2} = 240$, and the ground velocity is $240\mathbf{j}$ km/h.
    Bearing: east of north by $\sin^{-1}\tfrac{70}{250} \approx 16.3^\circ$, i.e. $016.3^\circ\text{T}$. Time: $\tfrac{400}{240}$ h $= 100$ minutes.
  verify: |
    def answers():
        v = sqrt(250**2 - 70**2)
        return {"a": round(float(deg(asin(Rational(70, 250)))), 1), "b": Rational(400) / v * 60}

- id: spec.vectors-2d.applications.closest-approach
  skills: { primary: spec.vectors-2d.applications }
  rating: 1610
  responseSkills: { synthesis: 1600, calculation: 1560 }
  stem: |
    At $t = 0$ hours, ship $A$ is at the origin and ship $B$ is at $10\mathbf{i}$ km. $A$ moves with velocity $3\mathbf{i} + 4\mathbf{j}$ km/h and $B$ with velocity $-\mathbf{i} + 2\mathbf{j}$ km/h. Find when the ships are closest, and the exact closest distance.
  parts:
    - id: t
      prompt: Time (hours)
      answer: { type: numeric, key: 2 }
    - id: d
      prompt: Closest distance (km)
      answer: { type: numeric, key: '2\sqrt{5}', form: [exact] }
  solution: |
    $\overrightarrow{AB} = \mathbf{r}_B - \mathbf{r}_A = (10 - 4t)\mathbf{i} - 2t\,\mathbf{j}$, so
    $|\overrightarrow{AB}|^2 = (10 - 4t)^2 + 4t^2 = 20t^2 - 80t + 100 = 20(t - 2)^2 + 20$.
    This is smallest at $t = 2$, when the distance is $\sqrt{20} = 2\sqrt{5}$ km.
  verify: |
    def answers():
        t = symbols("t", real=True)
        rel = Matrix([10, 0]) + t*Matrix([-1, 2]) - t*Matrix([3, 4])
        d2 = expand(rel.dot(rel))
        t0 = solve(diff(d2, t), t)[0]
        return {"t": t0, "d": sqrt(d2.subs(t, t0))}

