- id: spec.vectors-2d.applications.swim-upstream
  skills: { primary: spec.vectors-2d.applications }
  rating: 1740
  responseSkills: {calculation: 1680, reasoning: 1720, synthesis: 1740}
  requiresCalculator: true
  stem: |
    A river is 100 m wide with straight, parallel banks, and flows at 1 m/s. A swimmer swims at 2 m/s through the water and wants to land at the point on the far bank 50 m upstream of the point directly opposite. Find the angle between the swimmer's heading and the straight-across direction, correct to one decimal place, and the time taken, correct to one decimal place.
  parts:
