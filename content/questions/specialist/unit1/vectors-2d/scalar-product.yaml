- id: spec.vectors-2d.scalar-product.cauchy-schwarz
  title: "Square of a Scalar Product at Most the Product of Squares"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Magnitudes and the scalar product"
  rating: 1750
  responseSkills: {reasoning: 1750, proof: 1750, clarity: 1620, synthesis: 1700}
  stem: |
    For $\mathbf{a} = a_1\mathbf{i} + a_2\mathbf{j}$ and $\mathbf{b} = b_1\mathbf{i} + b_2\mathbf{j}$, prove using components only (no angles) that $(\mathbf{a}\cdot\mathbf{b})^2 \le |\mathbf{a}|^2\,|\mathbf{b}|^2$, and state exactly when equality holds.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: write, description: "Writes both sides in a form that can be compared (e.g. in components: (a₁b₁ + a₂b₂)² and (a₁² + a₂²)(b₁² + b₂²))", points: 1, dimension: reasoning }
          - { id: subtract, description: "Shows the difference between the sides is never negative (e.g. it equals (a₁b₂ − a₂b₁)²)", points: 2, dimension: reasoning }
          - { id: conclude, description: "Concludes the inequality from that (e.g. a square is ≥ 0)", points: 1, dimension: proof }
          - { id: equality, description: "Finds when equality holds: exactly when one vector is a multiple of the other (e.g. a₁b₂ = a₂b₁: parallel, or one is zero)", points: 1, dimension: synthesis }
  solution: |
    $|\mathbf{a}|^2|\mathbf{b}|^2 - (\mathbf{a}\cdot\mathbf{b})^2 = (a_1^2 + a_2^2)(b_1^2 + b_2^2) - (a_1b_1 + a_2b_2)^2 = a_1^2b_2^2 + a_2^2b_1^2 - 2a_1b_1a_2b_2 = (a_1b_2 - a_2b_1)^2 \ge 0$.
    Equality holds exactly when $a_1b_2 = a_2b_1$, which means one vector is a multiple of the other: they are parallel, or one is the zero vector.
  verify: |
    def answers():
        a1, a2, b1, b2 = symbols("a1 a2 b1 b2", real=True)
        assert expand((a1**2 + a2**2)*(b1**2 + b2**2) - (a1*b1 + a2*b2)**2 - (a1*b2 - a2*b1)**2) == 0
        return {}

- id: spec.vectors-2d.scalar-product.three-unit-vectors
  title: "Largest Sum of Squared Distances Between Unit Vectors"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Magnitudes and the scalar product"
  rating: 1820
  responseSkills: {calculation: 1770, reasoning: 1800, proof: 1760, synthesis: 1820}
  stem: |
    $\mathbf{a}$, $\mathbf{b}$ and $\mathbf{c}$ are unit vectors in the plane. Find the largest possible value of
    $$|\mathbf{a} - \mathbf{b}|^2 + |\mathbf{b} - \mathbf{c}|^2 + |\mathbf{c} - \mathbf{a}|^2.$$
  parts:
    - id: a
      answer: { type: numeric, key: 9 }
  solution: |
    Expanding, each $|\mathbf{a} - \mathbf{b}|^2 = 2 - 2\,\mathbf{a}\cdot\mathbf{b}$, so the sum is $6 - 2(\mathbf{a}\cdot\mathbf{b} + \mathbf{b}\cdot\mathbf{c} + \mathbf{c}\cdot\mathbf{a})$.
    Also $0 \le |\mathbf{a} + \mathbf{b} + \mathbf{c}|^2 = 3 + 2(\mathbf{a}\cdot\mathbf{b} + \mathbf{b}\cdot\mathbf{c} + \mathbf{c}\cdot\mathbf{a})$, so $\mathbf{a}\cdot\mathbf{b} + \mathbf{b}\cdot\mathbf{c} + \mathbf{c}\cdot\mathbf{a} \ge -\tfrac{3}{2}$.
    So the sum is at most $6 + 3 = 9$. It equals 9 when $\mathbf{a} + \mathbf{b} + \mathbf{c} = \mathbf{0}$, e.g. three unit vectors $120^\circ$ apart.
  verify: |
    def answers():
        u = lambda t: Matrix([cos(t), sin(t)])
        a, b, c = u(0), u(2*pi/3), u(4*pi/3)
        s = simplify((a - b).dot(a - b) + (b - c).dot(b - c) + (c - a).dot(c - a))
        # A coarse numeric search confirms nothing beats it.
        import math
        best = 0
        for i in range(0, 360, 10):
            for j in range(0, 360, 10):
                x, y = math.radians(i), math.radians(j)
                v = [(1, 0), (math.cos(x), math.sin(x)), (math.cos(y), math.sin(y))]
                d = lambda p, q: (p[0] - q[0])**2 + (p[1] - q[1])**2
                best = max(best, d(v[0], v[1]) + d(v[1], v[2]) + d(v[2], v[0]))
        assert best <= s + 1e-9
        return {"a": s}
