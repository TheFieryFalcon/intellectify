        - { id: c, text: 'Obtuse' }
        - { id: d, text: "Can't tell" }
      answer: { type: mcq, key: c }
  solution: |
    $\mathbf{a}\cdot\mathbf{b} = |\mathbf{a}|\,|\mathbf{b}|\cos\theta$ and the magnitudes are positive, so $\cos\theta < 0$. The angle is obtuse.

- id: spec.vectors-2d.scalar-product.perpendicular-simple
  title: "Finding k for Perpendicular Vectors"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Perpendicular and parallel vectors"
  rating: 1200
  responseSkills: { calculation: 1190 }
  variants:
    - { p: 2, x: 3, y: -6, k: 4 }
    - { p: -5, x: 10, y: 4, k: 2 }
  stem: |
    Find $k$ so that $k\mathbf{i} + ({{p}})\mathbf{j}$ is perpendicular to ${{x}}\mathbf{i} + ({{y}})\mathbf{j}$.
  parts:
    - id: a
      prompt: $k =$
      answer: { type: numeric, key: '{{k}}' }
  solution: |
    Set the dot product to 0: ${{x}}k + ({{p}})({{y}}) = 0$, so $k = {{k}}$.
  verify: |
    def answers(p, x, y, k):
