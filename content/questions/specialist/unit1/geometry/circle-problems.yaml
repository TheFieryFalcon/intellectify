- id: spec.geometry.circle-problems.parallelogram-cyclic
  skills: {primary: spec.geometry.circle-problems}
  rating: 1440
  responseSkills: {reasoning: 1430, proof: 1430, clarity: 1370}
  stem: |
    Prove that a parallelogram whose corners lie on a circle is a rectangle.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: opp, description: Opposite angles of a parallelogram are equal, points: 1, dimension: reasoning}
      - {id: cyc, description: Opposite angles of a cyclic quadrilateral add to 180°, points: 1, dimension: reasoning}
      - {id: right, description: 'So each is 90°, and all four angles are right angles', points: 2, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    In parallelogram $ABCD$, $\angle A = \angle C$. It is cyclic, so $\angle A + \angle C = 180^\circ$. So $\angle A = \angle C = 90^\circ$, and likewise $\angle B = \angle D = 90^\circ$: it is a rectangle.
- id: spec.geometry.circle-problems.tangents-major-arc
  skills: {primary: spec.geometry.circle-problems}
  rating: 1420
  responseSkills: {calculation: 1400, reasoning: 1410, synthesis: 1400}
  variants:
  - {m: 50}
  - {m: 36}
  stem: |
    Tangents from $M$ touch a circle at $S$ and $T$, and $\angle SMT = {{m}}^\circ$. $P$ is a point on the major arc $ST$. Find $\angle SPT$.

    ```diagram
    view: [-2.45, 2.45, -4.05, 2.45]
    width: 230
    points: { M: [0, -3.6], S: [1.663, -1.111], T: [-1.663, -1.111], P: [-0.347, 1.97], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: S }
      - { type: segment, from: M, to: T }
      - { type: segment, from: P, to: S }
      - { type: segment, from: P, to: T }
      - { type: angle, at: M, from: S, to: T, label: '{{m}}^\circ', radius: 22 }
      - { type: angle, at: P, from: T, to: S, radius: 20 }
      - { type: point, at: M, label: 'M' }
      - { type: point, at: S, label: 'S' }
      - { type: point, at: T, label: 'T' }
      - { type: point, at: P, label: 'P' }
    ```
  parts:
  - id: a
    prompt: $\angle SPT$ (°)
    answer: {type: numeric, key: '\frac{180-{{m}}}{2}'}
  solution: |
    With center $O$, $\angle OSM = \angle OTM = 90^\circ$, so $\angle SOT = 180^\circ - {{m}}^\circ$ (quadrilateral $OSMT$). The angle at the circumference is half: $\angle SPT = \tfrac{1}{2}(180^\circ - {{m}}^\circ)$.
  verify: |
    def answers(m):
        import math
        M = (0, -2 / math.sin(math.radians(m / 2)))
        S, T = tangent_point_toward((0, 0), 2, M, 1), tangent_point_toward((0, 0), 2, M, -1)
        Pp = on_circle(100, 2)
        return {"a": approx(angle_at(S, Pp, T))}
- id: spec.geometry.circle-problems.chords-cross-angle
  skills: {primary: spec.geometry.circle-problems}
  rating: 1450
  responseSkills: {calculation: 1430, reasoning: 1440, synthesis: 1420}
  stem: |
    $A$, $B$, $C$ and $D$ lie on a circle in that order, and chords $AC$ and $BD$ meet at $X$. $\angle ABD = 32^\circ$ and $\angle AXD = 110^\circ$. Find $\angle BDC$.
  parts:
  - id: a
    prompt: $\angle BDC$ (°)
    answer: {type: numeric, key: '78'}
  solution: |
    $\angle ACD = \angle ABD = 32^\circ$ (same arc $AD$). $\angle DXC = 180^\circ - 110^\circ = 70^\circ$ (angles on a straight line). In triangle $XCD$: $\angle XDC = 180^\circ - 70^\circ - 32^\circ = 78^\circ$, so $\angle BDC = 78^\circ$.
  verify: |
    def answers():
        # Arcs: AD (not containing B) = 64; BC = 2 * angle BDC = 156; AB + CD = 360 - 64 - 156 = 140.
        A = on_circle(0); B = on_circle(70); C = on_circle(70 + 156); D = on_circle(360 - 64)
        X = line_meet(A, C, B, D)
        assert abs(angle_at(A, B, D) - 32) < 1e-9 and abs(angle_at(A, X, D) - 110) < 1e-9
        return {"a": approx(angle_at(B, D, C))}
- id: spec.geometry.circle-problems.isosceles-trapezium
  skills: {primary: spec.geometry.circle-problems}
  rating: 1460
  responseSkills: {reading: 1440, calculation: 1440, reasoning: 1450}
  stem: |
    $ABCD$ is a trapezium with $AB \parallel DC$ and $AD = BC$, and $\angle DAB = 70^\circ$. Find $\angle BCD$, and decide whether $ABCD$ is cyclic.
  parts:
  - id: a
    prompt: $\angle BCD$ (°)
    answer: {type: numeric, key: '110'}
  - id: b
    prompt: Is it cyclic?
    options:
    - {id: a, text: Cyclic}
    - {id: b, text: Not cyclic}
    answer: {type: mcq, key: a}
  solution: |
    In an isosceles trapezium the base angles are equal: $\angle ABC = 70^\circ$. Co-interior angles between the parallel sides add to $180^\circ$: $\angle BCD = 180^\circ - 70^\circ = 110^\circ$. So $\angle DAB + \angle BCD = 180^\circ$, and $ABCD$ is cyclic.
  verify: |
    def answers():
        import math
        A, B = (0.0, 0.0), (6.0, 0.0)
        h = 2.0
        D = (h / math.tan(math.radians(70)), h); C = (6 - D[0], h)
        s = angle_at(B, C, D)
        return {"a": approx(s), "b": "a" if abs(angle_at(D, A, B) + s - 180) < 1e-9 else "b"}
- id: spec.geometry.circle-problems.kite-tangents-area
  skills: {primary: spec.geometry.circle-problems}
  rating: 1450
  responseSkills: {calculation: 1430, reasoning: 1440, synthesis: 1420}
  stem: |
    A point $M$ is 10 cm from the center $O$ of a circle of radius 6 cm. Tangents from $M$ touch the circle at $S$ and $T$. Find the area of quadrilateral $OSMT$.
  parts:
  - id: a
    prompt: Area (cm²)
    answer: {type: numeric, key: '48'}
  solution: |
    Each tangent has length $\sqrt{10^2 - 6^2} = 8$ (tangent ⟂ radius). $OSMT$ is two congruent right-angled triangles, each with area $\tfrac{1}{2} \times 6 \times 8 = 24$. Total: $48$ cm².
  verify: |
    def answers():
        M = (10.0, 0.0)
        S, T = tangent_point_toward((0, 0), 6, M, 1), tangent_point_toward((0, 0), 6, M, -1)
        pts = [(0, 0), S, M, T]
        area = abs(sum(pts[i][0]*pts[(i+1) % 4][1] - pts[(i+1) % 4][0]*pts[i][1] for i in range(4))) / 2
        return {"a": approx(area)}
- id: spec.geometry.circle-problems.prove-cyclic-converse
  skills: {primary: spec.geometry.circle-problems}
  rating: 1520
  responseSkills: {reasoning: 1510, proof: 1510, clarity: 1430, synthesis: 1480}
  stem: |
    Prove by contradiction: if a quadrilateral $ABCD$ has $\angle B + \angle D = 180^\circ$, then it is cyclic.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: circle, description: 'Draws the circle through A, B, C and supposes D is not on it', points: 1, dimension: proof}
      - {id: meet, description: Lets AD (or line through D) meet the circle at D′ ≠ D, points: 1, dimension: synthesis}
      - {id: angles, description: ∠AD′C = 180° − ∠B = ∠ADC (cyclic quadrilateral ABCD′), points: 2, dimension: reasoning}
      - {id: contra, description: 'But an exterior angle of triangle DD′C can''t equal its interior opposite angle: contradiction', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Draw the circle through $A$, $B$, $C$, and suppose $D$ isn't on it. Let line $AD$ meet the circle again at $D' \ne D$. $ABCD'$ is cyclic, so $\angle AD'C = 180^\circ - \angle B = \angle ADC$.
    But in triangle $DD'C$, one of $\angle AD'C$ and $\angle ADC$ is an exterior angle and the other an interior angle not next to it, so the exterior angle is larger. They can't be equal: contradiction. So $D$ is on the circle.
- id: spec.geometry.circle-problems.prove-semicircle-converse
  skills: {primary: spec.geometry.circle-problems}
  rating: 1480
  responseSkills: {reasoning: 1470, proof: 1470, clarity: 1400, synthesis: 1440}
  stem: |
    $\angle APB = 90^\circ$ and $M$ is the midpoint of $AB$. Prove that $MP = MA = MB$, so $P$ lies on the circle with diameter $AB$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: rect, description: 'Completes rectangle APBQ (or uses a reflection), or uses vectors with P as origin', points: 1, dimension: synthesis}
      - {id: diag, description: 'A rectangle''s diagonals are equal and bisect each other, so M is the midpoint of PQ too', points: 2, dimension: reasoning}
      - {id: equal, description: So MP = ½PQ = ½AB = MA = MB, points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Complete the rectangle $APBQ$ (draw lines through $A$ and $B$ parallel to $PB$ and $PA$). A rectangle's diagonals are equal and bisect each other, so $M$, the midpoint of $AB$, is also the midpoint of $PQ$, and $MP = \tfrac{1}{2}PQ = \tfrac{1}{2}AB = MA = MB$. So $P$ is on the circle with center $M$ and diameter $AB$.
- id: spec.geometry.circle-problems.diameter-two-points
  skills: {primary: spec.geometry.circle-problems}
  rating: 1580
  responseSkills: {calculation: 1540, reasoning: 1570, synthesis: 1570}
  stem: |
    $AB$ is a diameter of a circle, and $C$ and $D$ are on the circle on the same side of $AB$. $\angle DAB = 50^\circ$ and $\angle CBA = 60^\circ$. Find $\angle DCA$.
  parts:
  - id: a
    prompt: $\angle DCA$ (°)
    answer: {type: numeric, key: '40'}
  solution: |
    Join $BD$. $\angle ADB = 90^\circ$ (angle in a semicircle), so $\angle DBA = 90^\circ - 50^\circ = 40^\circ$. $\angle DCA$ and $\angle DBA$ stand on the same arc $DA$: $\angle DCA = 40^\circ$.
  verify: |
    def answers():
        A, B = on_circle(180), on_circle(0)
        D = on_circle(100)        # angle DBA = 40 means arc AD = 80, so D is at 180 - 80 = 100
        C = on_circle(180 - 120)  # angle CBA = 60 means arc AC = 120, so C is at 60
        assert abs(angle_at(D, A, B) - 50) < 1e-9 and abs(angle_at(C, B, A) - 60) < 1e-9
        return {"a": approx(angle_at(D, C, A))}
- id: spec.geometry.circle-problems.altitudes-concyclic
