  stem: |
    Prove by contradiction that there are infinitely many prime numbers.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: assume, description: 'Assumes there are only finitely many primes p₁, p₂, …, pₖ', points: 1, dimension: proof}
      - {id: build, description: Considers N = p₁p₂⋯pₖ + 1, points: 2, dimension: synthesis}
      - {id: remainder, description: No pᵢ divides N (each leaves remainder 1), points: 1, dimension: reasoning}
      - {id: contra, description: 'But N > 1 has a prime factor, which must be one of the pᵢ: contradiction', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose there are only finitely many primes, $p_1, p_2, \dots, p_k$. Let $N = p_1p_2\cdots p_k + 1$. Dividing $N$ by any $p_i$ leaves remainder 1, so no $p_i$ divides $N$. But $N > 1$, so it has at least one prime factor, which must be on our list. This is a contradiction, so there are infinitely many primes.
- id: spec.geometry.proof-methods.one-perpendicular
  skills: {primary: spec.geometry.proof-methods}
  rating: 1620
  responseSkills: {reasoning: 1610, proof: 1610, clarity: 1520}
  stem: |
    $P$ is a point not on line $\ell$. Prove by contradiction that there is only one line through $P$ perpendicular to $\ell$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: assume, description: 'Assumes two different perpendiculars from P, meeting ℓ at A and B (A ≠ B)', points: 1, dimension: proof}
      - {id: triangle, description: 'Triangle PAB then has two right angles, at A and B', points: 2, dimension: reasoning}
      - {id: contra, description: 'Angles would add to more than 180°: contradiction', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose two different lines through $P$ are perpendicular to $\ell$, meeting it at $A$ and $B$. Since the lines are different, $A \ne B$, and $PAB$ is a triangle with right angles at both $A$ and $B$. Its angles would add to more than $180^\circ$, which is impossible.
- id: spec.geometry.proof-methods.euler-polynomial
  skills: {primary: spec.geometry.proof-methods}
  rating: 1570
  responseSkills: {calculation: 1550, reasoning: 1560, synthesis: 1530}
  requiresCalculator: true
  stem: |
    Claim: "$n^2 - 79n + 1601$ is prime for every whole number $n \ge 0$." What is the smallest counterexample?
  parts:
  - id: a
    answer: {type: numeric, key: '80'}
  solution: |
    Substituting $m = n - 40$ turns the expression into $m^2 + m + 41$, which is prime for $m = -40, \dots, 39$, i.e. $n = 0, \dots, 79$. At $n = 80$: $6400 - 6320 + 1601 = 1681 = 41^2$.
  verify: |
    def answers():
        return {"a": next(n for n in range(500) if not isprime(n*n - 79*n + 1601))}
- id: spec.geometry.proof-methods.fermat-numbers
  skills: {primary: spec.geometry.proof-methods}
  rating: 1700
  responseSkills: {reading: 1660, calculation: 1680, reasoning: 1690}
  requiresCalculator: true
  stem: |
    Claim: "$2^{2^n} + 1$ is prime for every whole number $n$." What is the smallest counterexample?
  parts:
  - id: a
    answer: {type: numeric, key: '5'}
  solution: |
    $n = 0, 1, 2, 3, 4$ give 3, 5, 17, 257 and 65537, all prime. But $2^{32} + 1 = 4\,294\,967\,297 = 641 \times 6\,700\,417$. So $n = 5$.
  verify: |
    def answers():
        return {"a": next(n for n in range(10) if not isprime(2**(2**n) + 1))}
- id: spec.geometry.proof-methods.sum-of-two-squares-4k3
  skills: {primary: spec.geometry.proof-methods}
  rating: 1710
  responseSkills: {reasoning: 1700, proof: 1700, clarity: 1600, synthesis: 1680}
  stem: |
    Prove that no whole number that leaves remainder 3 on division by 4 is a sum of two perfect squares.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: squares, description: 'Shows every square leaves remainder 0 or 1 on division by 4 (even 2k: 4k²; odd 2k+1: 4k² + 4k + 1)', points: 2, dimension: reasoning}
      - {id: sums, description: 'So a sum of two squares leaves remainder 0, 1 or 2', points: 2, dimension: reasoning}
      - {id: conclude, description: 'Never 3, so such a number isn''t a sum of two squares', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    An even number squared is $(2k)^2 = 4k^2$, remainder 0. An odd number squared is $(2k + 1)^2 = 4(k^2 + k) + 1$, remainder 1. So a sum of two squares leaves remainder $0 + 0$, $0 + 1$ or $1 + 1$: that is, 0, 1 or 2, never 3.
- id: spec.geometry.proof-methods.pythagorean-even
  skills: {primary: spec.geometry.proof-methods}
  rating: 1740
  responseSkills: {reasoning: 1740, proof: 1740, clarity: 1620, synthesis: 1700}
  stem: |
    $a$, $b$ and $c$ are integers with $a^2 + b^2 = c^2$. Prove that at least one of $a$ and $b$ is even.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: assume, description: 'Assumes, for contradiction, that a and b are both odd', points: 1, dimension: proof}
      - {id: sum, description: Then a² + b² leaves remainder 2 on division by 4, points: 2, dimension: reasoning}
      - {id: square, description: But c² leaves remainder 0 or 1 on division by 4, points: 2, dimension: reasoning}
      - {id: contra, description: Contradiction stated clearly, points: 1, dimension: clarity}
  solution: |
    Suppose $a$ and $b$ are both odd. Odd squares leave remainder 1 on division by 4, so $a^2 + b^2$ leaves remainder 2. But any square, including $c^2$, leaves remainder 0 or 1. So $a^2 + b^2 \ne c^2$, a contradiction. Hence at least one of $a$, $b$ is even.
- id: spec.geometry.proof-methods.cubic-no-rational
  skills: {primary: spec.geometry.proof-methods}
  rating: 1760
  responseSkills: {proof: 1760, synthesis: 1720, clarity: 1640}
  stem: |
    A rational number is a fraction $\tfrac{p}{q}$ of integers ($q \ne 0$), which can be written in lowest terms (no common factor greater than 1). Prove that $x^3 + x + 1 = 0$ has no rational solution.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: setup, description: 'Assumes x = p/q in lowest terms is a solution and clears denominators: p³ + pq² + q³ = 0', points: 2, dimension: proof}
      - {id: parity, description: 'Not both p and q are even; checks the cases p, q both odd, or one even and one odd', points: 2, dimension: synthesis}
      - {id: contra, description: 'In every case the left side is odd, so it can''t be 0', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose $x = \tfrac{p}{q}$ in lowest terms is a solution. Multiplying by $q^3$: $p^3 + pq^2 + q^3 = 0$. In lowest terms $p$ and $q$ aren't both even.
    - Both odd: three odd terms add to an odd number.
    - $p$ even, $q$ odd: even + even + odd is odd.
    - $p$ odd, $q$ even: odd + even + even is odd.

    The left side is always odd, so it can't be 0. So there is no rational solution.
- id: spec.geometry.proof-methods.no-a-squared-3b-squared
  skills: {primary: spec.geometry.proof-methods}
  rating: 1780
  responseSkills: {reasoning: 1780, proof: 1780, clarity: 1660, synthesis: 1750}
  stem: |
    Using the fact that if $n^2$ is a multiple of 3 then $n$ is a multiple of 3, prove that there are no positive integers $a$ and $b$ with $a^2 = 3b^2$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: smallest, description: Assumes a solution exists and takes the one with the smallest positive a (or uses lowest terms), points: 1, dimension: synthesis}
      - {id: a3, description: 'a² = 3b² is a multiple of 3, so a = 3m', points: 1, dimension: reasoning}
      - {id: b3, description: 'Then 9m² = 3b², so b² = 3m², and b is a multiple of 3', points: 2, dimension: reasoning}
      - {id: descent, description: 'So (m, b/3) is a smaller solution (or a and b share a factor 3): contradiction', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose there are solutions, and take the one with the smallest positive $a$. $a^2 = 3b^2$ is a multiple of 3, so $a = 3m$. Then $9m^2 = 3b^2$, so $b^2 = 3m^2$, which makes $b$ a multiple of 3 too, say $b = 3n$. Then $(3m)^2 = 3(3n)^2$ gives $m^2 = 3n^2$: a solution with $m < a$. This contradicts $a$ being the smallest, so no solution exists.
- id: spec.geometry.proof-methods.integer-polynomial
  skills: {primary: spec.geometry.proof-methods}
  rating: 1790
  responseSkills: {reasoning: 1790, proof: 1790, clarity: 1660, synthesis: 1770}
  stem: |
    A polynomial with integer coefficients has the form $p(x) = c_nx^n + \dots + c_1x + c_0$ where every $c_i$ is an integer. Prove that no such polynomial has $p(1) = 2$ and $p(3) = 5$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: diff, description: Writes p(3) − p(1) as a sum of terms cₖ(3ᵏ − 1ᵏ), points: 2, dimension: synthesis}
      - {id: even, description: 'Shows each 3ᵏ − 1 is even (3ᵏ is odd), so p(3) − p(1) is even', points: 2, dimension: reasoning}
      - {id: contra, description: 'But 5 − 2 = 3 is odd: contradiction', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose such a polynomial exists. Then $p(3) - p(1) = \sum_k c_k\left(3^k - 1^k\right)$. Each $3^k$ is odd, so each $3^k - 1$ is even, and the whole sum is even. But $p(3) - p(1) = 5 - 2 = 3$ is odd. This contradiction shows no such polynomial exists.
- id: spec.geometry.proof-methods.primes-4k-plus-3
  skills: {primary: spec.geometry.proof-methods}
  rating: 1830
  responseSkills: {reasoning: 1830, proof: 1830, clarity: 1700, synthesis: 1800}
  stem: |
    Prove that there are infinitely many primes that leave remainder 3 on division by 4.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: assume, description: 'Assumes there are finitely many such primes, p₁, …, pₖ', points: 1, dimension: proof}
      - {id: build, description: 'Considers N = 4p₁p₂⋯pₖ − 1, which leaves remainder 3 on division by 4', points: 2, dimension: synthesis}
      - {id: factor, description: 'Shows N has a prime factor with remainder 3 (a product of primes with remainder 1 has remainder 1, and N is odd)', points: 2, dimension: reasoning}
      - {id: contra, description: 'That prime can''t be any pᵢ (each leaves remainder −1, i.e. doesn''t divide N): contradiction', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose the primes with remainder 3 are only $p_1, \dots, p_k$. Let $N = 4p_1p_2\cdots p_k - 1$, which leaves remainder 3 on division by 4 and is odd.
    Every odd prime leaves remainder 1 or 3. A product of numbers with remainder 1 also has remainder 1, so $N$ must have at least one prime factor $q$ with remainder 3.
    But each $p_i$ divides $4p_1\cdots p_k$, so it leaves remainder $p_i - 1$ when dividing $N$, and doesn't divide $N$. So $q$ isn't on the list, a contradiction. There are infinitely many such primes.
