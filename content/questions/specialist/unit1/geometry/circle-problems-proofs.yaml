      - { type: segment, from: A, to: D }
      - { type: point, at: E, label: 'E', pos: e }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: s }
      - { type: point, at: C, label: 'C', pos: n }
      - { type: point, at: D, label: 'D', pos: nw }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'exterior', description: "Finds one pair of equal angles (e.g. ∠EBC, exterior angle of ABCD at B, equals the interior opposite angle ∠ADC)", points: 2, dimension: reasoning }
          - { id: 'common', description: "Finds a second pair (e.g. the common angle at E)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes the triangles are similar", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $E$, $B$, $A$ are collinear, so $\angle EBC$ is an exterior angle of cyclic quadrilateral $ABCD$, and equals the interior opposite angle $\angle ADC = \angle EDA$. The triangles also share the angle at $E$. Two pairs of equal angles, so triangles $EBC$ and $EDA$ are similar.

- id: spec.geometry.circle-problems.tangent-by-angles
  title: "Equal Angles and a Product of Lengths"
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.chord-secant-lengths] }
  subsection: "Finding and proving angles"
  rating: 1600
  responseSkills: { reasoning: 1590, proof: 1590, clarity: 1550, synthesis: 1580 }
  stem: |
    In triangle $ABC$, $D$ is a point on $BC$ with $\angle BAD = \angle ACB$. Prove that $BA^2 = BD \times BC$.

    ```diagram
    view: [-2.45, 4.45, -2.45, 2.45]
    width: 260
    points: { A: [1, 2], B: [0, 0], C: [4, 0], D: [1.25, 0] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: A }
      - { type: segment, from: A, to: D }
      - { type: angle, at: A, from: B, to: D, radius: 26 }
      - { type: angle, at: C, from: A, to: B, radius: 30 }
      - { type: point, at: A, label: 'A', pos: n }
      - { type: point, at: B, label: 'B', pos: sw }
      - { type: point, at: C, label: 'C', pos: se }
      - { type: point, at: D, label: 'D', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'similar', description: "Shows two triangles are similar (e.g. BAD and BCA: common angle at B and ∠BAD = ∠BCA)", points: 2, dimension: reasoning }
          - { id: 'ratio', description: "Writes the ratio of sides (e.g. BA/BC = BD/BA)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes BA² = BD × BC", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Triangles $BAD$ and $BCA$ share the angle at $B$, and $\angle BAD = \angle BCA$. So they are similar, with $\dfrac{BA}{BC} = \dfrac{BD}{BA}$, i.e. $BA^2 = BD \times BC$.

    (In circle terms: $BA$ is tangent to the circle through $A$, $D$, $C$, by the converse of the alternate segment theorem, and this is the tangent–secant theorem.)

