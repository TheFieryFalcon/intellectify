      - { type: point, at: D, label: 'D' }
      - { type: point, at: X, label: 'X', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'sum', description: "AX + XB = CX + XD = L (equal chords)", points: 1, dimension: reasoning }
          - { id: 'product', description: "AX × XB = CX × XD (intersecting chords)", points: 1, dimension: reasoning }
          - { id: 'quadratic', description: "So {AX, XB} and {CX, XD} are both the roots of t² − Lt + P = 0 (same sum and product)", points: 2, dimension: reasoning }
