    prompt: Radius
    answer: {type: numeric, key: '{{r}}'}
  solution: |
    By symmetry the circle touches $CD$ at its midpoint $T$, and the line through $T$ perpendicular to $CD$ is a diameter, which also cuts chord $AB$ in half at $N$. $NT = {{a}}$, and the diameter is cut at $N$ into ${{a}}$ and $2r - {{a}}$. Intersecting chords: ${{h}} \times {{h}} = {{a}}(2r - {{a}})$, so $2r - {{a}} = {{k}}$ and $r = {{r}}$.
