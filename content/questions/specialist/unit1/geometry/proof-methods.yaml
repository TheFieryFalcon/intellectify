- id: spec.geometry.proof-methods.examples-prove
  skills: {primary: spec.geometry.proof-methods}
  rating: 1150
  responseSkills: {reading: 1140}
  stem: |
    Which kind of statement can be **proved** by giving a single example?
  parts:
  - id: a
    options:
    - {id: a, text: '"For all $x$, ..."'}
    - {id: b, text: '"There exists an $x$ such that ..."'}
    - {id: c, text: '"If $P$, then $Q$"'}
    - {id: d, text: '"No $x$ satisfies ..."'}
    answer: {type: mcq, key: b}
  solution: |
    One example shows that something exists. "For all" and "no $x$" statements are about every case, so one example can't prove them.
- id: spec.geometry.proof-methods.quadratic-prime
  skills: {primary: spec.geometry.proof-methods}
  rating: 1260
  responseSkills: {reading: 1240, calculation: 1250, reasoning: 1250}
  stem: |
    Claim: "$n^2 - n + 11$ is prime for every whole number $n \ge 0$." What is the smallest $n$ that disproves it?
  parts:
  - id: a
    answer: {type: numeric, key: '11'}
  solution: |
    For $n = 0, 1, \dots, 10$ the values are 11, 11, 13, 17, 23, 31, 41, 53, 67, 83, 101, all prime. At $n = 11$: $121 - 11 + 11 = 121 = 11^2$, which isn't prime.
  verify: |
    def answers():
        return {"a": next(n for n in range(200) if not isprime(n*n - n + 11))}
- id: spec.geometry.proof-methods.squares-equal
  skills: {primary: spec.geometry.proof-methods}
  rating: 1290
  responseSkills: {reading: 1280, reasoning: 1280}
  stem: |
    Which pair $(a, b)$ is a counterexample to "if $a^2 = b^2$, then $a = b$"?
  parts:
  - id: a
    options:
    - {id: a, text: '$(3, 3)$'}
    - {id: b, text: '$(2, -2)$'}
    - {id: c, text: '$(1, 2)$'}
    - {id: d, text: '$(0, 0)$'}
    answer: {type: mcq, key: b}
  solution: |
    A counterexample needs the hypothesis true and the conclusion false: $2^2 = (-2)^2$ but $2 \ne -2$. $(1, 2)$ doesn't satisfy the hypothesis.
- id: spec.geometry.proof-methods.powers-of-two
  skills: {primary: spec.geometry.proof-methods}
  rating: 1300
  responseSkills: {reading: 1260, calculation: 1290, reasoning: 1290}
  stem: |
    Claim: "$2^n > n^2$ for every whole number $n \ge 0$." What is the smallest counterexample?
  parts:
  - id: a
    answer: {type: numeric, key: '2'}
  solution: |
    $n = 0$: $1 > 0$. $n = 1$: $2 > 1$. $n = 2$: $4 > 4$ is false. So $n = 2$ is the smallest counterexample. (So are $n = 3$ and $n = 4$; from $n = 5$ on the claim holds.)
  verify: |
    def answers():
        return {"a": next(n for n in range(50) if not 2**n > n**2)}
- id: spec.geometry.proof-methods.two-squares
  skills: {primary: spec.geometry.proof-methods}
  rating: 1320
  responseSkills: {reading: 1300, calculation: 1300, reasoning: 1310}
  stem: |
    Claim: "Every positive whole number is a sum of at most two perfect squares" (squares of whole numbers, which may repeat, such as $2 = 1^2 + 1^2$). What is the smallest counterexample?
  parts:
  - id: a
    answer: {type: numeric, key: '3'}
  solution: |
    $1 = 1^2$ and $2 = 1^2 + 1^2$. The squares up to 3 are 0 and 1, and no two of them add to 3. So 3 is the smallest counterexample.
  verify: |
    def answers():
        sq = [k*k for k in range(40)]
        return {"a": next(n for n in range(1, 500) if not any(n - s in sq for s in sq if s <= n))}
- id: spec.geometry.proof-methods.not-valid-method
  skills: {primary: spec.geometry.proof-methods}
  rating: 1340
  responseSkills: {reading: 1330, reasoning: 1330, proof: 1300}
  stem: |
    Which of these is **not** a valid way to prove "if $P$, then $Q$"?
  parts:
  - id: a
    options:
    - {id: a, text: Assume $P$ and deduce $Q$.}
    - {id: b, text: Assume not $Q$ and deduce not $P$.}
    - {id: c, text: 'Assume $P$ and not $Q$, and reach a contradiction.'}
    - {id: d, text: Assume $Q$ and deduce $P$.}
    answer: {type: mcq, key: d}
  solution: |
    (d) proves the converse, $Q \Rightarrow P$, which is a different statement. (a) is direct, (b) proves the contrapositive, and (c) is contradiction.
- id: spec.geometry.proof-methods.largest-multiple-of-7
  skills: {primary: spec.geometry.proof-methods}
  rating: 1370
  responseSkills: {reasoning: 1360, proof: 1360, clarity: 1300}
  stem: |
    Prove by contradiction that there is no largest multiple of 7.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: assume, description: 'Assumes there is a largest multiple of 7, say N = 7k', points: 1, dimension: proof}
      - {id: bigger, description: Shows N + 7 = 7(k + 1) is a larger multiple of 7, points: 2, dimension: reasoning}
      - {id: contra, description: States the contradiction with N being the largest, points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose, for contradiction, that there is a largest multiple of 7, $N = 7k$. Then $N + 7 = 7(k + 1)$ is also a multiple of 7, and it is larger than $N$. This contradicts $N$ being the largest, so there is no largest multiple of 7.
- id: spec.geometry.proof-methods.assume-what
  skills: {primary: spec.geometry.proof-methods}
  rating: 1380
  responseSkills: {reading: 1370, reasoning: 1370, precision: 1350}
  stem: |
    To prove "if $n$ is odd, then $n^2$ is odd" by contradiction, what should you assume?
  parts:
  - id: a
    options:
    - {id: a, text: $n$ is even and $n^2$ is even.}
    - {id: b, text: $n$ is odd and $n^2$ is even.}
