    - { e1: '2x + 10', e2: '3x - 20', e3: 'x + 35', s: 3, rr: 135, x: 45, bv: 115, v: 65 }
    - { e1: '3x - 10', e2: '2x + 15', e3: 'x + 30', s: 4, rr: 160, x: 40, bv: 95, v: 85 }
    - { e1: 'x + 30', e2: '2x + 20', e3: '3x - 10', s: 4, rr: 160, x: 40, bv: 100, v: 80 }
    - { e1: '2x - 5', e2: 'x + 45', e3: '2x + 25', s: 4, rr: 160, x: 40, bv: 85, v: 95 }
  stem: |
    $ABCD$ is cyclic with $\angle DAB = ({{e1}})^\circ$, $\angle ABC = ({{e2}})^\circ$ and $\angle BCD = ({{e3}})^\circ$. Find $\angle CDA$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 300
    points: { A: [-1.879, -0.684], B: [0.347, -1.97], C: [1.879, -0.684], D: [1, 1.732], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: angle, at: A, from: B, to: D, label: '({{e1}})^\circ', radius: 12 }
      - { type: angle, at: B, from: C, to: A, label: '({{e2}})^\circ', radius: 14 }
      - { type: angle, at: C, from: D, to: B, label: '({{e3}})^\circ', radius: 12 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
  - id: a
    prompt: $\angle CDA$ (°)
    answer: {type: numeric, key: '{{v}}'}
  solution: |
    Opposite angles: $({{e1}}) + ({{e3}}) = 180$, so ${{s}}x = {{rr}}$ and $x = {{x}}$. Then $\angle ABC = {{bv}}^\circ$ and $\angle CDA = 180^\circ - {{bv}}^\circ = {{v}}^\circ$.
  verify: |
    def answers(e1, e2, e3, s, rr, x, bv, v):
        X = symbols("x")
        f = lambda e: sympify(e.replace("x", "*x").lstrip("*").replace("+ *", "+ ").replace("- *", "- ").replace("(*", "("))
        xv = solve(f(e1) + f(e3) - 180, X)[0]
        return {"a": 180 - f(e2).subs(X, xv)}

