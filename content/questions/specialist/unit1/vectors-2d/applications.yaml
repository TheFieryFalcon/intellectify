      answer: { type: vector, key: ['1', '4'] }
    - id: b
      prompt: Speed (km/h)
      answer: { type: numeric, key: '\sqrt{17}' }
  solution: |
    At 2 pm the ship is at $(6\mathbf{i} + 8\mathbf{j}) + 2(-2\mathbf{i}) = 2\mathbf{i} + 8\mathbf{j}$. The patrol boat covers that displacement in 2 hours, so its velocity is $\mathbf{i} + 4\mathbf{j}$ km/h, with speed $\sqrt{17} \approx 4.12$ km/h.
  verify: |
    def answers():
        meet = Matrix([6, 8]) + 2*Matrix([-2, 0])
        v = meet / 2
        return {"a": list(v), "b": v.norm()}

- id: spec.vectors-2d.applications.plane-due-north
