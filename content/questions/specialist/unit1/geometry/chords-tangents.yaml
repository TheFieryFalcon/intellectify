    - { p: 70, q: 62, a: 48, _A: '-1.286, 1.532', _B: '1.658, 1.118' }
  stem: |
    A tangent $XY$ touches a circle at $T$. Chords $TA$ and $TB$ make angles $\angle XTA = {{p}}^\circ$ and $\angle YTB = {{q}}^\circ$ with the tangent. Find $\angle ATB$, $\angle TAB$ and $\angle TBA$.

    ```diagram
    view: [-2.9, 2.9, -2.5, 2.5]
    width: 230
    points: { T: [-0, -2], A: [{{_A}}], B: [{{_B}}], X: [-2.8, -2], Y: [2.8, -2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: X, to: Y }
      - { type: segment, from: T, to: A }
      - { type: segment, from: T, to: B }
      - { type: segment, from: A, to: B }
      - { type: angle, at: T, from: A, to: X, label: '{{p}}^\circ', radius: 22 }
      - { type: angle, at: T, from: Y, to: B, label: '{{q}}^\circ', radius: 22 }
      - { type: point, at: T, label: 'T' }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: X, label: 'X' }
      - { type: point, at: Y, label: 'Y' }
    ```
  parts:
  - id: a
    prompt: $\angle ATB$ (°)
    answer: {type: numeric, key: '{{a}}'}
  - id: b
    prompt: $\angle TAB$ (°)
    answer: {type: numeric, key: '{{q}}'}
  - id: c
    prompt: $\angle TBA$ (°)
    answer: {type: numeric, key: '{{p}}'}
  solution: |
    Angles on the straight line $XY$: $\angle ATB = 180^\circ - {{p}}^\circ - {{q}}^\circ = {{a}}^\circ$. By the alternate segment theorem, $\angle TAB = \angle YTB = {{q}}^\circ$ and $\angle TBA = \angle XTA = {{p}}^\circ$.
