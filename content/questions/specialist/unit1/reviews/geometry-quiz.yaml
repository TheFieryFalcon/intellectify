- id: spec.geometry.sq.converse-of-four
  title: "Counterexample to \"Even Means a Multiple of 4\""
  pool: section-quiz
  skills: { primary: spec.geometry.logic }
  subsection: "Implication, converse and contrapositive"
  rating: 1300
  responseSkills: { reading: 1290, reasoning: 1280, calculation: 1250 }
  stem: |
    Consider the statement "If a whole number is a multiple of 4, then it is even." Its converse is false. What is the smallest positive counterexample to the converse?
  parts:
    - id: a
      answer: { type: numeric, key: 2 }
  solution: |
    The converse is "If a whole number is even, then it is a multiple of 4." A counterexample is even but not a multiple of 4. The smallest positive one is 2.
  verify: |
    def answers():
        return {"a": next(n for n in range(1, 100) if n % 2 == 0 and n % 4 != 0)}

