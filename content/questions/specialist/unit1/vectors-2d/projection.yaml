- id: spec.vectors-2d.projection.distance-to-line-origin
  skills: { primary: spec.vectors-2d.projection }
  rating: 1430
  responseSkills: { calculation: 1410, synthesis: 1400 }
  stem: |
    Find the exact shortest distance from the point $P(5, 5)$ to the line through the origin in the direction of $2\mathbf{i} + \mathbf{j}$.
  parts:
    - id: a
      answer: { type: numeric, key: '\sqrt{5}', form: [exact] }
  solution: |
    $\mathbf{p} = 5\mathbf{i} + 5\mathbf{j}$. Its vector projection onto $2\mathbf{i} + \mathbf{j}$ is $\tfrac{15}{5}(2\mathbf{i} + \mathbf{j}) = 6\mathbf{i} + 3\mathbf{j}$.
    The perpendicular part is $\mathbf{p} - (6\mathbf{i} + 3\mathbf{j}) = -\mathbf{i} + 2\mathbf{j}$, with length $\sqrt{5}$.
  verify: |
    def answers():
        p, b = Matrix([5, 5]), Matrix([2, 1])
        return {"a": (p - p.dot(b) / b.dot(b) * b).norm()}

- id: spec.vectors-2d.projection.ramp-force
  skills: { primary: spec.vectors-2d.projection }
  rating: 1460
  responseSkills: { calculation: 1440, reading: 1430 }
  stem: |
    A force $\mathbf{F} = 10\mathbf{i} + 5\mathbf{j}$ N acts on a box on a ramp. The ramp slopes upward in the direction $4\mathbf{i} + 3\mathbf{j}$. Find:
  parts:
    - id: a
      prompt: the part of $\mathbf{F}$ acting along the ramp (N)
      answer: { type: numeric, key: 11 }
    - id: b
      prompt: the magnitude of the part of $\mathbf{F}$ at right angles to the ramp (N)
      answer: { type: numeric, key: 2 }
  solution: |
    Along the ramp: the scalar projection, $\dfrac{40 + 15}{5} = 11$ N.
    The two parts are at right angles and combine to $\mathbf{F}$, so by Pythagoras the other part has magnitude $\sqrt{|\mathbf{F}|^2 - 11^2} = \sqrt{125 - 121} = 2$ N.
  verify: |
    def answers():
        F, d = Matrix([10, 5]), Matrix([4, 3])
        s = F.dot(d) / d.norm()
        return {"a": s, "b": (F - F.dot(d) / d.dot(d) * d).norm()}

- id: spec.vectors-2d.projection.foot-of-perpendicular
  skills: { primary: spec.vectors-2d.projection }
  rating: 1490
  responseSkills: { calculation: 1460, synthesis: 1460 }
  stem: |
    A line passes through $A(1, 1)$ in the direction $\mathbf{i} + \mathbf{j}$. Find the position vector of the point $F$ on the line closest to $P(4, 7)$.
  parts:
    - id: a
      answer: { type: vector, key: ['5.5', '5.5'] }
  solution: |
    $\overrightarrow{AP} = 3\mathbf{i} + 6\mathbf{j}$. Its vector projection onto $\mathbf{i} + \mathbf{j}$ is $\tfrac{9}{2}(\mathbf{i} + \mathbf{j})$, which is $\overrightarrow{AF}$.
    So $\overrightarrow{OF} = (\mathbf{i} + \mathbf{j}) + 4.5\mathbf{i} + 4.5\mathbf{j} = 5.5\mathbf{i} + 5.5\mathbf{j}$.
  verify: |
    def answers():
        A, P, d = Matrix([1, 1]), Matrix([4, 7]), Matrix([1, 1])
        F = A + (P - A).dot(d) / d.dot(d) * d
        assert (P - F).dot(d) == 0
        return {"a": list(F)}

- id: spec.vectors-2d.projection.distance-to-line-two-points
  skills: { primary: spec.vectors-2d.projection }
  rating: 1520
  responseSkills: { calculation: 1490, synthesis: 1490 }
  stem: |
    Find the shortest distance from $P(2, 6)$ to the line through $A(0, 1)$ and $B(4, 4)$.
  parts:
    - id: a
      answer: { type: numeric, key: 2.8 }
  solution: |
    $\overrightarrow{AB} = 4\mathbf{i} + 3\mathbf{j}$ and $\overrightarrow{AP} = 2\mathbf{i} + 5\mathbf{j}$. The scalar projection of $\overrightarrow{AP}$ onto $\overrightarrow{AB}$ is $\tfrac{8 + 15}{5} = \tfrac{23}{5}$.
    By Pythagoras, the distance is $\sqrt{|\overrightarrow{AP}|^2 - \left(\tfrac{23}{5}\right)^2} = \sqrt{29 - \tfrac{529}{25}} = \sqrt{\tfrac{196}{25}} = \tfrac{14}{5} = 2.8$.
  verify: |
    def answers():
        A, B, P = Matrix([0, 1]), Matrix([4, 4]), Matrix([2, 6])
        d, ap = B - A, P - A
        return {"a": (ap - ap.dot(d) / d.dot(d) * d).norm()}

