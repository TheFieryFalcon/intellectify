- id: spec.u1.quiz.negate-exists
  title: "Negating \"There Is an Even Prime over 100\""
  pool: unit-quiz
  skills: { primary: spec.geometry.logic }
  subsection: "Negation"
  rating: 1470
  responseSkills: { reading: 1460, precision: 1450 }
  stem: |
    Which is the negation of "There is a prime number greater than 100 that is even"?
  parts:
    - id: a
      options:
        - { id: a, text: 'Every prime number greater than 100 is odd.' }
        - { id: b, text: 'There is a prime number greater than 100 that is odd.' }
        - { id: c, text: 'Every prime number is even.' }
        - { id: d, text: 'No prime number is greater than 100.' }
      answer: { type: mcq, key: a }
  solution: |
    Negating "there is an $x$ with $P$" gives "every $x$ has not $P$": every prime greater than 100 is not even, i.e. is odd. That is (a).
  verify: |
    def answers():
        return {'a': 'a'}

- id: spec.u1.quiz.midpoint-vector
  title: "Point Dividing a Segment in a Ratio (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.vectors-2d.geometric }
  subsection: "Points dividing a line"
  rating: 1480
  responseSkills: { reading: 1460, calculation: 1460, reasoning: 1470 }
  stem: |
    $\overrightarrow{OA} = \mathbf{a}$ and $\overrightarrow{OB} = \mathbf{b}$. $P$ divides $AB$ so that $AP : PB = 1 : 3$. Which vector is $\overrightarrow{OP}$?
  parts:
    - id: a
      options:
        - { id: a, text: '$\tfrac{1}{4}\mathbf{a} + \tfrac{3}{4}\mathbf{b}$' }
        - { id: b, text: '$\tfrac{1}{3}\mathbf{a} + \tfrac{2}{3}\mathbf{b}$' }
        - { id: c, text: '$\tfrac{3}{4}\mathbf{a} + \tfrac{1}{4}\mathbf{b}$' }
        - { id: d, text: '$\tfrac{1}{2}(\mathbf{a} + \mathbf{b})$' }
      answer: { type: mcq, key: c }
  solution: |
    $\overrightarrow{OP} = \mathbf{a} + \tfrac{1}{4}(\mathbf{b} - \mathbf{a}) = \tfrac{3}{4}\mathbf{a} + \tfrac{1}{4}\mathbf{b}$.
  verify: |
    def answers():
        return {'a': 'c'}

- id: spec.u1.quiz.pascal-sum-row
  title: "Sum of a Row of Pascal's Triangle (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.combinatorics.pascal }
  subsection: "Row sums"
  rating: 1490
  responseSkills: { reasoning: 1480, calculation: 1470 }
  stem: |
    Find $\binom{8}{0} + \binom{8}{1} + \binom{8}{2} + \cdots + \binom{8}{8}$.
  parts:
    - id: a
      answer: { type: numeric, key: 256 }
  solution: |
    Both sides of the row-sum identity count the subsets of 8 objects: $2^8 = 256$.
  verify: |
    def answers():
        return {'a': sum(sympy.binomial(8, k) for k in range(9))}

- id: spec.u1.quiz.odd-times-odd-proof
  title: "Odd Times Odd Is Odd"
  pool: unit-quiz
  skills: { primary: spec.geometry.proof-methods }
  subsection: "Direct proof"
  rating: 1440
  responseSkills: { reasoning: 1430, proof: 1430, clarity: 1380 }
  stem: |
    Prove that the product of any two odd integers is odd.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: write, description: "Writes two general odd integers algebraically (e.g. 2a + 1 and 2b + 1 for integers a, b)", points: 1, dimension: proof }
          - { id: expand, description: "Shows the product has the form of an odd number (e.g. (2a + 1)(2b + 1) = 2(2ab + a + b) + 1)", points: 2, dimension: reasoning }
          - { id: conclude, description: "Concludes the product is odd (e.g. one more than an even number)", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let the integers be $2a + 1$ and $2b + 1$. Their product is $4ab + 2a + 2b + 1 = 2(2ab + a + b) + 1$, which is one more than an even number, so it is odd.

- id: spec.u1.quiz.relative-velocity
  title: "Speed of One Car Relative to Another (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.vectors-2d.applications }
  subsection: "Relative velocity"
  rating: 1510
  responseSkills: { reading: 1490, calculation: 1490 }
  stem: |
    Car $A$ has velocity $20\mathbf{i}$ m/s and car $B$ has velocity $15\mathbf{j}$ m/s. Find the speed of $B$ relative to $A$.
  parts:
    - id: a
      answer: { type: numeric, key: 25 }
  solution: |
    $\mathbf{v}_B - \mathbf{v}_A = -20\mathbf{i} + 15\mathbf{j}$, with length $\sqrt{400 + 225} = 25$ m/s.
  verify: |
    def answers():
        return {'a': sympy.sqrt(20**2 + 15**2)}

- id: spec.u1.quiz.angle-center-tangent
  title: "Two Tangents and the Angle at the Center (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Tangents from a point"
  rating: 1520
  responseSkills: { reading: 1500, reasoning: 1510, calculation: 1490 }
  stem: |
    Tangents from $P$ touch a circle with center $O$ at $A$ and $B$, and $\angle AOB = 112^\circ$. Find $\angle APB$, in degrees.
  parts:
    - id: a
      answer: { type: numeric, key: 68 }
  solution: |
    $\angle OAP = \angle OBP = 90^\circ$ (tangent ⟂ radius), and the angles of quadrilateral $OAPB$ add to $360^\circ$: $\angle APB = 360^\circ - 180^\circ - 112^\circ = 68^\circ$.
  verify: |
    def answers():
        return {'a': 360 - 90 - 90 - 112}

- id: spec.u1.quiz.ie-not-div
  title: "Integers Divisible by Neither 4 nor 6"
  pool: unit-quiz
  skills: { primary: spec.combinatorics.inclusion-exclusion }
  subsection: "Divisibility"
  rating: 1530
  responseSkills: { reading: 1510, calculation: 1510, reasoning: 1520 }
  stem: |
    How many integers from 1 to 300 are divisible by neither 4 nor 6?
  parts:
    - id: a
      answer: { type: numeric, key: 200 }
  solution: |
    Divisible by 4: 75. By 6: 50. By both, i.e. by 12: 25. By 4 or 6: $75 + 50 - 25 = 100$. Neither: $300 - 100 = 200$.
  verify: |
    def answers():
        return {'a': sum(1 for n in range(1, 301) if n % 4 and n % 6)}

- id: spec.u1.quiz.circle-chords-cross
  title: "Angle from Crossing Chords (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.circle-angles] }
  subsection: "Finding and proving angles"
  rating: 1570
  responseSkills: { reading: 1550, reasoning: 1560, calculation: 1540, synthesis: 1550 }
  stem: |
    Chords $AC$ and $BD$ of a circle meet at $X$. $\angle ABD = 32^\circ$ and $\angle BXC = 70^\circ$. Find $\angle BAC$, in degrees.
  parts:
    - id: a
      answer: { type: numeric, key: 38 }
  solution: |
    $A$, $X$, $C$ lie on a line, so $\angle BXC$ is an exterior angle of triangle $ABX$, so $\angle BAX + \angle ABX = 70^\circ$, giving $\angle BAC = 70^\circ - 32^\circ = 38^\circ$.
  verify: |
    def answers():
        return {'a': 70 - 32}

- id: spec.u1.quiz.sum-of-digits-arrangements
  title: "Even Four-Digit Numbers from Six Digits"
  pool: unit-quiz
  skills: { primary: spec.combinatorics.permutations }
  subsection: "Arranging different objects"
  rating: 1600
  responseSkills: { calculation: 1580, reasoning: 1590 }
  stem: |
    How many even 4-digit numbers can be made from the digits 1, 2, 3, 4, 5, 6, each used at most once?
  parts:
    - id: a
      answer: { type: numeric, key: 180 }
  solution: |
    The last digit is even: 3 choices. The other three places take 3 of the remaining 5 digits in order: $5 \times 4 \times 3 = 60$. Total $3 \times 60 = 180$.
  verify: |
    from itertools import permutations
    def answers():
        return {'a': sum(1 for p in permutations('123456', 4) if int(p[-1]) % 2 == 0)}

- id: spec.u1.quiz.vector-proof-parallelogram
  title: "Opposite Sides of a Parallelogram by Vectors"
  pool: unit-quiz
  skills: { primary: spec.vectors-2d.proofs }
  subsection: "Parallelograms and rhombuses"
  rating: 1640
  responseSkills: { reasoning: 1630, proof: 1630, clarity: 1580 }
  stem: |
    $ABCD$ is a quadrilateral with $\overrightarrow{AB} = \overrightarrow{DC}$. Use vectors to prove that $\overrightarrow{AD} = \overrightarrow{BC}$.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: route, description: "Links AD to BC through the other sides (e.g. AD = AB + BC + CD, or another route around the quadrilateral)", points: 1, dimension: proof }
          - { id: cancel, description: "Uses AB = DC to cancel the extra sides (e.g. CD = −DC = −AB, so AB + CD = 0)", points: 2, dimension: reasoning }
          - { id: conclude, description: "So AD = BC", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Going around the quadrilateral, $\overrightarrow{AD} = \overrightarrow{AB} + \overrightarrow{BC} + \overrightarrow{CD}$. Since $\overrightarrow{CD} = -\overrightarrow{DC} = -\overrightarrow{AB}$, the first and last terms cancel, leaving $\overrightarrow{AD} = \overrightarrow{BC}$.

- id: spec.u1.quiz.projection-length-k
  title: "Finding k from a Scalar Projection (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.vectors-2d.projection }
  subsection: "Scalar projection"
  rating: 1650
  responseSkills: { calculation: 1630, reasoning: 1640 }
  stem: |
    The scalar projection of $k\mathbf{i} + 2\mathbf{j}$ onto $3\mathbf{i} + 4\mathbf{j}$ is 5. Find $k$.
  parts:
    - id: a
      answer: { type: numeric, key: '\frac{17}{3}', form: [exact] }
  solution: |
    $\dfrac{3k + 8}{5} = 5$, so $3k = 17$ and $k = \tfrac{17}{3}$.
  verify: |
    def answers():
        k = sympy.symbols('k')
        return {'a': sympy.solve(sympy.Eq((3 * k + 8) / 5, 5), k)[0]}

- id: spec.u1.quiz.tangent-secant-solve
  title: "Secant Length from a Tangent"
  pool: unit-quiz
  skills: { primary: spec.geometry.chord-secant-lengths }
  subsection: "Tangent and secant"
  rating: 1660
  responseSkills: { calculation: 1640, reasoning: 1650 }
  stem: |
    From $M$, a tangent touches a circle at $T$ with $MT = 12$, and a secant cuts the circle at $A$ and $B$ with $AB = 10$ and $A$ between $M$ and $B$. Find $MA$.
  parts:
    - id: a
      answer: { type: numeric, key: 8 }
  solution: |
    $MT^2 = MA \times MB$: $144 = x(x + 10)$, so $x^2 + 10x - 144 = 0$, $(x + 18)(x - 8) = 0$, and $MA = 8$.
  verify: |
    def answers():
        x = sympy.symbols('x', positive=True)
        return {'a': sympy.solve(sympy.Eq(x * (x + 10), 144), x)[0]}

- id: spec.u1.quiz.grid-paths
  title: "Grid Paths Through a Given Point"
  pool: unit-quiz
  skills: { primary: spec.combinatorics.combinations }
  subsection: "Paths on a grid"
  rating: 1680
  responseSkills: { reading: 1660, calculation: 1660, reasoning: 1670 }
  stem: |
    A path on a grid moves only right or up, one unit at a time, from $(0, 0)$ to $(5, 4)$. How many such paths pass through $(2, 2)$?
  parts:
    - id: a
      answer: { type: numeric, key: 60 }
  solution: |
    To $(2, 2)$: 4 moves, 2 of them right: $\binom{4}{2} = 6$. From $(2, 2)$ to $(5, 4)$: 5 moves, 3 right: $\binom{5}{2} = 10$. Total $6 \times 10 = 60$.
  verify: |
    def answers():
        return {'a': sympy.binomial(4, 2) * sympy.binomial(5, 2)}
