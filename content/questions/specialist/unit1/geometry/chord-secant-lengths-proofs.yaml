- id: spec.geometry.chord-secant-lengths.concyclic-by-power
  skills: { primary: spec.geometry.chord-secant-lengths, secondary: [spec.geometry.circle-problems] }
  rating: 1800
  responseSkills: { reasoning: 1790, proof: 1790, clarity: 1750, synthesis: 1780 }
  stem: |
    Two circles meet at $P$ and $Q$. $M$ is a point on line $PQ$ outside both circles. A line through $M$ cuts the first circle at $A$ and $B$, and another line through $M$ cuts the second circle at $C$ and $D$ (the two lines are different). Prove that $A$, $B$, $C$, $D$ lie on one circle.

    ```diagram
    view: [-2.5, 2.8, -2, 3]
    width: 270
    points: { P1: [-0.9, 0], P2: [1, 0], P: [-0.108, 1.154], Q: [-0.108, -1.154], M: [-0.108, 2.6], A: [-0.771, 1.394], B: [-2.008, -0.855], C: [0.299, 1.438], D: [1.349, -1.562] }
    draw:
      - { type: circle, center: P1, radius: 1.4 }
      - { type: circle, center: P2, radius: 1.6 }
      - { type: segment, from: M, to: Q, dashed: true }
      - { type: segment, from: M, to: B }
      - { type: segment, from: M, to: D }
      - { type: point, at: M, label: 'M', pos: n }
      - { type: point, at: P, label: 'P', pos: e }
      - { type: point, at: Q, label: 'Q', pos: s }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: w }
      - { type: point, at: C, label: 'C', pos: e }
      - { type: point, at: D, label: 'D', pos: e }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'first', description: "In the first circle, MA × MB = MP × MQ (two secants from M)", points: 1, dimension: reasoning }
          - { id: 'second', description: "In the second circle, MC × MD = MP × MQ", points: 1, dimension: reasoning }
          - { id: 'equal', description: "So MA × MB = MC × MD", points: 1, dimension: reasoning }
          - { id: 'converse', description: "The circle through A, B, C meets line MC again at D' with MC × MD' = MA × MB, so MD' = MD and D' = D (same side of M): A, B, C, D concyclic", points: 2, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    From $M$, the first circle has secants $MAB$ and $MPQ$, so $MA \times MB = MP \times MQ$. The second circle has secants $MCD$ and $MPQ$, so $MC \times MD = MP \times MQ$. Hence $MA \times MB = MC \times MD$.

    Now take the circle through $A$, $B$, $C$. Line $MC$ meets it again at a point $D'$, with $MC \times MD' = MA \times MB = MC \times MD$ by the two-secants theorem. So $MD' = MD$, and since $D'$ and $D$ lie on the same ray from $M$, $D' = D$. Hence $A$, $B$, $C$, $D$ lie on one circle.
