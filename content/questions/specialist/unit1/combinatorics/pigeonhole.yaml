- id: spec.combinatorics.pigeonhole.round-robin-wins
  skills: { primary: spec.combinatorics.pigeonhole }
  subsection: "Points, handshakes and colorings"
  rating: 1620
  responseSkills: { reading: 1610, reasoning: 1610 }
  words: { sport: sport }
  stem: |
    In a {{sport}} round robin, each of 6 teams plays every other team once, and there are no draws. Must two teams finish with the same number of wins?
  parts:
    - id: a
      options:
        - { id: a, text: 'Yes, always' }
        - { id: b, text: 'No, not necessarily' }
      answer: { type: mcq, key: b }
  solution: |
    No. Each team has between 0 and 5 wins, which is 6 possible totals for 6 teams, so the pigeonhole principle doesn't force a repeat. It can happen: rank the teams 1 to 6 and let the higher-ranked team win every game. Then the teams win 5, 4, 3, 2, 1 and 0 games.
  verify: |
    from itertools import combinations
    def answers():
        wins = [0] * 6
        for i, j in combinations(range(6), 2):
            wins[min(i, j)] += 1
        return {"a": "b" if len(set(wins)) == 6 else "a"}

- id: spec.combinatorics.pigeonhole.party-handshakes
  skills: { primary: spec.combinatorics.pigeonhole }
  subsection: "Points, handshakes and colorings"
  rating: 1560
  responseSkills: { reasoning: 1550, proof: 1550, clarity: 1510 }
  words: { who: person }
  stem: |
    At {{who}}'s party, some pairs of guests shake hands (each pair at most once, and nobody shakes their own hand). There are at least 2 guests. Prove that two guests shook the same number of hands.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'range', description: "With n guests, each shakes between 0 and n − 1 hands", points: 1, dimension: reasoning }
          - { id: 'not-both', description: "Explains why 0 and n − 1 can't both occur", points: 2, dimension: proof }
          - { id: 'php', description: "So n guests share at most n − 1 values, and two guests have the same count", points: 1, dimension: reasoning }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Say there are $n$ guests. Each shakes between $0$ and $n - 1$ hands. If someone shook $n - 1$ hands, they shook everyone's, so nobody shook $0$. So $0$ and $n - 1$ can't both occur, and the $n$ counts take at most $n - 1$ different values. By the pigeonhole principle, two guests have the same count.

- id: spec.combinatorics.pigeonhole.snack-streak
  skills: { primary: spec.combinatorics.pigeonhole }
  subsection: "Number problems"
  rating: 1770
  responseSkills: { reasoning: 1760, proof: 1760, synthesis: 1740, clarity: 1720 }
  words: { who: person, f: snack }
  stem: |
    Over 30 days, {{who}} eats at least one {{f}} every day and 45 {{f.plural}} in total. Prove that there is a run of consecutive days on which {{who}} eats exactly 14 {{f.plural}}.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'sums', description: "Uses running totals s₁ < s₂ < … < s₃₀ = 45 (total eaten by the end of each day)", points: 1, dimension: synthesis }
          - { id: 'shift', description: "Considers the 60 numbers s₁, …, s₃₀ and s₁ + 14, …, s₃₀ + 14, all from 1 to 59", points: 2, dimension: reasoning }
          - { id: 'php', description: "Pigeonhole: two are equal, necessarily some s_j = s_i + 14", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "So days i + 1 to j contain exactly 14", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $s_k$ be the number eaten by the end of day $k$. Since at least one is eaten each day, $1 \le s_1 < s_2 < \dots < s_{30} = 45$. The numbers $s_1 + 14, \dots, s_{30} + 14$ are also all different, and lie between 15 and 59. So the 60 numbers $s_1, \dots, s_{30}, s_1 + 14, \dots, s_{30} + 14$ all lie between 1 and 59. By the pigeonhole principle two are equal. Two from the same list can't be, so $s_j = s_i + 14$ for some $i < j$. Then on days $i + 1$ to $j$, exactly 14 were eaten.
