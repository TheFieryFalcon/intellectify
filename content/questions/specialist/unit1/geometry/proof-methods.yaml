    - {id: d, text: $n^2$ is odd.}
    answer: {type: mcq, key: b}
  solution: |
    Contradiction for $P \Rightarrow Q$ assumes $P$ and not $Q$: $n$ is odd but $n^2$ is not odd.
- id: spec.geometry.proof-methods.even-sum-impossible
  skills: {primary: spec.geometry.proof-methods}
  rating: 1410
  responseSkills: {reasoning: 1400, proof: 1400, clarity: 1350}
  stem: |
    Prove that there are no integers $x$ and $y$ with $4x + 6y = 1$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: assume, description: 'Assumes, for contradiction, that such integers exist', points: 1, dimension: proof}
      - {id: even, description: Shows 4x + 6y = 2(2x + 3y) is even, points: 2, dimension: reasoning}
      - {id: contra, description: '1 is odd, so this is a contradiction', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose integers $x$, $y$ satisfy $4x + 6y = 1$. The left side is $2(2x + 3y)$, which is even, but 1 is odd. This is impossible, so no such integers exist.
- id: spec.geometry.proof-methods.contrapositive-odd
  skills: {primary: spec.geometry.proof-methods}
  rating: 1420
  responseSkills: {reasoning: 1410, proof: 1410, clarity: 1360}
  stem: |
    Let $n$ be an integer. Prove that if $5n + 3$ is even, then $n$ is odd.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: contra, description: 'Uses the contrapositive (if n is even, then 5n + 3 is odd) or contradiction', points: 1, dimension: proof}
      - {id: sub, description: Writes n = 2k and 5n + 3 = 10k + 3 = 2(5k + 1) + 1, points: 2, dimension: reasoning}
      - {id: conclude, description: 'Concludes 5n + 3 is odd, which proves the original statement', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Prove the contrapositive: if $n$ is even, then $5n + 3$ is odd. If $n = 2k$, then $5n + 3 = 10k + 3 = 2(5k + 1) + 1$, which is odd. So the original statement is true.
- id: spec.geometry.proof-methods.two-obtuse
  skills: {primary: spec.geometry.proof-methods}
  rating: 1440
  responseSkills: {reasoning: 1430, proof: 1430, clarity: 1370}
  stem: |
    An obtuse angle is bigger than $90^\circ$. Prove that a triangle cannot have two obtuse angles.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: assume, description: Assumes a triangle has two obtuse angles, points: 1, dimension: proof}
      - {id: sum, description: Two obtuse angles add to more than 180°, points: 2, dimension: reasoning}
      - {id: contra, description: 'Contradicts the angle sum of a triangle (180°, with the third angle positive)', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose a triangle has two obtuse angles. Each is more than $90^\circ$, so together they are more than $180^\circ$. With the third angle (which is positive), the total exceeds $180^\circ$. But the angles of a triangle add to exactly $180^\circ$, a contradiction.
- id: spec.geometry.proof-methods.assume-negation
  skills: {primary: spec.geometry.proof-methods}
  rating: 1400
  responseSkills: {reading: 1400, reasoning: 1390, precision: 1380}
  stem: |
    To prove "$\sqrt{x + 1} \ne \sqrt{x} + 1$ for every $x > 0$" by contradiction, what do you assume?
  parts:
  - id: a
    options:
    - {id: a, text: '$\sqrt{x + 1} = \sqrt{x} + 1$ for every $x > 0$.'}
    - {id: b, text: '$\sqrt{x + 1} = \sqrt{x} + 1$ for some $x > 0$.'}
    - {id: c, text: '$\sqrt{x + 1} \ne \sqrt{x} + 1$ for some $x > 0$.'}
    - {id: d, text: $x \le 0$.}
    answer: {type: mcq, key: b}
  solution: |
    The negation of "for every $x > 0$, A" is "for some $x > 0$, not A". So assume equality holds for at least one $x > 0$. (Squaring then gives $x + 1 = x + 2\sqrt{x} + 1$, so $\sqrt{x} = 0$, contradicting $x > 0$.)
- id: spec.geometry.proof-methods.different-primes
  skills: {primary: spec.geometry.proof-methods}
  rating: 1460
  responseSkills: {reading: 1440, calculation: 1430, reasoning: 1450}
  stem: |
    Claim: "Every even number greater than 4 is the sum of two **different** primes." What is the smallest counterexample?
  parts:
  - id: a
    answer: {type: numeric, key: '6'}
  solution: |
    $6 = 3 + 3$ is the only way to write 6 as a sum of two primes (1 isn't prime), and the two primes aren't different. So 6 is the smallest counterexample. ($8 = 3 + 5$, $10 = 3 + 7$.)
  verify: |
    def answers():
        ps = [p for p in range(2, 200) if isprime(p)]
        return {"a": next(n for n in range(6, 200, 2) if not any(n - p in ps and n - p != p for p in ps if p < n))}
- id: spec.geometry.proof-methods.no-smallest-positive
  skills: {primary: spec.geometry.proof-methods}
  rating: 1450
  responseSkills: {reasoning: 1440, proof: 1440, clarity: 1380}
  stem: |
    Prove by contradiction that there is no smallest positive real number.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: assume, description: Assumes a smallest positive real number r exists, points: 1, dimension: proof}
      - {id: half, description: 'Considers r/2, which is positive and smaller than r', points: 2, dimension: reasoning}
      - {id: contra, description: States the contradiction, points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose $r$ is the smallest positive real number. Then $\tfrac{r}{2}$ is a real number with $0 < \tfrac{r}{2} < r$, so it is positive and smaller than $r$. This contradicts $r$ being the smallest, so there is no smallest positive real number.
- id: spec.geometry.proof-methods.sum-at-least-20
  skills: {primary: spec.geometry.proof-methods}
  rating: 1430
  responseSkills: {reasoning: 1420, proof: 1420, clarity: 1360}
  stem: |
    Prove that if $a + b \ge 20$, then $a \ge 10$ or $b \ge 10$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: contra, description: 'Uses the contrapositive or contradiction: suppose a < 10 and b < 10', points: 2, dimension: proof}
      - {id: add, description: Adds to get a + b < 20, points: 1, dimension: reasoning}
      - {id: conclude, description: Concludes correctly, points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Contrapositive: if $a < 10$ and $b < 10$, then $a + b < 20$, which is clear by adding the inequalities. So if $a + b \ge 20$, then $a \ge 10$ or $b \ge 10$. (Note the negation of "$a \ge 10$ or $b \ge 10$" is "$a < 10$ and $b < 10$".)
- id: spec.geometry.proof-methods.factorial-vs-power
  skills: {primary: spec.geometry.proof-methods}
  rating: 1500
  responseSkills: {calculation: 1480, reasoning: 1490, synthesis: 1450}
  requiresCalculator: true
  stem: |
    Claim: "$n! < 10^n$ for every positive integer $n$." What is the smallest counterexample?
  parts:
  - id: a
    answer: {type: numeric, key: '25'}
  solution: |
    Each step multiplies $n!$ by $n + 1$ but $10^n$ by only 10, so once $n$ passes 10, $n!$ catches up. Checking: $24! \approx 6.2 \times 10^{23} < 10^{24}$, but $25! \approx 1.55 \times 10^{25} > 10^{25}$. So $n = 25$.
  verify: |
    def answers():
        return {"a": next(n for n in range(1, 100) if not factorial(n) < 10**n)}
- id: spec.geometry.proof-methods.square-multiple-of-3
  skills: {primary: spec.geometry.proof-methods}
  rating: 1480
  responseSkills: {reasoning: 1470, proof: 1470, clarity: 1400}
  stem: |
    Prove that for any integer $n$, if $n^2$ is a multiple of 3, then $n$ is a multiple of 3.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: contra, description: 'Uses the contrapositive: if n is not a multiple of 3, then n² is not', points: 1, dimension: proof}
      - {id: cases, description: Writes n = 3k + 1 or n = 3k + 2 (or 3k − 1), points: 1, dimension: reasoning}
      - {id: square, description: Squares each case to show remainder 1 on division by 3, points: 2, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Prove the contrapositive. If $n$ isn't a multiple of 3, then $n = 3k + 1$ or $n = 3k + 2$.
    - $(3k + 1)^2 = 9k^2 + 6k + 1 = 3(3k^2 + 2k) + 1$.
    - $(3k + 2)^2 = 9k^2 + 12k + 4 = 3(3k^2 + 4k + 1) + 1$.

    Either way $n^2$ leaves remainder 1, so it isn't a multiple of 3.
- id: spec.geometry.proof-methods.three-squares
  skills: {primary: spec.geometry.proof-methods}
  rating: 1450
  responseSkills: {reading: 1420, calculation: 1430, reasoning: 1440}
  stem: |
    Claim: "Every positive whole number is a sum of at most three perfect squares" (squares of whole numbers, which may repeat). What is the smallest counterexample?
  parts:
  - id: a
    answer: {type: numeric, key: '7'}
  solution: |
    $1 = 1$, $2 = 1 + 1$, $3 = 1 + 1 + 1$, $4 = 4$, $5 = 4 + 1$, $6 = 4 + 1 + 1$. For 7 the available squares are 1 and 4: $4 + 1 + 1 = 6$ and $4 + 4 = 8$, and three 1s make only 3. So 7 needs four squares ($4 + 1 + 1 + 1$).
  verify: |
    def answers():
        sq = [k*k for k in range(40)]
        ok = lambda n: any(n - a - b in sq for a in sq for b in sq if a + b <= n)
        return {"a": next(n for n in range(1, 500) if not ok(n))}
- id: spec.geometry.proof-methods.difference-of-squares-2
  skills: {primary: spec.geometry.proof-methods}
  rating: 1560
  responseSkills: {reasoning: 1550, proof: 1550, clarity: 1450, synthesis: 1520}
  stem: |
    Prove that there are no positive integers $x$ and $y$ with $x^2 - y^2 = 2$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: factor, description: 'Factorizes: (x − y)(x + y) = 2', points: 1, dimension: reasoning}
      - {id: parity, description: Shows x − y and x + y have the same parity (they differ by 2y), points: 2, dimension: synthesis}
      - {id: contra, description: 'Same parity: both odd gives an odd product, both even gives a multiple of 4; neither is 2', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Suppose $x^2 - y^2 = 2$, so $(x - y)(x + y) = 2$. The factors differ by $2y$, an even number, so they are both even or both odd. If both are odd, the product is odd; if both are even, it is a multiple of 4. Neither can equal 2, a contradiction.
- id: spec.geometry.proof-methods.n-squared-plus-1-by-3
  skills: {primary: spec.geometry.proof-methods}
  rating: 1580
  responseSkills: {reasoning: 1570, proof: 1570, clarity: 1480}
  stem: |
    Prove that $n^2 + 1$ is never a multiple of 3, for any integer $n$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: cases, description: 'Splits into n = 3k, 3k + 1, 3k + 2 (or similar)', points: 1, dimension: proof}
      - {id: remainders, description: Shows n² leaves remainder 0 or 1 on division by 3, points: 2, dimension: reasoning}
      - {id: conclude, description: 'So n² + 1 leaves remainder 1 or 2, never 0', points: 1, dimension: reasoning}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Every integer is $3k$, $3k + 1$ or $3k + 2$. Their squares are $9k^2$, $3(3k^2 + 2k) + 1$ and $3(3k^2 + 4k + 1) + 1$, which leave remainder 0, 1 and 1. So $n^2 + 1$ leaves remainder 1 or 2 and is never a multiple of 3.
- id: spec.geometry.proof-methods.mersenne
  skills: {primary: spec.geometry.proof-methods}
  rating: 1560
  responseSkills: {reading: 1520, calculation: 1540, reasoning: 1550}
  requiresCalculator: true
  stem: |
    Claim: "For every prime $p$, $2^p - 1$ is prime." What is the smallest prime $p$ that disproves it?
  parts:
  - id: a
    answer: {type: numeric, key: '11'}
  solution: |
    $2^2 - 1 = 3$, $2^3 - 1 = 7$, $2^5 - 1 = 31$ and $2^7 - 1 = 127$ are prime. But $2^{11} - 1 = 2047 = 23 \times 89$. So $p = 11$.
  verify: |
    def answers():
        return {"a": next(p for p in range(2, 100) if isprime(p) and not isprime(2**p - 1))}
- id: spec.geometry.proof-methods.divides-product
  skills: {primary: spec.geometry.proof-methods}
  rating: 1600
  responseSkills: {reading: 1590, reasoning: 1590, synthesis: 1550}
  stem: |
    Which choice of positive integers is a counterexample to "if $a$ divides $bc$, then $a$ divides $b$ or $a$ divides $c$"?
  parts:
  - id: a
    options:
    - {id: a, text: '$a = 3,\ b = 6,\ c = 5$'}
    - {id: b, text: '$a = 6,\ b = 2,\ c = 3$'}
    - {id: c, text: '$a = 5,\ b = 2,\ c = 3$'}
    - {id: d, text: '$a = 7,\ b = 7,\ c = 7$'}
    answer: {type: mcq, key: b}
  solution: |
    With $a = 6$, $b = 2$, $c = 3$: 6 divides $bc = 6$, but 6 divides neither 2 nor 3. (a) and (d) have the conclusion true; in (c), 5 doesn't divide 6, so the hypothesis fails.
  verify: |
    def answers():
        opts = {"a": (3, 6, 5), "b": (6, 2, 3), "c": (5, 2, 3), "d": (7, 7, 7)}
        good = [k for k, (a, b, c) in opts.items() if (b*c) % a == 0 and b % a != 0 and c % a != 0]
        return {"a": good[0]}
- id: spec.geometry.proof-methods.odd-coefficients
  skills: {primary: spec.geometry.proof-methods}
  rating: 1650
  responseSkills: {reasoning: 1640, proof: 1640, clarity: 1520, synthesis: 1600}
  stem: |
    $a$, $b$ and $c$ are odd integers. Prove that $ax^2 + bx + c = 0$ has no integer solution.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: assume, description: Assumes an integer solution x exists, points: 1, dimension: proof}
      - {id: even, description: 'If x is even, ax² and bx are even, so the left side is odd (c is odd)', points: 2, dimension: reasoning}
      - {id: odd, description: 'If x is odd, ax², bx and c are all odd, so the sum of three odds is odd', points: 2, dimension: reasoning}
      - {id: contra, description: 'An odd number can''t be 0: contradiction', points: 1, dimension: proof}
  solution: |
    Suppose an integer $x$ satisfies the equation.
    - If $x$ is even, $ax^2$ and $bx$ are even and $c$ is odd, so the left side is odd.
    - If $x$ is odd, $ax^2$, $bx$ and $c$ are all odd, and three odd numbers add to an odd number.

    Either way the left side is odd, so it can't equal 0. This contradiction shows there is no integer solution.
