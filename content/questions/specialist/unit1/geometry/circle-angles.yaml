    - { e1: 'x + 30', e2: '4x - 30', s: 5, r: 180, v: 36 }
  stem: |
    $ABCD$ is a cyclic quadrilateral with $\angle DAB = ({{e1}})^\circ$ and $\angle BCD = ({{e2}})^\circ$. Find $x$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.879, -0.684], B: [1, -1.732], C: [1.732, 1], D: [-0.684, 1.879], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: polygon, points: [A, B, C, D] }
      - { type: angle, at: A, from: B, to: D, label: '({{e1}})^\circ', radius: 18 }
      - { type: angle, at: C, from: D, to: B, label: '({{e2}})^\circ', radius: 16 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
