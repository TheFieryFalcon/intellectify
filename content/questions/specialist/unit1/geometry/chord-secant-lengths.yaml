  stem: |
    From $M$, a tangent touches a circle at $T$, and a secant cuts the circle at $A$ and $B$, with $MA = {{ma}}$ and $MB = {{mb}}$. Find $MT$.

    ```diagram
    view: [{{_view}}]
    width: 260
    points: { M: [{{_M}}], T: [{{_T}}], A: [{{_A}}], B: [{{_B}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: T }
      - { type: segment, from: M, to: B }
      - { type: point, at: M, label: 'M' }
      - { type: point, at: T, label: 'T' }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
    ```
  parts:
  - id: a
    prompt: $MT$
    answer: {type: numeric, key: '{{v}}'}
  solution: |
    $MT^2 = MA \times MB = {{ma}} \times {{mb}}$, so $MT = {{v}}$.
  verify: |
    def answers(ma, mb, v):
        # A secant through the center: radius (mb - ma)/2, M at distance (ma + mb)/2.
        r, d = (mb - ma) / 2, (ma + mb) / 2
        M = (d, 0.0)
        t = line_circle(M, 180, r)
        assert abs(t[0] - ma) < 1e-9 and abs(t[1] - mb) < 1e-9
        T = tangent_point_toward((0, 0), r, M, 1)
        return {"a": approx(dist(M, T))}

- id: spec.geometry.chord-secant-lengths.two-secants
  title: "Two Secants from a Point"
