  stem: |
    Find the unit vector that is perpendicular to ${{x}}\mathbf{i} + ({{y}})\mathbf{j}$ and has a positive $\mathbf{i}$-component.
  parts:
    - id: a
      answer: { type: vector, key: ['\frac{ {{r1}} }{ {{m}} }', '\frac{ {{r2}} }{ {{m}} }'] }
  solution: |
    Swapping the components and changing one sign gives the perpendicular vectors $\pm\left(({{y}})\mathbf{i} - {{x}}\mathbf{j}\right)$. Take the one with a positive $\mathbf{i}$-component, ${{r1}}\mathbf{i} + ({{r2}})\mathbf{j}$, and divide by its magnitude, {{m}}.
