- id: spec.combinatorics.combinations.solve-ncr
  skills: { primary: spec.combinatorics.combinations }
  rating: 1330
  responseSkills: { calculation: 1330 }
  variants:
    - { v: 45, n: 10, w: 90 }
    - { v: 28, n: 8, w: 56 }
    - { v: 66, n: 12, w: 132 }
  stem: |
    Find $n$ if $\dbinom{n}{2} = {{v}}$.
  parts:
    - id: a
      prompt: $n =$
      answer: { type: numeric, key: '{{n}}' }
  solution: |
    $\dfrac{n(n-1)}{2} = {{v}}$, so $n^2 - n - {{w}} = 0$, giving $n = {{n}}$ (the positive solution).
  verify: |
    def answers(v, n, w):
        x = symbols("x")
        return {"a": [s for s in solve(x * (x - 1) / 2 - v, x) if s > 0][0]}

# ─────────────── Tier 3 ───────────────
- id: spec.combinatorics.combinations.diagonals
  skills: { primary: spec.combinatorics.combinations }
  rating: 1420
  responseSkills: { reading: 1420, calculation: 1380 }
  variants:
    - { n: 10, v: 35 }
    - { n: 12, v: 54 }
  stem: |
    A diagonal of a polygon joins two corners that aren't next to each other. How many diagonals does a {{n}}-sided polygon have?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Any 2 corners make a line segment: $\dbinom{ {{n}} }{2}$. Remove the {{n}} sides: $\dbinom{ {{n}} }{2} - {{n}} = {{v}}$.
  verify: |
    def answers(n, v):
        return {"a": binomial(n, 2) - n}

- id: spec.combinatorics.combinations.at-least-two-girls
  skills: { primary: spec.combinatorics.combinations }
  rating: 1460
  responseSkills: { calculation: 1430, reading: 1460 }
  stem: |
    A committee of 5 is chosen from 6 boys and 5 girls. How many committees contain at least 2 girls?
  parts:
    - id: a
      answer: { type: numeric, key: 381 }
  solution: |
    Total $\dbinom{11}{5} = 462$. Subtract the committees with 0 girls ($\dbinom{6}{5} = 6$) and with exactly 1 girl ($5 \times \dbinom{6}{4} = 75$): $462 - 6 - 75 = 381$.
  verify: |
    def answers():
        return {"a": sum(binomial(5, g) * binomial(6, 5 - g) for g in range(2, 6))}

- id: spec.combinatorics.combinations.feuding-pair
  skills: { primary: spec.combinatorics.combinations }
  rating: 1470
  responseSkills: { calculation: 1430, reading: 1470 }
  stem: |
    A team of 4 is chosen from 10 people, but two of them, Sam and Kai, refuse to be on the team together. How many teams are possible?
  parts:
    - id: a
      answer: { type: numeric, key: 182 }
  solution: |
    All teams $\dbinom{10}{4} = 210$, minus teams with both Sam and Kai, which need 2 more from the other 8: $\dbinom{8}{2} = 28$. Answer $182$.
  verify: |
    from itertools import combinations as combos
    def answers():
        return {"a": sum(1 for t in combos(range(10), 4) if not (0 in t and 1 in t))}

