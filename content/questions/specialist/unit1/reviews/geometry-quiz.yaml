    - { e1: '2x - 10', e2: '4x + 10', s: 6, rr: 180, v: 30, _A: '-1.879, -0.684', _B: '1.732, -1', _C: '-0.347, 1.97', _D: '-1.732, 1' }
    - { e1: '3x - 15', e2: 'x + 35', s: 4, rr: 160, v: 40, _A: '-1.879, -0.684', _B: '0.174, -1.992', _C: '1.97, -0.347', _D: '-0.174, 1.992' }
