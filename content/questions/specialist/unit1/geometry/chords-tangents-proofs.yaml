    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'equal', description: "Finds the equal lengths (e.g. equal tangents: DA = DC and EB = EC)", points: 2, dimension: reasoning }
          - { id: 'sum', description: "Rewrites the perimeter using them (e.g. PD + DC + CE + EP = PA + PB)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes the perimeter is 2PA (e.g. PA = PB)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Tangents from one point are equal: $DA = DC$, $EB = EC$ and $PA = PB$. The perimeter is $PD + DE + EP = PD + DC + CE + EP = (PD + DA) + (EB + EP) = PA + PB = 2PA$.

- id: spec.geometry.chords-tangents.two-circles-tangent-angles
  title: "Tangents to Two Intersecting Circles"
  skills: { primary: spec.geometry.chords-tangents, secondary: [spec.geometry.circle-problems] }
  subsection: "The alternate segment theorem"
  rating: 1660
  responseSkills: { reasoning: 1650, proof: 1650, clarity: 1610, synthesis: 1640 }
  stem: |
    Two circles meet at $A$ and $B$. The tangent to the first circle at $A$ meets the second circle again at $C$, and the tangent to the second circle at $A$ meets the first circle again at $D$. Prove that $\angle ABD = \angle ABC$.

    ```diagram
    view: [-2.7, 3, -2.1, 2.1]
    width: 280
    points: { P1: [-0.9, 0], P2: [1, 0], A: [-0.118, 1.28], B: [-0.118, -1.28], C: [2.649, -0.411], D: [-2.274, -0.603] }
    draw:
      - { type: circle, center: P1, radius: 1.5 }
      - { type: circle, center: P2, radius: 1.7 }
      - { type: segment, from: A, to: C }
      - { type: segment, from: A, to: D }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: B, to: D }
      - { type: point, at: A, label: 'A', pos: n }
      - { type: point, at: B, label: 'B', pos: s }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'first', description: "Relates an angle at A to the first circle (e.g. AC tangent at A: ∠CAB = ∠ADB, alternate segment)", points: 1, dimension: reasoning }
          - { id: 'second', description: "Relates an angle at A to the second circle (e.g. AD tangent at A: ∠DAB = ∠ACB)", points: 1, dimension: reasoning }
          - { id: 'similar', description: "Shows two triangles are similar (e.g. ADB and CAB, two pairs of equal angles)", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "Concludes ∠ABD = ∠CBA (e.g. the third angles are equal)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    In the first circle, $AC$ is the tangent at $A$ and $AB$ a chord, so $\angle CAB = \angle ADB$ (alternate segment). In the second circle, $AD$ is the tangent at $A$, so $\angle DAB = \angle ACB$.

    Triangles $ADB$ and $CAB$ therefore have $\angle ADB = \angle CAB$ and $\angle DAB = \angle ACB$, so they are similar, and their third angles are equal: $\angle ABD = \angle ABC$.

- id: spec.geometry.chords-tangents.chord-equals-radius
  title: "Chord Equal to the Radius"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "The alternate segment theorem"
  rating: 1520
  responseSkills: { reasoning: 1510, proof: 1510, clarity: 1470 }
  stem: |
    A chord $AB$ of a circle is equal in length to the radius. Prove that the angle between $AB$ and the tangent at $A$ is $30^\circ$.

    ```diagram
    view: [-2.45, 2.65, -2.45, 2.45]
    width: 230
    points: { A: [-0, -2], B: [1.732, -1], U: [-1.8, -2], V: [2.2, -2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: U, to: V }
      - { type: segment, from: A, to: B }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: A, label: 'A', pos: s }
      - { type: point, at: B, label: 'B', pos: e }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'equilateral', description: "Finds the angle between AB and the radius (e.g. OA = OB = AB, equilateral, so ∠OAB = 60°)", points: 2, dimension: reasoning }
          - { id: 'tangent', description: "Uses the tangent's right angle (e.g. the tangent at A is perpendicular to OA)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes the angle is 30° (e.g. 90° − 60°)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $OA = OB$ (radii) $= AB$, so triangle $OAB$ is equilateral and $\angle OAB = 60^\circ$. The tangent at $A$ is perpendicular to $OA$, so the angle between it and $AB$ is $90^\circ - 60^\circ = 30^\circ$ (on the side of $B$).

- id: spec.geometry.chords-tangents.three-tangents-right-angle
  title: "Three Tangents and a Right Angle"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Tangents from a point"
  rating: 1720
  responseSkills: { reasoning: 1710, proof: 1710, clarity: 1670 }
  stem: |
    $AB$ is a diameter of a circle with center $O$. The tangents at $A$ and $B$ are met by the tangent at a third point $C$, at $D$ and $E$ respectively. Prove that $\angle DOE = 90^\circ$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 3.59]
    width: 230
    points: { A: [-2, 0], B: [2, 0], C: [0.845, 1.813], D: [-2, 3.138], E: [2, 1.275], U: [-2, -1], V: [2, -1], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: U, to: D }
      - { type: segment, from: V, to: E }
      - { type: segment, from: D, to: E }
      - { type: segment, from: O, to: D }
      - { type: segment, from: O, to: E }
      - { type: point, at: O, label: 'O', pos: s }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: e }
      - { type: point, at: C, label: 'C', pos: n }
      - { type: point, at: D, label: 'D', pos: nw }
      - { type: point, at: E, label: 'E', pos: ne }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'bisect-d', description: "Relates ∠DOC to ∠AOC (e.g. OD bisects ∠AOC: congruent triangles OAD, OCD, or tangents from D)", points: 1, dimension: reasoning }
          - { id: 'bisect-e', description: "Relates ∠COE to ∠COB (e.g. OE bisects ∠COB)", points: 1, dimension: reasoning }
          - { id: 'sum', description: "Uses the straight line AB (e.g. ∠AOC + ∠COB = 180°)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes ∠DOE = 90° (e.g. ½∠AOC + ½∠COB)", points: 2, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    From $D$, the tangents $DA$ and $DC$ give congruent right triangles $OAD$ and $OCD$ (RHS), so $OD$ bisects $\angle AOC$. Likewise $OE$ bisects $\angle COB$. Since $A$, $O$, $B$ are collinear, $\angle AOC + \angle COB = 180^\circ$. Hence $\angle DOE = \tfrac{1}{2}\angle AOC + \tfrac{1}{2}\angle COB = 90^\circ$.

- id: spec.geometry.chords-tangents.three-tangents-product
  title: "Product of Tangent Lengths on a Diameter"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Tangents from a point"
  rating: 1780
  responseSkills: { reasoning: 1770, proof: 1770, clarity: 1730 }
  stem: |
    In the setup where $AB$ is a diameter of a circle with center $O$ and radius $r$, and the tangent at a third point $C$ meets the tangents at $A$ and $B$ at $D$ and $E$, you may use that $\angle DOE = 90^\circ$. Prove that $AD \times BE = r^2$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 3.59]
    width: 230
    points: { A: [-2, 0], B: [2, 0], C: [0.845, 1.813], D: [-2, 3.138], E: [2, 1.275], U: [-2, -1], V: [2, -1], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: U, to: D }
      - { type: segment, from: V, to: E }
      - { type: segment, from: D, to: E }
      - { type: segment, from: O, to: D }
      - { type: segment, from: O, to: E }
      - { type: point, at: O, label: 'O', pos: s }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: e }
      - { type: point, at: C, label: 'C', pos: n }
      - { type: point, at: D, label: 'D', pos: nw }
      - { type: point, at: E, label: 'E', pos: ne }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'altitude', description: "Identifies OC as the height to DE (e.g. OC ⟂ DE, tangent ⟂ radius)", points: 1, dimension: reasoning }
          - { id: 'similar', description: "Relates OC to DC and CE (e.g. triangles DCO and OCE similar, giving OC² = DC × CE)", points: 2, dimension: reasoning }
          - { id: 'tangents', description: "Brings in the equal tangents (e.g. DC = DA and CE = EB)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes r² = AD × BE", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $OC \perp DE$ (tangent ⟂ radius), and $\angle DOE = 90^\circ$. In right triangle $DOE$, the altitude $OC$ splits it into triangles $DCO$ and $OCE$, which are similar ($\angle CDO = 90^\circ - \angle DOC = \angle COE$, and both have a right angle at $C$). So $\dfrac{DC}{OC} = \dfrac{OC}{CE}$, i.e. $OC^2 = DC \times CE$.

    Equal tangents give $DC = DA$ and $CE = EB$, and $OC = r$. Hence $AD \times BE = r^2$.

- id: spec.geometry.chords-tangents.perpendicular-bisects-chord
  title: "Perpendicular from the Center Bisects a Chord"
