# Intersecting chords, secants and tangents (1.1.12, 1.1.13).

- id: spec.geometry.chord-secant-lengths.intersecting-chords
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1050
  responseSkills: {calculation: 1040, reading: 1040}
  variants:
  - {ax: 4, xb: 9, cx: 6, v: 6}
  - {ax: 5, xb: 8, cx: 4, v: 10}
  stem: |
    Chords $AB$ and $CD$ of a circle meet at $X$. $AX = {{ax}}$, $XB = {{xb}}$ and $CX = {{cx}}$. Find $XD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.732, 1], B: [1.732, -1], C: [0.347, 1.97], D: [-1, -1.732], X: [-0.306, 0.176], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: C, to: D }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: X, label: 'X', pos: e }
    ```
  parts:
  - id: a
    prompt: $XD$
    answer: {type: numeric, key: '{{v}}'}
  solution: |
    Intersecting chords: $AX \times XB = CX \times XD$, so ${{ax}} \times {{xb}} = {{cx}} \times XD$ and $XD = {{v}}$.
  verify: |
    def answers(ax, xb, cx, v):
        # X at the origin, AB along the x-axis; a circle through A and B; then a chord through X with XC = cx.
        A, B = (-ax, 0.0), (xb, 0.0)
        c = ((xb - ax) / 2, 4.0)
        r = dist(c, A)
        phi = search(lambda d: (lambda t: -t[0] if t else None)(line_circle((0, 0), d, r, c)), cx)
        t = line_circle((0, 0), phi, r, c)
        assert abs(-t[0] - cx) < 1e-3, "no chord through X with that length on this circle"
        return {"a": approx(t[1], 3)}
- id: spec.geometry.chord-secant-lengths.tangent-secant
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1080
  responseSkills: {calculation: 1070, reading: 1070}
  variants:
  - {ma: 2, mb: 8, v: 4}
  - {ma: 3, mb: 12, v: 6}
  stem: |
    From $M$, a tangent touches a circle at $T$, and a secant cuts the circle at $A$ and $B$, with $MA = {{ma}}$ and $MB = {{mb}}$. Find $MT$.

    ```diagram
    view: [-2.5, 4.7, -2.5, 2.5]
    width: 260
    points: { M: [4.2, 0], T: [0.952, 1.759], A: [1.942, -0.48], B: [-1.578, -1.228], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: T }
      - { type: segment, from: M, to: B }
      - { type: point, at: M, label: 'M' }
      - { type: point, at: T, label: 'T' }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
    ```
  parts:
  - id: a
    prompt: $MT$
    answer: {type: numeric, key: '{{v}}'}
  solution: |
    $MT^2 = MA \times MB = {{ma}} \times {{mb}}$, so $MT = {{v}}$.
  verify: |
    def answers(ma, mb, v):
        # A secant through the center: radius (mb - ma)/2, M at distance (ma + mb)/2.
        r, d = (mb - ma) / 2, (ma + mb) / 2
        M = (d, 0.0)
        t = line_circle(M, 180, r)
        assert abs(t[0] - ma) < 1e-9 and abs(t[1] - mb) < 1e-9
        T = tangent_point_toward((0, 0), r, M, 1)
        return {"a": approx(dist(M, T))}
