    $AB$ is a diameter, so $\angle ACB = 90^\circ$ and $\angle ADB = 90^\circ$ (angles in a semicircle). Their sum is $180^\circ$.

- id: spec.geometry.circle-angles.semicircle-from-center
  skills: { primary: spec.geometry.circle-angles }
  rating: 1300
  responseSkills: { reasoning: 1290, clarity: 1250 }
  stem: |
    Use the theorem "the angle at the center is twice the angle at the circumference" to prove that an angle in a semicircle is $90^\circ$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-2, 0], B: [2, 0], C: [-0.845, 1.813], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: A, to: C }
      - { type: segment, from: B, to: C }
      - { type: point, at: O, label: 'O', pos: s }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'center', description: "For a diameter AB, the angle at the center is ∠AOB = 180° (a straight line)", points: 2, dimension: reasoning }
          - { id: 'half', description: "The angle at the circumference on the same arc is half of that: 90°", points: 1, dimension: reasoning }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $AB$ be a diameter with center $O$, and $C$ a point on the circle. $A$, $O$, $B$ lie on a straight line, so the angle at the center standing on arc $AB$ is $\angle AOB = 180^\circ$. The angle at the circumference on the same arc is half of this: $\angle ACB = 90^\circ$.

- id: spec.geometry.circle-angles.minor-arc-acute
  skills: { primary: spec.geometry.circle-angles }
  rating: 1360
  responseSkills: { reasoning: 1350, proof: 1350, clarity: 1310 }
  stem: |
    $AB$ is a chord of a circle that is not a diameter, and $C$ is a point on the major arc. Prove that $\angle ACB$ is acute.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.532, -1.286], B: [1.532, -1.286], C: [-0.347, 1.97], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: A }
      - { type: point, at: O, label: 'O', pos: e }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'center', description: "∠ACB = ½∠AOB, the angle at the center on the minor arc", points: 1, dimension: reasoning }
          - { id: 'less', description: "∠AOB < 180° because AB is not a diameter (A, O, B aren't collinear and the minor arc is less than half the circle)", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "So ∠ACB < 90°", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $C$ is on the major arc, so $\angle ACB$ stands on the minor arc $AB$, and $\angle ACB = \tfrac{1}{2}\angle AOB$. Since $AB$ is not a diameter, the minor arc is less than half the circle, so $\angle AOB < 180^\circ$. Hence $\angle ACB < 90^\circ$: it is acute.

- id: spec.geometry.circle-angles.equal-chords-equal-angles
  skills: { primary: spec.geometry.circle-angles }
  rating: 1380
  responseSkills: { reasoning: 1370, proof: 1370, clarity: 1330 }
  stem: |
    Prove that equal chords of a circle subtend equal angles at the circumference (each angle measured at a point on the major arc of its chord).

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.879, -0.684], B: [1, -1.732], C: [1.879, 0.684], D: [-1, 1.732], P: [0.518, 1.932], Q: [-0.684, -1.879], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B, ticks: 1 }
      - { type: segment, from: C, to: D, ticks: 1 }
      - { type: segment, from: P, to: A }
      - { type: segment, from: P, to: B }
      - { type: segment, from: Q, to: C }
      - { type: segment, from: Q, to: D }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: P, label: 'P' }
      - { type: point, at: Q, label: 'Q' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'center', description: "Equal chords subtend equal angles at the center (congruent isosceles triangles, SSS)", points: 2, dimension: reasoning }
          - { id: 'half', description: "Each angle at the circumference is half the matching angle at the center", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "So the angles at the circumference are equal", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $AB = CD$ be chords of a circle with center $O$. Triangles $OAB$ and $OCD$ have $OA = OC$, $OB = OD$ (radii) and $AB = CD$, so they are congruent and $\angle AOB = \angle COD$.

    An angle at the circumference standing on a chord's minor arc is half the angle at the center on that arc, so the two angles at the circumference are $\tfrac{1}{2}\angle AOB = \tfrac{1}{2}\angle COD$: they are equal.

