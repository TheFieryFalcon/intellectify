      answer: { type: vector, key: ['{{bx}}-({{ax}})', '{{by}}-({{ay}})'] }
    - id: b
      prompt: $|\overrightarrow{AB}|$
      answer: { type: numeric, key: '\sqrt{({{bx}}-({{ax}}))^2+({{by}}-({{ay}}))^2}' }
  solution: |
    End minus start: $\overrightarrow{AB} = ({{bx}} - ({{ax}}))\mathbf{i} + ({{by}} - ({{ay}}))\mathbf{j}$. Its magnitude follows from Pythagoras.
  verify: |
