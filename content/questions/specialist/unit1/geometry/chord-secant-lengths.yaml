- id: spec.geometry.chord-secant-lengths.chords-algebra
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1300
  responseSkills: {reading: 1270, calculation: 1290, reasoning: 1290}
  stem: |
    Chords $AB$ and $CD$ meet at $X$, with $AX = x$, $XB = x + 5$, $CX = 6$ and $XD = 4$. Find $x$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-0.553, -1.922], B: [1.476, 1.35], C: [-1.975, -0.316], D: [1.317, -1.505], X: [0, -1.02956], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: X, label: 'x' }
      - { type: segment, from: X, to: B, label: 'x + 5' }
      - { type: segment, from: C, to: X, label: '6', side: right }
      - { type: segment, from: X, to: D, label: '4', side: right }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: X, label: 'X', pos: s }
    ```
  parts:
  - id: a
    prompt: $x =$
    answer: {type: numeric, key: '3'}
  solution: |
    $x(x + 5) = 6 \times 4 = 24$, so $x^2 + 5x - 24 = 0$, i.e. $(x + 8)(x - 3) = 0$. Lengths are positive, so $x = 3$.
  verify: |
    def answers():
        x = symbols("x")
        return {"a": [s for s in solve(x*(x + 5) - 24, x) if s > 0][0]}
- id: spec.geometry.chord-secant-lengths.perpendicular-to-diameter
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1330
  responseSkills: {calculation: 1310, reasoning: 1320, synthesis: 1300}
  variants:
  - {a: 2, b: 8, v: 8}
  - {a: 3, b: 12, v: 12}
  stem: |
    $AB$ is a diameter of a circle, and chord $CD$ is perpendicular to $AB$, meeting it at $X$. $AX = {{a}}$ and $XB = {{b}}$. Find $CD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-2, 0], B: [2, 0], X: [-1.2, 0], C: [-1.2, 1.6], D: [-1.2, -1.6], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: X, label: '{{a}}', side: right }
      - { type: segment, from: X, to: B, label: '{{b}}', side: right }
      - { type: segment, from: C, to: D }
      - { type: angle, at: X, from: B, to: C, right: true }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: e }
      - { type: point, at: C, label: 'C', pos: n }
      - { type: point, at: D, label: 'D', pos: s }
      - { type: point, at: X, label: 'X', pos: sw }
    ```
  parts:
  - id: a
    prompt: $CD$
    answer: {type: numeric, key: '{{v}}'}
  solution: |
    A diameter perpendicular to a chord cuts it in half, so $CX = XD$. Intersecting chords: $CX^2 = AX \times XB = {{a}} \times {{b}}$, so $CX = \sqrt{ {{a}} \times {{b}} }$ and $CD = 2 \times CX = {{v}}$.
  verify: |
    def answers(a, b, v):
        r = (a + b) / 2
        X = (-r + a, 0.0)
        t = line_circle(X, 90, r)
        return {"a": approx(t[1] - t[0])}
- id: spec.geometry.chord-secant-lengths.find-chord-from-tangent
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1370
