# Converses and circle geometry problems (1.1.14, 1.1.15).

- id: spec.geometry.circle-problems.which-cyclic
  skills: {primary: spec.geometry.circle-problems}
  rating: 1080
  responseSkills: {reading: 1070}
  stem: |
    Which quadrilateral must be cyclic? Its angles are listed in order around the shape.
  parts:
  - id: a
    options:
    - {id: a, text: '$80^\circ, 100^\circ, 80^\circ, 100^\circ$'}
    - {id: b, text: '$75^\circ, 95^\circ, 105^\circ, 85^\circ$'}
    - {id: c, text: '$90^\circ, 80^\circ, 100^\circ, 90^\circ$'}
    - {id: d, text: '$70^\circ, 80^\circ, 100^\circ, 110^\circ$'}
    answer: {type: mcq, key: b}
  solution: |
    A quadrilateral is cyclic if a pair of opposite angles (first and third, or second and fourth) adds to $180^\circ$. Only (b) works: $75^\circ + 105^\circ = 180^\circ$. The opposite pairs add to $160^\circ$ and $200^\circ$ in (a), $190^\circ$ and $170^\circ$ in (c), and $170^\circ$ and $190^\circ$ in (d).
  verify: |
    def answers():
        opts = {"a": (80, 100, 80, 100), "b": (75, 95, 105, 85), "c": (90, 80, 100, 90), "d": (70, 80, 100, 110)}
        good = [k for k, a in opts.items() if a[0] + a[2] == 180]
        return {"a": good[0] if len(good) == 1 else "ambiguous"}
- id: spec.geometry.circle-problems.right-angle-on-circle
  skills: {primary: spec.geometry.circle-problems}
  rating: 1110
  responseSkills: {reading: 1100, calculation: 1080}
  variants:
    - { ab: 10 }
    - { ab: 14 }
    - { ab: 8 }
    - { ab: 12 }
    - { ab: 18 }
  stem: |
    $A$ and $B$ are {{ab}} cm apart, and $M$ is the midpoint of $AB$. A point $P$ has $\angle APB = 90^\circ$. How far is $P$ from $M$?

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 250
    points: { A: [-2, 0], B: [2, 0], M: [0, 0], P: [0.845, 1.813] }
    draw:
      - { type: segment, from: A, to: B, label: '{{ab}}', side: right }
      - { type: segment, from: A, to: P }
      - { type: segment, from: B, to: P }
      - { type: segment, from: M, to: P, dashed: true }
      - { type: angle, at: P, from: A, to: B, right: true }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: e }
      - { type: point, at: M, label: 'M', pos: nw }
      - { type: point, at: P, label: 'P', pos: n }
    ```
  parts:
  - id: a
    prompt: $PM$ (cm)
    answer: {type: numeric, key: '\frac{ {{ab}} }{2}'}
  solution: |
    By the converse of the angle in a semicircle, $P$ lies on the circle with diameter $AB$. Its center is $M$ and its radius is $\tfrac{ {{ab}} }{2}$ cm, so $PM = \tfrac{ {{ab}} }{2}$ cm.
  verify: |
    def answers(ab):
        import math
        A, B = (-ab / 2, 0.0), (ab / 2, 0.0)
        # Any P with a right angle at P: search along a ray from M for the point where angle APB = 90.
        best = min((((ab * k / 4000) * math.cos(1.1), (ab * k / 4000) * math.sin(1.1)) for k in range(1, 4000)),
                   key=lambda Q: abs(angle_at(A, Q, B) - 90))
        return {"a": round(dist(best, (0, 0)), 1)}

- id: spec.geometry.circle-problems.equal-angles-concyclic
