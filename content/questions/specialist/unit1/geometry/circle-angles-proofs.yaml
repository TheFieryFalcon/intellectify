    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'exterior', description: "Splits ∠AXB into angles at the circumference (e.g. exterior angle of triangle XBC: ∠AXB = ∠XBC + ∠XCB)", points: 2, dimension: reasoning }
          - { id: 'arcs', description: "Relates each to an angle at the center (e.g. ∠XBC = ½∠COD and ∠XCB = ½∠AOB)", points: 2, dimension: reasoning }
