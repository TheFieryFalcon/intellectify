- id: spec.vectors-2d.components.magnitude-quadratic
  skills: { primary: spec.vectors-2d.components }
  rating: 1580
  responseSkills: {calculation: 1570, reasoning: 1560, synthesis: 1520}
  stem: |
    Find the exact values of $k$ for which $|k(2\mathbf{i} - \mathbf{j}) - (\mathbf{i} + 3\mathbf{j})| = 5$.
  parts:
    - id: a
      answer: { type: set, key: ['\frac{-1+2\sqrt{19}}{5}', '\frac{-1-2\sqrt{19}}{5}'], form: [exact] }
  solution: |
    The vector is $(2k - 1)\mathbf{i} + (-k - 3)\mathbf{j}$. Setting its squared magnitude to 25:
    $(2k - 1)^2 + (k + 3)^2 = 25$, so $5k^2 + 2k - 15 = 0$, and $k = \dfrac{-2 \pm \sqrt{304}}{10} = \dfrac{-1 \pm 2\sqrt{19}}{5}$.
  verify: |
    def answers():
        k = symbols("k")
        return {"a": solve((2*k - 1)**2 + (k + 3)**2 - 25, k)}

- id: spec.vectors-2d.components.equal-length-sum
  skills: { primary: spec.vectors-2d.components }
  rating: 1590
  responseSkills: {calculation: 1520, reasoning: 1570, synthesis: 1580}
  stem: |
    $\mathbf{a} = 2\mathbf{i} - \mathbf{j}$. The vector $\mathbf{b}$ has the same magnitude as $\mathbf{a}$, and $\mathbf{a} + \mathbf{b}$ is parallel to $\mathbf{i}$. If $\mathbf{b}$ has a negative $\mathbf{i}$-component, find $\mathbf{b}$.
  parts:
    - id: a
      answer: { type: vector, key: ['-2', '1'] }
  solution: |
    Let $\mathbf{b} = x\mathbf{i} + y\mathbf{j}$. Parallel to $\mathbf{i}$ means no $\mathbf{j}$-component: $-1 + y = 0$, so $y = 1$.
    Equal magnitudes: $x^2 + 1 = 5$, so $x = \pm 2$. Taking the negative value, $\mathbf{b} = -2\mathbf{i} + \mathbf{j}$.
  verify: |
    def answers():
        x, y = symbols("x y", real=True)
        sols = solve([-1 + y, x**2 + y**2 - 5], [x, y], dict=True)
        s = [t for t in sols if t[x] < 0][0]
        return {"a": [s[x], s[y]]}

- id: spec.vectors-2d.components.three-parallelograms
  skills: { primary: spec.vectors-2d.components }
  rating: 1620
  responseSkills: {reading: 1610, calculation: 1570, reasoning: 1600, synthesis: 1580}
  stem: |
    $A(1, 1)$, $B(4, 2)$ and $C(3, 5)$ are three corners of a parallelogram. Find the position vector of the fourth corner $D$ if the parallelogram is:
  parts:
    - id: a
      prompt: $ABCD$ (corners in that order)
      answer: { type: vector, key: ['0', '4'] }
    - id: b
      prompt: $ABDC$
      answer: { type: vector, key: ['6', '6'] }
    - id: c
      prompt: $ADBC$
      answer: { type: vector, key: ['2', '-2'] }
  solution: |
    Going round the corners in order, opposite sides are equal vectors.
    - $ABCD$: $\overrightarrow{AD} = \overrightarrow{BC}$, so $D = A + C - B = (0, 4)$.
    - $ABDC$: $\overrightarrow{BD} = \overrightarrow{AC}$, so $D = B + C - A = (6, 6)$.
    - $ADBC$: $\overrightarrow{AD} = \overrightarrow{CB}$, so $D = A + B - C = (2, -2)$.
  verify: |
    def answers():
        A, B, C = Matrix([1, 1]), Matrix([4, 2]), Matrix([3, 5])
        return {"a": list(A + C - B), "b": list(B + C - A), "c": list(A + B - C)}

- id: spec.vectors-2d.components.greatest-least
  skills: { primary: spec.vectors-2d.components }
  rating: 1650
  responseSkills: {reading: 1580, calculation: 1600, reasoning: 1630, synthesis: 1650}
  variants:
    - { p: 5, q: 3 }
    - { p: 4, q: 2 }
  stem: |
    $|\mathbf{u}| = {{p}}$ and $|\mathbf{v}| = {{q}}$, but their directions are unknown. Find the greatest and least possible values of $|2\mathbf{u} - 3\mathbf{v}|$.
  parts:
    - id: a
      prompt: Greatest
      answer: { type: numeric, key: '2\cdot{{p}}+3\cdot{{q}}' }
    - id: b
      prompt: Least
      answer: { type: numeric, key: '|2\cdot{{p}}-3\cdot{{q}}|' }
  solution: |
    $|2\mathbf{u}| = 2\times{{p}}$ and $|3\mathbf{v}| = 3\times{{q}}$. Head to tail, $2\mathbf{u}$ and $-3\mathbf{v}$ form two sides of a triangle, so the third side is at most their sum and at least their difference.
    The greatest value occurs when $\mathbf{u}$ and $\mathbf{v}$ point in opposite directions (so $2\mathbf{u}$ and $-3\mathbf{v}$ line up), and the least when they point the same way.
  verify: |
    def answers(p, q):
        return {"a": 2*p + 3*q, "b": abs(2*p - 3*q)}

# ─────────────── Tier 5 ───────────────
- id: spec.vectors-2d.components.closest-point
  skills: { primary: spec.vectors-2d.components }
  rating: 1700
  responseSkills: {calculation: 1650, reasoning: 1680, synthesis: 1700}
  stem: |
    For each real number $t$, the point $P$ has position vector $(2 + t)\mathbf{i} + (1 - 2t)\mathbf{j}$. Find the value of $t$ for which $P$ is closest to the point $(7, 6)$, and the exact closest distance.
  parts:
    - id: a
      prompt: $t =$
      answer: { type: numeric, key: -1 }
    - id: b
      prompt: Closest distance
      answer: { type: numeric, key: '3\sqrt{5}', form: [exact] }
  solution: |
    The vector from $(7, 6)$ to $P$ is $(t - 5)\mathbf{i} + (-5 - 2t)\mathbf{j}$, with squared length
    $(t - 5)^2 + (2t + 5)^2 = 5t^2 + 10t + 50 = 5(t + 1)^2 + 45$.
    This is smallest when $t = -1$, giving a distance of $\sqrt{45} = 3\sqrt{5}$.
  verify: |
    def answers():
        t = symbols("t", real=True)
        d2 = (2 + t - 7)**2 + (1 - 2*t - 6)**2
        t0 = solve(diff(d2, t), t)[0]
        return {"a": t0, "b": sqrt(d2.subs(t, t0))}

- id: spec.vectors-2d.components.square-corners
  skills: { primary: spec.vectors-2d.components }
  rating: 1720
  responseSkills: {calculation: 1650, reasoning: 1700, synthesis: 1720}
  stem: |
    $ABCD$ is a square. $A$ is $(1, 2)$ and the opposite corner $C$ is $(7, 6)$. $B$ lies above the line $AC$. Find the position vectors of $B$ and $D$.
  parts:
    - id: b
      prompt: $B$
      answer: { type: vector, key: ['2', '7'] }
    - id: d
      prompt: $D$
      answer: { type: vector, key: ['6', '1'] }
  solution: |
    The diagonals of a square bisect each other at right angles and have equal length. The center is $M(4, 4)$, and $\overrightarrow{MC} = 3\mathbf{i} + 2\mathbf{j}$.
    $\overrightarrow{MB}$ has the same length as $\overrightarrow{MC}$ and is at right angles to it. Turning $3\mathbf{i} + 2\mathbf{j}$ through $90^\circ$ gives $\pm(-2\mathbf{i} + 3\mathbf{j})$ (swap the components and change one sign; check with gradients: $\tfrac{2}{3} \times -\tfrac{3}{2} = -1$).
    $B$ is above $AC$, so $\overrightarrow{OB} = (4\mathbf{i} + 4\mathbf{j}) + (-2\mathbf{i} + 3\mathbf{j}) = 2\mathbf{i} + 7\mathbf{j}$, and $\overrightarrow{OD} = (4\mathbf{i} + 4\mathbf{j}) - (-2\mathbf{i} + 3\mathbf{j}) = 6\mathbf{i} + \mathbf{j}$.
  verify: |
    def answers():
        A, C = Matrix([1, 2]), Matrix([7, 6])
        M = (A + C) / 2
        h = C - M
        perp = Matrix([-h[1], h[0]])
        B1, B2 = M + perp, M - perp
        above = lambda P: (P[1] - A[1]) * (C[0] - A[0]) - (P[0] - A[0]) * (C[1] - A[1]) > 0
        B, D = (B1, B2) if above(B1) else (B2, B1)
        assert (B - A).norm() == (C - B).norm() and (B - A).dot(C - B) == 0
        return {"b": list(B), "d": list(D)}

- id: spec.vectors-2d.components.rhombus-corners
  skills: { primary: spec.vectors-2d.components }
  rating: 1760
  responseSkills: {calculation: 1680, reasoning: 1740, synthesis: 1760}
  stem: |
    $ABCD$ is a rhombus (all four sides are equal) with side length $5\sqrt{2}$. $A$ is $(1, 1)$ and the opposite corner $C$ is $(9, 7)$. $B$ lies above the line $AC$. Find the position vectors of $B$ and $D$.
  parts:
    - id: b
      prompt: $B$
      answer: { type: vector, key: ['2', '8'] }
    - id: d
      prompt: $D$
      answer: { type: vector, key: ['8', '0'] }
  solution: |
    The diagonals of a rhombus bisect each other at right angles. The center is $M(5, 4)$, and $\overrightarrow{MC} = 4\mathbf{i} + 3\mathbf{j}$ has length 5.
    In right-angled triangle $MBC$, $|MB|^2 = (5\sqrt{2})^2 - 5^2 = 25$, so $|MB| = 5$.
    A vector at right angles to $4\mathbf{i} + 3\mathbf{j}$ is $-3\mathbf{i} + 4\mathbf{j}$, which also has length 5. $B$ is above $AC$, so $\overrightarrow{OB} = (5\mathbf{i} + 4\mathbf{j}) + (-3\mathbf{i} + 4\mathbf{j}) = 2\mathbf{i} + 8\mathbf{j}$, and $\overrightarrow{OD} = 8\mathbf{i} + 0\mathbf{j}$.
  verify: |
    def answers():
        A, C = Matrix([1, 1]), Matrix([9, 7])
        M = (A + C) / 2
        h = C - M
        half = sqrt(50 - h.dot(h))
        perp = Matrix([-h[1], h[0]]) / h.norm() * half
        B1, B2 = M + perp, M - perp
        above = lambda P: (P[1] - A[1]) * (C[0] - A[0]) - (P[0] - A[0]) * (C[1] - A[1]) > 0
        B, D = (B1, B2) if above(B1) else (B2, B1)
        assert (B - A).norm() == 5*sqrt(2) and (C - B).norm() == 5*sqrt(2)
        return {"b": list(B), "d": list(D)}

- id: spec.vectors-2d.components.unit-makes-parallel
  skills: { primary: spec.vectors-2d.components }
  rating: 1710
  responseSkills: {calculation: 1650, reasoning: 1690, synthesis: 1700}
  stem: |
    $\mathbf{u}$ is a unit vector, and $3\mathbf{i} + 4\mathbf{j} + 5\mathbf{u}$ is a non-zero vector parallel to $\mathbf{i}$. Find $\mathbf{u}$.
  parts:
    - id: a
      answer: { type: vector, key: ['0.6', '-0.8'] }
  solution: |
    Let $\mathbf{u} = x\mathbf{i} + y\mathbf{j}$ with $x^2 + y^2 = 1$. Parallel to $\mathbf{i}$ means the $\mathbf{j}$-component is 0: $4 + 5y = 0$, so $y = -0.8$ and $x = \pm 0.6$.
    $x = -0.6$ gives $3 - 3 = 0$, the zero vector, which isn't allowed. So $\mathbf{u} = 0.6\mathbf{i} - 0.8\mathbf{j}$ (giving $6\mathbf{i}$).
  verify: |
    def answers():
        x, y = symbols("x y", real=True)
        sols = solve([4 + 5*y, x**2 + y**2 - 1], [x, y], dict=True)
        s = [t for t in sols if 3 + 5*t[x] != 0][0]
        return {"a": [s[x], s[y]]}

- id: spec.vectors-2d.components.equilateral-corner
  skills: { primary: spec.vectors-2d.components }
  rating: 1740
  responseSkills: {calculation: 1690, reasoning: 1720, synthesis: 1730}
  stem: |
    $A$ is $(2, 1)$ and $B$ is $(5, 5)$. Triangle $ABC$ is equilateral, and $C$ lies above the line $AB$. Find the exact position vector of $C$.
  parts:
    - id: a
      answer: { type: vector, key: ['\frac{7}{2}-2\sqrt{3}', '3+\frac{3\sqrt{3}}{2}'], form: [exact] }
  solution: |
    $\overrightarrow{AB} = 3\mathbf{i} + 4\mathbf{j}$ has length 5, and the midpoint of $AB$ is $M\left(\tfrac{7}{2}, 3\right)$. In an equilateral triangle of side 5, $C$ is at distance $\tfrac{5\sqrt{3}}{2}$ from $M$, at right angles to $AB$.
    The unit vector at right angles to $3\mathbf{i} + 4\mathbf{j}$ pointing above the line is $\tfrac{1}{5}(-4\mathbf{i} + 3\mathbf{j})$. So
    $\overrightarrow{OC} = \left(\tfrac{7}{2}\mathbf{i} + 3\mathbf{j}\right) + \tfrac{\sqrt{3}}{2}(-4\mathbf{i} + 3\mathbf{j}) = \left(\tfrac{7}{2} - 2\sqrt{3}\right)\mathbf{i} + \left(3 + \tfrac{3\sqrt{3}}{2}\right)\mathbf{j}$.
  verify: |
    def answers():
        A, B = Matrix([2, 1]), Matrix([5, 5])
        M, d = (A + B) / 2, B - A
        n = Matrix([-d[1], d[0]]) / d.norm()
        C = M + sqrt(3) / 2 * d.norm() * n
        assert simplify((C - A).norm() - 5) == 0 and simplify((C - B).norm() - 5) == 0
        assert (C[1] - A[1]) * d[0] - (C[0] - A[0]) * d[1] > 0
        return {"a": [simplify(C[0]), simplify(C[1])]}

- id: spec.vectors-2d.components.angle-bisector
  skills: { primary: spec.vectors-2d.components }
  rating: 1760
  responseSkills: {calculation: 1690, reasoning: 1740, synthesis: 1760}
  stem: |
    Find the vector of magnitude $\sqrt{65}$ that bisects the angle between $3\mathbf{i} + 4\mathbf{j}$ and $5\mathbf{i} - 12\mathbf{j}$ (it points between them, making equal angles with both).
  parts:
    - id: a
      answer: { type: vector, key: ['8', '-1'] }
  solution: |
    Two unit vectors form a rhombus, and a rhombus's diagonal bisects its angle. So add the unit vectors: $\tfrac{1}{5}(3\mathbf{i} + 4\mathbf{j}) + \tfrac{1}{13}(5\mathbf{i} - 12\mathbf{j}) = \tfrac{1}{65}(64\mathbf{i} - 8\mathbf{j}) = \tfrac{8}{65}(8\mathbf{i} - \mathbf{j})$.
    $8\mathbf{i} - \mathbf{j}$ points the same way and already has magnitude $\sqrt{65}$.
  verify: |
    def answers():
        u, v = Matrix([3, 4]), Matrix([5, -12])
        w = u / u.norm() + v / v.norm()
        r = w / w.norm() * sqrt(65)
        assert simplify(r.dot(u) / u.norm() - r.dot(v) / v.norm()) == 0
        return {"a": [simplify(r[0]), simplify(r[1])]}
