    def answers(e1, e2, s, rr, v):
        X = symbols("x")
        f = lambda e: sympify(e.replace("x", "*x").lstrip("*").replace("+ *", "+ ").replace("- *", "- "))
        return {"a": solve(f(e1) + f(e2) - 180, X)[0]}

- id: spec.geometry.sq.diameter-complement
  title: "Angles in a Triangle on a Diameter"
  pool: section-quiz
  skills: { primary: spec.geometry.circle-angles }
  subsection: "Angle in a semicircle"
  rating: 1340
  responseSkills: { reasoning: 1330, proof: 1320, clarity: 1280 }
  stem: |
    $AB$ is a diameter of a circle, and $C$ is another point on the circle. Prove that $\angle CAB + \angle CBA = 90^\circ$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-2, 0], B: [2, 0], C: [0.845, 1.813], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: A, to: C }
      - { type: segment, from: B, to: C }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: e }
      - { type: point, at: C, label: 'C', pos: n }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: semicircle, description: "∠ACB = 90°, with the reason (angle in a semicircle)", points: 2, dimension: reasoning }
          - { id: sum, description: "Angle sum of triangle ABC: ∠CAB + ∠CBA = 180° − 90°", points: 1, dimension: reasoning }
          - { id: conclude, description: "Concludes ∠CAB + ∠CBA = 90°", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $AB$ is a diameter, so $\angle ACB = 90^\circ$ (angle in a semicircle). The angles of triangle $ABC$ add to $180^\circ$, so $\angle CAB + \angle CBA = 180^\circ - 90^\circ = 90^\circ$.

- id: spec.geometry.sq.tangent-chord-center
  title: "Tangent–Chord Angle and the Angle at the Center"
  pool: section-quiz
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "The alternate segment theorem"
  rating: 1380
  responseSkills: { reading: 1360, reasoning: 1370, calculation: 1340 }
  variants:
    - { t: 52, v: 104, _B: '1.941, 0.484' }
    - { t: 60, v: 120, _B: '1.732, 1' }
    - { t: 66, v: 132, _B: '1.486, 1.338' }
    - { t: 71, v: 142, _B: '1.231, 1.576' }
    - { t: 78, v: 156, _B: '0.813, 1.827' }
  stem: |
    A tangent touches a circle with center $O$ at $T$. Chord $TB$ makes an angle of ${{t}}^\circ$ with the tangent. Find $\angle TOB$, in degrees.

    ```diagram
    view: [-3.25, 3.25, -2.45, 2.45]
    width: 230
    alt: "Tangent at T; chord TB at 71 degrees to it; angle TOB at the center"
    points: { T: [-0, -2], B: [{{_B}}], L: [-2.8, -2], R: [2.8, -2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: L, to: R, color: muted }
      - { type: segment, from: T, to: B }
      - { type: segment, from: O, to: T, color: muted }
      - { type: segment, from: O, to: B, color: muted }
      - { type: angle, at: T, from: R, to: B, label: '{{t}}^\circ', radius: 24 }
      - { type: angle, at: O, from: T, to: B, label: '?', radius: 16 }
      - { type: point, at: T, label: 'T', pos: s }
      - { type: point, at: B, label: 'B', pos: ne }
      - { type: point, at: O, label: 'O', pos: w }
    ```
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    By the alternate segment theorem, any angle at the circumference standing on arc $TB$ (in the alternate segment) is ${{t}}^\circ$. The angle at the center on the same arc is twice that: $\angle TOB = {{v}}^\circ$.
  verify: |
    def answers(t, v):
        T, R = (0, -2), (3, -2)
        B = on_circle(270 + 2*t, 2)
        assert abs(angle_at(R, T, B) - t) < 1e-9
        return {"a": approx(angle_at(T, (0, 0), B))}

