- id: spec.geometry.sq.negate-for-every-y
  pool: section-quiz
  skills: { primary: spec.geometry.logic }
  rating: 1450
  responseSkills: { reading: 1440, reasoning: 1430, precision: 1420 }
  stem: |
    Which statement is the negation of "For every real number $x$, there is a real number $y$ with $y > x^2$"?
  parts:
    - id: a
      options:
        - { id: a, text: 'For every real number $x$, there is a real number $y$ with $y \le x^2$.' }
        - { id: b, text: 'There is a real number $x$ such that every real number $y$ has $y \le x^2$.' }
        - { id: c, text: 'There is a real number $x$ and a real number $y$ with $y \le x^2$.' }
        - { id: d, text: 'For every real number $x$ and every real number $y$, $y < x^2$.' }
      answer: { type: mcq, key: b }
  solution: |
    Negating swaps each quantifier and negates what follows: "for every $x$" becomes "there is an $x$", "there is a $y$ with $y > x^2$" becomes "every $y$ has $y \le x^2$". That is (b).
  verify: |
    def answers():
        return {"a": "b"}

- id: spec.geometry.sq.prime-2p-plus-1
  pool: section-quiz
  skills: { primary: spec.geometry.proof-methods }
  rating: 1410
  responseSkills: { reading: 1400, reasoning: 1400, calculation: 1370 }
  stem: |
    Disprove the claim "for every prime $p$, $2p + 1$ is prime" by finding the smallest prime $p$ for which $2p + 1$ is not prime.
  parts:
    - id: a
      answer: { type: numeric, key: 7 }
  solution: |
    Try the primes in order: $p = 2$ gives 5, $p = 3$ gives 7, $p = 5$ gives 11, all prime. $p = 7$ gives $15 = 3 \times 5$, which isn't. One counterexample disproves a "for all" claim, so the smallest is $p = 7$.
  verify: |
    def answers():
        return {"a": next(p for p in sympy.primerange(2, 100) if not sympy.isprime(2 * p + 1))}

- id: spec.geometry.sq.odd-square-minus-one
  pool: section-quiz
  skills: { primary: spec.geometry.proof-methods }
  rating: 1600
  responseSkills: { reasoning: 1590, proof: 1590, clarity: 1540 }
  stem: |
    Prove that if $n$ is odd, then $n^2 - 1$ is a multiple of 8.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: odd, description: "Writes n = 2k + 1 for an integer k", points: 1, dimension: proof }
          - { id: factor, description: "Shows n² − 1 = 4k² + 4k = 4k(k + 1)", points: 1, dimension: reasoning }
          - { id: even, description: "Explains that k(k + 1) is even: one of two consecutive integers is even", points: 2, dimension: reasoning }
          - { id: conclude, description: "So n² − 1 = 4 × (an even number), a multiple of 8", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $n = 2k + 1$, where $k$ is an integer. Then $n^2 - 1 = 4k^2 + 4k = 4k(k + 1)$.

    $k$ and $k + 1$ are consecutive integers, so one of them is even, and $k(k + 1) = 2m$ for some integer $m$. Then $n^2 - 1 = 8m$, a multiple of 8.

- id: spec.geometry.sq.tangents-major-arc-proof
  pool: section-quiz
  skills: { primary: spec.geometry.chords-tangents }
  rating: 1640
  responseSkills: { reasoning: 1630, proof: 1620, clarity: 1580 }
  stem: |
    Tangents from $P$ touch a circle at $A$ and $B$. $C$ is a point on the major arc $AB$. Prove that $\angle APB = 180^\circ - 2\angle ACB$.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: equal, description: "PA = PB (tangents from one point), so ∠PAB = ∠PBA", points: 1, dimension: reasoning }
          - { id: alt, description: "Alternate segment theorem: ∠PAB = ∠ACB (and ∠PBA = ∠ACB)", points: 2, dimension: reasoning }
          - { id: sum, description: "Angle sum of triangle PAB: ∠APB = 180° − 2∠ACB", points: 1, dimension: reasoning }
          - { id: conclude, description: "States the result with every step justified", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $PA = PB$ (tangents from one point), so triangle $PAB$ is isosceles and $\angle PAB = \angle PBA$.

    The angle between tangent $PA$ and chord $AB$ equals the angle in the alternate segment: $\angle PAB = \angle ACB$. So $\angle PBA = \angle ACB$ too.

    The angles of triangle $PAB$ add to $180^\circ$: $\angle APB = 180^\circ - 2\angle ACB$.
