  solution: |
    Wind $\mathbf{w} = -15\mathbf{i}$ (moving west); cyclist $\mathbf{c} = 20\mathbf{j}$. Relative to the cyclist: $\mathbf{w} - \mathbf{c} = -15\mathbf{i} - 20\mathbf{j}$, with speed 25 km/h.
    That air moves towards the south-west, so it comes from the north-east: east of north by $\tan^{-1}\tfrac{15}{20} \approx 36.9^\circ$, i.e. from $036.9^\circ\text{T}$.
  verify: |
    def answers():
        rel = Matrix([-15, 0]) - Matrix([0, 20])
        frm = -rel
        return {"a": rel.norm(), "b": round(float(deg(atan2(frm[0], frm[1])) % 360), 1)}

# ─────────────── Tier 5 ───────────────
- id: spec.vectors-2d.applications.intercept-speed
  skills: { primary: spec.vectors-2d.applications }
  rating: 1700
  responseSkills: { synthesis: 1700, calculation: 1650 }
  stem: |
    At noon, ship $B$ is 8 km due east of ship $A$ and sails due north at 3 km/h. Also at noon, $A$ sets off at 5 km/h in a fixed direction chosen so that it meets $B$. Find when they meet and $A$'s velocity.
  parts:
    - id: t
      prompt: Time after noon (hours)
      answer: { type: numeric, key: 2 }
    - id: v
      prompt: $A$'s velocity (km/h)
      answer: { type: vector, key: ['4', '3'] }
  solution: |
    Put $A$ at the origin. After $t$ hours, $B$ is at $8\mathbf{i} + 3t\,\mathbf{j}$. $A$ travels $5t$ km in a straight line to that point, so
    $(5t)^2 = 8^2 + (3t)^2$, giving $16t^2 = 64$ and $t = 2$.
    They meet at $8\mathbf{i} + 6\mathbf{j}$, so $A$'s velocity is $\tfrac{1}{2}(8\mathbf{i} + 6\mathbf{j}) = 4\mathbf{i} + 3\mathbf{j}$ km/h (speed 5 ✓).
  verify: |
    def answers():
        t = symbols("t", positive=True)
        t0 = solve((5*t)**2 - (8**2 + (3*t)**2), t)[0]
        meet = Matrix([8, 3*t0])
        return {"t": t0, "v": list(meet / t0)}

