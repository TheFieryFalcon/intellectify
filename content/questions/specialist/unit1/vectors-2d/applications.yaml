- id: spec.vectors-2d.applications.intercept-fixed-time
  skills: { primary: spec.vectors-2d.applications }
  rating: 1550
  responseSkills: {calculation: 1500, reasoning: 1530, synthesis: 1530}
  stem: |
    At noon, a patrol boat is at the origin and a ship is at $6\mathbf{i} + 8\mathbf{j}$ km, moving with velocity $-2\mathbf{i}$ km/h. The patrol boat leaves at noon at constant velocity and meets the ship at 2 pm. Find the patrol boat's velocity and its speed.
  parts:
    - id: a
