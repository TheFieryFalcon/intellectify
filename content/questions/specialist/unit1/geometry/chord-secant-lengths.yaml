    Intersecting chords: $XD = \tfrac{ {{ax}} \times {{xb}} }{ {{cx}} } = {{xd}}$.
    Put $X$ at the origin with $A(-{{ax}}, 0)$, $B({{xb}}, 0)$, $C(0, {{cx}})$, $D(0, -{{xd}})$. The center is on the perpendicular bisectors of both chords: $x = {{qx}}$ and $y = {{qy}}$. The radius is the distance to $A$: $\sqrt{ \left({{hx}}\right)^2 + \left({{qy}}\right)^2 } = {{v}}$.
