- id: spec.geometry.circle-angles.obc-acute
  skills: { primary: spec.geometry.circle-angles }
  rating: 1450
  responseSkills: { reasoning: 1440, proof: 1440, clarity: 1400 }
  stem: |
    $ABC$ is a triangle inscribed in a circle with center $O$, and $\angle BAC$ is acute. Prove that $\angle OBC = 90^\circ - \angle BAC$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-0.684, 1.879], B: [-1.532, -1.286], C: [1.532, -1.286], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: A }
      - { type: segment, from: O, to: B }
      - { type: segment, from: O, to: C }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'center', description: "∠BOC = 2∠BAC (angle at the center)", points: 2, dimension: reasoning }
          - { id: 'isosceles', description: "OB = OC, so ∠OBC = ∠OCB", points: 1, dimension: reasoning }
          - { id: 'sum', description: "Angle sum: ∠OBC = ½(180° − 2∠BAC) = 90° − ∠BAC", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $\angle BAC$ is acute, so it stands on the minor arc $BC$, and $\angle BOC = 2\angle BAC$. $OB = OC$ (radii), so triangle $OBC$ is isosceles with $\angle OBC = \angle OCB = \tfrac{1}{2}(180^\circ - 2\angle BAC) = 90^\circ - \angle BAC$.

- id: spec.geometry.circle-angles.cyclic-trapezium-angles
  skills: { primary: spec.geometry.circle-angles }
  rating: 1450
  responseSkills: { reasoning: 1440, proof: 1440, clarity: 1400 }
  stem: |
    $ABCD$ is a cyclic quadrilateral with $AB \parallel DC$. Prove that $\angle DAB = \angle ABC$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.732, 1], B: [1.732, 1], C: [1.532, -1.286], D: [-1.532, -1.286], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'parallel', description: "AB ∥ DC: ∠DAB + ∠ADC = 180° (co-interior angles)", points: 2, dimension: reasoning }
          - { id: 'cyclic', description: "Cyclic: ∠ABC + ∠ADC = 180° (opposite angles)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "So ∠DAB = ∠ABC", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $AB \parallel DC$, so the co-interior angles at $A$ and $D$ add to $180^\circ$: $\angle DAB = 180^\circ - \angle ADC$. $ABCD$ is cyclic, so opposite angles add to $180^\circ$: $\angle ABC = 180^\circ - \angle ADC$. Hence $\angle DAB = \angle ABC$.

