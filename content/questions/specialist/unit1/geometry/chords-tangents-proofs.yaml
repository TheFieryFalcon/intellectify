# Chords and tangents: written proofs (1.1.7, 1.1.8).

- id: spec.geometry.chords-tangents.diameter-tangents-parallel
  title: "Tangents at the Ends of a Diameter"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Tangent and radius"
  rating: 1290
  responseSkills: { reasoning: 1280, proof: 1280, clarity: 1240 }
  stem: |
    Prove that the tangents at the two ends of a diameter are parallel.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [0, 2], B: [-0, -2], U1: [-1.8, 2], V1: [1.8, 2], U2: [-1.8, -2], V2: [1.8, -2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: U1, to: V1 }
      - { type: segment, from: U2, to: V2 }
      - { type: point, at: A, label: 'A', pos: n }
      - { type: point, at: B, label: 'B', pos: s }
      - { type: point, at: O, label: 'O', pos: e }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'perp', description: "Relates each tangent to the diameter (e.g. tangent ⟂ radius, so both are perpendicular to the diameter)", points: 2, dimension: reasoning }
          - { id: 'parallel', description: "Concludes the tangents are parallel (e.g. two lines perpendicular to the same line)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $AB$ be a diameter. The tangent at $A$ is perpendicular to radius $OA$, and the tangent at $B$ is perpendicular to radius $OB$; both radii lie along the line $AB$. So both tangents are perpendicular to $AB$, and two lines perpendicular to the same line are parallel.

- id: spec.geometry.chords-tangents.bisecting-radius-perpendicular
  title: "Line from the Center to a Chord's Midpoint"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Chords and the center"
  rating: 1200
  bookwork: true
  responseSkills: { reasoning: 1190, proof: 1190, clarity: 1150 }
  stem: |
    $AB$ is a chord (not a diameter) of a circle with center $O$, and $M$ is its midpoint. Prove that $OM \perp AB$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.732, -1], B: [1.732, -1], M: [0, -1], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: M, ticks: 1 }
      - { type: segment, from: M, to: B, ticks: 1 }
      - { type: segment, from: O, to: M }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: M, label: 'M', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'congruent', description: "Shows two triangles are congruent (e.g. OMA and OMB: OA = OB, AM = BM, OM common, SSS)", points: 2, dimension: reasoning }
          - { id: 'angles', description: "Gets equal angles at M that add to 180° (e.g. ∠OMA = ∠OMB)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes OM ⟂ AB (e.g. each angle is 90°)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Triangles $OMA$ and $OMB$ have $OA = OB$ (radii), $AM = BM$ and $OM$ common, so they are congruent (SSS) and $\angle OMA = \angle OMB$. These angles lie on the straight line $AB$, so they add to $180^\circ$; each is $90^\circ$. Hence $OM \perp AB$.

- id: spec.geometry.chords-tangents.perpendicular-bisector-center
  title: "Perpendicular Bisector of a Chord"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Chords and the center"
  rating: 1250
  bookwork: true
  responseSkills: { reasoning: 1240, proof: 1240, clarity: 1200 }
  stem: |
    Prove that the perpendicular bisector of any chord of a circle passes through the center.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.879, -0.684], B: [1.286, -1.532], M: [-0.296, -1.108], K: [0.53, 1.984], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: M, ticks: 1 }
      - { type: segment, from: M, to: B, ticks: 1 }
      - { type: segment, from: M, to: K, dashed: true }
      - { type: angle, at: M, from: B, to: K, right: true }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: M, label: 'M', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'equidistant', description: "Shows the center is equally far from A and B (e.g. OA = OB, radii)", points: 2, dimension: reasoning }
          - { id: 'locus', description: "Links equal distances to the perpendicular bisector (e.g. points equidistant from A and B lie on it)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "So O is on it", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $AB$ be a chord and $O$ the center. $OA = OB$ (radii), so $O$ is equidistant from $A$ and $B$. Every point equidistant from $A$ and $B$ lies on the perpendicular bisector of $AB$. So the perpendicular bisector passes through $O$.

- id: spec.geometry.chords-tangents.concentric-chord-midpoint
  title: "Chord Touching an Inner Circle"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Chords and the center"
  rating: 1420
  responseSkills: { reasoning: 1410, proof: 1410, clarity: 1370 }
  stem: |
    Two circles have the same center $O$. A chord $AB$ of the larger circle touches the smaller circle at $T$. Prove that $T$ is the midpoint of $AB$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.6, -1.2], B: [1.6, -1.2], T: [0, -1.2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: circle, center: O, radius: 1.2 }
      - { type: segment, from: A, to: B }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: T, label: 'T', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'perp', description: "Relates OT to AB (e.g. AB is tangent to the small circle at T, so OT ⟂ AB)", points: 2, dimension: reasoning }
          - { id: 'bisect', description: "Shows T is the midpoint of AB in the larger circle (e.g. the perpendicular from the center to a chord bisects it)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "So AT = TB", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $AB$ touches the smaller circle at $T$, so $OT \perp AB$ (tangent ⟂ radius). In the larger circle, $OT$ is then the perpendicular from the center to the chord $AB$, and that perpendicular bisects the chord. So $T$ is the midpoint of $AB$.

- id: spec.geometry.chords-tangents.op-bisects-angles
  title: "Line to the Center Bisects the Angles"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Tangents from a point"
  rating: 1440
  responseSkills: { reasoning: 1430, proof: 1430, clarity: 1390 }
  stem: |
    Tangents at $A$ and $B$ to a circle with center $O$ meet at $P$. Prove that $OP$ bisects both $\angle APB$ and $\angle AOB$.

    ```diagram
    view: [-2.45, 4.05, -2.45, 2.45]
    width: 230
    points: { P: [3.6, 0], A: [1.111, 1.663], B: [1.111, -1.663], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: P, to: A }
      - { type: segment, from: P, to: B }
      - { type: segment, from: O, to: A }
      - { type: segment, from: O, to: B }
      - { type: segment, from: O, to: P }
      - { type: point, at: O, label: 'O', pos: w }
      - { type: point, at: P, label: 'P', pos: e }
      - { type: point, at: A, label: 'A', pos: n }
      - { type: point, at: B, label: 'B', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'right', description: "Uses the right angles where the tangents touch (e.g. ∠OAP = ∠OBP = 90°, tangent ⟂ radius)", points: 1, dimension: reasoning }
          - { id: 'congruent', description: "Shows the two triangles are congruent (e.g. OAP and OBP by RHS: OP common, OA = OB)", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "Concludes the angles are bisected (e.g. ∠APO = ∠BPO and ∠AOP = ∠BOP)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $\angle OAP = \angle OBP = 90^\circ$ (tangent ⟂ radius). Triangles $OAP$ and $OBP$ have these right angles, the common hypotenuse $OP$, and $OA = OB$ (radii), so they are congruent (RHS). Hence $\angle APO = \angle BPO$ and $\angle AOP = \angle BOP$: $OP$ bisects both angles.

- id: spec.geometry.chords-tangents.op-perpendicular-ab
  title: "Line to the Center Is Perpendicular to the Chord"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Tangents from a point"
  rating: 1460
  responseSkills: { reasoning: 1450, proof: 1450, clarity: 1410 }
  stem: |
    Tangents at $A$ and $B$ to a circle with center $O$ meet at $P$. Prove that $OP$ is perpendicular to $AB$.

    ```diagram
    view: [-2.45, 4.05, -2.45, 2.45]
    width: 230
    points: { P: [3.6, 0], A: [1.111, 1.663], B: [1.111, -1.663], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: P, to: A }
      - { type: segment, from: P, to: B }
      - { type: segment, from: O, to: A }
      - { type: segment, from: O, to: B }
      - { type: segment, from: O, to: P }
      - { type: point, at: O, label: 'O', pos: w }
      - { type: point, at: P, label: 'P', pos: e }
      - { type: point, at: A, label: 'A', pos: n }
      - { type: point, at: B, label: 'B', pos: s }
      - { type: segment, from: A, to: B }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'equal', description: "Finds two points equally far from A and B (e.g. PA = PB, equal tangents, and OA = OB, radii)", points: 2, dimension: reasoning }
          - { id: 'bisector', description: "Places them on the perpendicular bisector of AB", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes OP is that bisector, so OP ⟂ AB", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $PA = PB$ (tangents from one point) and $OA = OB$ (radii). So $P$ and $O$ are both equidistant from $A$ and $B$, and both lie on the perpendicular bisector of $AB$. Two different points determine a line, so $OP$ is that perpendicular bisector, and $OP \perp AB$.

- id: spec.geometry.chords-tangents.isosceles-tangent-parallel
  title: "Tangent at the Apex of an Isosceles Triangle"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "The alternate segment theorem"
  rating: 1480
  responseSkills: { reasoning: 1470, proof: 1470, clarity: 1430 }
  stem: |
    Triangle $ABC$ has $AB = AC$ and its corners on a circle. Prove that the tangent at $A$ is parallel to $BC$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [0, 2], B: [-1.638, -1.147], C: [1.638, -1.147], U: [-1.8, 2], V: [1.8, 2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B, ticks: 1 }
      - { type: segment, from: A, to: C, ticks: 1 }
      - { type: segment, from: B, to: C }
      - { type: segment, from: U, to: V }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'alt', description: "Relates the tangent to an angle of the triangle (e.g. alternate segment: the angle between the tangent and AB equals ∠ACB)", points: 2, dimension: reasoning }
          - { id: 'isosceles', description: "Uses the equal sides (e.g. AB = AC gives ∠ACB = ∠ABC)", points: 1, dimension: reasoning }
          - { id: 'parallel', description: "Concludes the tangent is parallel to BC (e.g. equal alternate angles with AB)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $X$ be a point on the tangent at $A$, on the opposite side of $AB$ from $C$. By the alternate segment theorem, $\angle XAB = \angle ACB$. Since $AB = AC$, $\angle ACB = \angle ABC$. So $\angle XAB = \angle ABC$: these are alternate angles for the lines $AX$ and $BC$ with transversal $AB$, so the tangent is parallel to $BC$.

- id: spec.geometry.chords-tangents.incircle-half-perimeter
  title: "Inscribed Circle and Half the Perimeter"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Tangents from a point"
  rating: 1500
  responseSkills: { reasoning: 1490, proof: 1490, clarity: 1450 }
  stem: |
    A circle inside triangle $ABC$ touches $BC$, $CA$ and $AB$ at $D$, $E$ and $F$. Prove that $AF + BD + CE$ is half the perimeter of the triangle.

    ```diagram
    view: [-2.45, 4.65, -2.45, 3.45]
    width: 260
    points: { A: [0, 0], B: [4.2, 0], C: [1.3, 3], I: [1.649, 1.082], D: [2.427, 1.834], E: [0.655, 1.513], F: [1.649, 0] }
    draw:
      - { type: circle, center: I, radius: 1.082 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: A }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D', pos: ne }
      - { type: point, at: E, label: 'E', pos: nw }
      - { type: point, at: F, label: 'F', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'equal', description: "Finds the equal lengths (e.g. equal tangents: AF = AE, BD = BF, CE = CD)", points: 2, dimension: reasoning }
          - { id: 'perimeter', description: "Writes the perimeter using them (e.g. (AF + FB) + (BD + DC) + (CE + EA) = 2(AF + BD + CE))", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "So AF + BD + CE is half the perimeter", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Tangents from one point are equal: $AF = AE$, $BD = BF$, $CE = CD$. The perimeter is
    $$AB + BC + CA = (AF + FB) + (BD + DC) + (CE + EA) = AF + BD + BD + CE + CE + AF = 2(AF + BD + CE).$$
    So $AF + BD + CE$ is half the perimeter.

- id: spec.geometry.chords-tangents.pitot
  title: "Quadrilateral Around a Circle"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Tangents from a point"
  rating: 1540
  responseSkills: { reasoning: 1530, proof: 1530, clarity: 1490 }
  stem: |
    A circle touches all four sides of quadrilateral $ABCD$. Prove that $AB + CD = BC + DA$.

    ```diagram
    view: [-2.05, 2.07, -1.94, 2.05]
    width: 260
    points: { A: [1.623, 1.034], B: [-1.603, 1.603], C: [-1.122, -1.122], D: [0.947, -1.487], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 1.3 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'tangents', description: "Finds the equal lengths (e.g. the two tangents from each corner are equal: a, b, c, d from A, B, C, D)", points: 2, dimension: reasoning }
          - { id: 'sides', description: "Writes the sides using them (e.g. AB = a + b, BC = b + c, CD = c + d, DA = d + a)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes AB + CD = BC + DA (e.g. both are a + b + c + d)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Each side touches the circle once. From each corner, the two tangents to the circle are equal: call their lengths $a, b, c, d$ at $A, B, C, D$. Then $AB = a + b$, $BC = b + c$, $CD = c + d$ and $DA = d + a$, so $AB + CD = a + b + c + d = BC + DA$.

- id: spec.geometry.chords-tangents.tangent-chord-half-center
  title: "Tangent–Chord Angle and the Center"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "The alternate segment theorem"
  rating: 1560
  responseSkills: { reasoning: 1550, clarity: 1510 }
  stem: |
    A tangent touches a circle with center $O$ at $T$, and $S$ is a point on the tangent. $TB$ is a chord with $\angle STB$ acute. Prove that $\angle TOB = 2\angle STB$.

    ```diagram
    view: [-2.45, 2.65, -2.45, 2.45]
    width: 230
    points: { T: [-0, -2], B: [1.879, 0.684], S: [2.2, -2], U: [-1.6, -2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: U, to: S }
      - { type: segment, from: T, to: B }
      - { type: segment, from: O, to: T }
      - { type: segment, from: O, to: B }
      - { type: point, at: O, label: 'O', pos: w }
      - { type: point, at: T, label: 'T', pos: s }
      - { type: point, at: S, label: 'S', pos: s }
      - { type: point, at: B, label: 'B', pos: ne }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'right', description: "Uses the tangent's right angle (e.g. ∠OTS = 90°, so ∠OTB = 90° − ∠STB)", points: 1, dimension: reasoning }
          - { id: 'isosceles', description: "Uses the equal radii (e.g. OT = OB, so ∠OBT = ∠OTB)", points: 1, dimension: reasoning }
          - { id: 'sum', description: "Concludes ∠TOB = 2∠STB (e.g. angle sum of triangle OTB)", points: 2, dimension: reasoning }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    The tangent is perpendicular to the radius, so $\angle OTS = 90^\circ$ and $\angle OTB = 90^\circ - \angle STB$. $OT = OB$, so triangle $OTB$ is isosceles with $\angle OBT = \angle OTB$. Hence $\angle TOB = 180^\circ - 2(90^\circ - \angle STB) = 2\angle STB$.

- id: spec.geometry.chords-tangents.touching-centers-collinear
  title: "Centers of Touching Circles"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Tangent and radius"
  rating: 1580
  responseSkills: { reasoning: 1570, proof: 1570, clarity: 1530 }
  stem: |
    Two circles touch externally at $T$, sharing the tangent line there. Prove that their centers and $T$ lie on one straight line.

    ```diagram
    view: [-2.7, 3.5, -2.1, 2.1]
    width: 280
    points: { P1: [-1.2, 0], P2: [1.6, 0], T: [0, 0], U: [0, 1.9], V: [0, -1.9] }
    draw:
      - { type: circle, center: P1, radius: 1.2 }
      - { type: circle, center: P2, radius: 1.6 }
      - { type: segment, from: U, to: V }
      - { type: point, at: P1, label: 'O_1', pos: s }
      - { type: point, at: P2, label: 'O_2', pos: s }
      - { type: point, at: T, label: 'T', pos: se }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'perp', description: "Relates each radius to T to the common tangent (e.g. each is perpendicular to it)", points: 2, dimension: reasoning }
          - { id: 'one-line', description: "Explains why there is only one such line (e.g. through T there is only one line perpendicular to the tangent)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes both centers and T are collinear", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let the centers be $O_1$ and $O_2$. The common tangent at $T$ is perpendicular to both radii $O_1T$ and $O_2T$. There is only one line through $T$ perpendicular to the tangent, so $O_1T$ and $O_2T$ both lie along it. Hence $O_1$, $T$, $O_2$ are collinear.

- id: spec.geometry.chords-tangents.triangle-pde-perimeter
