      - { type: point, at: E, label: 'E', pos: ne }
      - { type: point, at: F, label: 'F', pos: nw }
      - { type: point, at: H, label: 'H', pos: e }
      - { type: point, at: K, label: 'H''', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'aefh', description: "Finds ∠FHE in terms of ∠A (e.g. quadrilateral AFHE has right angles at E and F, so ∠FHE = 180° − ∠A)", points: 1, dimension: reasoning }
          - { id: 'bhc', description: "Finds ∠BHC (e.g. vertically opposite ∠FHE: 180° − ∠A)", points: 1, dimension: reasoning }
          - { id: 'reflect', description: "Carries it to the reflection (e.g. reflection keeps angles: ∠BH′C = 180° − ∠A, with H′ on the other side of BC from A)", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "Concludes H′ is on the circle (e.g. ∠BAC + ∠BH′C = 180°: ABH′C cyclic, converse)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    In quadrilateral $AFHE$, $\angle AFH = \angle AEH = 90^\circ$, so $\angle FHE = 360^\circ - 180^\circ - \angle A = 180^\circ - \angle A$. $\angle BHC$ and $\angle FHE$ are vertically opposite, so $\angle BHC = 180^\circ - \angle A$.

    Reflecting in $BC$ keeps $B$ and $C$ fixed and preserves angles, so $\angle BH'C = 180^\circ - \angle A$, with $H'$ on the opposite side of $BC$ from $A$ (the triangle is acute, so $H$ is inside it).

    Then in quadrilateral $ABH'C$, $\angle BAC + \angle BH'C = 180^\circ$, so it is cyclic: $H'$ lies on the circle through $A$, $B$, $C$.

- id: spec.geometry.circle-problems.tangents-meet-concyclic
  title: "Tangents to Two Circles Meeting on a Circle"
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.chords-tangents] }
  subsection: "Proving points lie on a circle"
  rating: 1840
  responseSkills: { reasoning: 1830, proof: 1830, clarity: 1790, synthesis: 1820 }
  stem: |
    Two circles meet at $P$ and $Q$. A line through $P$ meets the first circle again at $A$ and the second circle again at $B$, with $P$ between $A$ and $B$. The tangents at $A$ (to the first circle) and at $B$ (to the second) meet at $T$. Prove that $A$, $T$, $B$, $Q$ lie on one circle.

    ```diagram
    view: [-2.45, 2.97, -2.45, 2.45]
    width: 290
    points: { P1: [-0.9, 0], P2: [1, 0], P: [-0.108, 1.154], Q: [-0.108, -1.154], A: [-1.056, 1.391], B: [2.521, 0.497], T: [2.113, 1.746] }
    draw:
