- id: spec.geometry.proof-methods.cube-even
  skills: {primary: spec.geometry.proof-methods}
  rating: 1520
  responseSkills: {reasoning: 1510, proof: 1510, clarity: 1440}
  stem: |
    Prove that for any integer $n$, if $n^3$ is even, then $n$ is even.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: contra, description: 'Uses the contrapositive (if n is odd, then n³ is odd) or contradiction', points: 1, dimension: proof}
      - {id: expand, description: Writes n = 2k + 1 and expands n³ = 8k³ + 12k² + 6k + 1, points: 2, dimension: reasoning}
      - {id: odd, description: 'Shows this equals 2(4k³ + 6k² + 3k) + 1, which is odd', points: 1, dimension: reasoning}
      - {id: clear, description: 'Clearly set out, with a concluding sentence', points: 1, dimension: clarity}
  solution: |
    Prove the contrapositive. If $n = 2k + 1$ is odd, then $n^3 = 8k^3 + 12k^2 + 6k + 1 = 2(4k^3 + 6k^2 + 3k) + 1$, which is odd. So if $n^3$ is even, $n$ must be even.
