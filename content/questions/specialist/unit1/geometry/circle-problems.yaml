    answer: {type: numeric, key: '{{r}}'}
  solution: |
    The diagonals of a square meet at right angles, so $\angle AOB = 90^\circ$. By the converse of the angle in a semicircle, $O$ lies on the circle with diameter $AB$. That circle passes through $A$, $B$ and $O$, and its radius is $\tfrac{1}{2}AB = {{r}}$.
  verify: |
