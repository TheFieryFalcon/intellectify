- id: spec.combinatorics.combinations.examination
  skills: { primary: spec.combinatorics.combinations, secondary: [spec.combinatorics.permutations] }
  rating: 1650
  responseSkills: { synthesis: 1640, calculation: 1600 }
  stem: |
    How many different 4-letter arrangements can be made from the letters of the word **EXAMINATION**? (Each letter can be used no more times than it appears in the word.)
  parts:
    - id: a
      answer: { type: numeric, key: 2454 }
  solution: |
    EXAMINATION has 8 different letters: A, I and N appear twice, and E, X, M, T and O once.

    - **All 4 letters different:** $^{8}P_{4} = 1680$.
    - **One repeated pair plus 2 other different letters:** choose the pair (3 ways) and 2 of the other 7 letters ($\binom{7}{2} = 21$), then arrange $\frac{4!}{2!} = 12$ ways. That's $3 \times 21 \times 12 = 756$.
    - **Two repeated pairs:** $\binom{3}{2} = 3$ choices, each arranged $\frac{4!}{2!\,2!} = 6$ ways, giving $18$.

    Total $1680 + 756 + 18 = 2454$.
  verify: |
    from itertools import permutations
    def answers():
        return {"a": len(set(permutations("EXAMINATION", 4)))}

- id: spec.combinatorics.combinations.pairs-up
  skills: { primary: spec.combinatorics.combinations }
  rating: 1680
  responseSkills: { synthesis: 1660, calculation: 1600 }
  variants:
    - { n: 8, k: 4, v: 105 }
    - { n: 6, k: 3, v: 15 }
  stem: |
    In how many ways can {{n}} people be split into {{k}} pairs? (Only who is paired with whom matters.)
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Choose the pairs one at a time with $\binom{ {{n}} }{2}\binom{ {{n}}-2 }{2}\cdots\binom{2}{2}$, then divide by ${{k}}!$, because the order the pairs were chosen in doesn't matter. This gives {{v}}.

    Alternatively: the first person can be paired with ${{n}}-1$ others; the next unpaired person with ${{n}}-3$ others, and so on. The product of these odd numbers is {{v}}.
  verify: |
    def answers(n, k, v):
        result = 1
        for m in range(n - 1, 0, -2):
            result *= m
        return {"a": result}

# ─────────────── Tier 5 ───────────────
- id: spec.combinatorics.combinations.every-suit
  skills: { primary: spec.combinatorics.combinations }
  rating: 1720
  responseSkills: { synthesis: 1720, calculation: 1620 }
  stem: |
    From a standard 52-card deck (13 cards in each of 4 suits), how many 5-card hands contain at least one card of every suit?
  parts:
    - id: a
      answer: { type: numeric, key: 685464 }
  solution: |
    Five cards covering four suits means one suit appears twice and the others once. Choose that suit (4 ways), 2 of its cards ($\binom{13}{2} = 78$), and one card from each other suit ($13^3$): $4 \times 78 \times 2197 = 685\,464$.
  verify: |
    def answers():
        return {"a": 4 * binomial(13, 2) * 13**3}

- id: spec.combinatorics.combinations.no-consecutive-subsets
  skills: { primary: spec.combinatorics.combinations }
  rating: 1800
  responseSkills: { synthesis: 1800, proof: 1720 }
  stem: |
    How many subsets of $\{1, 2, 3, \dots, 10\}$ (including the empty set) contain **no two consecutive numbers**?
  parts:
    - id: a
      answer: { type: numeric, key: 144 }
  solution: |
    **Method 1 (by size).** Choosing $k$ non-consecutive numbers from $1, \dots, n$ is the same as choosing $k$ numbers from $1, \dots, n-k+1$: subtract 0 from the smallest, 1 from the next, 2 from the next, and so on, which closes the gaps. So there are $\binom{n-k+1}{k}$ such subsets. For $n = 10$: $1 + 10 + 36 + 56 + 35 + 6 = 144$.

    **Method 2 (building up).** Let $a_n$ be the count for $\{1, \dots, n\}$. A subset either leaves out $n$ ($a_{n-1}$ ways) or includes $n$ and so leaves out $n - 1$ ($a_{n-2}$ ways). So $a_n = a_{n-1} + a_{n-2}$, with $a_1 = 2$ and $a_2 = 3$, which gives $a_{10} = 144$.
  verify: |
    from itertools import combinations as combos
    def answers():
        total = sum(1 for k in range(11) for s in combos(range(1, 11), k) if all(s[i + 1] - s[i] > 1 for i in range(len(s) - 1)))
        return {"a": total}

- id: spec.combinatorics.combinations.capped-sharing
  skills: { primary: spec.combinatorics.combinations, secondary: [spec.combinatorics.inclusion-exclusion] }
  rating: 1790
  responseSkills: { synthesis: 1790, calculation: 1650 }
  stem: |
    10 identical sweets are shared among 4 children so that every child gets **at least 1** and **no child gets more than 4**. In how many ways can this be done?
  parts:
    - id: a
      answer: { type: numeric, key: 44 }
  solution: |
    Give each child 1 sweet first. Then share the remaining 6 so that no child gets more than 3 extra.

    - Without the cap: $\binom{9}{3} = 84$ ways.
    - Remove the cases where some child gets 4 or more extra: give that child 4 and share the other 2 freely, which is $4 \times \binom{5}{3} = 40$. Two children can't both get 4 or more extra, since $8 > 6$.

    Answer: $84 - 40 = 44$.
  verify: |
    from itertools import product
    def answers():
        return {"a": sum(1 for p in product(range(1, 5), repeat=4) if sum(p) == 10)}
