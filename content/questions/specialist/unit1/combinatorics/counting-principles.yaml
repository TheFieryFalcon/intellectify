- id: spec.combinatorics.counting-principles.number-plates
  skills: { primary: spec.combinatorics.counting-principles }
  subsection: "Multiplication principle"
  rating: 1320
  responseSkills: { calculation: 1300, reading: 1320 }
  stem: |
    A number plate has three letters (A–Z) followed by three digits (0–9). Letters may repeat but digits may not. How many number plates are possible?
  parts:
    - id: a
      answer: { type: numeric, key: 12654720 }
  solution: |
    Letters: $26^3 = 17\,576$. Digits with no repeats: $10 \times 9 \times 8 = 720$. By the multiplication principle, $17\,576 \times 720 = 12\,654\,720$.
  verify: |
    def answers():
        return {"a": 26**3 * 10 * 9 * 8}

- id: spec.combinatorics.counting-principles.cafe-or
  skills: { primary: spec.combinatorics.counting-principles }
