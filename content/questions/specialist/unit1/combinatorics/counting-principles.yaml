- id: spec.combinatorics.counting-principles.solve-npr
  skills: { primary: spec.combinatorics.counting-principles }
  subsection: "Factorials and nPr"
  rating: 1360
  responseSkills: { calculation: 1350 }
  variants:
    - { v: 56, n: 8 }
    - { v: 110, n: 11 }
    - { v: 132, n: 12 }
  stem: |
    Find $n$ if $^{n}P_2 = {{v}}$.
  parts:
    - id: a
      prompt: $n =$
      answer: { type: numeric, key: '{{n}}' }
  solution: |
    $^{n}P_2 = n(n-1) = {{v}}$, so $n^2 - n - {{v}} = 0$. The positive solution is $n = {{n}}$.
  verify: |
    def answers(v, n):
        x = symbols("x")
        return {"a": [s for s in solve(x * (x - 1) - v, x) if s > 0][0]}

