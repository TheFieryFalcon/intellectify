- id: spec.vectors-2d.components.solve-scalars
  skills: { primary: spec.vectors-2d.components }
  rating: 1350
  responseSkills: { calculation: 1340, reading: 1320 }
  variants:
    - { c1: 7, c2: 2 }
    - { c1: 4, c2: 5 }
  stem: |
    Find the numbers $p$ and $q$ such that $p\begin{pmatrix} 2 \\ 1 \end{pmatrix} + q\begin{pmatrix} 1 \\ -1 \end{pmatrix} = \begin{pmatrix} {{c1}} \\ {{c2}} \end{pmatrix}$.
  parts:
    - id: p
      prompt: $p =$
      answer: { type: numeric, key: '\frac{ {{c1}}+{{c2}} }{3}' }
    - id: q
      prompt: $q =$
      answer: { type: numeric, key: '\frac{ {{c1}}-2\cdot{{c2}} }{3}' }
  solution: |
    Match components: $2p + q = {{c1}}$ and $p - q = {{c2}}$. Adding gives $3p = {{c1}} + {{c2}}$; then $q = p - {{c2}}$.
  verify: |
    def answers(c1, c2):
        p, q = symbols("p q")
        s = solve([2*p + q - c1, p - q - c2], [p, q])
        return {"p": s[p], "q": s[q]}

- id: spec.vectors-2d.components.fourth-corner
  skills: { primary: spec.vectors-2d.components }
  rating: 1370
  responseSkills: { reading: 1360, calculation: 1300 }
  variants:
    - { ax: 1, ay: 2, bx: 4, by: 3, cx: 6, cy: 7 }
    - { ax: -2, ay: 0, bx: 3, by: -1, cx: 5, cy: 4 }
  stem: |
    $ABCD$ is a parallelogram with $A({{ax}}, {{ay}})$, $B({{bx}}, {{by}})$ and $C({{cx}}, {{cy}})$. Find the coordinates of $D$, as a position vector.
  parts:
    - id: a
      answer: { type: vector, key: ['{{ax}}+{{cx}}-({{bx}})', '{{ay}}+{{cy}}-({{by}})'] }
  solution: |
    In parallelogram $ABCD$, $\overrightarrow{AD} = \overrightarrow{BC}$. So $\overrightarrow{OD} = \overrightarrow{OA} + \overrightarrow{BC} = \overrightarrow{OA} + \overrightarrow{OC} - \overrightarrow{OB}$.
  verify: |
    def answers(ax, ay, bx, by, cx, cy):
        return {"a": [ax + cx - bx, ay + cy - by]}

