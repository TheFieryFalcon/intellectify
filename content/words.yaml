# Flies with an airspeed and a heading, and can be blown by wind.
aircraft:
  - plane
  - seaplane
  - helicopter
  - light aircraft
  - jet
  - glider
  - drone
  - air ambulance

# Moves through water with a heading, and can be carried by a current.
vessel:
  - boat
  - ship
  - yacht
  - ferry
  - motorboat
  - fishing boat
  - catamaran
  - tugboat

# Crosses a river under its own power, pointing straight across.
crosser:
  - { name: swimmer, verb: swims }
  - { name: kayaker, verb: paddles }
  - { name: rower, verb: rows }
  - { name: paddleboarder, verb: paddles }

# Travels on roads.
road:
  - car
  - truck
  - bus
  - van
  - motorbike
  - taxi

# Matching distance and speed units (time stays in hours).
units:
  - { name: km, distance: km, speed: km/h }
  - { name: nautical miles, distance: nautical miles, speed: knots }
  - { name: miles, distance: miles, speed: mph }

# School clubs and groups (singular; "the {{club}}").
