# Section quiz pool: Vectors in the plane (1.3). Never served in practice (SPEC §8.1a).

- id: spec.vectors-2d.sq.add-components
  title: "Adding Vectors in Components"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.components }
  subsection: "Notation and arithmetic"
  rating: 1050
  responseSkills: { calculation: 1030 }
  stem: |
    $\mathbf{a} = 3\mathbf{i} - 2\mathbf{j}$ and $\mathbf{b} = -\mathbf{i} + 5\mathbf{j}$. Find $\mathbf{a} + \mathbf{b}$.
  parts:
    - id: a
      answer: { type: vector, key: ['2', '3'] }
  solution: |
    Add matching components: $(3 - 1)\mathbf{i} + (-2 + 5)\mathbf{j} = 2\mathbf{i} + 3\mathbf{j}$.
  verify: |
    def answers():
        return {"a": [3 - 1, -2 + 5]}

- id: spec.vectors-2d.sq.length-6-8
  title: "Length of a Vector"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.components }
  subsection: "Magnitude and direction"
  rating: 1080
  responseSkills: { calculation: 1060 }
  stem: |
    Find $|6\mathbf{i} - 8\mathbf{j}|$.
  parts:
    - id: a
      answer: { type: numeric, key: 10 }
  solution: |
    $\sqrt{6^2 + 8^2} = \sqrt{100} = 10$.
  verify: |
    def answers():
        return {"a": sympy.sqrt(6**2 + 8**2)}

- id: spec.vectors-2d.sq.parallelogram-diagonal
  title: "Diagonal of a Parallelogram (Quiz)"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.geometric }
  subsection: "Adding and subtracting"
  rating: 1120
  responseSkills: { reading: 1100, reasoning: 1090 }
  stem: |
    $ABCD$ is a parallelogram with $\overrightarrow{AB} = \mathbf{u}$ and $\overrightarrow{AD} = \mathbf{v}$. Which vector is $\overrightarrow{AC}$?
  parts:
    - id: a
      options:
        - { id: a, text: '$\mathbf{u} - \mathbf{v}$' }
        - { id: b, text: '$\mathbf{u} + \mathbf{v}$' }
        - { id: c, text: '$\mathbf{v} - \mathbf{u}$' }
        - { id: d, text: '$2\mathbf{u}$' }
      answer: { type: mcq, key: b }
  solution: |
    Go $A \to B \to C$. $\overrightarrow{BC} = \overrightarrow{AD} = \mathbf{v}$ (opposite sides of a parallelogram), so $\overrightarrow{AC} = \mathbf{u} + \mathbf{v}$.
  verify: |
    def answers():
        return {"a": "b"}

- id: spec.vectors-2d.sq.dot-2-3-4-1
  title: "Scalar Product in Components (Quiz)"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Calculating the scalar product"
  rating: 1150
  responseSkills: { calculation: 1130 }
  stem: |
    Find $(2\mathbf{i} + 3\mathbf{j}) \cdot (4\mathbf{i} - \mathbf{j})$.
  parts:
    - id: a
      answer: { type: numeric, key: 5 }
  solution: |
    $2 \times 4 + 3 \times (-1) = 8 - 3 = 5$.
  verify: |
    def answers():
        return {"a": 2 * 4 + 3 * (-1)}

- id: spec.vectors-2d.sq.unit-5-12
  title: "Unit Vector in a Given Direction (Quiz)"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.components }
  subsection: "Magnitude and direction"
  rating: 1290
  responseSkills: { calculation: 1270 }
  stem: |
    Find the unit vector in the direction of $5\mathbf{i} + 12\mathbf{j}$.
  parts:
    - id: a
      answer: { type: vector, key: ['\frac{5}{13}', '\frac{12}{13}'], form: [exact] }
  solution: |
    $|5\mathbf{i} + 12\mathbf{j}| = 13$, so the unit vector is $\tfrac{5}{13}\mathbf{i} + \tfrac{12}{13}\mathbf{j}$.
  verify: |
    def answers():
        n = sympy.sqrt(5**2 + 12**2)
        return {"a": [5 / n, 12 / n]}

- id: spec.vectors-2d.sq.perp-k
  title: "Finding k for Perpendicular Vectors (Quiz)"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Perpendicular and parallel vectors"
  rating: 1320
  responseSkills: { calculation: 1300, reasoning: 1300 }
  stem: |
    Find $k$ so that $k\mathbf{i} + 4\mathbf{j}$ is perpendicular to $6\mathbf{i} - 3\mathbf{j}$.
  parts:
    - id: a
      answer: { type: numeric, key: 2 }
  solution: |
    Perpendicular vectors have dot product 0: $6k - 12 = 0$, so $k = 2$.
  verify: |
    def answers():
        k = sympy.symbols("k")
        return {"a": sympy.solve(6 * k - 12, k)[0]}

- id: spec.vectors-2d.sq.position-after-4
  title: "Position After Constant Velocity"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.applications }
  subsection: "Position and constant velocity"
  rating: 1350
  responseSkills: { reading: 1330, calculation: 1320 }
  stem: |
    A particle starts at the point $(1, 2)$ and moves with constant velocity $3\mathbf{i} - \mathbf{j}$ units per second. Find its position vector after 4 seconds.
  parts:
    - id: a
      answer: { type: vector, key: ['13', '-2'] }
  solution: |
    $\mathbf{r} = (\mathbf{i} + 2\mathbf{j}) + 4(3\mathbf{i} - \mathbf{j}) = 13\mathbf{i} - 2\mathbf{j}$.
  verify: |
    def answers():
        return {"a": [1 + 4 * 3, 2 + 4 * (-1)]}

- id: spec.vectors-2d.sq.scalar-proj-2
  title: "Scalar Projection (Quiz)"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.projection }
  subsection: "Scalar projection"
  rating: 1380
  responseSkills: { calculation: 1360 }
  stem: |
    Find the scalar projection of $2\mathbf{i} + \mathbf{j}$ onto $3\mathbf{i} + 4\mathbf{j}$.
  parts:
    - id: a
      answer: { type: numeric, key: 2 }
  solution: |
    $\dfrac{(2\mathbf{i} + \mathbf{j}) \cdot (3\mathbf{i} + 4\mathbf{j})}{|3\mathbf{i} + 4\mathbf{j}|} = \dfrac{6 + 4}{5} = 2$.
  verify: |
    def answers():
        return {"a": sympy.Rational(2 * 3 + 1 * 4, 5)}

- id: spec.vectors-2d.sq.cos-1-1-1-7
  title: "Cosine of the Angle Between Two Vectors"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Angle between vectors"
  rating: 1420
  responseSkills: { calculation: 1400 }
  stem: |
    Find $\cos\theta$, where $\theta$ is the angle between $\mathbf{i} + \mathbf{j}$ and $\mathbf{i} + 7\mathbf{j}$.
  parts:
    - id: a
      answer: { type: numeric, key: '\frac{4}{5}', form: [exact] }
  solution: |
    $\cos\theta = \dfrac{1 + 7}{\sqrt{2}\,\sqrt{50}} = \dfrac{8}{10} = \dfrac{4}{5}$.
  verify: |
    def answers():
        return {"a": sympy.Rational(8) / (sympy.sqrt(2) * sympy.sqrt(50))}

- id: spec.vectors-2d.sq.vproj-4-1
  title: "Vector Projection (Quiz)"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.projection }
  subsection: "Vector projection"
  rating: 1450
  responseSkills: { calculation: 1430 }
  stem: |
    Find the vector projection of $4\mathbf{i} + \mathbf{j}$ onto $\mathbf{i} + 2\mathbf{j}$.
  parts:
    - id: a
      answer: { type: vector, key: ['\frac{6}{5}', '\frac{12}{5}'], form: [exact] }
  solution: |
    $\dfrac{(4)(1) + (1)(2)}{1^2 + 2^2}(\mathbf{i} + 2\mathbf{j}) = \dfrac{6}{5}(\mathbf{i} + 2\mathbf{j}) = \dfrac{6}{5}\mathbf{i} + \dfrac{12}{5}\mathbf{j}$.
  verify: |
    def answers():
        f = sympy.Rational(4 * 1 + 1 * 2, 1 + 4)
        return {"a": [f, 2 * f]}

- id: spec.vectors-2d.sq.plane-240-70
  title: "Plane's Ground Speed in a Crosswind"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.applications }
  subsection: "Navigation with wind and current"
  rating: 1480
  responseSkills: { reading: 1460, calculation: 1460 }
  stem: |
    A plane's velocity relative to the air is 240 km/h due east. A wind blows due north at 70 km/h. Find the plane's speed over the ground.
  parts:
    - id: a
      answer: { type: numeric, key: 250 }
  solution: |
    Ground velocity $= 240\mathbf{i} + 70\mathbf{j}$, so the speed is $\sqrt{240^2 + 70^2} = 250$ km/h.
  verify: |
    def answers():
        return {"a": sympy.sqrt(240**2 + 70**2)}

- id: spec.vectors-2d.sq.difference-3-5-60
  title: "Length of a Difference of Vectors"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.geometric }
  subsection: "Magnitudes from the triangle rule"
  rating: 1430
  responseSkills: { calculation: 1410, reasoning: 1410 }
  stem: |
    $|\mathbf{a}| = 3$, $|\mathbf{b}| = 5$ and the angle between $\mathbf{a}$ and $\mathbf{b}$ is $60^\circ$. Find $|\mathbf{a} - \mathbf{b}|$ exactly.
  parts:
    - id: a
      answer: { type: numeric, key: '\sqrt{19}', form: [exact] }
  solution: |
    Drawn from one point, $\mathbf{a}$, $\mathbf{b}$ and $\mathbf{a} - \mathbf{b}$ make a triangle whose angle between the sides of length 3 and 5 is $60^\circ$. Cosine rule: $|\mathbf{a} - \mathbf{b}|^2 = 9 + 25 - 2(3)(5)\cos 60^\circ = 19$, so $|\mathbf{a} - \mathbf{b}| = \sqrt{19}$.
  verify: |
    def answers():
        return {"a": sympy.sqrt(9 + 25 - 2 * 3 * 5 * sympy.cos(sympy.pi / 3))}

- id: spec.vectors-2d.sq.collinear-k
  title: "Three Points on a Line (Quiz)"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.components }
  subsection: "Points and parallel vectors"
  rating: 1440
  responseSkills: { reading: 1420, calculation: 1420, reasoning: 1420 }
  stem: |
    The points $A(1, 2)$, $B(4, 6)$ and $C(10, k)$ lie on one straight line. Find $k$.
  parts:
    - id: a
      answer: { type: numeric, key: 14 }
  solution: |
    $\overrightarrow{AB} = 3\mathbf{i} + 4\mathbf{j}$ and $\overrightarrow{AC} = 9\mathbf{i} + (k - 2)\mathbf{j}$ must be parallel: $\overrightarrow{AC} = 3\overrightarrow{AB}$, so $k - 2 = 12$ and $k = 14$.
  verify: |
    def answers():
        k = sympy.symbols("k")
        return {"a": sympy.solve(sympy.Eq(3 * (k - 2), 4 * 9), k)[0]}

- id: spec.vectors-2d.sq.square-diagonals
  title: "Diagonals of a Square by Vectors"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.proofs }
  subsection: "Parallelograms and rhombuses"
  rating: 1500
  responseSkills: { reasoning: 1490, proof: 1490, clarity: 1440 }
  stem: |
    $OABC$ is a square with $\overrightarrow{OA} = \mathbf{a}$ and $\overrightarrow{OC} = \mathbf{c}$. Use vectors to prove that its diagonals are perpendicular and equal in length.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: facts, description: "States what makes it a square in vector terms (e.g. sides a and c with |a| = |c| and a · c = 0)", points: 1, dimension: proof }
          - { id: diagonals, description: "Writes the diagonals in terms of those vectors (e.g. a + c and a − c)", points: 1, dimension: reasoning }
          - { id: perp, description: "Shows the diagonals are perpendicular (e.g. (a + c) · (a − c) = |a|² − |c|² = 0)", points: 1, dimension: reasoning }
          - { id: equal, description: "Shows the diagonals are equal in length (e.g. |a + c|² = |a|² + 2a · c + |c|² = |a − c|²)", points: 1, dimension: reasoning }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    In a square, $|\mathbf{a}| = |\mathbf{c}|$ and $\mathbf{a} \cdot \mathbf{c} = 0$. The diagonals are $\overrightarrow{OB} = \mathbf{a} + \mathbf{c}$ and $\overrightarrow{CA} = \mathbf{a} - \mathbf{c}$.

    $(\mathbf{a} + \mathbf{c}) \cdot (\mathbf{a} - \mathbf{c}) = |\mathbf{a}|^2 - |\mathbf{c}|^2 = 0$, so the diagonals are perpendicular.

    $|\mathbf{a} \pm \mathbf{c}|^2 = |\mathbf{a}|^2 \pm 2\,\mathbf{a} \cdot \mathbf{c} + |\mathbf{c}|^2 = |\mathbf{a}|^2 + |\mathbf{c}|^2$ for both signs, so the diagonals are equal in length.

- id: spec.vectors-2d.sq.dot-from-lengths
  title: "Scalar Product from Three Lengths"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Magnitudes and the scalar product"
  rating: 1600
  responseSkills: { calculation: 1580, reasoning: 1590 }
  stem: |
    $|\mathbf{a}| = 2$, $|\mathbf{b}| = 3$ and $|\mathbf{a} + \mathbf{b}| = 4$. Find $\mathbf{a} \cdot \mathbf{b}$.
  parts:
    - id: a
      answer: { type: numeric, key: '\frac{3}{2}', form: [exact] }
  solution: |
    $|\mathbf{a} + \mathbf{b}|^2 = |\mathbf{a}|^2 + 2\,\mathbf{a} \cdot \mathbf{b} + |\mathbf{b}|^2$, so $16 = 4 + 2\,\mathbf{a} \cdot \mathbf{b} + 9$ and $\mathbf{a} \cdot \mathbf{b} = \tfrac{3}{2}$.
  verify: |
    def answers():
        return {"a": sympy.Rational(16 - 4 - 9, 2)}

- id: spec.vectors-2d.sq.midpoint-theorem
  title: "Midpoint Theorem by Vectors (Quiz)"
  pool: section-quiz
  skills: { primary: spec.vectors-2d.proofs }
  subsection: "Triangles and circles"
  rating: 1550
  bookwork: true
  responseSkills: { reasoning: 1540, proof: 1540, clarity: 1490 }
  stem: |
    In triangle $OAB$, $M$ and $N$ are the midpoints of $OA$ and $OB$. Use vectors to prove that $MN$ is parallel to $AB$ and half its length.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: setup, description: "Sets up vectors for the triangle and writes the midpoints in terms of them (e.g. OA = a, OB = b, so OM = ½a and ON = ½b)", points: 1, dimension: proof }
          - { id: mn, description: "Finds MN in terms of those vectors (e.g. MN = ON − OM = ½(b − a))", points: 1, dimension: reasoning }
          - { id: ab, description: "Relates MN to AB (e.g. AB = b − a, so MN = ½ AB)", points: 1, dimension: reasoning }
          - { id: conclude, description: "Concludes MN is parallel to AB and half as long (e.g. a vector that is ½ times another)", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $\overrightarrow{OA} = \mathbf{a}$ and $\overrightarrow{OB} = \mathbf{b}$. Then $\overrightarrow{OM} = \tfrac{1}{2}\mathbf{a}$ and $\overrightarrow{ON} = \tfrac{1}{2}\mathbf{b}$, so $\overrightarrow{MN} = \tfrac{1}{2}\mathbf{b} - \tfrac{1}{2}\mathbf{a} = \tfrac{1}{2}(\mathbf{b} - \mathbf{a}) = \tfrac{1}{2}\overrightarrow{AB}$.

    So $MN$ is parallel to $AB$, and half its length.
