# Converses and circle geometry problems: written proofs (1.1.9).

- id: spec.geometry.circle-problems.two-right-angles-concyclic
  title: "Two Right Angles on the Same Segment"
  skills: { primary: spec.geometry.circle-problems }
  subsection: "Proving points lie on a circle"
  rating: 1400
  responseSkills: { reasoning: 1390, proof: 1390, clarity: 1350 }
  stem: |
    Points $A$, $B$, $C$, $D$ satisfy $\angle ACB = \angle ADB = 90^\circ$. Prove that they lie on one circle.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 240
    points: { A: [-2, 0], B: [2, 0], C: [1, 1.732], D: [-1.147, -1.638] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: A, to: C }
      - { type: segment, from: B, to: C }
      - { type: segment, from: A, to: D }
      - { type: segment, from: B, to: D }
      - { type: angle, at: C, from: A, to: B, right: true }
      - { type: angle, at: D, from: A, to: B, right: true }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: e }
      - { type: point, at: C, label: 'C', pos: n }
      - { type: point, at: D, label: 'D', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'c', description: "Places C on the circle with diameter AB (e.g. ∠ACB = 90°, converse of the angle in a semicircle)", points: 2, dimension: reasoning }
          - { id: 'd', description: "Places D on the same circle (e.g. ∠ADB = 90°)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes A, B, C, D lie on one circle", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    By the converse of the angle in a semicircle, $\angle ACB = 90^\circ$ means $C$ lies on the circle with diameter $AB$, and $\angle ADB = 90^\circ$ means $D$ lies on that same circle. $A$ and $B$ are on it too, so all four points are concyclic.

- id: spec.geometry.circle-problems.perpendicular-bisectors-meet
  title: "Perpendicular Bisectors of a Triangle Meet"
  skills: { primary: spec.geometry.circle-problems }
  subsection: "Proving points lie on a circle"
  rating: 1450
  responseSkills: { reasoning: 1440, proof: 1440, clarity: 1400 }
  stem: |
    Prove that the perpendicular bisectors of the three sides of a triangle meet at one point, and that this point is the center of a circle through the three corners.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.8, -0.8], B: [2, -0.8], C: [0.4, 1.8] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: A }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: se }
      - { type: point, at: C, label: 'C', pos: n }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'two', description: "Names a candidate center (e.g. O, where the perpendicular bisectors of AB and BC meet; they aren't parallel since AB and BC aren't)", points: 1, dimension: proof }
          - { id: 'equal', description: "Shows it is equally far from all three corners (e.g. OA = OB and OB = OC, from the perpendicular bisectors)", points: 2, dimension: reasoning }
          - { id: 'third', description: "Shows the third bisector passes through it (e.g. OA = OC puts O on the perpendicular bisector of CA)", points: 1, dimension: reasoning }
          - { id: 'circle', description: "Concludes there is a circle through A, B and C (e.g. center O, radius OA)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    The sides $AB$ and $BC$ aren't parallel, so their perpendicular bisectors meet at a point $O$. Being on the first gives $OA = OB$, and on the second $OB = OC$. So $OA = OC$, and $O$ is also on the perpendicular bisector of $CA$: all three meet at $O$. Since $OA = OB = OC$, the circle with center $O$ through $A$ passes through $B$ and $C$.

- id: spec.geometry.circle-problems.kite-right-angle-cyclic
  title: "Kite with a Right Angle Is Cyclic"
  skills: { primary: spec.geometry.circle-problems }
  subsection: "Proving points lie on a circle"
  rating: 1520
  responseSkills: { reasoning: 1510, proof: 1510, clarity: 1470 }
  stem: |
    $ABCD$ is a kite with $AB = AD$, $CB = CD$ and $\angle ABC = 90^\circ$. Prove that $ABCD$ is cyclic and that $AC$ is a diameter of its circle.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-2, 0], B: [-0.684, -1.879], C: [2, 0], D: [-0.684, 1.879] }
    draw:
      - { type: segment, from: A, to: B, ticks: 1 }
      - { type: segment, from: A, to: D, ticks: 1 }
      - { type: segment, from: C, to: B, ticks: 2 }
      - { type: segment, from: C, to: D, ticks: 2 }
      - { type: angle, at: B, from: A, to: C, right: true }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: s }
      - { type: point, at: C, label: 'C', pos: e }
      - { type: point, at: D, label: 'D', pos: n }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'equal', description: "Shows the angle at D is also 90° (e.g. triangles ABC and ADC congruent by SSS, so ∠ADC = ∠ABC)", points: 2, dimension: reasoning }
          - { id: 'cyclic', description: "Concludes ABCD is cyclic (e.g. opposite angles B and D add to 180°, converse)", points: 1, dimension: reasoning }
          - { id: 'diameter', description: "Concludes AC is a diameter (e.g. the 90° angle at B stands on AC)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Triangles $ABC$ and $ADC$ have $AB = AD$, $CB = CD$ and $AC$ common, so they are congruent and $\angle ADC = \angle ABC = 90^\circ$. Then $\angle ABC + \angle ADC = 180^\circ$, so by the converse of the cyclic quadrilateral theorem $ABCD$ is cyclic. In that circle, $\angle ABC = 90^\circ$ is an angle in a semicircle on $AC$, so $AC$ is a diameter.

- id: spec.geometry.circle-problems.isosceles-trapezium-cyclic
  title: "Isosceles Trapezium Is Cyclic"
  skills: { primary: spec.geometry.circle-problems }
  subsection: "Proving points lie on a circle"
  rating: 1520
  responseSkills: { reasoning: 1510, proof: 1510, clarity: 1470 }
  stem: |
    $ABCD$ is a trapezium with $AB \parallel DC$ and $AD = BC$, and it is not a parallelogram. You may use that its base angles are equal: $\angle DAB = \angle CBA$. Prove that $ABCD$ is cyclic.

    ```diagram
    view: [-2.45, 4.45, -2.45, 2.45]
    width: 260
    points: { A: [0, 0], B: [4, 0], C: [3.316, 1.879], D: [0.684, 1.879] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C, ticks: 1 }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A, ticks: 1 }
      - { type: angle, at: A, from: B, to: D, radius: 20 }
      - { type: angle, at: B, from: C, to: A, radius: 20 }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: se }
      - { type: point, at: C, label: 'C', pos: ne }
      - { type: point, at: D, label: 'D', pos: nw }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'cointerior', description: "Uses the parallel sides (e.g. AB ∥ DC: ∠CBA + ∠BCD = 180°, co-interior angles)", points: 2, dimension: reasoning }
          - { id: 'swap', description: "Brings in the equal base angles (e.g. so ∠DAB + ∠BCD = 180°)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes ABCD is cyclic (e.g. opposite angles add to 180°, converse)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $AB \parallel DC$, so the co-interior angles at $B$ and $C$ add to $180^\circ$: $\angle CBA + \angle BCD = 180^\circ$. Since $\angle DAB = \angle CBA$, this gives $\angle DAB + \angle BCD = 180^\circ$. Opposite angles add to $180^\circ$, so by the converse of the cyclic quadrilateral theorem, $ABCD$ is cyclic.

- id: spec.geometry.circle-problems.circle-through-bc-antiparallel
  title: "Circle Through Two Corners of a Triangle"
  skills: { primary: spec.geometry.circle-problems }
  subsection: "Finding and proving angles"
  rating: 1520
  responseSkills: { reasoning: 1510, proof: 1510, clarity: 1470 }
  stem: |
    In triangle $ABC$, a circle through $B$ and $C$ meets $AB$ again at $D$ and $AC$ again at $E$ (between the corners). Prove that $\angle ADE = \angle ACB$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 3.45]
    width: 250
    points: { A: [0, 3], B: [-2, 0], C: [2, 0], Q: [0, -0.5], D: [-1.231, 1.154], E: [1.231, 1.154] }
    draw:
      - { type: circle, center: Q, radius: 2.062 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: A }
      - { type: segment, from: D, to: E }
      - { type: point, at: A, label: 'A', pos: n }
      - { type: point, at: B, label: 'B', pos: w }
      - { type: point, at: C, label: 'C', pos: e }
      - { type: point, at: D, label: 'D', pos: w }
      - { type: point, at: E, label: 'E', pos: e }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'cyclic', description: "Uses that B, D, E, C lie on one circle (e.g. BDEC is a cyclic quadrilateral)", points: 1, dimension: reasoning }
          - { id: 'exterior', description: "Relates ∠ADE to an angle of the circle (e.g. exterior angle at D equals the interior opposite angle ∠BCE)", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "Concludes ∠ADE = ∠ACB (e.g. ∠BCE = ∠ACB, since E is on AC)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $B$, $D$, $E$, $C$ lie on the circle, so $BDEC$ is a cyclic quadrilateral. $A$, $D$, $B$ are collinear, so $\angle ADE$ is an exterior angle of it at $D$, and equals the interior opposite angle $\angle BCE$. Since $E$ lies on $AC$, $\angle BCE = \angle ACB$. Hence $\angle ADE = \angle ACB$.

- id: spec.geometry.circle-problems.converse-same-arc
  title: "Equal Angles Put Four Points on a Circle"
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.circle-angles] }
  subsection: "Proving points lie on a circle"
  rating: 1560
  responseSkills: { reasoning: 1550, proof: 1550, clarity: 1510, synthesis: 1540 }
  stem: |
    $A$, $B$, $C$, $D$ are points with $C$ and $D$ on the same side of line $AB$, and $\angle ACB = \angle ADB$. Prove that $\angle CAD = \angle CBD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 240
    points: { A: [-1.8, -0.8], B: [1.8, -0.8], C: [0.684, 1.879], D: [-1.286, 1.532] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: C, to: A }
      - { type: segment, from: C, to: B }
      - { type: segment, from: D, to: A }
      - { type: segment, from: D, to: B }
      - { type: angle, at: C, from: A, to: B, radius: 22 }
      - { type: angle, at: D, from: A, to: B, radius: 22 }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: e }
      - { type: point, at: C, label: 'C', pos: n }
      - { type: point, at: D, label: 'D', pos: n }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'concyclic', description: "Shows A, B, C, D are concyclic (e.g. converse of angles on the same arc)", points: 2, dimension: reasoning }
          - { id: 'same', description: "Finds the arc that ∠CAD and ∠CBD stand on (e.g. both on arc CD, with A and B on the same side)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes ∠CAD = ∠CBD", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Equal angles $\angle ACB = \angle ADB$, with $C$ and $D$ on the same side of $AB$, mean $A$, $B$, $C$, $D$ are concyclic (converse of angles on the same arc). In that circle, $\angle CAD$ and $\angle CBD$ both stand on arc $CD$, so they are equal.

- id: spec.geometry.circle-problems.tangent-parallel-diagonal
  title: "Tangent Parallel to a Diagonal"
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.chords-tangents] }
  subsection: "Finding and proving angles"
  rating: 1580
  responseSkills: { reasoning: 1570, proof: 1570, clarity: 1530, synthesis: 1560 }
  stem: |
    $ABCD$ is a cyclic quadrilateral, and the tangent at $A$ is parallel to the diagonal $BD$. Prove that $AB = AD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [0, 2], B: [-1.732, -1], C: [-0, -2], D: [1.732, -1], U: [-1.8, 2], V: [1.8, 2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: segment, from: B, to: D }
      - { type: segment, from: U, to: V }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'alt', description: "Relates the tangent to an angle in the triangle (e.g. alternate segment: the angle between the tangent and AB equals ∠ADB)", points: 1, dimension: reasoning }
          - { id: 'parallel', description: "Uses the parallel lines (e.g. tangent ∥ BD: that angle equals ∠ABD, alternate angles)", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "Concludes AB = AD (e.g. ∠ADB = ∠ABD, so triangle ABD is isosceles)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $X$ be on the tangent at $A$, on the side of $AB$ away from $D$. By the alternate segment theorem, $\angle XAB = \angle ADB$. Since $AX \parallel BD$, $\angle XAB = \angle ABD$ (alternate angles). So $\angle ADB = \angle ABD$, triangle $ABD$ is isosceles, and $AB = AD$.

- id: spec.geometry.circle-problems.equal-chords-parallel
  title: "Equal Chords Give Parallel Sides"
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.circle-angles] }
  subsection: "Finding and proving angles"
  rating: 1580
  responseSkills: { reasoning: 1570, proof: 1570, clarity: 1530, synthesis: 1560 }
  stem: |
    $A$, $B$, $C$, $D$ lie on a circle in that order, and $AB = CD$. Prove that $AD \parallel BC$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1, 1.732], B: [-1.879, -0.684], C: [1, -1.732], D: [1.879, 0.684], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B, ticks: 1 }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D, ticks: 1 }
      - { type: segment, from: D, to: A }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'angles', description: "Turns the equal chords into equal angles (e.g. AB and CD subtend equal angles at the circumference: ∠ADB = ∠DBC)", points: 2, dimension: reasoning }
          - { id: 'alternate', description: "Recognizes a parallel-line angle pair (e.g. alternate angles for AD and BC with transversal BD)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "Concludes AD ∥ BC", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Equal chords subtend equal angles at the circumference: $\angle ADB$ (on chord $AB$) equals $\angle DBC$ (on chord $CD$). With the points in order $A, B, C, D$, $A$ and $C$ are on opposite sides of $BD$, so these are alternate angles for the lines $AD$ and $BC$ cut by $BD$. Equal alternate angles mean $AD \parallel BC$.

- id: spec.geometry.circle-problems.secant-triangles-similar
  title: "Similar Triangles from Extended Sides"
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.chord-secant-lengths] }
  subsection: "Finding and proving angles"
