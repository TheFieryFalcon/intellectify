# SAMPLE questions for Phase 0.

- id: spec.geometry.logic.contrapositive
  status: draft
  skills: { primary: spec.geometry.logic }
  rating: 1290
  responseSkills: { reading: 1300, precision: 1300 }
  stem: |
    What is the contrapositive of "If $n^2$ is even, then $n$ is even"?
  parts:
    - id: a
      options:
        - { id: a, text: 'If $n$ is even, then $n^2$ is even.' }
        - { id: b, text: 'If $n^2$ is odd, then $n$ is odd.' }
        - { id: c, text: 'If $n$ is odd, then $n^2$ is odd.' }
        - { id: d, text: 'If $n$ is odd, then $n^2$ is even.' }
      answer: { type: mcq, key: c }
  solution: |
    The contrapositive of $P \Rightarrow Q$ is $\neg Q \Rightarrow \neg P$: "If $n$ is not even, then $n^2$ is not even",
    i.e. "If $n$ is odd, then $n^2$ is odd". Option A is the converse and option B is the inverse.

- id: spec.geometry.circle-angles.semicircle
  status: draft
  skills: { primary: spec.geometry.circle-angles }
  rating: 1120
  responseSkills: { reading: 1100 }
  stem: |
    $AB$ is a diameter of a circle and $C$ is another point on the circle. What is the size of $\angle ACB$, in degrees?
  parts:
    - id: a
      answer: { type: numeric, key: 90 }
  solution: |
    The angle in a semicircle is a right angle, so $\angle ACB = 90^\circ$.

- id: spec.geometry.chord-secant-lengths.intersecting-chords
  status: draft
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1460
  responseSkills: { calculation: 1400, reading: 1450 }
  stem: |
    Chords $AB$ and $CD$ of a circle intersect at $P$. Given $AP = 4$, $PB = 6$ and $CP = 3$, find $PD$.
  parts:
    - id: a
      answer: { type: numeric, key: 8 }
  solution: |
    By the intersecting chords theorem, $AP \cdot PB = CP \cdot PD$, so $4 \times 6 = 3 \times PD$ and $PD = 8$.
