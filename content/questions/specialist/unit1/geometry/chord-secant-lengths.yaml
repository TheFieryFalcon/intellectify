- id: spec.geometry.chord-secant-lengths.chords-two-solutions
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1450
  responseSkills: {reading: 1420, calculation: 1440, reasoning: 1440}
  stem: |
    Chord $AB$ has length 8, and chord $CD$ crosses it at $X$ with $CX = 3$ and $XD = 5$. Find all possible values of $AX$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.2, -1.6], B: [1.999, 0.051], C: [1.2, -1.6], D: [-1.999, 0.051], X: [0, -0.981071], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B, label: '8', side: left }
      - { type: segment, from: C, to: X, label: '3', side: left }
      - { type: segment, from: X, to: D, label: '5', side: left }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: X, label: 'X', pos: s }
    ```
  parts:
  - id: a
    answer:
      type: set
      key: ['3', '5']
  solution: |
    $AX \times XB = 15$ with $AX + XB = 8$. So $AX(8 - AX) = 15$, giving $AX^2 - 8AX + 15 = 0$ and $AX = 3$ or $5$.
  verify: |
    def answers():
        x = symbols("x")
        return {"a": solve(x*(8 - x) - 15, x)}
- id: spec.geometry.chord-secant-lengths.prove-intersecting-chords
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1480
  responseSkills: {reasoning: 1470, proof: 1470, clarity: 1400}
  stem: |
    Chords $AB$ and $CD$ of a circle meet at $X$. Prove that $AX \times XB = CX \times XD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.732, 1], B: [1.532, -1.286], C: [-1.286, -1.532], D: [1, 1.732], X: [-0.243, -0.043], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: C, to: D }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: X, label: 'X', pos: n }
    ```
  parts:
  - id: a
    rubric:
      criteria:
      - {id: join, description: Joins AC and BD (or AD and BC), points: 1, dimension: reasoning}
      - {id: angles, description: ∠CAB = ∠CDB (same arc CB) and ∠AXC = ∠DXB (vertically opposite), points: 2, dimension: reasoning}
      - {id: similar, description: 'Triangles AXC and DXB are similar, so AX/DX = CX/BX', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Join $AC$ and $BD$. $\angle CAB = \angle CDB$ (same arc $CB$) and $\angle AXC = \angle DXB$ (vertically opposite). So triangles $AXC$ and $DXB$ are similar, and $\dfrac{AX}{DX} = \dfrac{CX}{BX}$. Cross-multiplying: $AX \times XB = CX \times XD$.
- id: spec.geometry.chord-secant-lengths.two-secants-algebra
  skills: {primary: spec.geometry.chord-secant-lengths}
