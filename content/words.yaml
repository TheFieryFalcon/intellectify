# Word lists for word variety (docs/SPEC.md §9.6). A question names the lists it draws from:
#
#   words: { who: person, craft: aircraft, u: units }
#
# and uses {{who}}, {{craft}}, {{u.speed}} in its text. Each serve picks entries at random,
# independently of the numeric variant. Words never change an answer.
#
# For a plain entry, {{slot}} is the word, {{slot.a}} adds "a" or "an", and {{slot.A}} and
# {{slot.Cap}} capitalize (for the start of a sentence). For an entry with fields, {{slot.field}}
# is that field, and {{slot}} is its `name` field.
#
# People are referred to by name only, never by pronoun, so any name fits any sentence.

