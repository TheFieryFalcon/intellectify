- id: spec.geometry.proof-methods.odd-not-prime
  skills: {primary: spec.geometry.proof-methods}
  rating: 1060
  responseSkills: {reading: 1050, calculation: 1030}
  stem: |
    The claim "every odd number greater than 1 is prime" is false. What is the smallest counterexample?
  parts:
  - id: a
    answer: {type: numeric, key: '9'}
  solution: |
    3, 5 and 7 are prime, but $9 = 3 \times 3$ is odd and not prime.
  verify: |
    def answers():
        return {"a": next(n for n in range(3, 100, 2) if not isprime(n))}
- id: spec.geometry.proof-methods.square-bigger
  skills: {primary: spec.geometry.proof-methods}
  rating: 1080
  responseSkills: {reading: 1070, calculation: 1050}
  stem: |
    Which number is a counterexample to "the square of any number is bigger than the number"?
  parts:
  - id: a
    options:
    - {id: a, text: $2$}
    - {id: b, text: '$\tfrac{1}{2}$'}
    - {id: c, text: $5$}
    - {id: d, text: $-3$}
    answer: {type: mcq, key: b}
  solution: |
    $\left(\tfrac{1}{2}\right)^2 = \tfrac{1}{4}$, which is smaller than $\tfrac{1}{2}$. The others all have squares bigger than themselves ($(-3)^2 = 9 > -3$).
