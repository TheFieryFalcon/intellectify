- id: spec.vectors-2d.geometric.perpendicular-walk
  title: "Distance After Two Perpendicular Legs"
  skills: { primary: spec.vectors-2d.geometric }
  subsection: "Magnitudes from the triangle rule"
  rating: 1120
  responseSkills: { calculation: 1100, reading: 1120 }
  variants:
    - { e: 6, n: 8, v: 10 }
    - { e: 5, n: 12, v: 13 }
    - { e: 9, n: 12, v: 15 }
  stem: |
    A cyclist rides {{e}} km due east, then {{n}} km due north. How far is the cyclist from the starting point?
  parts:
    - id: a
      prompt: Distance (km)
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    The two legs meet at a right angle, so the distance is $\sqrt{ {{e}}^2 + {{n}}^2 } = {{v}}$ km.
  verify: |
