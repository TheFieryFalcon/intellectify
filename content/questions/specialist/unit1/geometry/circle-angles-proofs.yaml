    $A$, $B$, $C$, $D$ lie on a circle with center $O$, with $C$ and $D$ on the same side of chord $AB$. Use the angle-at-the-center theorem to prove that $\angle ACB = \angle ADB$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.732, -1], B: [1.732, -1], C: [0.518, 1.932], D: [-1.286, 1.532], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: A, to: C }
      - { type: segment, from: B, to: C }
      - { type: segment, from: A, to: D }
      - { type: segment, from: B, to: D }
      - { type: point, at: O, label: 'O', pos: e }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'each', description: "Relates both angles to the same quantity (e.g. ∠ACB = ½∠AOB and ∠ADB = ½∠AOB, on the same arc AB)", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "So ∠ACB = ∠ADB", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $C$ and $D$ are on the same side of $AB$, so $\angle ACB$ and $\angle ADB$ stand on the same arc $AB$. Each is half the angle at the center on that arc: $\angle ACB = \tfrac{1}{2}\angle AOB = \angle ADB$.

- id: spec.geometry.circle-angles.equal-angles-equal-chords
  title: "Equal Angles Give Equal Chords"
  skills: { primary: spec.geometry.circle-angles }
  subsection: "Angles on the same arc"
  rating: 1400
  responseSkills: { reasoning: 1390, proof: 1390, clarity: 1350 }
  stem: |
    $A$, $B$, $C$, $D$ lie on a circle in that order, and $\angle ABD = \angle CBD$. Prove that $AD = CD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.879, 0.684], B: [-0, -2], C: [1.879, 0.684], D: [0, 2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: B, to: A }
      - { type: segment, from: B, to: C }
      - { type: segment, from: B, to: D }
      - { type: segment, from: A, to: D }
      - { type: segment, from: C, to: D }
      - { type: angle, at: B, from: A, to: D, radius: 26 }
      - { type: angle, at: B, from: D, to: C, radius: 30 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'center', description: "Relates the equal angles at B to angles at the center (e.g. ∠AOD = 2∠ABD and ∠COD = 2∠CBD)", points: 2, dimension: reasoning }
          - { id: 'equal', description: "Concludes the center angles are equal (e.g. ∠AOD = ∠COD)", points: 1, dimension: reasoning }
          - { id: 'congruent', description: "Concludes AD = CD (e.g. triangles AOD and COD congruent by SAS: radii and the equal angle)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $\angle ABD$ stands on chord $AD$ and $\angle CBD$ on chord $CD$, so $\angle AOD = 2\angle ABD = 2\angle CBD = \angle COD$. Triangles $AOD$ and $COD$ have $OA = OC$, $OD$ common and the angles between them equal, so they are congruent (SAS), and $AD = CD$.

- id: spec.geometry.circle-angles.right-angle-diameter
  title: "Right Angle in a Cyclic Quadrilateral"
  skills: { primary: spec.geometry.circle-angles }
  subsection: "Angle in a semicircle"
  rating: 1400
  responseSkills: { reasoning: 1390, proof: 1390, clarity: 1350 }
  stem: |
    $ABCD$ is a cyclic quadrilateral with $\angle DAB = 90^\circ$. Prove that $BD$ is a diameter of the circle.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1, 1.732], B: [-1.732, -1], C: [1, -1.732], D: [1.732, 1], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: segment, from: B, to: D }
      - { type: angle, at: A, from: B, to: D, right: true }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'center', description: "Finds the angle at the center on arc BD (e.g. 180°, twice ∠DAB = 90°), or uses another valid route", points: 2, dimension: reasoning }
          - { id: 'line', description: "Concludes BD passes through the center (e.g. B, O, D collinear)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "A chord through the center is a diameter", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $\angle DAB$ stands on arc $BD$, so the angle at the center on that arc is $2 \times 90^\circ = 180^\circ$. A $180^\circ$ angle at $O$ means $B$, $O$, $D$ lie on a straight line, so the chord $BD$ passes through the center: it is a diameter.

- id: spec.geometry.circle-angles.equal-sides-bisects
  title: "Diagonal Bisecting an Angle of a Cyclic Quadrilateral"
  skills: { primary: spec.geometry.circle-angles }
  subsection: "Cyclic quadrilaterals"
  rating: 1420
  responseSkills: { reasoning: 1410, proof: 1410, clarity: 1370 }
  stem: |
    $ABCD$ is a cyclic quadrilateral with $AB = AD$. Prove that the diagonal $CA$ bisects angle $BCD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [0, 2], B: [-1.879, -0.684], C: [-0, -2], D: [1.879, -0.684], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B, ticks: 1 }
      - { type: segment, from: A, to: D, ticks: 1 }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: C, to: A }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'chords', description: "Identifies the equal chords (e.g. AB and AD)", points: 1, dimension: reasoning }
          - { id: 'angles', description: "Turns them into equal angles at C (e.g. ∠ACB = ∠ACD)", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "Concludes CA bisects ∠BCD", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $AB$ and $AD$ are equal chords, and equal chords subtend equal angles at the circumference. At $C$, chord $AB$ subtends $\angle ACB$ and chord $AD$ subtends $\angle ACD$, so $\angle ACB = \angle ACD$, and $CA$ bisects $\angle BCD$.

