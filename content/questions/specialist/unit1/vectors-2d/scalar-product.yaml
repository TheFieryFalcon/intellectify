        return {"a": [s for s in solve(2*k/(k**2 + 1) - Rational(1, 2), k)]}

- id: spec.vectors-2d.scalar-product.minimize
  title: "Shortest Length of a + tb"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Magnitudes and the scalar product"
  rating: 1720
  responseSkills: {calculation: 1660, reasoning: 1700, synthesis: 1710}
  stem: |
    $\mathbf{a}$ and $\mathbf{b}$ are unit vectors with an angle of $60^\circ$ between them. Find the real number $t$ that makes $|\mathbf{a} + t\mathbf{b}|$ as small as possible, and the exact smallest value.
  parts:
    - id: a
      prompt: $t =$
      answer: { type: numeric, key: '-\frac{1}{2}' }
    - id: b
      prompt: Smallest value
      answer: { type: numeric, key: '\frac{\sqrt{3}}{2}', form: [exact] }
  solution: |
    $\mathbf{a}\cdot\mathbf{b} = \cos 60^\circ = \tfrac{1}{2}$, so $|\mathbf{a} + t\mathbf{b}|^2 = 1 + 2t\left(\tfrac{1}{2}\right) + t^2 = t^2 + t + 1 = \left(t + \tfrac{1}{2}\right)^2 + \tfrac{3}{4}$.
    This is smallest when $t = -\tfrac{1}{2}$, with value $\sqrt{\tfrac{3}{4}} = \tfrac{\sqrt{3}}{2}$.
  verify: |
