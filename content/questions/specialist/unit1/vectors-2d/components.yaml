        return {"a": [bx - ax, by - ay], "b": sqrt((bx - ax)**2 + (by - ay)**2)}

- id: spec.vectors-2d.components.unit-vector
  skills: { primary: spec.vectors-2d.components }
  rating: 1180
  responseSkills: { calculation: 1170 }
  variants:
    - { x: 3, y: -4, m: 5 }
    - { x: -5, y: 12, m: 13 }
    - { x: 8, y: 15, m: 17 }
  stem: |
    Find the unit vector in the direction of ${{x}}\mathbf{i} + ({{y}})\mathbf{j}$.
  parts:
    - id: a
      answer: { type: vector, key: ['\frac{ {{x}} }{ {{m}} }', '\frac{ {{y}} }{ {{m}} }'] }
  solution: |
    The magnitude is $\sqrt{({{x}})^2 + ({{y}})^2} = {{m}}$. Divide each component by it: $\tfrac{1}{ {{m}} }\left({{x}}\mathbf{i} + ({{y}})\mathbf{j}\right)$.
  verify: |
    def answers(x, y, m):
        n = sqrt(x**2 + y**2)
        return {"a": [x / n, y / n]}

