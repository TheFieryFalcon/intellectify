- id: spec.geometry.chord-secant-lengths.prove-intersecting-chords
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1480
  responseSkills: {proof: 1470, clarity: 1400}
  stem: |
    Chords $AB$ and $CD$ of a circle meet at $X$. Prove that $AX \times XB = CX \times XD$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: join, description: Joins AC and BD (or AD and BC), points: 1, dimension: proof}
      - {id: angles, description: ∠CAB = ∠CDB (same arc CB) and ∠AXC = ∠DXB (vertically opposite), points: 2, dimension: proof}
      - {id: similar, description: 'Triangles AXC and DXB are similar, so AX/DX = CX/BX', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Join $AC$ and $BD$. $\angle CAB = \angle CDB$ (same arc $CB$) and $\angle AXC = \angle DXB$ (vertically opposite). So triangles $AXC$ and $DXB$ are similar, and $\dfrac{AX}{DX} = \dfrac{CX}{BX}$. Cross-multiplying: $AX \times XB = CX \times XD$.
