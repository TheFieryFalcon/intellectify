    - { c: 136, _A: '-1.879, -0.684', _B: '1.827, -0.813', _C: '1.97, 0.347', _D: '-1.658, 1.118' }
  stem: |
    In a circle with center $O$, chords $AB$ and $CD$ have equal length, and $\angle AOB = {{c}}^\circ$. Find $\angle COD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [{{_A}}], B: [{{_B}}], C: [{{_C}}], D: [{{_D}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B, ticks: 1 }
      - { type: segment, from: C, to: D, ticks: 1 }
      - { type: segment, from: O, to: A }
      - { type: segment, from: O, to: B }
      - { type: segment, from: O, to: C }
      - { type: segment, from: O, to: D }
      - { type: angle, at: O, from: A, to: B, label: '{{c}}^\circ', radius: 16 }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
