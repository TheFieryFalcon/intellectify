      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Treat {{p1}}, {{who}}, {{p2}} as one block, with {{who}} in the middle: 2 orders ({{p1}} on the left or right). That's ${{n}} - 2$ units around the table: $({{n}} - 3)!$ ways. Total $2 \times ({{n}} - 3)! = {{v}}$.
  verify: |
    from itertools import permutations
    def answers(n, v):
        seen = set()
