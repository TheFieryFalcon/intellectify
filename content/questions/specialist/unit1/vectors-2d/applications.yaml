- id: spec.vectors-2d.applications.velocity-from-displacement
  skills: { primary: spec.vectors-2d.applications }
  rating: 1400
  responseSkills: { calculation: 1380, reading: 1390 }
  stem: |
    A drone flies in a straight line at constant velocity from $(3, 5)$ to $(15, -4)$ (in meters) in 3 seconds. Find its velocity and its speed.
  parts:
    - id: a
      prompt: Velocity (m/s)
      answer: { type: vector, key: ['4', '-3'] }
    - id: b
      prompt: Speed (m/s)
      answer: { type: numeric, key: 5 }
  solution: |
    Displacement $= 12\mathbf{i} - 9\mathbf{j}$ m, so the velocity is $\tfrac{1}{3}(12\mathbf{i} - 9\mathbf{j}) = 4\mathbf{i} - 3\mathbf{j}$ m/s, and the speed is 5 m/s.
  verify: |
    def answers():
        v = (Matrix([15, -4]) - Matrix([3, 5])) / 3
        return {"a": list(v), "b": v.norm()}

- id: spec.vectors-2d.applications.collide-or-not
  skills: { primary: spec.vectors-2d.applications }
  rating: 1410
  responseSkills: { reading: 1400, calculation: 1380 }
  stem: |
    At noon, ship $A$ is at $\mathbf{i} + 2\mathbf{j}$ km with velocity $3\mathbf{i} + \mathbf{j}$ km/h, and ship $B$ is at $9\mathbf{i} - 2\mathbf{j}$ km with velocity $-\mathbf{i} + 2\mathbf{j}$ km/h. Will they collide?
  parts:
    - id: a
      options:
        - { id: a, text: 'Yes, at 2 pm' }
        - { id: b, text: 'Yes, at 4 pm' }
        - { id: c, text: 'No' }
      answer: { type: mcq, key: c }
  solution: |
    $\mathbf{r}_A = (1 + 3t)\mathbf{i} + (2 + t)\mathbf{j}$ and $\mathbf{r}_B = (9 - t)\mathbf{i} + (-2 + 2t)\mathbf{j}$.
    The $\mathbf{i}$-components match when $1 + 3t = 9 - t$, so $t = 2$. Then the $\mathbf{j}$-components are $4$ and $2$, which differ. Their paths cross, but not at the same time, so they don't collide.
  verify: |
    def answers():
        t = symbols("t")
        ts = solve(1 + 3*t - (9 - t), t)
        hit = any((2 + s) == (-2 + 2*s) for s in ts)
        return {"a": "a" if hit else "c"}

- id: spec.vectors-2d.applications.equilibrium-bearing
  skills: { primary: spec.vectors-2d.applications }
  rating: 1420
  responseSkills: { calculation: 1400, reading: 1410 }
  requiresCalculator: true
  stem: |
    Two forces act on a particle: 6 N due east and 8 N due north. Find the magnitude and true bearing of the third force that keeps the particle in equilibrium, with the bearing correct to one decimal place.
  parts:
    - id: a
      prompt: Magnitude (N)
      answer: { type: numeric, key: 10 }
    - id: b
      prompt: Bearing (°T)
      answer: { type: numeric, key: 216.9 }
  solution: |
    The third force is $-(6\mathbf{i} + 8\mathbf{j}) = -6\mathbf{i} - 8\mathbf{j}$ N, with magnitude 10 N.
    It points south-west: west of south by $\tan^{-1}\tfrac{6}{8} \approx 36.9^\circ$, so the bearing is $180^\circ + 36.9^\circ = 216.9^\circ\text{T}$.
  verify: |
    def answers():
        F = -Matrix([6, 8])
        return {"a": F.norm(), "b": round(float(deg(atan2(F[0], F[1])) % 360), 1)}

- id: spec.vectors-2d.applications.river-crossing
  skills: { primary: spec.vectors-2d.applications }
  rating: 1440
  responseSkills: { calculation: 1420, reading: 1430 }
  words: { cr: crosser }
  variants:
    - { w: 100, s: 2, c: 1.5, t: 50, d: 75 }
    - { w: 60, s: 1.5, c: 2, t: 40, d: 80 }
  stem: |
    A river is {{w}} m wide with straight, parallel banks, and flows at {{c}} m/s. {{cr.A}} {{cr.verb}} at {{s}} m/s through the water, always pointing straight across. Find how long the crossing takes and how far downstream the {{cr}} lands.
  parts:
    - id: t
      prompt: Time (s)
      answer: { type: numeric, key: '{{t}}' }
    - id: d
      prompt: Distance downstream (m)
      answer: { type: numeric, key: '{{d}}' }
  solution: |
    The current only moves the {{cr}} along the river, so it doesn't change the crossing speed of {{s}} m/s: the time is ${{w}} \div {{s}} = {{t}}$ s.
    In that time the current carries the {{cr}} ${{c}} \times {{t}} = {{d}}$ m downstream.
  verify: |
    def answers(w, s, c, t, d):
        T = Rational(str(w)) / Rational(str(s))
        return {"t": T, "d": Rational(str(c)) * T}

- id: spec.vectors-2d.applications.heading-due-north
  skills: { primary: spec.vectors-2d.applications }
  rating: 1460
  responseSkills: { calculation: 1440, synthesis: 1420 }
  requiresCalculator: true
  stem: |
    A boat moves through the water at 13 km/h. The current flows due east at 5 km/h. The boat must travel due north. Find the bearing the boat should point on, correct to one decimal place, and its actual speed.
  parts:
    - id: a
      prompt: Bearing (°T)
      answer: { type: numeric, key: 337.4 }
    - id: b
      prompt: Actual speed (km/h)
      answer: { type: numeric, key: 12 }
  solution: |
    The boat must point west of north to cancel the current, so its velocity through the water is $-5\mathbf{i} + v\mathbf{j}$ with magnitude 13. Then $v = \sqrt{169 - 25} = 12$, and the ground velocity is $12\mathbf{j}$: 12 km/h due north.
    The angle west of north is $\sin^{-1}\tfrac{5}{13} \approx 22.6^\circ$, so the bearing is $360^\circ - 22.6^\circ = 337.4^\circ\text{T}$.
  verify: |
    def answers():
        v = sqrt(13**2 - 5**2)
        return {"a": round(float(360 - deg(asin(Rational(5, 13)))), 1), "b": v}

