- id: spec.geometry.chords-tangents.prove-equal-tangents
  skills: {primary: spec.geometry.chords-tangents}
  rating: 1500
  responseSkills: {proof: 1490, clarity: 1420}
  stem: |
    Tangents from an outside point $M$ touch a circle with center $O$ at $S$ and $T$. Prove that $MS = MT$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: right, description: ∠OSM = ∠OTM = 90° (tangent ⟂ radius), points: 1, dimension: proof}
      - {id: sides, description: OS = OT (radii) and OM is common, points: 1, dimension: proof}
      - {id: congruent, description: 'Triangles OSM and OTM are congruent (right angle, hypotenuse, side)', points: 2, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Join $OS$, $OT$ and $OM$. $\angle OSM = \angle OTM = 90^\circ$ (tangent ⟂ radius), $OS = OT$ (radii) and $OM$ is common. So right-angled triangles $OSM$ and $OTM$ are congruent (hypotenuse and one side), and $MS = MT$.
- id: spec.geometry.chords-tangents.incircle-tangents
  skills: {primary: spec.geometry.chords-tangents}
  rating: 1600
  responseSkills: {synthesis: 1590, calculation: 1550}
  stem: |
    A circle touches all three sides of triangle $ABC$, where $AB = 7$, $BC = 8$ and $CA = 9$. Find the distance from $A$ to the point where the circle touches $AB$.
  parts:
  - id: a
    prompt: Distance
    answer: {type: numeric, key: '4'}
  solution: |
    Let the tangent lengths from $A$, $B$ and $C$ be $a$, $b$ and $c$ (tangents from one point are equal). Then $a + b = 7$, $b + c = 8$ and $c + a = 9$. Adding: $2(a + b + c) = 24$, so $a + b + c = 12$ and $a = 12 - 8 = 4$.
  verify: |
    def answers():
        import math
        A, B = (0.0, 0.0), (7.0, 0.0)
        # C with CA = 9 and CB = 8.
        x = (81 - 64 + 49) / 14
        C = (x, math.sqrt(81 - x*x))
        a, b, c = dist(B, C), dist(C, A), dist(A, B)
        I = ((a*A[0] + b*B[0] + c*C[0]) / (a + b + c), (a*A[1] + b*B[1] + c*C[1]) / (a + b + c))
        foot = (I[0], 0.0)  # AB lies on the x-axis
        return {"a": approx(dist(A, foot))}
- id: spec.geometry.chords-tangents.prove-alternate-segment
  skills: {primary: spec.geometry.chords-tangents}
  rating: 1620
  responseSkills: {proof: 1610, synthesis: 1580, clarity: 1520}
  stem: |
    A tangent touches a circle at $T$, and $TB$ is a chord. $A$ is a point on the circle in the alternate segment. Prove that the angle between the tangent and $TB$ equals $\angle TAB$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: diam, description: 'Draws the diameter TD and uses ∠(tangent, TD) = 90°', points: 1, dimension: proof}
      - {id: semi, description: '∠TBD = 90° (angle in a semicircle), so ∠BTD = 90° − ∠TDB', points: 1, dimension: proof}
      - {id: subtract, description: Tangent–chord angle = 90° − ∠BTD = ∠TDB, points: 1, dimension: proof}
      - {id: same, description: ∠TDB = ∠TAB (same arc TB), points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Draw the diameter $TD$ and join $DB$. The tangent is perpendicular to $TD$, so the tangent–chord angle is $90^\circ - \angle BTD$. In triangle $TBD$, $\angle TBD = 90^\circ$ (angle in a semicircle), so $\angle TDB = 90^\circ - \angle BTD$ too. So the tangent–chord angle equals $\angle TDB$, which equals $\angle TAB$ (same arc $TB$).
- id: spec.geometry.chords-tangents.chord-of-contact
