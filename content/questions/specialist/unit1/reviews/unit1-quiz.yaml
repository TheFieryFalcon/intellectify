- id: spec.u1.quiz.pigeon-socks-5
  title: "Three Socks of the Same Color"
  pool: unit-quiz
  skills: { primary: spec.combinatorics.pigeonhole }
  subsection: "Guaranteeing a match"
  rating: 1380
  responseSkills: { reading: 1360, reasoning: 1370, calculation: 1330 }
  stem: |
    A drawer holds socks in 5 colors. How many socks must you take, without looking, to be sure of 3 of the same color?
  parts:
    - id: a
      answer: { type: numeric, key: 11 }
  solution: |
    With 10 socks you could have exactly 2 of each color. With 11 socks in 5 colors, $11 > 2 \times 5$, so some color has at least 3.
  verify: |
    def answers():
        return {'a': 2 * 5 + 1}

- id: spec.u1.quiz.vowel-start
  title: "TRIANGLE Beginning and Ending with a Vowel"
  pool: unit-quiz
  skills: { primary: spec.combinatorics.permutations }
  subsection: "Fixed positions and order"
  rating: 1420
  responseSkills: { reading: 1400, calculation: 1400, reasoning: 1410 }
  stem: |
    How many arrangements of the letters of TRIANGLE begin and end with a vowel?
  parts:
    - id: a
      answer: { type: numeric, key: 4320 }
  solution: |
    The vowels are I, A, E. Choose the first and last letters in order from them: $3 \times 2 = 6$ ways. The other 6 letters fill the middle: $6! = 720$. Total $6 \times 720 = 4320$.
  verify: |
    from itertools import permutations
    def answers():
        return {'a': sum(1 for p in permutations('TRIANGLE') if p[0] in 'IAE' and p[-1] in 'IAE')}

- id: spec.u1.quiz.secant-5-7
  title: "Two Secants from a Point (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.geometry.chord-secant-lengths }
  subsection: "Two secants from a point"
  rating: 1430
  responseSkills: { calculation: 1410 }
  stem: |
    From a point $M$, two secants cut a circle: one at $A$ and $B$ with $MA = 5$ and $AB = 7$, the other at $C$ and $D$ with $MC = 4$. Find $CD$.
  parts:
    - id: a
      answer: { type: numeric, key: 11 }
  solution: |
    Measure from $M$: $MB = 5 + 7 = 12$. Then $MA \times MB = MC \times MD$ gives $60 = 4 \times MD$, so $MD = 15$ and $CD = MD - MC = 11$.
  verify: |
    def answers():
        md = sympy.Rational(5 * (5 + 7), 4)
        return {'a': md - 4}

- id: spec.u1.quiz.angle-between
  title: "Angle Between Two Vectors (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Angle between vectors"
  rating: 1440
  responseSkills: { calculation: 1420 }
  stem: |
    Find the angle between $2\mathbf{i} + 2\mathbf{j}$ and $-3\mathbf{j}$, in degrees.
  parts:
    - id: a
      answer: { type: numeric, key: 135 }
  solution: |
    $\cos\theta = \dfrac{-6}{\sqrt{8} \times 3} = -\dfrac{1}{\sqrt{2}}$, so $\theta = 135^\circ$.
  verify: |
    def answers():
        c = sympy.Rational(-6) / (sympy.sqrt(8) * 3)
        return {'a': sympy.deg(sympy.acos(c))}

- id: spec.u1.quiz.cyclic-exterior
