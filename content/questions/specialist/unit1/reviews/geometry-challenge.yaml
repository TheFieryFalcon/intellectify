      - { type: segment, from: A, to: B }
      - { type: segment, from: U1, to: V1 }
      - { type: segment, from: U2, to: V2 }
      - { type: point, at: T, label: 'T', pos: se }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: ne }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: common, description: "Draws the common tangent at T (it touches both circles there)", points: 1, dimension: proof }
          - { id: first, description: "In the first circle, the tangents at A and at T make equal angles with chord AT (alternate segment, or equal tangents from where they meet)", points: 1, dimension: reasoning }
          - { id: second, description: "In the second circle, the tangents at B and at T make equal angles with chord BT", points: 1, dimension: reasoning }
          - { id: parallel, description: "The two angles at T are vertically opposite, so the tangents at A and B make equal alternate angles with line AB: they are parallel", points: 1, dimension: reasoning }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Draw the common tangent at $T$. In the first circle, the tangent at $A$ and the common tangent both make with chord $AT$ an angle equal to the angle in the alternate segment, so they make equal angles with line $AB$. The same holds in the second circle for the tangent at $B$ and the common tangent, with chord $BT$.

    At $T$, the two angles the common tangent makes with line $AB$ (one on each side of $T$) are vertically opposite, so equal. Hence the tangents at $A$ and $B$ make equal alternate angles with the line $AB$, and so they are parallel.

- id: spec.geometry.ch.common-chord-bisects-tangent
  pool: challenge
  skills: { primary: spec.geometry.chord-secant-lengths, secondary: [spec.geometry.chords-tangents] }
  subsection: "Tangent and secant"
  rating: 1900
  responseSkills: { reasoning: 1890, proof: 1880, clarity: 1840, synthesis: 1880 }
  stem: |
    Two circles meet at $P$ and $Q$. A common tangent touches the first circle at $A$ and the second at $B$. Prove that the line $PQ$ passes through the midpoint of $AB$.

    ```diagram
    view: [-2.6, 3, -2, 2.4]
    width: 280
    points: { P1: [-1, 0], P2: [1.1, 0], A: [-1.186, 1.287], B: [0.871, 1.584], P: [-0.157, 0.99], Q: [-0.157, -0.99] }
    draw:
      - { type: circle, center: P1, radius: 1.3 }
      - { type: circle, center: P2, radius: 1.6 }
      - { type: segment, from: A, to: B }
      - { type: point, at: A, label: 'A', pos: nw }
      - { type: point, at: B, label: 'B', pos: ne }
      - { type: point, at: P, label: 'P', pos: ne }
      - { type: point, at: Q, label: 'Q', pos: se }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: meet, description: "Lets line PQ meet AB at M (M is outside both circles)", points: 1, dimension: proof }
          - { id: first, description: "Tangent–secant from M to the first circle: MA² = MP × MQ", points: 1, dimension: reasoning }
          - { id: second, description: "Tangent–secant from M to the second circle: MB² = MP × MQ", points: 1, dimension: reasoning }
          - { id: conclude, description: "So MA² = MB², MA = MB: M is the midpoint of AB", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let line $PQ$ meet $AB$ at $M$. From $M$, $MA$ is a tangent to the first circle and $MPQ$ is a secant of it, so $MA^2 = MP \times MQ$. In the same way, $MB$ is a tangent to the second circle and $MPQ$ is a secant of it, so $MB^2 = MP \times MQ$.

    Hence $MA^2 = MB^2$, so $MA = MB$, and $M$ is the midpoint of $AB$.

- id: spec.geometry.ch.root2-plus-root3
  pool: challenge
  skills: { primary: spec.geometry.proof-methods }
  subsection: "Proof by contradiction"
  rating: 1930
  responseSkills: { reasoning: 1920, proof: 1920, clarity: 1870 }
  stem: |
    Prove that $\sqrt{2} + \sqrt{3}$ is irrational.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: assume, description: "Assumes, for contradiction, that √2 + √3 = r with r rational", points: 1, dimension: proof }
          - { id: square, description: "Squares: 5 + 2√6 = r², so √6 = (r² − 5)/2 would be rational", points: 1, dimension: reasoning }
          - { id: root6, description: "Proves √6 is irrational: √6 = p/q in lowest terms gives p² = 6q², so p is even, p = 2m, 2m² = 3q², so q is even: contradiction", points: 2, dimension: reasoning }
          - { id: conclude, description: "So the assumption fails: √2 + √3 is irrational", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Suppose, for contradiction, that $\sqrt{2} + \sqrt{3} = r$ with $r$ rational. Squaring, $5 + 2\sqrt{6} = r^2$, so $\sqrt{6} = \dfrac{r^2 - 5}{2}$ would be rational.

    But $\sqrt{6}$ is irrational. If $\sqrt{6} = \dfrac{p}{q}$ in lowest terms, then $p^2 = 6q^2$ is even, so $p$ is even, $p = 2m$. Then $4m^2 = 6q^2$, i.e. $2m^2 = 3q^2$, so $3q^2$ is even and $q$ is even. Both $p$ and $q$ are even, which contradicts lowest terms.

    So $\sqrt{2} + \sqrt{3}$ is irrational.

- id: spec.geometry.ch.ptolemy
  pool: challenge
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.chord-secant-lengths] }
  subsection: "Finding and proving lengths"
  rating: 1980
  responseSkills: { reasoning: 1970, proof: 1970, clarity: 1920, synthesis: 1960 }
  stem: |
    $ABCD$ is a cyclic quadrilateral. Prove that $AC \times BD = AB \times CD + AD \times BC$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.879, -0.684], B: [0.518, -1.932], C: [1.879, 0.684], D: [-0.845, 1.813], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: segment, from: A, to: C }
      - { type: segment, from: B, to: D }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: construct, description: "Chooses E on diagonal AC with ∠ABE = ∠DBC", points: 1, dimension: proof }
          - { id: sim1, description: "Triangles ABE and DBC are similar (∠ABE = ∠DBC by construction; ∠BAE = ∠BAC = ∠BDC, same arc BC)", points: 2, dimension: reasoning }
          - { id: len1, description: "So AE/AB = DC/DB, i.e. AE × BD = AB × CD", points: 1, dimension: reasoning }
          - { id: sim2, description: "Triangles CBE and DBA are similar (∠CBE = ∠DBA, since adding ∠EBD to both equal angles; ∠BCE = ∠BCA = ∠BDA, same arc AB), giving CE × BD = BC × AD", points: 2, dimension: reasoning }
          - { id: add, description: "Adds, using AE + CE = AC: AC × BD = AB × CD + AD × BC", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Choose $E$ on $AC$ with $\angle ABE = \angle DBC$.

    Triangles $ABE$ and $DBC$: $\angle ABE = \angle DBC$ by construction, and $\angle BAE = \angle BAC = \angle BDC$ (same arc $BC$). So they are similar, and $\dfrac{AE}{AB} = \dfrac{DC}{DB}$, i.e. $AE \times BD = AB \times CD$.

    Triangles $CBE$ and $DBA$: adding $\angle EBD$ to both sides of $\angle ABE = \angle DBC$ gives $\angle ABD = \angle EBC$. Also $\angle BCE = \angle BCA = \angle BDA$ (same arc $AB$). So they are similar, and $\dfrac{CE}{BC} = \dfrac{AD}{BD}$, i.e. $CE \times BD = BC \times AD$.

    Adding, and using $AE + CE = AC$: $AC \times BD = AB \times CD + AD \times BC$.
