- id: spec.geometry.circle-angles.chord-from-angle
  skills: {primary: spec.geometry.circle-angles}
  rating: 1710
  responseSkills: {calculation: 1650, reasoning: 1700, synthesis: 1700}
  variants:
  - {a: 30, v: '5'}
  - {a: 45, v: '5\sqrt{2}'}
  stem: |
    Triangle $ABC$ has all three corners on a circle of radius 5, and $\angle BAC = {{a}}^\circ$. Find the exact length of $BC$.
  parts:
  - id: a
    prompt: $BC =$
    answer:
      type: numeric
      key: '{{v}}'
      form: [exact]
  solution: |
    Let $O$ be the center. $\angle BOC = 2 \times {{a}}^\circ$ (angle at the center), and $OB = OC = 5$. Find $BC$ from isosceles triangle $OBC$: for $30^\circ$ it is equilateral ($\angle BOC = 60^\circ$), so $BC = 5$; for $45^\circ$ it is right-angled ($\angle BOC = 90^\circ$), so $BC = 5\sqrt{2}$ by Pythagoras.
  verify: |
    def answers(a, v):
        B, C, A = on_circle(270 - a, 5), on_circle(270 + a, 5), on_circle(90, 5)
        assert abs(angle_at(B, A, C) - a) < 1e-9
        return {"a": nsimplify(round(dist(B, C), 12), [sqrt(2)])}
- id: spec.geometry.circle-angles.equal-chords-quad
  skills: {primary: spec.geometry.circle-angles}
  rating: 1720
  responseSkills: {calculation: 1650, reasoning: 1710, synthesis: 1710}
  stem: |
    $A$, $B$, $C$ and $D$ lie on a circle in that order, with $AB = BC = CD$ and $\angle ABC = 130^\circ$. Find $\angle BAD$.
  parts:
  - id: a
    prompt: $\angle BAD$ (°)
    answer: {type: numeric, key: '50'}
  solution: |
    Equal chords cut off equal arcs; let each of arcs $AB$, $BC$, $CD$ be $a^\circ$ at the center. $\angle ABC$ stands on arc $CDA$, which is $360^\circ - 2a$, so $130 = \tfrac{1}{2}(360 - 2a)$ and $a = 50$. $\angle BAD$ stands on arc $BCD = 2a = 100^\circ$, so $\angle BAD = 50^\circ$.
  verify: |
    def answers():
        a = 50
        A, B, C, D = on_circle(0), on_circle(a), on_circle(2*a), on_circle(3*a)
        assert abs(angle_at(A, B, C) - 130) < 1e-9
        return {"a": approx(angle_at(B, A, D))}
- id: spec.geometry.circle-angles.dodecagon-diagonals
  skills: {primary: spec.geometry.circle-angles}
  rating: 1750
  responseSkills: {calculation: 1680, reasoning: 1740, synthesis: 1750}
  stem: |
    $A_1A_2 \dots A_{12}$ is a regular 12-sided polygon with its corners on a circle. The diagonals $A_1A_5$ and $A_2A_8$ meet at $X$. Find the acute angle between them, $\angle A_1XA_2$.
  parts:
  - id: a
    prompt: $\angle A_1XA_2$ (°)
    answer: {type: numeric, key: '60'}
  solution: |
    Each side cuts off a $30^\circ$ arc. Join $A_1A_8$. In triangle $A_1XA_8$, the exterior angle at $X$ is $\angle A_1XA_2 = \angle XA_1A_8 + \angle XA_8A_1$.
    $\angle A_5A_1A_8$ stands on arc $A_5A_8$ ($3 \times 30^\circ = 90^\circ$), so it is $45^\circ$. $\angle A_1A_8A_2$ stands on arc $A_1A_2$ ($30^\circ$), so it is $15^\circ$. So the angle is $45^\circ + 15^\circ = 60^\circ$.
  verify: |
    def answers():
        V = {k: on_circle(90 - 30*(k - 1)) for k in range(1, 13)}
        X = line_meet(V[1], V[5], V[2], V[8])
        return {"a": approx(angle_at(V[1], X, V[2]))}
- id: spec.geometry.circle-angles.two-diameters-collinear
  skills: {primary: spec.geometry.circle-angles}
  rating: 1710
  responseSkills: {reasoning: 1700, proof: 1700, clarity: 1600, synthesis: 1690}
  stem: |
    Two circles meet at $A$ and $B$. $AC$ is a diameter of the first circle and $AD$ is a diameter of the second. Prove that $C$, $B$ and $D$ lie on one straight line.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: right1, description: '∠ABC = 90° (angle in a semicircle, first circle)', points: 2, dimension: reasoning}
      - {id: right2, description: '∠ABD = 90° (angle in a semicircle, second circle)', points: 1, dimension: proof}
      - {id: line, description: 'Two right angles at B add to 180°, so CBD is a straight line', points: 2, dimension: synthesis}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Join $AB$. $AC$ is a diameter of the first circle and $B$ is on it, so $\angle ABC = 90^\circ$ (angle in a semicircle). Likewise $\angle ABD = 90^\circ$ in the second circle. $C$ and $D$ are on opposite sides of $AB$, so $\angle CBD = 90^\circ + 90^\circ = 180^\circ$: $C$, $B$ and $D$ are collinear.
- id: spec.geometry.circle-angles.altitude-center
  skills: {primary: spec.geometry.circle-angles}
  rating: 1780
  responseSkills: {reasoning: 1780, proof: 1780, clarity: 1660, synthesis: 1760}
  stem: |
    Triangle $ABC$ is acute, with all three corners on a circle with center $O$. $D$ is the point on $BC$ with $AD$ perpendicular to $BC$. Prove that $\angle BAD = \angle OAC$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: bad, description: 'From right triangle ABD: ∠BAD = 90° − ∠ABC', points: 1, dimension: reasoning}
      - {id: center, description: ∠AOC = 2∠ABC (angle at the center), points: 2, dimension: reasoning}
      - {id: iso, description: 'OA = OC, so ∠OAC = ½(180° − 2∠ABC) = 90° − ∠ABC', points: 2, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Let $\angle ABC = \beta$. In right-angled triangle $ABD$, $\angle BAD = 90^\circ - \beta$.
    $\angle AOC = 2\beta$ (angle at the center on arc $AC$). $OA = OC$ (radii), so $\angle OAC = \tfrac{1}{2}(180^\circ - 2\beta) = 90^\circ - \beta$. So $\angle BAD = \angle OAC$.
