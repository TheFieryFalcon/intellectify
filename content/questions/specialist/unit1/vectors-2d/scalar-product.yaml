- id: spec.vectors-2d.scalar-product.obtuse-range
  title: "When the Angle Is Obtuse"
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Angle between vectors"
  rating: 1720
  responseSkills: {reading: 1700, reasoning: 1700, synthesis: 1710}
  stem: |
    For which real numbers $t$ is the angle between $\mathbf{i} + t\mathbf{j}$ and $t\mathbf{i} + \mathbf{j}$ obtuse (strictly between $90^\circ$ and $180^\circ$)?
  parts:
    - id: a
      options:
        - { id: a, text: '$t < 0$' }
        - { id: b, text: '$t < 0$ and $t \ne -1$' }
        - { id: c, text: '$-1 < t < 0$' }
        - { id: d, text: '$t < -1$' }
      answer: { type: mcq, key: b }
  solution: |
    The dot product is $2t$, so the angle is obtuse or $180^\circ$ exactly when $t < 0$.
    It is $180^\circ$ when the vectors point in opposite directions: $t\mathbf{i} + \mathbf{j} = k(\mathbf{i} + t\mathbf{j})$ with $k < 0$, which needs $t = k$ and $1 = kt = t^2$, so $t = -1$. Excluding that leaves $t < 0$, $t \ne -1$.
  verify: |
    def answers():
        def obtuse(t):
            u, v = Matrix([1, t]), Matrix([t, 1])
            c = u.dot(v) / (u.norm()*v.norm())
            return bool(-1 < c < 0)
        tests = {Rational(-5): True, Rational(-1): False, Rational(-1, 2): True, Rational(0): False, Rational(2): False}
        assert all(obtuse(t) == want for t, want in tests.items())
        return {"a": "b"}

