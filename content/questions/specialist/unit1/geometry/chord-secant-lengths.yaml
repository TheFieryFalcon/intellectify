    answer: {type: numeric, key: '{{v}}'}
  solution: |
    $x(x + {{k}}) = {{c}} \times {{d}} = {{p}}$, so $x^2 + {{k}}x - {{p}} = 0$, i.e. $(x + {{w}})(x - {{v}}) = 0$. Lengths are positive, so $x = {{v}}$.
  verify: |
    def answers(k, c, d, p, w, v):
        x = symbols("x", positive=True)
        return {"a": solve(x * (x + k) - c * d, x)[0]}

