  solution: |
    Glue the pair into one block: $({{n}}-1)!$ arrangements of the blocks, times 2 for the order inside the pair. That's {{v}}.
  verify: |
    from itertools import permutations
    def answers(n, v):
        return {"a": sum(1 for p in permutations(range(n)) if abs(p.index(0) - p.index(1)) == 1)}

