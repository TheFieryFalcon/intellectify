- id: spec.combinatorics.inclusion-exclusion.three-sports-exactly-one
  skills: { primary: spec.combinatorics.inclusion-exclusion }
  subsection: "Three sets"
  rating: 1620
  responseSkills: { reading: 1610, calculation: 1590, reasoning: 1610 }
  words: { sp1: sport, sp2: sport, sp3: sport }
  variants:
    - { n: 100, a: 40, b: 35, c: 30, ab: 12, ac: 10, bc: 8, abc: 4, v: 57 }
    - { n: 80, a: 30, b: 25, c: 20, ab: 8, ac: 6, bc: 5, abc: 2, v: 43 }
  stem: |
    Of {{n}} students, {{a}} play {{sp1}}, {{b}} play {{sp2}} and {{c}} play {{sp3}}. {{ab}} play both {{sp1}} and {{sp2}}, {{ac}} play both {{sp1}} and {{sp3}}, {{bc}} play both {{sp2}} and {{sp3}}, and {{abc}} play all three. How many play **exactly one** of them?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Fill the Venn diagram from the middle. Only {{sp1}} and {{sp2}}: ${{ab}} - {{abc}}$, and similarly for the other pairs. Only {{sp1}}: ${{a}} - ({{ab}} - {{abc}}) - ({{ac}} - {{abc}}) - {{abc}}$, and similarly. Adding the three "only" regions gives ${{a}} + {{b}} + {{c}} - 2({{ab}} + {{ac}} + {{bc}}) + 3 \times {{abc}} = {{v}}$.
