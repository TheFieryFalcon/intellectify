    - { e: 70, b: 110, d: 70, _view: '-2.55, 2.73, -2.5, 2.5', _A: '-1.879, -0.684', _B: '-0, -2', _C: '1.879, -0.684', _D: '1.286, 1.532', _E: '2.176, -1.792' }
    - { e: 84, b: 76, d: 104, _view: '-2.55, 3.12, -2.5, 2.5', _A: '-1.879, -0.684', _B: '1.439, -1.389', _C: '1.338, 1.486', _D: '-1.118, 1.658', _E: '2.567, 1.4' }
  stem: |
    $ABCD$ is a cyclic quadrilateral. Side $DC$ is extended to $E$. $\angle BCE = {{e}}^\circ$ and $\angle ABC = {{b}}^\circ$.

    ```diagram
    view: [{{_view}}]
    width: 230
    alt: "Cyclic quadrilateral ABCD with DC extended to E; angle BCE is 72 degrees and angle ABC is 95 degrees"
    points: { A: [{{_A}}], B: [{{_B}}], C: [{{_C}}], D: [{{_D}}], E: [{{_E}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: polygon, points: [A, B, C, D] }
      - { type: segment, from: C, to: E, dashed: true }
      - { type: angle, at: C, from: E, to: B, label: '{{e}}^\circ', radius: 20 }
      - { type: angle, at: B, from: C, to: A, label: '{{b}}^\circ', radius: 20 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: E, label: 'E' }
    ```
  parts:
    - id: a
      prompt: Find $\angle BAD$, in degrees.
      answer: { type: numeric, key: '{{e}}' }
    - id: b
      prompt: Find $\angle ADC$, in degrees.
      answer: { type: numeric, key: '{{d}}' }
  solution: |
    (a) An exterior angle of a cyclic quadrilateral equals the interior opposite angle: $\angle BAD = \angle BCE = {{e}}^\circ$.

    (b) Opposite angles add to $180^\circ$: $\angle ADC = 180^\circ - {{b}}^\circ = {{d}}^\circ$.
  verify: |
    def answers(e, b, d):
        # Cyclic quadrilateral with angle A = e and angle B = b; extend DC beyond C to E.
        for c in range(40, 160, 5):
            bb, dd = 2*e - c, 2*b - c
            aa = 360 - bb - c - dd
            if min(aa, bb, c, dd) >= 30: break
        A = on_circle(200); B = on_circle(200 + aa); C = on_circle(200 + aa + bb); D = on_circle(200 + aa + bb + c)
        E = (2*C[0] - D[0], 2*C[1] - D[1])
        assert abs(angle_at(B, C, E) - e) < 1e-6
        return {"a": approx(angle_at(B, A, D), 6), "b": approx(angle_at(A, D, C), 6)}

