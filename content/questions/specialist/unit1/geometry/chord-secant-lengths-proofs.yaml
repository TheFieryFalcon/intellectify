  solution: |
    Draw a tangent $MT$. It is perpendicular to the radius $OT$, so by Pythagoras $MT^2 = OM^2 - OT^2 = d^2 - r^2$. By the tangent–secant theorem, every secant from $M$ has $MA \times MB = MT^2 = d^2 - r^2$.

- id: spec.geometry.chord-secant-lengths.tangent-by-pythagoras
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1560
  responseSkills: { reasoning: 1550, proof: 1550, clarity: 1510 }
  stem: |
    From $M$, a tangent touches a circle with center $O$ and radius $r$ at $T$, and the line from $M$ through $O$ meets the circle at $A$ (nearer $M$) and $B$. Without using the tangent–secant theorem, prove that $MT^2 = MA \times MB$.

    ```diagram
    view: [-2.45, 4.05, -2.45, 2.45]
    width: 230
    points: { M: [3.6, 0], T: [1.111, 1.663], A: [2, 0], B: [-2, 0], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: T }
      - { type: segment, from: B, to: M }
      - { type: segment, from: O, to: T }
      - { type: point, at: O, label: 'O', pos: s }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: T, label: 'T', pos: n }
      - { type: point, at: A, label: 'A', pos: se }
      - { type: point, at: B, label: 'B', pos: w }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'pythag', description: "MT ⟂ OT, so MT² = MO² − r²", points: 1, dimension: reasoning }
          - { id: 'lengths', description: "MA = MO − r and MB = MO + r", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "MA × MB = MO² − r² = MT²", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    The tangent is perpendicular to the radius, so $MT^2 = MO^2 - r^2$. Since $A$ and $B$ lie on line $MO$ at distance $r$ from $O$, $MA = MO - r$ and $MB = MO + r$. So $MA \times MB = MO^2 - r^2 = MT^2$.

- id: spec.geometry.chord-secant-lengths.radius-from-tangent
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1550
  responseSkills: { reasoning: 1540, proof: 1540, clarity: 1500 }
  stem: |
    From $M$, a tangent of length $t$ touches a circle, and the line from $M$ through the center meets the circle first at $A$, with $MA = a$. Prove that the radius is $r = \dfrac{t^2 - a^2}{2a}$.

    ```diagram
    view: [-2.45, 4.05, -2.45, 2.45]
    width: 230
    points: { M: [3.6, 0], T: [1.111, 1.663], A: [2, 0], B: [-2, 0], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: T, label: 't', side: right }
      - { type: segment, from: B, to: M }
      - { type: segment, from: A, to: M, label: 'a', side: right }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: T, label: 'T', pos: n }
      - { type: point, at: A, label: 'A', pos: sw }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'mb', description: "The line through the center gives MB = a + 2r", points: 1, dimension: reasoning }
          - { id: 'power', description: "Tangent–secant: t² = a(a + 2r)", points: 2, dimension: reasoning }
          - { id: 'solve', description: "Rearranges to r = (t² − a²)/(2a)", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    The line through the center meets the circle at $A$ and at $B$, the other end of a diameter, so $MB = a + 2r$. By the tangent–secant theorem, $t^2 = a(a + 2r) = a^2 + 2ar$, so $r = \dfrac{t^2 - a^2}{2a}$.

- id: spec.geometry.chord-secant-lengths.tangent-between
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1460
  responseSkills: { reasoning: 1450, proof: 1450, clarity: 1410 }
  stem: |
    From $M$, a tangent touches a circle at $T$, and a secant cuts it at $A$ and $B$ with $A$ between $M$ and $B$. Prove that $MA < MT < MB$.

    ```diagram
    view: [-2.45, 4.05, -2.45, 2.45]
    width: 230
    points: { M: [3.6, 0], T: [1.111, 1.663], A: [1.965, 0.373], B: [-1.609, 1.187], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: T }
      - { type: segment, from: M, to: B }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: T, label: 'T', pos: n }
      - { type: point, at: A, label: 'A', pos: s }
      - { type: point, at: B, label: 'B', pos: sw }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'power', description: "MT² = MA × MB", points: 1, dimension: reasoning }
          - { id: 'bounds', description: "MA < MB gives MA² < MA × MB < MB²", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "So MA² < MT² < MB², and taking square roots of positive numbers, MA < MT < MB", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    By the tangent–secant theorem, $MT^2 = MA \times MB$. Since $0 < MA < MB$, we have $MA^2 < MA \times MB < MB^2$, i.e. $MA^2 < MT^2 < MB^2$. All are positive lengths, so $MA < MT < MB$.

- id: spec.geometry.chord-secant-lengths.bisecting-chords-diameters
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1480
  responseSkills: { reasoning: 1470, proof: 1470, clarity: 1430 }
  stem: |
    Two different chords of a circle bisect each other. Prove that both are diameters.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [1.732, 1], B: [-1.732, -1], C: [-1.732, 1], D: [1.732, -1], X: [0, 0], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: X, ticks: 1 }
      - { type: segment, from: X, to: B, ticks: 1 }
      - { type: segment, from: C, to: X, ticks: 2 }
      - { type: segment, from: X, to: D, ticks: 2 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: X, label: 'X', pos: n }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'perp', description: "If the common midpoint X isn't the center O, then OX is perpendicular to both chords (the line from the center to a chord's midpoint is perpendicular to it)", points: 2, dimension: reasoning }
          - { id: 'contra', description: "Two different lines through X perpendicular to OX is impossible", points: 1, dimension: proof }
          - { id: 'conclude', description: "So X = O, and both chords pass through the center: they are diameters", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let the chords $AB$ and $CD$ have the same midpoint $X$. Suppose $X$ is not the center $O$. The line from the center to the midpoint of a chord is perpendicular to the chord, so $OX \perp AB$ and $OX \perp CD$. But through $X$ there is only one line perpendicular to $OX$, so $AB$ and $CD$ would be the same line, contradicting their being different chords. Hence $X = O$, and both chords pass through the center: both are diameters.

- id: spec.geometry.chord-secant-lengths.am-gm-circle
  skills: { primary: spec.geometry.chord-secant-lengths, secondary: [spec.geometry.circle-problems] }
  rating: 1680
  responseSkills: { reasoning: 1670, proof: 1670, clarity: 1630, synthesis: 1660 }
  stem: |
    Use a circle to prove that for positive numbers $a$ and $b$, $\sqrt{ab} \le \dfrac{a + b}{2}$.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'construct', description: "Draws a diameter AB of length a + b with X on it, AX = a, XB = b, and the chord CD through X perpendicular to AB", points: 1, dimension: proof }
          - { id: 'cx', description: "Then CX² = AX × XB = ab (perpendicular chord bisected, intersecting chords), so CX = √(ab)", points: 2, dimension: reasoning }
          - { id: 'bound', description: "CX is at most the radius (a + b)/2, since C is on the circle and X is on a diameter (OC = r and CX ≤ OC in right triangle OXC)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "So √(ab) ≤ (a + b)/2", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Draw a circle with diameter $AB = a + b$, so the radius is $r = \dfrac{a + b}{2}$, and mark $X$ on $AB$ with $AX = a$, $XB = b$. Let the chord through $X$ perpendicular to $AB$ meet the circle at $C$ and $D$. The diameter bisects it, so $CX = XD$, and by intersecting chords $CX^2 = AX \times XB = ab$: $CX = \sqrt{ab}$.

    In triangle $OXC$, the angle at $X$ is $90^\circ$, so the hypotenuse $OC = r$ is at least as long as $CX$ (equal when $X = O$). Hence $\sqrt{ab} \le \dfrac{a + b}{2}$.

- id: spec.geometry.chord-secant-lengths.altitude-mean-proportional
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1640
  responseSkills: { reasoning: 1630, proof: 1630, clarity: 1590 }
  stem: |
    Triangle $ABC$ has a right angle at $C$, and $D$ is the foot of the perpendicular from $C$ to $AB$. Use a circle to prove that $CD^2 = AD \times DB$.

    ```diagram
    view: [-2.45, 4.45, -2.45, 2.45]
    width: 260
    points: { A: [0, 0], B: [4, 0], C: [1, 1.732], D: [1, 0] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: A }
      - { type: segment, from: C, to: D }
      - { type: angle, at: C, from: A, to: B, right: true }
      - { type: angle, at: D, from: B, to: C, right: true }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: se }
      - { type: point, at: C, label: 'C', pos: n }
      - { type: point, at: D, label: 'D', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'circle', description: "C lies on the circle with diameter AB (converse of the angle in a semicircle)", points: 1, dimension: reasoning }
          - { id: 'chord', description: "Extend CD to meet the circle again at E; the diameter AB is perpendicular to chord CE, so CD = DE", points: 2, dimension: reasoning }
          - { id: 'product', description: "Intersecting chords: AD × DB = CD × DE = CD²", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $\angle ACB = 90^\circ$, so $C$ lies on the circle with diameter $AB$. Extend $CD$ to meet that circle again at $E$. The diameter $AB$ is perpendicular to the chord $CE$, so it bisects it: $CD = DE$. By the intersecting chords theorem, $AD \times DB = CD \times DE = CD^2$.

- id: spec.geometry.chord-secant-lengths.equal-chords-split
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1640
  responseSkills: { reasoning: 1630, proof: 1630, clarity: 1590 }
  stem: |
    Two equal chords $AB$ and $CD$ of a circle meet at $X$. Prove that the two pieces of $AB$ are equal, in some order, to the two pieces of $CD$: either $AX = CX$ and $XB = XD$, or $AX = XD$ and $XB = CX$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [1.836, 0.793], B: [-1.454, 1.373], C: [-0.462, 1.946], D: [-1.605, -1.193], X: [-0.718, 1.243], O: [0, 0] }
    draw:
