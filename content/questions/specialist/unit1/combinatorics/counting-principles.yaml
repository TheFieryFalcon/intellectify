- id: spec.combinatorics.counting-principles.sum-of-arrangements
  skills: { primary: spec.combinatorics.counting-principles }
  subsection: "Factorials and nPr"
  rating: 1730
  responseSkills: {calculation: 1600, reasoning: 1710, synthesis: 1720}
  variants:
    - { d: '1, 2, 3, 4', s: 10, v: 66660 }
    - { d: '2, 4, 6, 8', s: 20, v: 133320 }
    - { d: '1, 3, 5, 9', s: 18, v: 119988 }
  stem: |
    Every 4-digit number that uses each of the digits {{d}} exactly once is written down. Find the sum of all these numbers.
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    There are $4! = 24$ numbers. By symmetry, each digit appears in each place value $24 \div 4 = 6$ times. So each place contributes $6 \times {{s}}$ times its place value, and the total is $6 \times {{s}} \times 1111 = {{v}}$.
  verify: |
    from itertools import permutations
    def answers(d, s, v):
        digits = [int(x) for x in d.split(",")]
        return {"a": sum(int("".join(map(str, p))) for p in permutations(digits))}

- id: spec.combinatorics.counting-principles.ordered-factor-triples
  skills: { primary: spec.combinatorics.counting-principles, secondary: [spec.combinatorics.combinations] }
  subsection: "Counting divisors"
  rating: 1790
  responseSkills: {calculation: 1600, reasoning: 1770, synthesis: 1780}
  stem: |
    How many ordered triples $(a, b, c)$ of positive integers satisfy $abc = 2^6 \times 3^4$?
  parts:
    - id: a
      answer: { type: numeric, key: 420 }
  solution: |
    Each of $a, b, c$ is $2^x 3^y$, and the exponents of 2 must add to 6 while those of 3 add to 4. These are independent, so multiply.

    Sharing 6 identical factors of 2 among 3 numbers is like placing 2 dividers among 6 objects: $\binom{8}{2} = 28$ ways. For the factors of 3: $\binom{6}{2} = 15$ ways. Total $28 \times 15 = 420$.
  verify: |
    def answers():
        n = 2**6 * 3**4
        return {"a": sum(1 for a in divisors(n) for b in divisors(n // a))}

- id: spec.combinatorics.counting-principles.no-adjacent-equal
  skills: { primary: spec.combinatorics.counting-principles }
  subsection: "Cases and the addition principle"
  rating: 1760
  responseSkills: {calculation: 1710, reasoning: 1740, proof: 1700, synthesis: 1750}
  stem: |
    A string of length $n$ uses only the digits 0, 1 and 2, and no two **adjacent** digits are equal (for example 0120 but not 0110).
  parts:
    - id: a
      prompt: How many such strings have length 6?
      marks: 1
      answer: { type: numeric, key: 96 }
    - id: b
      prompt: Find a formula for the number of such strings of length $n$, in terms of $n$.
      marks: 2
      answer: { type: expression, key: '3 \cdot 2^{n-1}', vars: { n: { domain: [1, 8] } } }
  solution: |
    The first digit has 3 options. Each later digit can be anything except the digit just before it: 2 options, *whatever came before*. By the multiplication principle there are $3 \cdot 2^{n-1}$ strings, which is $3 \cdot 2^5 = 96$ when $n = 6$.
  verify: |
    from itertools import product
    def answers():
        count6 = sum(1 for s in product(range(3), repeat=6) if all(s[i] != s[i + 1] for i in range(5)))
        n = symbols("n")
        return {"a": count6, "b": 3 * 2**(n - 1)}

