    - { x: 77, _A: '-2, 0', _B: '0.45, -1.949', _C: '2, 0', _D: '0.45, 1.949' }
    - { x: 91, _A: '-2, 0', _B: '-0.035, -2', _C: '2, 0', _D: '-0.035, 2' }
    - { x: 113, _A: '-2, 0', _B: '-0.781, -1.841', _C: '2, 0', _D: '-0.781, 1.841' }
    - { x: 128, _A: '-2, 0', _B: '-1.231, -1.576', _C: '2, 0', _D: '-1.231, 1.576' }
  stem: |
    $ABCD$ is a cyclic quadrilateral with $\angle DAB = {{x}}^\circ$. Find $\angle BCD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [{{_A}}], B: [{{_B}}], C: [{{_C}}], D: [{{_D}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: polygon, points: [A, B, C, D] }
      - { type: angle, at: A, from: B, to: D, label: '{{x}}^\circ', radius: 18 }
      - { type: angle, at: C, from: D, to: B, radius: 16 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
  - id: a
    prompt: $\angle BCD$ (°)
    answer: {type: numeric, key: '180-{{x}}'}
  solution: |
    Opposite angles of a cyclic quadrilateral add to $180^\circ$: $\angle BCD = 180^\circ - {{x}}^\circ$.
  verify: |
    def answers(x):
        # Arc BCD (not containing A) has central angle 2x.
        A = on_circle(180)
        B, D = on_circle(180 + (360 - 2*x) / 2), on_circle(180 - (360 - 2*x) / 2)
        C = on_circle(0)
        assert abs(angle_at(B, A, D) - x) < 1e-9
        return {"a": approx(angle_at(B, C, D))}

