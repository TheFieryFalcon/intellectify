# Section Challenge: Geometry (1.1). A fixed sequence, green → yellow → red → black (SPEC §8.4).

- id: spec.geometry.ch.concentric-equal-pieces
  pool: challenge
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Chords and the center"
  rating: 1570
  responseSkills: { reasoning: 1560, proof: 1550, clarity: 1500 }
  stem: |
    Two circles have the same center $O$. A straight line cuts the larger circle at $A$ and $D$ and the smaller circle at $B$ and $C$, in the order $A$, $B$, $C$, $D$. Prove that $AB = CD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.873, -0.7], B: [-0.975, -0.7], C: [0.975, -0.7], D: [1.873, -0.7], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: circle, center: O, radius: 1.2 }
      - { type: segment, from: A, to: D }
      - { type: point, at: O, label: 'O', pos: n }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: s }
      - { type: point, at: C, label: 'C', pos: s }
      - { type: point, at: D, label: 'D', pos: se }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: foot, description: "Drops the perpendicular OM from O to the line", points: 1, dimension: proof }
          - { id: bisects, description: "The perpendicular from the center bisects a chord, in both circles: AM = MD and BM = MC", points: 2, dimension: reasoning }
          - { id: subtract, description: "AB = AM − BM = MD − MC = CD", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $M$ be the foot of the perpendicular from $O$ to the line. The perpendicular from the center of a circle to a chord bisects the chord. $AD$ is a chord of the larger circle, so $AM = MD$; $BC$ is a chord of the smaller circle, so $BM = MC$.

    $B$ lies between $A$ and $M$, and $C$ between $M$ and $D$, so $AB = AM - BM = MD - MC = CD$.

- id: spec.geometry.ch.cyclic-extended-sides
  pool: challenge
  skills: { primary: spec.geometry.circle-angles }
  subsection: "Cyclic quadrilaterals"
  rating: 1590
  responseSkills: { reasoning: 1580, proof: 1570, clarity: 1510 }
  stem: |
    $ABCD$ is a cyclic quadrilateral. Lines $AB$ and $DC$, extended beyond $B$ and $C$, meet at $P$. Lines $AD$ and $BC$, extended beyond $D$ and $C$, meet at $Q$. Prove that $\angle APD + \angle AQB = 180^\circ - 2\angle DAB$.

    ```diagram
    view: [-2.45, 4.6, -2.6, 4.7]
    width: 260
    points: { A: [-1.879, -0.684], B: [1.286, -1.532], C: [2, 0], D: [1, 1.732], P: [3.177, -2.039], Q: [3.97, 4.224], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: P }
      - { type: segment, from: D, to: P }
      - { type: segment, from: A, to: Q }
      - { type: segment, from: B, to: Q }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: s }
      - { type: point, at: C, label: 'C', pos: e }
      - { type: point, at: D, label: 'D', pos: nw }
      - { type: point, at: P, label: 'P', pos: e }
      - { type: point, at: Q, label: 'Q', pos: e }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: names, description: "Names ∠DAB = α and ∠ABC = β, and uses ∠ADC = 180° − β (opposite angles of a cyclic quadrilateral)", points: 1, dimension: reasoning }
          - { id: p, description: "Angle sum of triangle APD: ∠APD = 180° − α − (180° − β) = β − α", points: 1, dimension: reasoning }
          - { id: q, description: "Angle sum of triangle ABQ: ∠AQB = 180° − α − β", points: 1, dimension: reasoning }
          - { id: add, description: "Adds to get 180° − 2α", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $\angle DAB = \alpha$ and $\angle ABC = \beta$. Opposite angles of a cyclic quadrilateral add to $180^\circ$, so $\angle ADC = 180^\circ - \beta$.

    In triangle $APD$, the angle at $A$ is $\alpha$ and the angle at $D$ is $\angle ADC = 180^\circ - \beta$ ($P$ is on line $DC$ beyond $C$). So $\angle APD = 180^\circ - \alpha - (180^\circ - \beta) = \beta - \alpha$.

    In triangle $ABQ$, the angle at $A$ is $\alpha$ and the angle at $B$ is $\beta$ ($Q$ is on line $BC$ beyond $C$). So $\angle AQB = 180^\circ - \alpha - \beta$.

    Adding, $\angle APD + \angle AQB = 180^\circ - 2\alpha = 180^\circ - 2\angle DAB$.

- id: spec.geometry.ch.tangent-two-chords
  pool: challenge
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.chords-tangents] }
  subsection: "Finding and proving angles"
  rating: 1600
  responseSkills: { reading: 1560, reasoning: 1570, calculation: 1540, synthesis: 1560 }
  variants:
    - { t: 58, a: 54, v: 68, _B: '1.798, 0.877', _A: '-1.389, 1.439' }
    - { t: 50, a: 60, v: 70, _B: '1.97, 0.347', _A: '-1.286, 1.532' }
    - { t: 62, a: 48, v: 70, _B: '1.658, 1.118', _A: '-1.286, 1.532' }
    - { t: 55, a: 65, v: 60, _B: '1.879, 0.684', _A: '-1.732, 1' }
    - { t: 64, a: 52, v: 64, _B: '1.576, 1.231', _A: '-1.576, 1.231' }
  stem: |
    A tangent touches a circle at $T$. Points $A$ and $B$ are on the circle, on opposite sides of the line through $T$ and the center. Chord $TB$ makes an angle of ${{t}}^\circ$ with the tangent, and $\angle ATB = {{a}}^\circ$. Find $\angle TBA$, in degrees.

    ```diagram
    view: [-3.25, 3.25, -2.45, 2.45]
    width: 230
    alt: "Tangent at T; chord TB at 58 degrees to it; angle ATB of 54 degrees; angle TBA unknown"
    points: { T: [-0, -2], A: [{{_A}}], B: [{{_B}}], L: [-2.8, -2], R: [2.8, -2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: L, to: R, color: muted }
      - { type: segment, from: T, to: A }
      - { type: segment, from: T, to: B }
      - { type: segment, from: A, to: B }
      - { type: angle, at: T, from: R, to: B, label: '{{t}}^\circ', radius: 26 }
      - { type: angle, at: T, from: B, to: A, label: '{{a}}^\circ', radius: 22 }
      - { type: angle, at: B, from: A, to: T, label: '?', radius: 20 }
      - { type: point, at: T, label: 'T', pos: s }
      - { type: point, at: A, label: 'A', pos: nw }
      - { type: point, at: B, label: 'B', pos: ne }
    ```
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    The tangent is a straight line, so the angle between chord $TA$ and the tangent on $A$'s side is $180^\circ - {{a}}^\circ - {{t}}^\circ = {{v}}^\circ$. By the alternate segment theorem, that equals the angle chord $TA$ subtends at $B$: $\angle TBA = {{v}}^\circ$.
  verify: |
    def answers(t, a, v):
        T, L, R = (0, -2), (-3, -2), (3, -2)
        B, A = on_circle(270 + 2*t, 2), on_circle(270 - 2*(180 - t - a), 2)
        assert abs(angle_at(R, T, B) - t) < 1e-9 and abs(angle_at(A, T, B) - a) < 1e-9
        return {"a": approx(angle_at(T, B, A))}

- id: spec.geometry.ch.tangent-meets-diameter
  pool: challenge
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.chords-tangents] }
  subsection: "Finding and proving angles"
  rating: 1640
  responseSkills: { reasoning: 1610, proof: 1600, clarity: 1560, synthesis: 1590 }
  stem: |
    $AB$ is a diameter of a circle with center $O$, and $C$ is a point on the circle. The tangent at $C$ meets line $AB$, extended beyond $B$, at $T$. Prove that $\angle ATC = 90^\circ - 2\angle CAB$.

    ```diagram
    view: [-2.45, 4.45, -2.45, 2.45]
    width: 300
    points: { A: [-2, 0], B: [2, 0], C: [1, 1.732], T: [3.999, 0], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: T }
      - { type: segment, from: C, to: T }
      - { type: segment, from: A, to: C }
      - { type: segment, from: O, to: C }
      - { type: point, at: O, label: 'O', pos: s }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: s }
      - { type: point, at: C, label: 'C', pos: n }
      - { type: point, at: T, label: 'T', pos: e }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: center, description: "∠COB = 2∠CAB (angle at the center is twice the angle at the circumference)", points: 2, dimension: reasoning }
          - { id: tangent, description: "∠OCT = 90° (tangent ⟂ radius)", points: 1, dimension: reasoning }
          - { id: sum, description: "Angle sum of triangle OCT: ∠CTO = 90° − 2∠CAB, and ∠CTO = ∠ATC", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $\angle CAB = x$. The angle at the center on arc $CB$ is twice the angle at the circumference: $\angle COB = 2x$.

    The tangent at $C$ is perpendicular to the radius, so $\angle OCT = 90^\circ$. In triangle $OCT$, $\angle CTO = 180^\circ - 90^\circ - 2x = 90^\circ - 2x$. Since $T$ lies on line $AB$, $\angle ATC = \angle CTO = 90^\circ - 2\angle CAB$.

- id: spec.geometry.ch.log2-3-irrational
  pool: challenge
  skills: { primary: spec.geometry.proof-methods }
  subsection: "Proof by contradiction"
  rating: 1690
  responseSkills: { reasoning: 1670, proof: 1670, clarity: 1620 }
  stem: |
    Prove that $\log_2 3$ is irrational.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: assume, description: "Assumes, for contradiction, that log₂3 = p/q with p, q positive integers (it is positive)", points: 1, dimension: proof }
          - { id: power, description: "Rewrites as 2^(p/q) = 3, so 2^p = 3^q", points: 2, dimension: reasoning }
          - { id: parity, description: "2^p is even (p ≥ 1) and 3^q is odd: contradiction", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Suppose, for contradiction, that $\log_2 3 = \dfrac{p}{q}$ for integers $p$ and $q$. Since $3 > 1$, $\log_2 3 > 0$, so we can take $p, q$ positive.

    Then $2^{p/q} = 3$, and raising both sides to the power $q$ gives $2^p = 3^q$. The left side is even (as $p \ge 1$) and the right side is odd, which is impossible. So $\log_2 3$ is irrational.

- id: spec.geometry.ch.circle-through-lattice
  pool: challenge
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.circle-angles] }
  subsection: "Finding and proving lengths"
  rating: 1720
  responseSkills: { reading: 1710, reasoning: 1710, calculation: 1690, synthesis: 1700 }
  variants:
    - { p: 6, q: 8, h: 10, r: '5', _A: '6, 0', _B: '0, 8', _view: '-1.5, 8, -1.5, 9.5' }
    - { p: 5, q: 12, h: 13, r: '6.5', _A: '5, 0', _B: '0, 12', _view: '-1.5, 7, -1.5, 13.5' }
    - { p: 8, q: 15, h: 17, r: '8.5', _A: '8, 0', _B: '0, 15', _view: '-1.5, 10, -1.5, 16.5' }
    - { p: 9, q: 12, h: 15, r: '7.5', _A: '9, 0', _B: '0, 12', _view: '-1.5, 11, -1.5, 13.5' }
    - { p: 12, q: 16, h: 20, r: '10', _A: '12, 0', _B: '0, 16', _view: '-1.5, 14, -1.5, 17.5' }
  stem: |
    A circle passes through the points $(0, 0)$, $({{p}}, 0)$ and $(0, {{q}})$ on a coordinate grid. Find its radius.

    ```diagram
    view: [{{_view}}]
    width: 220
    axes: true
    grid: true
    points: { O: [0, 0], A: [{{_A}}], B: [{{_B}}] }
    draw:
      - { type: polygon, points: [O, A, B] }
      - { type: point, at: O, label: '(0, 0)', pos: sw }
      - { type: point, at: A, label: '({{p}}, 0)', pos: s }
      - { type: point, at: B, label: '(0, {{q}})', pos: e }
    ```
  parts:
    - id: a
      answer: { type: numeric, key: '{{r}}' }
  solution: |
    The segments from $(0, 0)$ to the other two points lie along the axes, so the angle at $(0, 0)$ is $90^\circ$. By the converse of the angle in a semicircle, the chord joining $({{p}}, 0)$ and $(0, {{q}})$ is a diameter. Its length is $\sqrt{ {{p}}^2 + {{q}}^2 } = {{h}}$, so the radius is {{r}}.
  verify: |
    def answers(p, q, h, r):
        # Circle through (0, 0), (p, 0), (0, q): center (p/2, q/2) from the perpendicular bisectors.
        cx, cy = Rational(p, 2), Rational(q, 2)
        return {"a": sqrt(cx ** 2 + cy ** 2)}

- id: spec.geometry.ch.determinant-one-coprime
  pool: challenge
  requires: [matrices]
  skills: { primary: spec.geometry.proof-methods }
  subsection: "Proof by contradiction"
  rating: 1740
  responseSkills: { reasoning: 1730, proof: 1730, clarity: 1680 }
  stem: |
    The matrix $\begin{pmatrix} a & b \\ c & d \end{pmatrix}$ has whole-number entries and determinant $ad - bc = 1$. Prove that $a$ and $b$ have no common factor greater than 1.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: assume, description: "Assumes, for contradiction, that a whole number k > 1 divides both a and b", points: 1, dimension: proof }
          - { id: divides, description: "Then k divides ad and bc, so k divides ad − bc", points: 2, dimension: reasoning }
          - { id: contra, description: "But ad − bc = 1, and k > 1 can't divide 1: contradiction", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Suppose, for contradiction, that a whole number $k > 1$ divides both $a$ and $b$. Then $k$ divides $ad$ and $bc$, so it divides their difference $ad - bc = 1$. No whole number greater than 1 divides 1, which is a contradiction. So $a$ and $b$ have no common factor greater than 1.

- id: spec.geometry.ch.tangents-meet-distance
  pool: challenge
  skills: { primary: spec.geometry.chords-tangents, secondary: [spec.geometry.proof-methods] }
  subsection: "Tangents from a point"
  rating: 1750
  responseSkills: { reasoning: 1700, proof: 1690, clarity: 1620, synthesis: 1680 }
  stem: |
    A chord $AB$ of a circle with center $O$ and radius $r$ is at distance $d > 0$ from $O$. The tangents at $A$ and $B$ meet at $P$. Prove that $OP = \dfrac{r^2}{d}$.

    ```diagram
    view: [-2.45, 3.75, -2.45, 2.45]
    width: 250
    points: { A: [1.2, 1.6], B: [1.2, -1.6], P: [3.333, 0], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: A, to: P }
      - { type: segment, from: B, to: P }
      - { type: segment, from: O, to: P, dashed: true }
      - { type: point, at: O, label: 'O', pos: w }
      - { type: point, at: A, label: 'A', pos: n }
      - { type: point, at: B, label: 'B', pos: s }
      - { type: point, at: P, label: 'P', pos: e }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: congruent, description: "Triangles OAP and OBP are congruent (RHS: right angles at A and B, OA = OB, OP common), so ∠AOP = ∠BOP", points: 1, dimension: reasoning }
          - { id: perpendicular, description: "OP meets AB at M with triangles OMA and OMB congruent (SAS), so OM ⟂ AB and OM = d", points: 2, dimension: reasoning }
          - { id: similar, description: "Triangles OMA and OAP are similar (common angle at O, right angles at M and A)", points: 1, dimension: proof }
          - { id: conclude, description: "OM/OA = OA/OP, so OP = r²/d", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    A tangent is perpendicular to the radius at its point of contact, so $\angle OAP = \angle OBP = 90^\circ$. Triangles $OAP$ and $OBP$ have $OA = OB = r$ and $OP$ common, so they are congruent (RHS), and $\angle AOP = \angle BOP$.

    Let $OP$ meet $AB$ at $M$. Triangles $OMA$ and $OMB$ have $OA = OB$, $OM$ common and $\angle AOM = \angle BOM$, so they are congruent (SAS). Then $\angle OMA = \angle OMB$, and these add to $180^\circ$, so each is $90^\circ$. So $OM \perp AB$, and $OM$ is the distance from $O$ to the chord: $OM = d$.

    Triangles $OMA$ and $OAP$ share the angle at $O$, and $\angle OMA = \angle OAP = 90^\circ$, so they are similar:
    $$\frac{OM}{OA} = \frac{OA}{OP} \quad\Rightarrow\quad OP = \frac{OA^2}{OM} = \frac{r^2}{d}.$$

- id: spec.geometry.ch.square-circle-radius
  pool: challenge
  skills: { primary: spec.geometry.chord-secant-lengths, secondary: [spec.geometry.chords-tangents] }
  subsection: "Intersecting chords"
  rating: 1780
  responseSkills: { reasoning: 1720, proof: 1710, clarity: 1640, synthesis: 1720 }
  stem: |
    Square $ABCD$ has side length $s$. A circle passes through $A$ and $B$ and touches the side $CD$. Prove that the radius of the circle is $\dfrac{5s}{8}$.

    ```diagram
    view: [-2.1, 2.1, -1, 2.45]
    width: 230
    points: { A: [-1, 0], B: [1, 0], C: [1, 2], D: [-1, 2], K: [0, 0.75], T: [0, 2] }
    draw:
      - { type: polygon, points: [A, B, C, D] }
      - { type: circle, center: K, radius: 1.25 }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: se }
      - { type: point, at: C, label: 'C', pos: ne }
      - { type: point, at: D, label: 'D', pos: nw }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: axis, description: "The center lies on the perpendicular bisector of chord AB, which passes through the midpoints N of AB and M of CD", points: 1, dimension: reasoning }
          - { id: touch, description: "The radius to the point of contact is perpendicular to CD, so the circle touches CD at M", points: 1, dimension: reasoning }
          - { id: diameter, description: "MN extended is a diameter MS of the circle", points: 1, dimension: proof }
          - { id: chords, description: "Intersecting chords at N: MN × NS = AN × NB, so s × NS = s²/4 and NS = s/4", points: 2, dimension: reasoning }
          - { id: conclude, description: "Diameter MS = 5s/4, so the radius is 5s/8", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $N$ and $M$ be the midpoints of $AB$ and $CD$, and $K$ the center. $AB$ is a chord, so $K$ lies on its perpendicular bisector, the line $NM$.

    The radius to the point of contact is perpendicular to the tangent $CD$. $CD \parallel AB$, so this radius is perpendicular to $AB$ too, and it lies along the line through $K$ perpendicular to $AB$: the line $NM$. So the circle touches $CD$ at $M$.

    The line $MN$ passes through $K$, so it meets the circle again at $S$, with $MS$ a diameter, and $N$ is inside the circle between $M$ and $S$. Chords $MS$ and $AB$ cross at $N$, so by the intersecting chords theorem
    $$MN \times NS = AN \times NB \quad\Rightarrow\quad s \times NS = \frac{s}{2}\cdot\frac{s}{2} \quad\Rightarrow\quad NS = \frac{s}{4}.$$
    The diameter is $MS = s + \dfrac{s}{4} = \dfrac{5s}{4}$, so the radius is $\dfrac{5s}{8}$.

- id: spec.geometry.ch.feet-mean-proportional
  pool: challenge
  skills: { primary: spec.geometry.chords-tangents, secondary: [spec.geometry.circle-problems] }
  subsection: "The alternate segment theorem"
  rating: 1830
  responseSkills: { reasoning: 1760, proof: 1750, clarity: 1680, synthesis: 1780 }
  stem: |
    Tangents from a point $P$ touch a circle at $A$ and $B$. $C$ is a point on the minor arc $AB$, and $D$, $E$, $F$ are the feet of the perpendiculars from $C$ to $AB$, $PA$ and $PB$. Prove that $CD^2 = CE \times CF$.

    ```diagram
    view: [-2.45, 2.45, -4.4, 2.45]
    width: 230
    points: { P: [0, -4], A: [-1.732, -1], B: [1.732, -1], C: [-0.684, -1.879], D: [-0.684, -1], E: [-1.089, -2.113], F: [0.747, -2.706], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: P, to: A }
      - { type: segment, from: P, to: B }
      - { type: segment, from: A, to: B }
      - { type: segment, from: C, to: D }
      - { type: segment, from: C, to: E }
      - { type: segment, from: C, to: F }
      - { type: angle, at: D, from: A, to: C, right: true }
      - { type: angle, at: E, from: A, to: C, right: true }
      - { type: angle, at: F, from: B, to: C, right: true }
      - { type: point, at: P, label: 'P', pos: s }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: e }
      - { type: point, at: C, label: 'C', pos: s }
      - { type: point, at: D, label: 'D', pos: n }
      - { type: point, at: E, label: 'E', pos: w }
      - { type: point, at: F, label: 'F', pos: e }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: cyclic, description: "AECD and BFCD are cyclic (each has two opposite right angles)", points: 1, dimension: reasoning }
          - { id: first, description: "∠CDE = ∠CAE = ∠CBA = ∠CFD (same arc; alternate segment; same arc)", points: 2, dimension: reasoning }
          - { id: second, description: "∠CED = ∠CAD = ∠CBF = ∠CDF (same arc; alternate segment; same arc)", points: 2, dimension: reasoning }
          - { id: similar, description: "So triangles CDE and CFD are similar, giving CD/CF = CE/CD and CD² = CE × CF", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    $\angle CEA = \angle CDA = 90^\circ$, and these are opposite angles of quadrilateral $AECD$, so it is cyclic. In the same way $\angle CFB = \angle CDB = 90^\circ$, so $BFCD$ is cyclic.

    **First pair of angles.** In circle $AECD$, $\angle CDE = \angle CAE$ (same arc $CE$). By the alternate segment theorem, the angle between tangent $AP$ and chord $AC$ equals the angle in the alternate segment: $\angle CAE = \angle CBA$. In circle $BFCD$, $\angle CBD = \angle CFD$ (same arc $CD$). So $\angle CDE = \angle CFD$.

    **Second pair.** In circle $AECD$, $\angle CED = \angle CAD$ (same arc $CD$). By the alternate segment theorem at $B$, $\angle CBF = \angle CAB$. In circle $BFCD$, $\angle CBF = \angle CDF$ (same arc $CF$). So $\angle CED = \angle CDF$.

    Triangles $CDE$ and $CFD$ have two pairs of equal angles, so they are similar:
    $$\frac{CD}{CF} = \frac{CE}{CD} \quad\Rightarrow\quad CD^2 = CE \times CF.$$

- id: spec.geometry.ch.bisector-meets-perpendicular
  pool: challenge
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.circle-angles] }
  subsection: "Finding and proving angles"
  rating: 1870
  responseSkills: { reasoning: 1860, proof: 1850, clarity: 1810, synthesis: 1850 }
  stem: |
    $ABC$ is a triangle inscribed in a circle, with $AB \ne AC$. Prove that the bisector of angle $A$ and the perpendicular bisector of $BC$ meet at a point on the circle.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1, 1.732], B: [-1.638, -1.147], C: [1.732, -1], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: A }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: meet, description: "Lets the bisector of angle A meet the circle again at M", points: 1, dimension: proof }
          - { id: chords, description: "∠BAM = ∠MAC, so chords BM and MC are equal (equal angles at the circumference stand on equal chords)", points: 2, dimension: reasoning }
          - { id: perp, description: "MB = MC puts M on the perpendicular bisector of BC", points: 1, dimension: reasoning }
          - { id: unique, description: "The two lines are different (AB ≠ AC), so they meet only at M, which is on the circle", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let the bisector of angle $A$ meet the circle again at $M$. Then $\angle BAM = \angle MAC$: equal angles at the circumference stand on equal chords, so $MB = MC$. A point equally far from $B$ and $C$ lies on the perpendicular bisector of $BC$, so $M$ is on it.

    Since $AB \ne AC$, the bisector of angle $A$ is not the perpendicular bisector of $BC$, so the two lines meet in exactly one point, $M$, which lies on the circle.

- id: spec.geometry.ch.touching-circles-parallel
  pool: challenge
  skills: { primary: spec.geometry.circle-problems, secondary: [spec.geometry.chords-tangents] }
  subsection: "Finding and proving angles"
