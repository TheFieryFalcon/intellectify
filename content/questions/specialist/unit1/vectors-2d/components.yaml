- id: spec.vectors-2d.components.sum-and-difference
  skills: { primary: spec.vectors-2d.components }
  rating: 1410
  responseSkills: { calculation: 1390, reading: 1400 }
  stem: |
    $\mathbf{a} + \mathbf{b} = 5\mathbf{i} + \mathbf{j}$ and $\mathbf{a} - \mathbf{b} = \mathbf{i} + 7\mathbf{j}$. Find $\mathbf{a}$ and $\mathbf{b}$.
  parts:
    - id: a
      prompt: $\mathbf{a}$
      answer: { type: vector, key: ['3', '4'] }
    - id: b
      prompt: $\mathbf{b}$
      answer: { type: vector, key: ['2', '-3'] }
  solution: |
    Add the equations: $2\mathbf{a} = 6\mathbf{i} + 8\mathbf{j}$, so $\mathbf{a} = 3\mathbf{i} + 4\mathbf{j}$. Then $\mathbf{b} = (5\mathbf{i} + \mathbf{j}) - \mathbf{a} = 2\mathbf{i} - 3\mathbf{j}$.
  verify: |
    def answers():
        s, d = Matrix([5, 1]), Matrix([1, 7])
        a = (s + d) / 2
        return {"a": list(a), "b": list(s - a)}

- id: spec.vectors-2d.components.magnitude-unknown
  skills: { primary: spec.vectors-2d.components }
  rating: 1420
  responseSkills: { calculation: 1410 }
  stem: |
    Find all values of $k$ for which $|k\mathbf{i} + (k + 1)\mathbf{j}| = 5$.
  parts:
    - id: a
      answer: { type: set, key: ['3', '-4'] }
  solution: |
    $k^2 + (k + 1)^2 = 25$, so $2k^2 + 2k - 24 = 0$, i.e. $k^2 + k - 12 = (k + 4)(k - 3) = 0$. So $k = 3$ or $k = -4$.
  verify: |
    def answers():
        k = symbols("k")
        return {"a": solve(k**2 + (k + 1)**2 - 25, k)}

- id: spec.vectors-2d.components.collinear
  skills: { primary: spec.vectors-2d.components }
  rating: 1440
  responseSkills: { reading: 1430, calculation: 1400 }
  variants:
    - { cy: 11, k: 7 }
    - { cy: -4, k: -3 }
  stem: |
    The points $A(1, 2)$, $B(3, 5)$ and $C(k, {{cy}})$ lie on one straight line. Find $k$.
  parts:
    - id: a
      prompt: $k =$
      answer: { type: numeric, key: '{{k}}' }
  solution: |
    On one line means $\overrightarrow{AC} = t\,\overrightarrow{AB}$. $\overrightarrow{AB} = 2\mathbf{i} + 3\mathbf{j}$ and $\overrightarrow{AC} = (k - 1)\mathbf{i} + ({{cy}} - 2)\mathbf{j}$. The $\mathbf{j}$-components give $t = \tfrac{ {{cy}} - 2 }{3}$, so $k = 1 + 2t = {{k}}$.
  verify: |
    def answers(cy, k):
        t = Rational(cy - 2, 3)
        return {"a": 1 + 2*t}

- id: spec.vectors-2d.components.divide-segment
  skills: { primary: spec.vectors-2d.components }
  rating: 1450
  responseSkills: { calculation: 1430, reading: 1420 }
  variants:
