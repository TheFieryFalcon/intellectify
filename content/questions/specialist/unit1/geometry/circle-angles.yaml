# Angles in circles (1.1.6–1.1.9).

- id: spec.geometry.circle-angles.center-from-circumference
  skills: {primary: spec.geometry.circle-angles}
  rating: 1040
  responseSkills: {calculation: 1030, reading: 1040}
  variants:
  - {x: 35}
  - {x: 48}
  - {x: 62}
  stem: |
    $A$, $B$ and $C$ lie on a circle with center $O$, and $\angle ACB = {{x}}^\circ$. Find $\angle AOB$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.732, -1], B: [1.732, -1], C: [-0.174, 1.992], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: O, to: A, color: muted }
      - { type: segment, from: O, to: B, color: muted }
      - { type: segment, from: C, to: A }
      - { type: segment, from: C, to: B }
      - { type: angle, at: C, from: A, to: B, label: '{{x}}^\circ', radius: 22 }
      - { type: angle, at: O, from: A, to: B, radius: 14 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: O, label: 'O', pos: n }
    ```
  parts:
  - id: a
    prompt: $\angle AOB$ (°)
    answer: {type: numeric, key: '2\cdot{{x}}'}
  solution: |
    The angle at the center is twice the angle at the circumference on the same arc: $\angle AOB = 2 \times {{x}}^\circ$.
  verify: |
    def answers(x):
        A, B = on_circle(270 - x), on_circle(270 + x)
        C = on_circle(90)
        assert abs(angle_at(A, C, B) - x) < 1e-9
        return {"a": approx(angle_at(A, (0, 0), B))}
