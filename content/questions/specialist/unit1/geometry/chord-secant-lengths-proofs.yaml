# Intersecting chords, secants and tangents: written proofs (1.1.8).

- id: spec.geometry.chord-secant-lengths.equal-parts-equal-chords
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1330
  responseSkills: { reasoning: 1320, proof: 1320, clarity: 1280 }
  stem: |
    Chords $AB$ and $CD$ of a circle meet at $X$, with $AX = CX$. Prove that $XB = XD$, and hence that $AB = CD$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.323, -1.5], B: [1.881, 0.68], C: [1.323, -1.5], D: [-1.881, 0.68], X: [0, -0.6], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: X, ticks: 1 }
      - { type: segment, from: X, to: B }
      - { type: segment, from: C, to: X, ticks: 1 }
      - { type: segment, from: X, to: D }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
      - { type: point, at: X, label: 'X', pos: s }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'product', description: "Intersecting chords: AX × XB = CX × XD", points: 2, dimension: reasoning }
          - { id: 'cancel', description: "AX = CX ≠ 0, so XB = XD", points: 1, dimension: reasoning }
          - { id: 'add', description: "AB = AX + XB = CX + XD = CD", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    By the intersecting chords theorem, $AX \times XB = CX \times XD$. Since $AX = CX \ne 0$, dividing gives $XB = XD$. Then $AB = AX + XB = CX + XD = CD$.

- id: spec.geometry.chord-secant-lengths.tangents-equal-by-power
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1420
  responseSkills: { reasoning: 1410, proof: 1410, clarity: 1370 }
  stem: |
    From a point $M$ outside a circle, two tangents touch the circle at $S$ and $T$, and a secant cuts it at $A$ and $B$. Use the tangent–secant theorem to prove that $MS = MT$.

    ```diagram
    view: [-2.45, 4.05, -2.45, 2.45]
    width: 230
    points: { M: [3.6, 0], A: [1.965, 0.373], B: [-1.609, 1.187], S: [1.111, 1.663], T: [1.111, -1.663], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: S }
      - { type: segment, from: M, to: T }
      - { type: segment, from: M, to: B }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: S, label: 'S', pos: n }
      - { type: point, at: T, label: 'T', pos: s }
      - { type: point, at: A, label: 'A', pos: ne }
      - { type: point, at: B, label: 'B', pos: w }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'both', description: "MS² = MA × MB and MT² = MA × MB", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "So MS² = MT², and since lengths are positive, MS = MT", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    By the tangent–secant theorem, $MS^2 = MA \times MB$ and $MT^2 = MA \times MB$. So $MS^2 = MT^2$, and since lengths are positive, $MS = MT$.

- id: spec.geometry.chord-secant-lengths.two-secants-proof
  skills: { primary: spec.geometry.chord-secant-lengths }
  rating: 1500
  responseSkills: { reasoning: 1490, proof: 1490, clarity: 1450 }
  stem: |
    From a point $M$ outside a circle, one line cuts the circle at $A$ and $B$, and another at $C$ and $D$. Prove that $MA \times MB = MC \times MD$.

    ```diagram
    view: [-2.45, 4.25, -2.45, 2.45]
    width: 230
    points: { M: [3.8, 0], A: [1.735, -0.996], B: [-0.302, -1.977], C: [1.735, 0.996], D: [-0.302, 1.977], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: B }
      - { type: segment, from: M, to: D }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: A, label: 'A', pos: n }
      - { type: point, at: B, label: 'B', pos: nw }
      - { type: point, at: C, label: 'C', pos: s }
      - { type: point, at: D, label: 'D', pos: sw }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'route', description: "Uses a tangent MT: MT² = MA × MB and MT² = MC × MD; or similar triangles MAD and MCB", points: 2, dimension: reasoning }
          - { id: 'justify', description: "Justifies the step used (tangent–secant theorem, or equal angles: common angle at M and ∠MBC = ∠MDA on the same arc AC)", points: 1, dimension: reasoning }
          - { id: 'conclude', description: "MA × MB = MC × MD", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Draw a tangent from $M$, touching the circle at $T$. By the tangent–secant theorem, $MT^2 = MA \times MB$ and also $MT^2 = MC \times MD$. Hence $MA \times MB = MC \times MD$.

    (Alternatively, triangles $MAD$ and $MCB$ share the angle at $M$ and have $\angle MDA = \angle MBC$, angles on the same arc $AC$, so they are similar and $\tfrac{MA}{MC} = \tfrac{MD}{MB}$.)

