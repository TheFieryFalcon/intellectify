- id: spec.geometry.chords-tangents.equal-chords-equidistant
  title: "Equal Chords Are Equally Far from the Center"
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Chords and the center"
  rating: 1660
  bookwork: true
  responseSkills: { reasoning: 1550, proof: 1540, clarity: 1500 }
  stem: |
    $AB$ and $CD$ are chords of equal length in a circle with center $O$ and radius $r$. Prove that $AB$ and $CD$ are the same distance from $O$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-1.879, -0.684], B: [1, -1.732], C: [1.879, 0.684], D: [-1, 1.732], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B, ticks: 1 }
      - { type: segment, from: C, to: D, ticks: 1 }
      - { type: point, at: O, label: 'O', pos: e }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: feet, description: "Finds equal lengths from the equal chords (e.g. perpendiculars OM and ON bisect the chords, so AM = ½AB = ½CD = CN)", points: 2, dimension: reasoning }
          - { id: pythag, description: "Relates the distances to the radius (e.g. Pythagoras: OM² = r² − AM² and ON² = r² − CN²)", points: 1, dimension: reasoning }
          - { id: conclude, description: "Concludes OM = ON", points: 1, dimension: proof }
          - { id: clear, description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Let $M$ and $N$ be the feet of the perpendiculars from $O$ to $AB$ and $CD$. The perpendicular from the center bisects a chord, so $AM = \tfrac{1}{2}AB = \tfrac{1}{2}CD = CN$.

    In the right triangles $OMA$ and $ONC$, $OA = OC = r$, so $OM^2 = r^2 - AM^2 = r^2 - CN^2 = ON^2$. Hence $OM = ON$.
