- id: spec.geometry.circle-angles.diagonal-angles
  skills: {primary: spec.geometry.circle-angles}
  rating: 1450
  responseSkills: {reading: 1440, calculation: 1430, reasoning: 1440}
  stem: |
    $ABCD$ is a cyclic quadrilateral with diagonal $BD$. $\angle ABD = 30^\circ$ and $\angle DBC = 40^\circ$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-0.684, -1.879], B: [1.732, -1], C: [1, 1.732], D: [-1.732, 1], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: polygon, points: [A, B, C, D] }
      - { type: segment, from: B, to: D }
      - { type: segment, from: A, to: C, dashed: true, color: muted }
      - { type: angle, at: B, from: A, to: D, label: '30^\circ', radius: 26 }
      - { type: angle, at: B, from: D, to: C, label: '40^\circ', radius: 40 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: D, label: 'D' }
    ```
  parts:
  - id: a
    prompt: Find $\angle ACD$ (°).
    answer: {type: numeric, key: '30'}
  - id: b
    prompt: Find $\angle ADC$ (°).
    answer: {type: numeric, key: '110'}
  solution: |
    (a) $\angle ACD$ and $\angle ABD$ stand on the same arc $AD$: $\angle ACD = 30^\circ$.
    (b) $\angle ABC = 30^\circ + 40^\circ = 70^\circ$, and opposite angles add to $180^\circ$: $\angle ADC = 110^\circ$.
  verify: |
    def answers():
        # Arc AD (not containing B) = 60 at the center; arc DC (not containing B) = 80.
        B = on_circle(0)
        A = on_circle(150)
        D, C = on_circle(150 - 60), on_circle(150 - 60 - 80)
        assert abs(angle_at(A, B, D) - 30) < 1e-9 and abs(angle_at(D, B, C) - 40) < 1e-9
        return {"a": approx(angle_at(A, C, D)), "b": approx(angle_at(A, D, C))}
- id: spec.geometry.circle-angles.semicircle-proof
  skills: {primary: spec.geometry.circle-angles}
  rating: 1470
  responseSkills: {reasoning: 1460, proof: 1460, clarity: 1400}
  stem: |
    $AB$ is a diameter of a circle with center $O$, and $C$ is another point on the circle. Without using the angle-at-the-center theorem, prove that $\angle ACB = 90^\circ$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: radii, description: Draws OC and notes OA = OB = OC (radii), points: 1, dimension: reasoning}
      - {id: iso, description: 'Two isosceles triangles: ∠OAC = ∠OCA = a and ∠OBC = ∠OCB = b', points: 2, dimension: reasoning}
      - {id: sum, description: 'Angle sum of triangle ABC: 2a + 2b = 180°, so a + b = 90°', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Join $OC$. $OA = OB = OC$ (radii), so triangles $OAC$ and $OBC$ are isosceles: $\angle OAC = \angle OCA = a$ and $\angle OBC = \angle OCB = b$.
    The angles of triangle $ABC$ add to $180^\circ$: $a + (a + b) + b = 180^\circ$, so $a + b = 90^\circ$. That is, $\angle ACB = 90^\circ$.
