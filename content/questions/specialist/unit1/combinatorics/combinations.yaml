- id: spec.combinatorics.combinations.sum-divisible-by-3
  skills: { primary: spec.combinatorics.combinations }
  subsection: "Counting by a clever choice"
  rating: 1760
  responseSkills: {calculation: 1680, reasoning: 1740, synthesis: 1760}
  stem: |
    In how many ways can 3 different numbers be selected from $1, 2, \dots, 30$ so that their sum is divisible by 3?
  parts:
    - id: a
      answer: { type: numeric, key: 1360 }
  solution: |
    Sort the numbers by remainder on division by 3: remainder 0, 1 or 2, with 10 numbers in each group. The sum is divisible by 3 exactly when the three remainders are all equal, or are 0, 1 and 2.
    - All from one group: $3 \times \dbinom{10}{3} = 360$.
    - One from each group: $10^3 = 1000$.

    Total: $1360$.
  verify: |
    from itertools import combinations as combos
    def answers():
        return {"a": sum(1 for c in combos(range(1, 31), 3) if sum(c) % 3 == 0)}

- id: spec.combinatorics.combinations.paths-below-diagonal
  skills: { primary: spec.combinatorics.combinations }
  subsection: "Paths on a grid"
  rating: 1850
  responseSkills: {calculation: 1800, reasoning: 1830, proof: 1780, synthesis: 1850}
  stem: |
    A path on a grid goes from $(0, 0)$ to $(6, 6)$ using steps of one unit right or one unit up. How many such paths never go above the line $y = x$ (they may touch it)?
  parts:
    - id: a
      answer: { type: numeric, key: 132 }
  solution: |
    All paths: 12 steps, 6 of them up: $\binom{12}{6} = 924$.
    Count the bad paths, which touch the line $y = x + 1$. For a bad path, take the part after its first touch of $y = x + 1$ and swap rights and ups (reflect it in that line). This turns it into a path ending at $(5, 7)$, and every path to $(5, 7)$ comes from exactly one bad path this way (it must cross $y = x + 1$, and reflecting back undoes the swap).
    Paths to $(5, 7)$: $\binom{12}{5} = 792$. So the good paths number $924 - 792 = 132$.
  verify: |
    from functools import lru_cache
    def answers():
        @lru_cache(None)
        def f(x, y):
            if y > x: return 0
            if x == 0 and y == 0: return 1
            return (f(x - 1, y) if x > 0 else 0) + (f(x, y - 1) if y > 0 else 0)
        return {"a": f(6, 6)}

