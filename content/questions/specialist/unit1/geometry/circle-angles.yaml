- id: spec.geometry.circle-angles.semicircle
  skills: {primary: spec.geometry.circle-angles}
  rating: 1100
  responseSkills: {calculation: 1090, reading: 1090}
  variants:
  - {x: 32}
  - {x: 47}
  stem: |
    $AB$ is a diameter of a circle, $C$ is on the circle, and $\angle CAB = {{x}}^\circ$. Find $\angle ABC$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [-2, 0], B: [2, 0], C: [-1, 1.732], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: C, to: A }
      - { type: segment, from: C, to: B }
      - { type: angle, at: A, from: B, to: C, label: '{{x}}^\circ', radius: 24 }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: O, label: 'O', pos: s }
    ```
  parts:
  - id: a
    prompt: $\angle ABC$ (°)
    answer: {type: numeric, key: '90-{{x}}'}
  solution: |
    The angle in a semicircle is a right angle, so $\angle ACB = 90^\circ$. Then $\angle ABC = 180^\circ - 90^\circ - {{x}}^\circ$.
