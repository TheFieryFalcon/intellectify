- id: spec.combinatorics.permutations.no-two-adjacent
  skills: { primary: spec.combinatorics.permutations, secondary: [spec.combinatorics.combinations] }
  subsection: "Objects together or apart"
  rating: 1420
  responseSkills: {reading: 1420, calculation: 1400, reasoning: 1400, synthesis: 1400}
  variants:
    - { w: MISSISSIPPI, c: S, v: 7350 }
    - { w: GENERATED, c: E, v: 25200 }
    - { w: METASTASIS, c: S, v: 70560 }
  stem: |
    How many arrangements of the letters of the word **{{w}}** have no two {{c}}'s next to each other?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    First arrange the letters that aren't {{c}}, dividing by repeats. That leaves one more gap than there are such letters (between letters and at both ends). Then choose which gaps hold the {{c}}'s, at most one {{c}} per gap. Multiply the two counts to get {{v}}.
  verify: |
    from sympy.utilities.iterables import multiset_permutations
    def answers(w, c, v):
        ok = lambda p: all(not (p[i] == c and p[i + 1] == c) for i in range(len(p) - 1))
        return {"a": sum(1 for p in multiset_permutations(list(w)) if ok(p))}

- id: spec.combinatorics.permutations.parallel
  skills: { primary: spec.combinatorics.permutations }
  subsection: "Repeated objects"
  rating: 1460
  responseSkills: {reading: 1450, calculation: 1450, reasoning: 1440}
  stem: |
    Consider arrangements of all the letters of the word **PARALLEL**.
  parts:
    - id: a
      prompt: How many different arrangements are there?
      marks: 2
      answer: { type: numeric, key: 3360 }
    - id: b
      prompt: In how many of these arrangements are the three L's together?
      marks: 2
      answer: { type: numeric, key: 360 }
  solution: |
    **(a)** There are 8 letters, with A twice and L three times: $\dfrac{8!}{2!\,3!} = 3360$.

    **(b)** Treat LLL as one block. That gives 6 objects (LLL, P, A, A, R, E) with A repeated: $\dfrac{6!}{2!} = 360$.
  verify: |
    from sympy.utilities.iterables import multiset_permutations
    def answers():
        perms = list(multiset_permutations(list("PARALLEL")))
        return {"a": len(perms), "b": sum(1 for p in perms if "LLL" in "".join(p))}

