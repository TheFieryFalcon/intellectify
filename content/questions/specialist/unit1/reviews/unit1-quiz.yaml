    $|A| = 12$, $|B| = 10$, $|C| = 8$, $|A \cap B| = 4$, $|A \cap C| = 3$, $|B \cap C| = 2$ and $|A \cap B \cap C| = 1$. Find $|A \cup B \cup C|$.
  parts:
