  stem: |
    $A$ is $({{ax}}, {{ay}})$ and $B$ is $({{bx}}, {{by}})$. $P$ lies on $AB$ with $AP : PB = {{p}} : {{q}}$. Find the position vector of $P$.
  parts:
    - id: a
      answer: { type: vector, key: ['{{ax}}+\frac{ {{p}} }{ {{p}}+{{q}} }({{bx}}-({{ax}}))', '{{ay}}+\frac{ {{p}} }{ {{p}}+{{q}} }({{by}}-({{ay}}))'] }
  solution: |
    $P$ is $\tfrac{ {{p}} }{ {{p}} + {{q}} }$ of the way from $A$ to $B$: $\overrightarrow{OP} = \overrightarrow{OA} + \tfrac{ {{p}} }{ {{p}} + {{q}} }\overrightarrow{AB}$.
  verify: |
    def answers(ax, ay, bx, by, p, q):
        f = Rational(p, p + q)
        return {"a": [ax + f*(bx - ax), ay + f*(by - ay)]}

- id: spec.vectors-2d.components.distance-along
  skills: { primary: spec.vectors-2d.components }
  rating: 1470
  responseSkills: { calculation: 1450, synthesis: 1430 }
  stem: |
    $A$ is $(-2, 1)$ and $B$ is $(4, 9)$. Find the position vectors of:
  parts:
    - id: a
      prompt: the point $P$ on segment $AB$ that is 4 units from $A$
      answer: { type: vector, key: ['0.4', '4.2'] }
    - id: b
      prompt: the point $Q$ on line $AB$, beyond $B$, that is 15 units from $A$
      answer: { type: vector, key: ['7', '13'] }
  solution: |
    $\overrightarrow{AB} = 6\mathbf{i} + 8\mathbf{j}$, with magnitude 10, so the unit vector from $A$ towards $B$ is $0.6\mathbf{i} + 0.8\mathbf{j}$.
    $\overrightarrow{OP} = (-2\mathbf{i} + \mathbf{j}) + 4(0.6\mathbf{i} + 0.8\mathbf{j}) = 0.4\mathbf{i} + 4.2\mathbf{j}$, and $\overrightarrow{OQ} = (-2\mathbf{i} + \mathbf{j}) + 15(0.6\mathbf{i} + 0.8\mathbf{j}) = 7\mathbf{i} + 13\mathbf{j}$.
  verify: |
    def answers():
        A, B = Matrix([-2, 1]), Matrix([4, 9])
        u = (B - A) / (B - A).norm()
        return {"a": list(A + 4*u), "b": list(A + 15*u)}

- id: spec.vectors-2d.components.parallelogram-midpoint
  skills: { primary: spec.vectors-2d.components }
  rating: 1510
  responseSkills: { calculation: 1480, reading: 1480 }
  stem: |
    $OABC$ is a parallelogram, where $O$ is the origin, $A$ is $(4, 1)$ and $C$ is $(1, 3)$. $M$ is the midpoint of $AB$. Find the exact value of $|\overrightarrow{CM}|$.
  parts:
    - id: a
      answer: { type: numeric, key: '\frac{5\sqrt{2}}{2}', form: [exact] }
  solution: |
    $\overrightarrow{OB} = \overrightarrow{OA} + \overrightarrow{OC} = 5\mathbf{i} + 4\mathbf{j}$, so $\overrightarrow{OM} = \tfrac{1}{2}(9\mathbf{i} + 5\mathbf{j})$.
    $\overrightarrow{CM} = \tfrac{9}{2}\mathbf{i} + \tfrac{5}{2}\mathbf{j} - (\mathbf{i} + 3\mathbf{j}) = \tfrac{7}{2}\mathbf{i} - \tfrac{1}{2}\mathbf{j}$, so $|\overrightarrow{CM}| = \sqrt{\tfrac{49 + 1}{4}} = \tfrac{5\sqrt{2}}{2}$.
  verify: |
    def answers():
        A, C = Matrix([4, 1]), Matrix([1, 3])
        M = (A + (A + C)) / 2
        return {"a": (M - C).norm()}

