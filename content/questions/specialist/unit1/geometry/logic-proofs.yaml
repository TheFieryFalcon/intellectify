# Logic: written explanations and proofs (1.1.1–1.1.4).

- id: spec.geometry.logic.square-converse-rhombus
  skills: { primary: spec.geometry.logic }
  subsection: "Implication, converse and contrapositive"
  rating: 1260
  responseSkills: { reasoning: 1250, clarity: 1210, precision: 1210 }
  stem: |
    Write the converse of "If a quadrilateral is a square, then its four sides are equal", and decide whether the converse is true. Justify your answer.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'converse', description: "States the converse: if a quadrilateral's four sides are equal, then it is a square", points: 1, dimension: precision }
          - { id: 'false', description: "Says the converse is false", points: 1, dimension: reasoning }
          - { id: 'example', description: "Gives a counterexample: a rhombus that isn't a square (e.g. with angles 60° and 120°)", points: 2, dimension: reasoning }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Converse: "If a quadrilateral has four equal sides, then it is a square." It is false: a rhombus with angles $60^\circ$ and $120^\circ$ has four equal sides but is not a square.

- id: spec.geometry.logic.contrapositive-x-squared
  skills: { primary: spec.geometry.logic }
  subsection: "Implication, converse and contrapositive"
  rating: 1280
  responseSkills: { reasoning: 1270, clarity: 1230, precision: 1230 }
  stem: |
    Write the contrapositive of "If $x > 3$, then $x^2 > 9$" (for real $x$). Explain why it is true.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'form', description: "States: if x² ≤ 9, then x ≤ 3", points: 2, dimension: precision }
          - { id: 'true', description: "Explains why: the original is true (x > 3 > 0 gives x² > 9), and a contrapositive always has the same truth value; or argues directly that x² ≤ 9 gives −3 ≤ x ≤ 3", points: 2, dimension: reasoning }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Contrapositive: "If $x^2 \le 9$, then $x \le 3$."

    It is true. Directly: $x^2 \le 9$ means $-3 \le x \le 3$, so $x \le 3$. (Equally, the original is true, since $x > 3$ gives $x^2 > 3x > 9$, and a statement and its contrapositive are always both true or both false.)

- id: spec.geometry.logic.square-at-least-x
  skills: { primary: spec.geometry.logic }
  subsection: "For all and there exists"
  rating: 1300
  responseSkills: { reasoning: 1290, proof: 1290, clarity: 1250 }
  stem: |
    Is the statement "For all real numbers $x$, $x^2 \ge x$" true? Justify your answer.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'false', description: "Says it is false", points: 1, dimension: reasoning }
          - { id: 'example', description: "Gives a counterexample with 0 < x < 1, e.g. x = ½: x² = ¼ < ½", points: 2, dimension: reasoning }
          - { id: 'why', description: "Explains that one counterexample disproves a 'for all' statement", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    False. Take $x = \tfrac{1}{2}$: $x^2 = \tfrac{1}{4} < \tfrac{1}{2} = x$. One counterexample is enough to disprove a "for all" statement.

- id: spec.geometry.logic.no-square-negative
  skills: { primary: spec.geometry.logic }
  subsection: "For all and there exists"
  rating: 1320
  responseSkills: { reasoning: 1310, proof: 1310, clarity: 1270, precision: 1270 }
  stem: |
    Explain why the statement "There is a real number $x$ with $x^2 = -1$" is false.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'negation', description: "Shows the negation holds for every x: for all real x, x² ≠ −1", points: 1, dimension: precision }
          - { id: 'square', description: "Every real square is at least 0 (a product of two numbers with the same sign, or 0)", points: 2, dimension: reasoning }
          - { id: 'conclude', description: "So no real x has x² = −1: the 'there exists' statement is false", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    To show "there is an $x$ with $x^2 = -1$" is false, we show its negation, "for every real $x$, $x^2 \ne -1$". If $x \ge 0$ then $x^2 = x \cdot x \ge 0$; if $x < 0$ then $x^2$ is a product of two negatives, so $x^2 > 0$. Either way $x^2 \ge 0 > -1$. So no real number squares to $-1$.

- id: spec.geometry.logic.prime-odd-fix
  skills: { primary: spec.geometry.logic }
  subsection: "For all and there exists"
  rating: 1350
  responseSkills: { reasoning: 1340, clarity: 1300, precision: 1300 }
  stem: |
    Show that "If $n$ is prime, then $n$ is odd" is false. Then change only its hypothesis to make a true statement.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'example', description: "Counterexample: 2 is prime and even", points: 2, dimension: reasoning }
          - { id: 'fix', description: "A true version, e.g. 'If n is a prime greater than 2, then n is odd'", points: 1, dimension: precision }
          - { id: 'why', description: "Justifies the new statement: an even number greater than 2 has the factor 2, so isn't prime", points: 1, dimension: reasoning }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    False: 2 is prime but not odd.

    True version: "If $n$ is a prime greater than 2, then $n$ is odd." An even number greater than 2 is divisible by 2 and by itself, so it is not prime; hence a prime greater than 2 must be odd.

- id: spec.geometry.logic.abs-less-3-iff
  skills: { primary: spec.geometry.logic }
  subsection: "If and only if"
  rating: 1380
  responseSkills: { reasoning: 1370, proof: 1370, clarity: 1330 }
  stem: |
    Prove that for real numbers $x$, $|x| < 3 \Leftrightarrow x^2 < 9$.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'forward', description: "⇒: |x| < 3 gives x² = |x|² < 9 (squaring non-negative numbers keeps the order)", points: 2, dimension: reasoning }
          - { id: 'back', description: "⇐: if |x| ≥ 3 then x² = |x|² ≥ 9, so x² < 9 forces |x| < 3 (contrapositive)", points: 2, dimension: reasoning }
          - { id: 'both', description: "States that both directions are needed for ⇔", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    An equivalence needs both directions.

    ($\Rightarrow$) If $|x| < 3$, then since $0 \le |x| < 3$, squaring gives $x^2 = |x|^2 < 9$.

    ($\Leftarrow$) By the contrapositive: if $|x| \ge 3$, then $x^2 = |x|^2 \ge 9$. So $x^2 < 9$ forces $|x| < 3$.

    Hence $|x| < 3 \Leftrightarrow x^2 < 9$.

- id: spec.geometry.logic.negate-every-student
  skills: { primary: spec.geometry.logic }
  subsection: "Negation"
  rating: 1400
  responseSkills: { reasoning: 1390, clarity: 1350, precision: 1350 }
  stem: |
    Write the negation of "Every student in the class passed at least one test." Then explain what you would need to find to show that the original statement is false.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'negation', description: "There is a student in the class who passed no tests", points: 2, dimension: precision }
          - { id: 'quantifiers', description: "Shows both quantifiers swapped: 'every' became 'there is', and 'at least one' became 'none'", points: 1, dimension: reasoning }
          - { id: 'show', description: "To disprove the original: find one student who passed no test", points: 1, dimension: reasoning }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Negation: "There is a student in the class who passed no tests." "Every" becomes "there is", and "passed at least one test" becomes its negation, "passed no tests".

    To show the original statement is false, it is enough to find one student who failed every test.

- id: spec.geometry.logic.de-morgan-cases
  skills: { primary: spec.geometry.logic }
  subsection: "Negation"
  rating: 1420
  responseSkills: { reasoning: 1410, proof: 1410, clarity: 1370 }
  stem: |
    $P$ and $Q$ are statements. By considering the four cases for $P$ and $Q$ (each true or false), show that "not ($P$ and $Q$)" and "(not $P$) or (not $Q$)" are always both true or both false.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'cases', description: "Lists all four cases: TT, TF, FT, FF", points: 1, dimension: proof }
          - { id: 'first', description: "Finds 'not (P and Q)': false only in the TT case", points: 1, dimension: reasoning }
          - { id: 'second', description: "Finds '(not P) or (not Q)': false only in the TT case", points: 1, dimension: reasoning }
          - { id: 'match', description: "Concludes they agree in every case", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    | $P$ | $Q$ | $P$ and $Q$ | not ($P$ and $Q$) | (not $P$) or (not $Q$) |
    |---|---|---|---|---|
    | T | T | T | F | F |
    | T | F | F | T | T |
    | F | T | F | T | T |
    | F | F | F | T | T |

    The last two columns agree in every case, so the two statements are always both true or both false.

- id: spec.geometry.logic.contrapositive-same-truth
  skills: { primary: spec.geometry.logic }
  subsection: "Implication, converse and contrapositive"
  rating: 1440
  responseSkills: { reasoning: 1430, proof: 1430, clarity: 1390 }
  stem: |
    Explain why "if $P$, then $Q$" and its contrapositive "if not $Q$, then not $P$" are always both true or both false.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'false-when', description: "'If P then Q' is false exactly when P is true and Q is false", points: 1, dimension: reasoning }
          - { id: 'contra-false', description: "'If not Q then not P' is false exactly when not Q is true and not P is false, i.e. Q false and P true", points: 2, dimension: reasoning }
          - { id: 'same', description: "Both fail in exactly the same case, so they are always both true or both false", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    An implication is false in exactly one situation: its hypothesis is true and its conclusion is false.

    - "If $P$, then $Q$" is false exactly when $P$ is true and $Q$ is false.
    - "If not $Q$, then not $P$" is false exactly when "not $Q$" is true and "not $P$" is false, i.e. when $Q$ is false and $P$ is true.

    That is the same situation, so the two statements are false together and true together.

- id: spec.geometry.logic.n-squared-n-1-claim
  skills: { primary: spec.geometry.logic }
  subsection: "For all and there exists"
  rating: 1460
  responseSkills: { reasoning: 1450, proof: 1450, clarity: 1410 }
  stem: |
    A student claims: "$n^2 + n + 1$ is prime for every whole number $n \ge 1$, because it works for $n = 1$, $2$ and $3$." Explain what is wrong with the reasoning, and settle the claim.
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'error', description: "Examples can't prove a 'for every' claim: the claim covers infinitely many n", points: 1, dimension: reasoning }
          - { id: 'example', description: "Finds a counterexample, e.g. n = 4: 21 = 3 × 7", points: 2, dimension: reasoning }
          - { id: 'settle', description: "Concludes the claim is false", points: 1, dimension: proof }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    Checking a few cases can't prove a statement about every whole number. In fact the claim is false: $n = 1, 2, 3$ give $3, 7, 13$, but $n = 4$ gives $21 = 3 \times 7$, which is not prime.

- id: spec.geometry.logic.quantifier-order
  skills: { primary: spec.geometry.logic }
  subsection: "For all and there exists"
  rating: 1480
  responseSkills: { reasoning: 1470, clarity: 1430, precision: 1430 }
  stem: |
    Decide whether each statement is true, and explain.

    (i) $\forall x \in \mathbb{R}\ \exists y \in \mathbb{R},\ x + y = 0$

    (ii) $\exists y \in \mathbb{R}\ \forall x \in \mathbb{R},\ x + y = 0$
  parts:
    - id: a
      rubric:
        criteria:
          - { id: 'first', description: "(i) is true: for each x choose y = −x", points: 2, dimension: reasoning }
          - { id: 'second', description: "(ii) is false: one y would need x + y = 0 for every x, but x = −y and x = 1 − y can't both work", points: 2, dimension: reasoning }
          - { id: 'order', description: "Notes that the order of the quantifiers changes the meaning", points: 1, dimension: precision }
          - { id: 'clear', description: "Clearly set out, with a reason for each step and a concluding sentence", points: 1, dimension: clarity }
  solution: |
    (i) True. Whatever $x$ is, $y = -x$ works, since $x + (-x) = 0$. Here $y$ may depend on $x$.

    (ii) False. It claims one single $y$ works for every $x$. But if $x + y = 0$, then $(x + 1) + y = 1 \ne 0$, so that $y$ fails for $x + 1$.

    The order of the quantifiers changes the meaning.

- id: spec.geometry.logic.not-every-rectangle
  skills: { primary: spec.geometry.logic }
  subsection: "For all and there exists"
  rating: 1500
