    ```
  parts:
    - id: a
      rubric:
        criteria:
          - { id: meet, description: "Lets line PQ meet AB at M (M is outside both circles)", points: 1, dimension: proof }
          - { id: first, description: "Tangent–secant from M to the first circle: MA² = MP × MQ", points: 1, dimension: reasoning }
          - { id: second, description: "Tangent–secant from M to the second circle: MB² = MP × MQ", points: 1, dimension: reasoning }
          - { id: conclude, description: "So MA² = MB², MA = MB: M is the midpoint of AB", points: 1, dimension: proof }
