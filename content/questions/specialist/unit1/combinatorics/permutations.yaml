- id: spec.combinatorics.permutations.couples-in-a-row
  skills: { primary: spec.combinatorics.permutations }
  subsection: "Objects together or apart"
  rating: 1450
  responseSkills: {reading: 1440, calculation: 1430, reasoning: 1430}
  variants:
    - { c: 3, v: 48 }
    - { c: 4, v: 384 }
  stem: |
    {{c}} couples sit in a row of $2 \times {{c}}$ seats. In how many ways can they sit if each couple sits together?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Tape each couple into a block: {{c}} blocks can be arranged in ${{c}}!$ ways. Each couple can sit in 2 orders, giving $2^{ {{c}} }$. Total ${{c}}! \times 2^{ {{c}} } = {{v}}$.
  verify: |
    from itertools import permutations
    def answers(c, v):
        people = list(range(2 * c))  # couple k is people 2k and 2k + 1
        return {"a": sum(1 for p in permutations(people) if all(p[i] // 2 == p[i + 1] // 2 for i in range(0, 2 * c, 2)))}

- id: spec.combinatorics.permutations.vowels-together
  skills: { primary: spec.combinatorics.permutations }
  subsection: "Objects together or apart"
  rating: 1480
  responseSkills: {reading: 1460, calculation: 1460, reasoning: 1460}
  stem: |
    How many arrangements of the letters of **TRIANGLE** have the three vowels (I, A and E) all together?
  parts:
    - id: a
      answer: { type: numeric, key: 4320 }
  solution: |
    Tape the vowels into one block. There are now 6 items (the block and 5 consonants), arranged in $6! = 720$ ways. The vowels inside the block can be in $3! = 6$ orders. Total: $720 \times 6 = 4320$.
  verify: |
    from itertools import permutations
    def answers():
        def together(p):
            idx = sorted(i for i, ch in enumerate(p) if ch in "IAE")
            return idx[2] - idx[0] == 2
        return {"a": sum(1 for p in permutations("TRIANGLE") if together(p))}

- id: spec.combinatorics.permutations.alternate-round-couple
  skills: { primary: spec.combinatorics.permutations }
  subsection: "Arrangements in a circle"
  rating: 1720
  responseSkills: {calculation: 1660, reasoning: 1700, synthesis: 1710}
  stem: |
    5 men and 5 women, all different, sit around a round table so that men and women alternate. One particular man and woman are a couple and must sit next to each other. Rotations of the whole table count as the same seating. How many seatings are possible?
  parts:
    - id: a
      answer: { type: numeric, key: 1152 }
  solution: |
    Seat the man from the couple first; since rotations count as the same, his seat can be taken as fixed. Seats alternate man–woman, so his partner must take one of the 2 women's seats beside him: 2 ways.
    The other 4 men fill the remaining men's seats in $4! = 24$ ways, and the other 4 women fill the remaining women's seats in $4! = 24$ ways. Total: $2 \times 24 \times 24 = 1152$.
  verify: |
    from itertools import permutations
    def answers():
        # Fix man 0 in seat 0 (removes rotations). Seats 0..9 around the table; even seats men, odd seats women.
        count = 0
        for men in permutations(range(1, 5)):
            for women in permutations(range(5)):
                seat = [None] * 10
                seat[0] = ("m", 0)
                for i, m in enumerate(men): seat[2 * (i + 1)] = ("m", m)
                for i, w in enumerate(women): seat[2 * i + 1] = ("w", w)
