- id: spec.vectors-2d.scalar-product.parallel-or-perpendicular
  skills: { primary: spec.vectors-2d.scalar-product }
  rating: 1260
  responseSkills: { reading: 1250, calculation: 1220 }
  variants:
    - { a1: 6, a2: -4, b1: -9, b2: 6, key: a }
    - { a1: 6, a2: -4, b1: 2, b2: 3, key: b }
    - { a1: 6, a2: -4, b1: 3, b2: 4, key: c }
  stem: |
    Are ${{a1}}\mathbf{i} + ({{a2}})\mathbf{j}$ and ${{b1}}\mathbf{i} + {{b2}}\mathbf{j}$ parallel, perpendicular or neither?
  parts:
    - id: a
      options:
        - { id: a, text: 'Parallel' }
        - { id: b, text: 'Perpendicular' }
        - { id: c, text: 'Neither' }
      answer: { type: mcq, key: '{{key}}' }
  solution: |
    Parallel if one is a multiple of the other; perpendicular if the dot product, $({{a1}})({{b1}}) + ({{a2}})({{b2}})$, is 0.
  verify: |
    def answers(a1, a2, b1, b2, key):
        a, b = Matrix([a1, a2]), Matrix([b1, b2])
        if a1*b2 - a2*b1 == 0: k = "a"
        elif a.dot(b) == 0: k = "b"
        else: k = "c"
        return {"a": k}

