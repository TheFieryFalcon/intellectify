- id: spec.combinatorics.permutations.before
  skills: { primary: spec.combinatorics.permutations }
  rating: 1570
  responseSkills: { synthesis: 1560, reading: 1550 }
  stem: |
    The six letters A, B, C, D, E, F are arranged in a row.
  parts:
    - id: a
      prompt: In how many arrangements does A come somewhere before B?
      marks: 1
      answer: { type: numeric, key: 360 }
    - id: b
      prompt: In how many arrangements do A, B and C appear in that order (not necessarily together)?
      marks: 2
      answer: { type: numeric, key: 120 }
  solution: |
    **(a)** Swapping A and B pairs every arrangement with A first with one where B is first, so exactly half have A first: $6!/2 = 360$.

    **(b)** The 3 letters A, B, C can appear in $3! = 6$ orders, each equally often, so $6!/6 = 120$.
  verify: |
    from itertools import permutations
    def answers():
        perms = list(permutations("ABCDEF"))
        return {"a": sum(1 for p in perms if p.index("A") < p.index("B")),
                "b": sum(1 for p in perms if p.index("A") < p.index("B") < p.index("C"))}

- id: spec.combinatorics.permutations.bookkeeper
  skills: { primary: spec.combinatorics.permutations }
  rating: 1600
  responseSkills: { calculation: 1550, synthesis: 1580 }
  stem: |
    How many arrangements of the letters of **BOOKKEEPER** have the two O's **not** next to each other?
  parts:
    - id: a
      answer: { type: numeric, key: 120960 }
  solution: |
    BOOKKEEPER has 10 letters: B, O×2, K×2, E×3, P and R.

    - All arrangements: $\dfrac{10!}{2!\,2!\,3!} = 151\,200$.
    - With the O's together: treat OO as one object, giving 9 objects with K×2 and E×3: $\dfrac{9!}{2!\,3!} = 30\,240$.

    The answer is $151\,200 - 30\,240 = 120\,960$.
  verify: |
    from sympy.utilities.iterables import multiset_permutations
    def answers():
        return {"a": sum(1 for p in multiset_permutations(list("BOOKKEEPER")) if "OO" not in "".join(p))}

- id: spec.combinatorics.permutations.subject-blocks
  skills: { primary: spec.combinatorics.permutations }
  rating: 1580
  responseSkills: { calculation: 1550, reading: 1560 }
  stem: |
    4 different Maths books, 3 different Physics books and 2 different Chemistry books are placed on a shelf so that books of the same subject are together. In how many ways can this be done?
  parts:
    - id: a
      answer: { type: numeric, key: 1728 }
  solution: |
    Arrange the 3 subject blocks: $3! = 6$. Then arrange inside each block: $4! \times 3! \times 2! = 24 \times 6 \times 2 = 288$. Total $6 \times 288 = 1728$.
  verify: |
    from itertools import permutations
    def answers():
        books = ["M1", "M2", "M3", "M4", "P1", "P2", "P3", "C1", "C2"]
        def grouped(p):
            subjects = [b[0] for b in p]
            changes = sum(1 for i in range(8) if subjects[i] != subjects[i + 1])
            return changes == 2
        return {"a": sum(1 for p in permutations(books) if grouped(p))}

- id: spec.combinatorics.permutations.dictionary-rank
  skills: { primary: spec.combinatorics.permutations }
  rating: 1640
  responseSkills: { synthesis: 1620, reading: 1600 }
  variants:
    - { w: LEMON, v: 26 }
    - { w: MATHS, v: 53 }
    - { w: SPACE, v: 115 }
  stem: |
    All arrangements of the letters of **{{w}}** are listed in alphabetical order (like a dictionary). In what position is **{{w}}**?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Work left to right. For each position, count the arrangements that start the same way but have an earlier letter there: each earlier unused letter accounts for (number of remaining letters)! words. Add these counts, then add 1 for the word itself. This gives position {{v}}.
  verify: |
    from itertools import permutations
    def answers(w, v):
        words = sorted(set("".join(p) for p in permutations(w)))
        return {"a": words.index(w) + 1}

# ─────────────── Tier 5 ───────────────
- id: spec.combinatorics.permutations.record-arrangements
  skills: { primary: spec.combinatorics.permutations }
  rating: 1780
  responseSkills: { synthesis: 1780, proof: 1720 }
  stem: |
    The numbers $1, 2, \dots, n$ are arranged in a row so that every number after the first is either **larger than all** the numbers before it or **smaller than all** the numbers before it. For example, $3, 4, 2, 5, 1$ works for $n = 5$.
  parts:
    - id: a
      prompt: How many such arrangements are there when $n = 6$?
      marks: 1
      answer: { type: numeric, key: 32 }
    - id: b
      prompt: Find a formula in terms of $n$.
      marks: 2
      answer: { type: expression, key: '2^{n-1}', vars: { n: { domain: [1, 8] } } }
  solution: |
    Look at the row from the **end**. The last number must be larger or smaller than everything before it, so it is either $n$ or $1$: 2 options. Remove it; the remaining numbers must satisfy the same rule, so the second-last number is the largest or smallest of what's left, again 2 options. This continues until one number is left. So there are $2^{n-1}$ arrangements, which is 32 for $n = 6$.
  verify: |
    from itertools import permutations
    def ok(p):
        return all(p[i] > max(p[:i]) or p[i] < min(p[:i]) for i in range(1, len(p)))
    def answers():
        n = symbols("n")
        return {"a": sum(1 for p in permutations(range(1, 7)) if ok(p)), "b": 2**(n - 1)}

- id: spec.combinatorics.permutations.no-consecutive-neighbors
  skills: { primary: spec.combinatorics.permutations }
  rating: 1760
  responseSkills: { synthesis: 1760, calculation: 1650 }
  stem: |
    In how many ways can the numbers 1, 2, 3, 4, 5 be arranged in a row so that no two numbers that differ by 1 are next to each other?
  parts:
    - id: a
      answer: { type: numeric, key: 14 }
  solution: |
    Split by where 3 goes. Its neighbors can't be 2 or 4, so each neighbor of 3 is 1 or 5.

    - **3 at an end:** its one neighbor is 1 or 5. Checking each way to finish (e.g. 3 1 4 2 5, 3 5 2 4 1, 3 1 5 2 4, 3 5 1 4 2) gives 4 arrangements starting with 3, and by reversal 4 ending with 3.
    - **3 in the middle:** its neighbors must be exactly 1 and 5 (…1 3 5… or …5 3 1…). Then 2 and 4 go at the two ends, but 2 can't touch 1 and 4 can't touch 5. That leaves 2 1 3 5 4 at position 3, plus the arrangements with 3 in position 2 or 4. Counting these carefully gives 6.

    Total: $4 + 4 + 6 = 14$.
  verify: |
    from itertools import permutations
    def answers():
        return {"a": sum(1 for p in permutations(range(1, 6)) if all(abs(p[i] - p[i + 1]) != 1 for i in range(4)))}
