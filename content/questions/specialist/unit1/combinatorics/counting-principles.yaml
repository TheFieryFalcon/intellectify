  solution: |
    Going: ${{a}} \times {{b}}$. Coming back, the path just used is ruled out on each stretch: $({{b}} - 1) \times ({{a}} - 1)$. Total ${{a}} \times {{b}} \times ({{b}} - 1) \times ({{a}} - 1) = {{v}}$.
