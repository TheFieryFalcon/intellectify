- id: spec.u1.quiz.vector-ab
  title: "Vector Between Two Points"
  pool: unit-quiz
  skills: { primary: spec.vectors-2d.components }
  subsection: "Notation and arithmetic"
  rating: 1290
  responseSkills: { calculation: 1270 }
  stem: |
    $A$ is $(3, -1)$ and $B$ is $(-2, 4)$. Find $\overrightarrow{AB}$.
  parts:
    - id: a
      answer: { type: vector, key: ['-5', '5'] }
  solution: |
