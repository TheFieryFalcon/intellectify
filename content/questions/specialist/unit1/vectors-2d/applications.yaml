  requiresCalculator: true
  stem: |
    A cyclist rides due north at 20 km/h. The wind blows from the east at 15 km/h. Find the speed of the wind as the cyclist feels it (the wind's velocity relative to the cyclist), and the true bearing it seems to come *from*, correct to one decimal place.
