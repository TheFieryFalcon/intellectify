  stem: |
    Chords $AB$ and $CD$ meet at $X$, with $AX = x$, $XB = x + {{k}}$, $CX = {{c}}$ and $XD = {{d}}$. Find $x$.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [{{_A}}], B: [{{_B}}], C: [{{_C}}], D: [{{_D}}], X: [{{_X}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: X, label: 'x' }
