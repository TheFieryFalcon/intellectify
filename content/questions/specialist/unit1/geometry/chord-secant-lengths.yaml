- id: spec.geometry.chord-secant-lengths.chords-algebra
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1300
  responseSkills: {calculation: 1290, reading: 1270}
  stem: |
    Chords $AB$ and $CD$ meet at $X$, with $AX = x$, $XB = x + 5$, $CX = 6$ and $XD = 4$. Find $x$.
  parts:
  - id: a
    prompt: $x =$
    answer: {type: numeric, key: '3'}
  solution: |
    $x(x + 5) = 6 \times 4 = 24$, so $x^2 + 5x - 24 = 0$, i.e. $(x + 8)(x - 3) = 0$. Lengths are positive, so $x = 3$.
  verify: |
    def answers():
        x = symbols("x")
        return {"a": [s for s in solve(x*(x + 5) - 24, x) if s > 0][0]}
- id: spec.geometry.chord-secant-lengths.perpendicular-to-diameter
