- id: spec.geometry.circle-problems.isosceles-circumradius
  skills: {primary: spec.geometry.circle-problems}
  rating: 1650
  responseSkills: {calculation: 1600, reasoning: 1640, synthesis: 1640}
  stem: |
    A triangle has sides 10, 10 and 12. Find the radius of the circle through its three corners.
  parts:
  - id: a
    prompt: Radius
    answer: {type: numeric, key: '6.25'}
  solution: |
    The height to the side of length 12 is $\sqrt{10^2 - 6^2} = 8$, and by symmetry the center lies on this height. If the radius is $R$, the center is $8 - R$ above the base, and its distance to a base corner is $R$: $(8 - R)^2 + 6^2 = R^2$. So $100 - 16R = 0$ and $R = 6.25$.
  verify: |
    def answers():
        A, B, C = (-6.0, 0.0), (6.0, 0.0), (0.0, 8.0)
        k = symbols("k", real=True)
        kv = solve((6**2 + k**2) - (8 - k)**2, k)[0]
        return {"a": nsimplify(sqrt(36 + kv**2))}
- id: spec.geometry.circle-problems.parallel-chords
  skills: {primary: spec.geometry.circle-problems}
  rating: 1620
  responseSkills: {reasoning: 1610, proof: 1610, clarity: 1520}
  stem: |
    Chords $AB$ and $CD$ of a circle are parallel, with $A$ and $C$ on the same side. Prove that $AC = BD$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: join, description: Joins BC (or AD), points: 1, dimension: reasoning}
      - {id: alt, description: '∠ABC = ∠BCD (alternate angles, AB ∥ CD)', points: 1, dimension: reasoning}
      - {id: arcs, description: 'Equal angles at the circumference stand on equal chords: AC = BD', points: 2, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Join $BC$. $\angle ABC = \angle BCD$ (alternate angles, $AB \parallel CD$). $\angle ABC$ stands on chord $AC$ and $\angle BCD$ on chord $BD$. Equal angles at the circumference stand on equal arcs, so they subtend equal angles at the center, and equal angles at the center mean equal chords: $AC = BD$.
