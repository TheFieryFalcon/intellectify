    width: 300
    points: { P1: [-1, 0], P2: [1.8, 0], A: [-0.279, 1.2], B: [-0.279, -1.2], P: [-2.4, 0], C: [1.842, 2.4], D: [1.842, -2.4], U: [-2.4, -1], V: [-2.4, 1] }
