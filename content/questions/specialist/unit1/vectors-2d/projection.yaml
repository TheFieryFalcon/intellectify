- id: spec.vectors-2d.projection.which-formula
  skills: { primary: spec.vectors-2d.projection }
  rating: 1120
  responseSkills: { reading: 1120 }
  stem: |
    Which expression is the vector projection of $\mathbf{a}$ onto $\mathbf{b}$?
  parts:
    - id: a
      options:
        - { id: a, text: '$\dfrac{\mathbf{a}\cdot\mathbf{b}}{|\mathbf{b}|}$' }
        - { id: b, text: '$\left(\dfrac{\mathbf{a}\cdot\mathbf{b}}{|\mathbf{a}|^2}\right)\mathbf{a}$' }
        - { id: c, text: '$\left(\dfrac{\mathbf{a}\cdot\mathbf{b}}{|\mathbf{b}|^2}\right)\mathbf{b}$' }
        - { id: d, text: '$\left(\dfrac{\mathbf{a}\cdot\mathbf{b}}{|\mathbf{b}|^2}\right)\mathbf{a}$' }
      answer: { type: mcq, key: c }
  solution: |
    The projection onto $\mathbf{b}$ lies along $\mathbf{b}$, so it is a multiple of $\mathbf{b}$: $\left(\dfrac{\mathbf{a}\cdot\mathbf{b}}{|\mathbf{b}|^2}\right)\mathbf{b}$. Option a is the scalar projection, a number.

