    A mass hangs at rest from two strings. Its weight is 196 N, straight down. One string makes an angle of $30^\circ$ with the vertical and the other $60^\circ$ with the vertical, on opposite sides. Find the pull (tension) in each string, correct to one decimal place where needed.
