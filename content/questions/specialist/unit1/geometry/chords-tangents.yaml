    def answers(p, q, a):
        T, X, Y = (0, -2), (-3, -2), (3, -2)
        A, B = on_circle(270 - 2*p, 2), on_circle(270 + 2*q, 2)
        assert abs(angle_at(X, T, A) - p) < 1e-9 and abs(angle_at(Y, T, B) - q) < 1e-9
        return {"a": approx(angle_at(A, T, B)), "b": approx(angle_at(T, A, B)), "c": approx(angle_at(T, B, A))}

