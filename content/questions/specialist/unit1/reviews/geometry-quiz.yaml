    - { ma: 5, ab: 15, mb: 20, p: 100, v: 10, _view: '-2.55, 3.57, -2.5, 2.5', _M: '3.023, 0', _A: '1.961, -0.395', _B: '-1.226, -1.58', _T: '1.323, 1.5' }
    - { ma: 4, ab: 12, mb: 16, p: 64, v: 8, _view: '-2.55, 3.57, -2.5, 2.5', _M: '3.023, 0', _A: '1.961, -0.395', _B: '-1.226, -1.58', _T: '1.323, 1.5' }
  stem: |
    From a point $M$ outside a circle, a tangent touches the circle at $T$, and a secant cuts it at $A$ and $B$, with $A$ between $M$ and $B$. $MA = {{ma}}$ and $AB = {{ab}}$. Find $MT$.

    ```diagram
    view: [{{_view}}]
    width: 230
    points: { M: [{{_M}}], T: [{{_T}}], A: [{{_A}}], B: [{{_B}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: M, to: T }
      - { type: segment, from: M, to: A, label: '{{ma}}', side: right }
      - { type: segment, from: A, to: B, label: '{{ab}}', side: right }
      - { type: point, at: M, label: 'M', pos: e }
      - { type: point, at: T, label: 'T', pos: n }
      - { type: point, at: A, label: 'A', pos: s }
      - { type: point, at: B, label: 'B', pos: sw }
    ```
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Measure from $M$: $MB = {{ma}} + {{ab}} = {{mb}}$. Then $MT^2 = MA \times MB = {{p}}$, so $MT = {{v}}$.
  verify: |
    def answers(ma, ab, mb, p, v):
        import math
        R, d = 5.0, math.sqrt(25.0 + ma * mb)  # M at distance d from the center of a radius-5 circle
        M = (d, 0.0)
        T = tangent_point_toward((0, 0), R, M, 1)
        return {"a": approx(dist(M, T), 6)}

- id: spec.geometry.sq.exterior-and-opposite
  title: "Exterior and Opposite Angles of a Cyclic Quadrilateral"
  pool: section-quiz
  skills: { primary: spec.geometry.circle-problems }
  subsection: "Finding and proving angles"
  rating: 1440
  responseSkills: { reading: 1420, reasoning: 1430, calculation: 1400 }
  variants:
