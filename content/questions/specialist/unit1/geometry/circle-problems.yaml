  stem: |
    $A$, $B$, $C$ and $D$ are four points with $C$ and $D$ on the same side of line $AB$, and $\angle ACB = \angle ADB = 35^\circ$. What can you conclude?

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 250
    points: { A: [-1.8, -0.8], B: [1.8, -0.8], C: [0.684, 1.879], D: [-1.286, 1.532] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: C, to: A }
      - { type: segment, from: C, to: B }
      - { type: segment, from: D, to: A }
      - { type: segment, from: D, to: B }
      - { type: angle, at: C, from: A, to: B, label: '35^\circ', radius: 26 }
      - { type: angle, at: D, from: A, to: B, label: '35^\circ', radius: 26 }
      - { type: point, at: A, label: 'A', pos: w }
      - { type: point, at: B, label: 'B', pos: e }
      - { type: point, at: C, label: 'C', pos: n }
      - { type: point, at: D, label: 'D', pos: n }
    ```
  parts:
  - id: a
    options:
    - {id: a, text: $ABCD$ is a parallelogram}
    - {id: b, text: '$A$, $B$, $C$ and $D$ lie on a circle'}
    - {id: c, text: $AC = BD$}
    - {id: d, text: Nothing}
    answer: {type: mcq, key: b}
  solution: |
    $AB$ subtends equal angles at $C$ and $D$ on the same side, so by the converse of angles on the same arc, the four points are concyclic.
- id: spec.geometry.circle-problems.cyclic-exterior
  skills: {primary: spec.geometry.circle-problems}
  rating: 1200
  responseSkills: {reading: 1190, calculation: 1150}
  variants:
  - {e: 70}
  - {e: 112}
  stem: |
    A quadrilateral $ABCD$ has an exterior angle at $C$ (between $DC$ and $BC$ extended) of ${{e}}^\circ$, and $\angle DAB = {{e}}^\circ$. Is $ABCD$ cyclic?

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.65]
    width: 250
    points: { A: [-1.8, -1], B: [1.4, -1.4], C: [1.6, 1], D: [-1, 1.6], E: [1.7, 2.2] }
    draw:
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: segment, from: C, to: E }
      - { type: angle, at: C, from: E, to: D, label: '{{e}}^\circ', radius: 20 }
      - { type: angle, at: A, from: B, to: D, label: '{{e}}^\circ', radius: 22 }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: se }
      - { type: point, at: C, label: 'C', pos: e }
      - { type: point, at: D, label: 'D', pos: n }
      - { type: point, at: E, label: 'E', pos: ne }
    ```
  parts:
  - id: a
    options:
    - {id: a, text: 'Yes'}
    - {id: b, text: 'No'}
    - {id: c, text: Not enough information}
    answer: {type: mcq, key: a}
  solution: |
    The interior angle at $C$ is $180^\circ - {{e}}^\circ$, so $\angle DAB + \angle BCD = 180^\circ$. By the converse of the cyclic quadrilateral theorem, $ABCD$ is cyclic.
- id: spec.geometry.circle-problems.triangle-from-center-angles
  skills: {primary: spec.geometry.circle-problems}
  rating: 1300
  responseSkills: {reading: 1280, calculation: 1290, reasoning: 1290}
  variants:
    - { p: 140, q: 100, r: 120, a: 50, b: 60, c: 70, _A: '-0.684, -1.879', _B: '1.732, 1', _C: '-1.286, 1.532' }
    - { p: 130, q: 110, r: 120, a: 55, b: 60, c: 65, _A: '-0.684, -1.879', _B: '1.879, 0.684', _C: '-1.286, 1.532' }
    - { p: 120, q: 150, r: 90, a: 75, b: 45, c: 60, _A: '-0.684, -1.879', _B: '1.97, 0.347', _C: '-1.879, 0.684' }
    - { p: 100, q: 150, r: 110, a: 75, b: 55, c: 50, _A: '-0.684, -1.879', _B: '1.97, -0.347', _C: '-1.532, 1.286' }
    - { p: 160, q: 110, r: 90, a: 55, b: 45, c: 80, _A: '-0.684, -1.879', _B: '1.286, 1.532', _C: '-1.879, 0.684' }
  stem: |
    Triangle $ABC$ has its corners on a circle with center $O$ inside the triangle. $\angle AOB = {{p}}^\circ$ and $\angle BOC = {{q}}^\circ$. Find the angles of the triangle.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 230
    points: { A: [{{_A}}], B: [{{_B}}], C: [{{_C}}], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: polygon, points: [A, B, C] }
      - { type: segment, from: O, to: A, color: muted }
      - { type: segment, from: O, to: B, color: muted }
      - { type: segment, from: O, to: C, color: muted }
      - { type: point, at: A, label: 'A' }
      - { type: point, at: B, label: 'B' }
      - { type: point, at: C, label: 'C' }
      - { type: point, at: O, label: 'O', pos: e }
    ```
  parts:
  - id: a
    prompt: $\angle BAC$ (°)
    answer: {type: numeric, key: '{{a}}'}
  - id: b
    prompt: $\angle ABC$ (°)
    answer: {type: numeric, key: '{{b}}'}
  - id: c
    prompt: $\angle ACB$ (°)
    answer: {type: numeric, key: '{{c}}'}
  solution: |
    $\angle COA = 360^\circ - {{p}}^\circ - {{q}}^\circ = {{r}}^\circ$. Each angle of the triangle is half the angle at the center on the opposite side: $\angle BAC = \tfrac{1}{2} \times {{q}}^\circ = {{a}}^\circ$, $\angle ABC = \tfrac{1}{2} \times {{r}}^\circ = {{b}}^\circ$ and $\angle ACB = \tfrac{1}{2} \times {{p}}^\circ = {{c}}^\circ$.
  verify: |
    def answers(p, q, r, a, b, c):
        A, B, C = on_circle(250), on_circle(250 + p), on_circle(250 + p + q)
        O = (0, 0)
        assert abs(angle_at(A, O, B) - p) < 1e-9 and abs(angle_at(B, O, C) - q) < 1e-9
        return {"a": approx(angle_at(B, A, C)), "b": approx(angle_at(A, B, C)), "c": approx(angle_at(A, C, B))}

- id: spec.geometry.circle-problems.tangent-cyclic
  skills: {primary: spec.geometry.circle-problems}
  rating: 1320
  responseSkills: {reading: 1310, calculation: 1300, reasoning: 1310}
  variants:
    - { t: 36, _B: '1.902, -0.618' }
    - { t: 46, _B: '1.999, 0.07' }
    - { t: 54, _B: '1.902, 0.618' }
    - { t: 64, _B: '1.576, 1.231' }
    - { t: 72, _B: '1.176, 1.618' }
  stem: |
    $ABCD$ is a cyclic quadrilateral. The tangent at $A$ makes an angle of {{t}}° with $AB$, on the side away from $D$. Find $\angle ADB$ and $\angle ACB$.

    ```diagram
    view: [-2.45, 3.05, -2.45, 2.45]
    width: 230
    points: { A: [-0, -2], B: [{{_B}}], C: [-1, 1.732], D: [-1.97, -0.347], U: [-1.6, -2], V: [2.6, -2], O: [0, 0] }
    draw:
      - { type: circle, center: O, radius: 2 }
      - { type: segment, from: A, to: B }
      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: segment, from: D, to: B }
      - { type: segment, from: C, to: A }
      - { type: segment, from: U, to: V }
      - { type: angle, at: A, from: V, to: B, label: '{{t}}^\circ', radius: 24 }
      - { type: point, at: A, label: 'A', pos: s }
      - { type: point, at: B, label: 'B', pos: ne }
      - { type: point, at: C, label: 'C', pos: n }
      - { type: point, at: D, label: 'D', pos: w }
    ```
  parts:
  - id: a
    prompt: $\angle ADB$ (°)
    answer: {type: numeric, key: '{{t}}'}
  - id: b
    prompt: $\angle ACB$ (°)
    answer: {type: numeric, key: '{{t}}'}
  solution: |
    By the alternate segment theorem, the tangent–chord angle equals any angle on chord $AB$ in the alternate segment. $C$ and $D$ both lie in it, so $\angle ADB = \angle ACB = {{t}}^\circ$.
  verify: |
    def answers(t):
        A = on_circle(270)
        B = on_circle(270 + 2*t)
        C, D = on_circle(120), on_circle(200)
        Y = (3, -1)
        assert abs(angle_at(Y, A, B) - t) < 1e-9
        return {"a": approx(angle_at(A, D, B)), "b": approx(angle_at(A, C, B))}

- id: spec.geometry.circle-problems.cyclic-four-angles
