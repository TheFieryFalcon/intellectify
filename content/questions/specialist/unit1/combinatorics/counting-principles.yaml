- id: spec.combinatorics.counting-principles.square-divisors
  skills: { primary: spec.combinatorics.counting-principles }
  subsection: "Counting divisors"
  rating: 1590
  responseSkills: {calculation: 1500, reasoning: 1570, synthesis: 1580}
  variants:
    - { e: 6, v: 16 }
    - { e: 8, v: 25 }
  stem: |
    How many positive divisors of $10^{ {{e}} }$ are perfect squares?
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    $10^{ {{e}} } = 2^{ {{e}} } \cdot 5^{ {{e}} }$. A divisor $2^a 5^b$ is a perfect square exactly when $a$ and $b$ are both even. Each can be any even number from 0 to {{e}}, which is $\tfrac{ {{e}} }{2} + 1$ options, so there are $\left(\tfrac{ {{e}} }{2} + 1\right)^2 = {{v}}$ square divisors.
  verify: |
    def answers(e, v):
        return {"a": sum(1 for d in divisors(10**e) if integer_nthroot(d, 2)[1])}

