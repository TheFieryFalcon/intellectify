# ─────────────── Tier 2 ───────────────
- id: spec.combinatorics.combinations.exactly-two-women
  skills: { primary: spec.combinatorics.combinations }
  rating: 1330
  responseSkills: { calculation: 1300, reading: 1330 }
  stem: |
    A committee of 4 is chosen from 7 women and 5 men. How many committees contain exactly 2 women?
  parts:
    - id: a
