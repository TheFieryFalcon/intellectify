- id: spec.geometry.circle-problems.prove-cyclic-converse
  skills: {primary: spec.geometry.circle-problems}
  rating: 1420
  bookwork: true
  responseSkills: {reasoning: 1410, proof: 1410, clarity: 1330, synthesis: 1380}
  stem: |
    Prove by contradiction: if a quadrilateral $ABCD$ has $\angle B + \angle D = 180^\circ$, then it is cyclic.

    ```diagram
    view: [-2.45, 2.45, -2.45, 2.45]
    width: 240
    points: { A: [-1.8, -0.9], B: [1.5, -1.5], C: [1.9, 0.9], D: [-0.7, 1.9] }
    draw:
