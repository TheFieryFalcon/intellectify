    - { r: 10, t: 240, k1: '-5', k2: '-5\sqrt{3}' }
  stem: |
    A vector has magnitude {{r}} and makes an angle of ${{t}}^\circ$ with the positive $x$-direction (measured anticlockwise). Write it in the form $a\mathbf{i} + b\mathbf{j}$, with exact values.
  parts:
    - id: a
      answer: { type: vector, key: ['{{k1}}', '{{k2}}'], form: [exact] }
  solution: |
    $r\cos\theta\,\mathbf{i} + r\sin\theta\,\mathbf{j} = {{r}}\cos {{t}}^\circ\,\mathbf{i} + {{r}}\sin {{t}}^\circ\,\mathbf{j} = {{k1}}\,\mathbf{i} + ({{k2}})\mathbf{j}$.
  verify: |
    def answers(r, t, k1, k2):
        a = rad(t)
        return {"a": [r*cos(a), r*sin(a)]}

- id: spec.vectors-2d.components.direction-angle
