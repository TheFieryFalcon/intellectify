- id: spec.u1.quiz.contrapositive-square
  title: "Contrapositive of \"If n² Is Even\""
  pool: unit-quiz
  skills: { primary: spec.geometry.logic }
  subsection: "Implication, converse and contrapositive"
  rating: 1280
  responseSkills: { reading: 1270, precision: 1260 }
  stem: |
    Which statement is the contrapositive of "If $n^2$ is even, then $n$ is even"?
  parts:
    - id: a
      options:
        - { id: a, text: 'If $n$ is even, then $n^2$ is even.' }
        - { id: b, text: 'If $n^2$ is odd, then $n$ is odd.' }
        - { id: c, text: 'If $n^2$ is even, then $n$ is odd.' }
        - { id: d, text: 'If $n$ is odd, then $n^2$ is odd.' }
      answer: { type: mcq, key: d }
  solution: |
    Swap the parts and negate both: "If $n$ is not even, then $n^2$ is not even", i.e. (d).
  verify: |
    def answers():
        return {'a': 'd'}

- id: spec.u1.quiz.dot-perp-check
  title: "Scalar Product of Two Vectors (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.vectors-2d.scalar-product }
  subsection: "Calculating the scalar product"
  rating: 1300
  responseSkills: { calculation: 1280, reasoning: 1290 }
  stem: |
    Find $(3\mathbf{i} - 2\mathbf{j}) \cdot (4\mathbf{i} + 6\mathbf{j})$.
  parts:
    - id: a
      answer: { type: numeric, key: 0 }
  solution: |
    $12 - 12 = 0$, so the vectors are perpendicular.
  verify: |
    def answers():
        return {'a': 3 * 4 + (-2) * 6}

- id: spec.u1.quiz.tangent-length-8-17
  title: "Length of a Tangent from a Point (Quiz)"
  pool: unit-quiz
  skills: { primary: spec.geometry.chords-tangents }
  subsection: "Tangent and radius"
  rating: 1320
  responseSkills: { calculation: 1300 }
  stem: |
    A circle has radius 8. A point $M$ is 17 units from the center. Find the length of a tangent from $M$ to the circle.
  parts:
    - id: a
      answer: { type: numeric, key: 15 }
  solution: |
    The tangent is perpendicular to the radius: $\sqrt{17^2 - 8^2} = 15$.
  verify: |
    def answers():
        return {'a': sympy.sqrt(17**2 - 8**2)}

