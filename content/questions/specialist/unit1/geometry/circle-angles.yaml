  parts:
  - id: a
    prompt: $\angle AXB$ (°)
    answer: {type: numeric, key: '115'}
  solution: |
    $\angle BAC = \angle BDC = 25^\circ$ (same arc $BC$). In triangle $AXB$: $\angle AXB = 180^\circ - \angle XAB - \angle XBA = 180^\circ - 25^\circ - 40^\circ = 115^\circ$.
  verify: |
    def answers():
        A, B, C, D = on_circle(0), on_circle(100), on_circle(150), on_circle(280)
        assert abs(angle_at(A, B, D) - 40) < 1e-9 and abs(angle_at(B, D, C) - 25) < 1e-9
        X = line_meet(A, C, B, D)
        return {"a": approx(angle_at(A, X, B))}
