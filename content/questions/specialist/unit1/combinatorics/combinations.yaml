- id: spec.combinatorics.combinations.grid-triangles
  skills: {primary: spec.combinatorics.combinations}
  subsection: "Counting shapes"
  rating: 1730
  responseSkills: {calculation: 1660, reasoning: 1710, synthesis: 1730}
  stem: |
    16 points form a 4 by 4 square grid. How many triangles have all three corners at these points?
  parts:
  - id: a
    answer: {type: numeric, key: '516'}
  solution: |
    Every 3 points make a triangle unless they lie on a line. Total triples: $\dbinom{16}{3} = 560$. Subtract the collinear ones:
    - 4 rows and 4 columns, each with $\dbinom{4}{3} = 4$ triples: $32$.
    - 2 long diagonals with 4 points each: $8$.
    - 4 shorter diagonals with 3 points each: $4$.

    That's $44$ collinear triples, so $560 - 44 = 516$ triangles.
  verify: |
    from itertools import combinations
    def answers():
        pts = [(x, y) for x in range(4) for y in range(4)]
        col = lambda a, b, c: (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]) == 0
        return {"a": sum(1 for t in combinations(pts, 3) if not col(*t))}
