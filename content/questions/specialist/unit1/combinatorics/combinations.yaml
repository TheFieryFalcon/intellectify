  solution: |
    Five cards covering four suits means one suit appears twice and the others once. Choose that suit (4 ways), 2 of its cards ($\binom{13}{2} = 78$), and one card from each other suit ($13^3$): $4 \times 78 \times 2197 = 685\,464$.
