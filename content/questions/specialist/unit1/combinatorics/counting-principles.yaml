- id: spec.combinatorics.counting-principles.pin-codes
  skills: { primary: spec.combinatorics.counting-principles }
  subsection: "Multiplication principle"
  rating: 1060
  responseSkills: { calculation: 1050 }
  variants:
    - { n: 3, total: 1000 }
    - { n: 4, total: 10000 }
    - { n: 5, total: 100000 }
  stem: |
    A PIN is made of {{n}} digits, each from 0 to 9. Digits may repeat. How many different PINs are possible?
  parts:
    - id: a
      answer: { type: numeric, key: '{{total}}' }
  solution: |
    Each of the {{n}} positions has 10 options, so there are $10^{ {{n}} } = {{total}}$ PINs.
  verify: |
    def answers(n, total):
        return {"a": 10**n}

- id: spec.combinatorics.counting-principles.factorial-quotient
  skills: { primary: spec.combinatorics.counting-principles }
  subsection: "Factorials and nPr"
  rating: 1080
  responseSkills: { calculation: 1080 }
  variants:
    - { n: 7, k: 5, v: 42 }
    - { n: 9, k: 6, v: 504 }
    - { n: 10, k: 7, v: 720 }
    - { n: 12, k: 10, v: 132 }
  stem: |
    Evaluate $\dfrac{ {{n}}! }{ {{k}}! }$ without a calculator.
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    Cancel the common factors: $\dfrac{ {{n}}! }{ {{k}}! }$ is the product of the whole numbers from ${{k}}+1$ to ${{n}}$, which is ${{v}}$.
  verify: |
    def answers(n, k, v):
        return {"a": factorial(n) / factorial(k)}

- id: spec.combinatorics.counting-principles.npr-evaluate
  skills: { primary: spec.combinatorics.counting-principles }
  subsection: "Factorials and nPr"
  rating: 1120
  responseSkills: { calculation: 1100 }
  variants:
    - { n: 8, r: 3, v: 336 }
    - { n: 10, r: 2, v: 90 }
    - { n: 6, r: 4, v: 360 }
    - { n: 9, r: 3, v: 504 }
  stem: |
    Evaluate $^{ {{n}} }P_{ {{r}} }$.
  parts:
    - id: a
      answer: { type: numeric, key: '{{v}}' }
  solution: |
    $^{ {{n}} }P_{ {{r}} } = \dfrac{ {{n}}! }{({{n}}-{{r}})!} = {{v}}$: multiply the {{r}} largest whole numbers up to {{n}}.
  verify: |
    def answers(n, r, v):
        return {"a": factorial(n) / factorial(n - r)}

