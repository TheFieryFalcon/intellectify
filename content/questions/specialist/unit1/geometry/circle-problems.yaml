    $\angle ACB = 90^\circ$, so $C$ lies on the circle with diameter $AB$ (converse of the angle in a semicircle). Its center is $M$ and its radius is $\tfrac{1}{2}AB$, and $MC$ is a radius. So $MC = \tfrac{1}{2}AB$.
- id: spec.geometry.circle-problems.perpendicular-diagonals-radius
  skills: {primary: spec.geometry.circle-problems}
  rating: 1720
  responseSkills: {calculation: 1660, reasoning: 1710, synthesis: 1720}
  stem: |
    $ABCD$ is a cyclic quadrilateral whose diagonals meet at right angles at $X$. $AX = 3$, $XC = 8$ and $BX = 4$. Find $XD$ and the exact radius of the circle.
  parts:
  - id: a
    prompt: $XD$
    answer: {type: numeric, key: '6'}
  - id: b
    prompt: Radius
    answer:
      type: numeric
      key: \frac{5\sqrt{5}}{2}
      form: [exact]
  solution: |
    Intersecting chords: $XD = \tfrac{3 \times 8}{4} = 6$.
    Put $X$ at the origin with $A(-3, 0)$, $C(8, 0)$, $B(0, 4)$, $D(0, -6)$. The center lies on the perpendicular bisectors of both chords: $x = 2.5$ and $y = -1$. The radius is the distance to $A$: $\sqrt{5.5^2 + 1^2} = \sqrt{31.25} = \tfrac{5\sqrt{5}}{2}$.
  verify: |
    def answers():
        A, C, B = (-3, 0), (8, 0), (0, 4)
        x0 = (A[0] + C[0]) / 2
        y = symbols("y", real=True)
        y0 = solve((x0 - A[0])**2 + y**2 - ((x0 - B[0])**2 + (y - B[1])**2), y)[0]
        r = sqrt((x0 - A[0])**2 + y0**2)
        t = line_circle((0, 0), 90, float(r), (x0, float(y0)))
        return {"a": approx(-t[0]), "b": nsimplify(r)}
- id: spec.geometry.circle-problems.bisector-equal-chords
  skills: {primary: spec.geometry.circle-problems}
  rating: 1700
  responseSkills: {reasoning: 1700, proof: 1700, clarity: 1600, synthesis: 1680}
  stem: |
    In triangle $ABC$, the bisector of angle $A$ meets the circle through $A$, $B$ and $C$ again at $D$. Prove that $DB = DC$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: bisect, description: ∠BAD = ∠DAC (bisector), points: 1, dimension: reasoning}
      - {id: chords, description: 'Equal angles at the circumference stand on equal chords (or: ∠DBC = ∠DAC and ∠DCB = ∠DAB, same arcs)', points: 2, dimension: reasoning}
      - {id: conclude, description: 'So triangle DBC is isosceles, or the chords are equal: DB = DC', points: 2, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    $\angle BAD = \angle DAC$. Also $\angle DCB = \angle DAB$ (same arc $DB$) and $\angle DBC = \angle DAC$ (same arc $DC$). So $\angle DCB = \angle DBC$, triangle $DBC$ is isosceles, and $DB = DC$.
- id: spec.geometry.circle-problems.constant-angle
  skills: {primary: spec.geometry.circle-problems}
  rating: 1780
  responseSkills: {reasoning: 1780, proof: 1780, clarity: 1660, synthesis: 1760}
  stem: |
    Two circles meet at $P$ and $Q$. A line through $P$ meets the first circle again at $A$ and the second circle again at $B$, with $P$ between $A$ and $B$. Prove that $\angle AQB$ is the same for every such line.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: first, description: '∠PAQ is constant: angle on the fixed arc PQ of the first circle', points: 2, dimension: reasoning}
      - {id: second, description: '∠PBQ is constant: angle on the fixed arc PQ of the second circle', points: 2, dimension: proof}
      - {id: sum, description: 'In triangle AQB, ∠AQB = 180° − ∠QAB − ∠QBA is therefore constant', points: 1, dimension: synthesis}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    As the line turns, $A$ moves around the first circle but $\angle QAP$ always stands on the fixed chord $PQ$, so it is constant (angles on the same arc). Likewise $\angle QBP$ is constant in the second circle. In triangle $AQB$, $\angle AQB = 180^\circ - \angle QAB - \angle QBA$, which is therefore constant.
- id: spec.geometry.circle-problems.extended-sides
  skills: {primary: spec.geometry.circle-problems}
  rating: 1760
  responseSkills: {calculation: 1700, reasoning: 1750, synthesis: 1760}
  stem: |
    $ABCD$ is a cyclic quadrilateral. Lines $AB$ and $DC$ meet at $E$ (beyond $B$ and $C$), and lines $AD$ and $BC$ meet at $F$ (beyond $D$ and $C$). $\angle AED = 30^\circ$ and $\angle AFB = 40^\circ$. Find $\angle DAB$.
  parts:
  - id: a
    prompt: $\angle DAB$ (°)
    answer: {type: numeric, key: '55'}
  solution: |
    Let $\angle DAB = x$. In triangle $ADE$, $\angle ADC = 180^\circ - x - 30^\circ$. In triangle $ABF$, $\angle ABC = 180^\circ - x - 40^\circ$. Opposite angles of the cyclic quadrilateral add to $180^\circ$: $(150^\circ - x) + (140^\circ - x) = 180^\circ$, so $2x = 110^\circ$ and $x = 55^\circ$.
  verify: |
    def answers():
        # Angles A = 55, B = 85, C = 125, D = 95 give arcs AB = 140, BC = 50, CD = 60, DA = 110.
        A, B, C, D = on_circle(0), on_circle(140), on_circle(190), on_circle(250)
        E = line_meet(A, B, D, C)
        F = line_meet(A, D, B, C)
        assert abs(angle_at(A, E, D) - 30) < 1e-6 and abs(angle_at(A, F, B) - 40) < 1e-6
        return {"a": approx(angle_at(D, A, B), 4)}
- id: spec.geometry.circle-problems.square-center-circle
  skills: {primary: spec.geometry.circle-problems}
  rating: 1700
  responseSkills: {calculation: 1640, reasoning: 1690, synthesis: 1700}
  stem: |
    $ABCD$ is a square with side 2 and center $O$. Find the radius of the circle through $A$, $B$ and $O$.
  parts:
  - id: a
    prompt: Radius
    answer: {type: numeric, key: '1'}
  solution: |
    The diagonals of a square meet at right angles, so $\angle AOB = 90^\circ$. By the converse of the angle in a semicircle, $O$ lies on the circle with diameter $AB$. That circle passes through $A$, $B$ and $O$, and its radius is $\tfrac{1}{2}AB = 1$.
  verify: |
    def answers():
        A, B, O = (0, 0), (2, 0), (1, 1)
        k = symbols("k", real=True)
        kv = solve((1 + k**2) - ((1 - 1)**2 + (1 - k)**2), k)[0]
        return {"a": sqrt(1 + kv**2)}
