      - { type: segment, from: B, to: C }
      - { type: segment, from: C, to: D }
      - { type: segment, from: D, to: A }
      - { type: angle, at: B, from: C, to: A, radius: 18 }
      - { type: angle, at: D, from: A, to: C, radius: 18 }
      - { type: point, at: A, label: 'A', pos: sw }
      - { type: point, at: B, label: 'B', pos: se }
      - { type: point, at: C, label: 'C', pos: e }
      - { type: point, at: D, label: 'D', pos: n }
    ```
  parts:
  - id: a
    rubric:
      criteria:
      - {id: circle, description: 'Draws the circle through A, B, C and supposes D is not on it', points: 1, dimension: proof}
      - {id: meet, description: Lets AD (or line through D) meet the circle at D′ ≠ D, points: 1, dimension: synthesis}
      - {id: angles, description: ∠AD′C = 180° − ∠B = ∠ADC (cyclic quadrilateral ABCD′), points: 2, dimension: reasoning}
      - {id: contra, description: 'But an exterior angle of triangle DD′C can''t equal its interior opposite angle: contradiction', points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Draw the circle through $A$, $B$, $C$, and suppose $D$ isn't on it. Let line $AD$ meet the circle again at $D' \ne D$. $ABCD'$ is cyclic, so $\angle AD'C = 180^\circ - \angle B = \angle ADC$.
