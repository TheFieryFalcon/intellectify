    Let $L = AB = CD$. Then $AX + XB = L = CX + XD$, and by the intersecting chords theorem $AX \times XB = CX \times XD = P$.

    Two numbers with sum $L$ and product $P$ are the roots of $t^2 - Lt + P = 0$, since $(t - u)(t - v) = t^2 - (u + v)t + uv$. A quadratic has at most two roots, so $\{AX, XB\}$ and $\{CX, XD\}$ are the same pair of numbers. Hence $AX = CX$ and $XB = XD$, or $AX = XD$ and $XB = CX$.

