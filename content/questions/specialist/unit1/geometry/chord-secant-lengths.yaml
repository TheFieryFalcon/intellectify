- id: spec.geometry.chord-secant-lengths.arch
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1640
  responseSkills: {synthesis: 1630, calculation: 1580}
  stem: |
    A bridge has an arch in the shape of an arc of a circle. The arch spans 12 m (the straight distance between its feet) and rises 2 m at its middle. Find the radius of the circle.
  parts:
  - id: a
    prompt: Radius (m)
    answer: {type: numeric, key: '10'}
  solution: |
    The span is a chord of length 12, and the rise lies on the diameter perpendicular to it, which cuts it into 6 and 6. That diameter is cut into $2$ and $2r - 2$. Intersecting chords: $6 \times 6 = 2(2r - 2)$, so $36 = 4r - 4$ and $r = 10$ m.
  verify: |
    def answers():
        # Circle center (0, k) through (±6, 0) and (0, 2): solve for k, then the radius.
        k = symbols("k", real=True)
        kv = solve((6**2 + k**2) - (2 - k)**2, k)[0]
        return {"a": sqrt(36 + kv**2)}
- id: spec.geometry.chord-secant-lengths.perpendicular-chords-radius
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1680
  responseSkills: {synthesis: 1670, calculation: 1620}
  stem: |
    Chords $AB$ and $CD$ meet at right angles at $X$. $AX = 2$, $XB = 6$ and $CX = 3$. Find $XD$ and the exact radius of the circle.
  parts:
  - id: a
    prompt: $XD$
    answer: {type: numeric, key: '4'}
  - id: b
    prompt: Radius
    answer:
      type: numeric
      key: \frac{\sqrt{65}}{2}
      form: [exact]
  solution: |
    Intersecting chords: $XD = \tfrac{2 \times 6}{3} = 4$.
    Put $X$ at the origin with $A(-2, 0)$, $B(6, 0)$, $C(0, 3)$, $D(0, -4)$. The center is on the perpendicular bisectors of both chords: $x = 2$ and $y = -\tfrac{1}{2}$. The radius is the distance to $A$: $\sqrt{4^2 + \left(\tfrac{1}{2}\right)^2} = \tfrac{\sqrt{65}}{2}$.
  verify: |
    def answers():
        A, B, C = (-2, 0), (6, 0), (0, 3)
        # Circle through A, B, C, then the second meeting point with the y-axis.
        x0 = (A[0] + B[0]) / 2
        y = symbols("y", real=True)
        y0 = solve((x0 - A[0])**2 + (y - A[1])**2 - ((x0 - C[0])**2 + (y - C[1])**2), y)[0]
        r = sqrt((x0 - A[0])**2 + (y0 - A[1])**2)
        t = line_circle((0, 0), 90, float(r), (x0, float(y0)))
        return {"a": approx(-t[0]), "b": nsimplify(r)}
- id: spec.geometry.chord-secant-lengths.circle-through-square
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1720
  responseSkills: {synthesis: 1720, calculation: 1660}
  stem: |
    $ABCD$ is a square with side 4. A circle passes through $A$ and $B$ and touches the opposite side $CD$. Find its radius.
  parts:
  - id: a
    prompt: Radius
    answer: {type: numeric, key: '2.5'}
  solution: |
    By symmetry the circle touches $CD$ at its midpoint $T$, and the line through $T$ perpendicular to $CD$ is a diameter, which also cuts chord $AB$ in half at $N$. $NT = 4$, and the diameter is cut at $N$ into $4$ and $2r - 4$. Intersecting chords: $2 \times 2 = 4(2r - 4)$, so $2r - 4 = 1$ and $r = 2.5$.
  verify: |
    def answers():
        k = symbols("k", real=True)
        # Center (2, k): distance to A(0, 0) equals distance to the line y = 4.
        kv = [s for s in solve(4 + k**2 - (4 - k)**2, k)][0]
        return {"a": 4 - kv}
- id: spec.geometry.chord-secant-lengths.radical-axis-bisects
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1740
  responseSkills: {proof: 1740, synthesis: 1720, clarity: 1620}
  stem: |
    Two circles meet at $P$ and $Q$. A line touches the first circle at $A$ and the second at $B$. Prove that the line $PQ$, extended, cuts $AB$ in half.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: meet, description: Lets PQ extended meet AB at N, points: 1, dimension: proof}
      - {id: power1, description: 'Tangent–secant in the first circle: NA² = NP × NQ', points: 2, dimension: proof}
      - {id: power2, description: 'Tangent–secant in the second circle: NB² = NP × NQ', points: 1, dimension: proof}
      - {id: conclude, description: So NA = NB, points: 1, dimension: proof}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    Let $PQ$ extended meet $AB$ at $N$. From $N$, line $NA$ is a tangent to the first circle and $NPQ$ is a secant, so $NA^2 = NP \times NQ$. Likewise $NB^2 = NP \times NQ$ for the second circle. So $NA^2 = NB^2$ and $NA = NB$: $N$ is the midpoint of $AB$.
- id: spec.geometry.chord-secant-lengths.converse-concyclic
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1780
  responseSkills: {proof: 1780, synthesis: 1760, clarity: 1660}
  stem: |
    Lines $AB$ and $CD$ meet at $X$, with $X$ between $A$ and $B$ and between $C$ and $D$, and $AX \times XB = CX \times XD$. Prove that $A$, $B$, $C$ and $D$ lie on a circle.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: ratio, description: Rewrites as AX/CX = XD/XB, points: 1, dimension: proof}
      - {id: similar, description: 'With ∠AXC = ∠DXB (vertically opposite), triangles AXC and DXB are similar (two sides in ratio, included angle)', points: 2, dimension: proof}
      - {id: angles, description: 'So ∠XAC = ∠XDB, i.e. ∠BAC = ∠BDC', points: 1, dimension: proof}
      - {id: converse, description: 'AB... segment BC subtends equal angles at A and D on the same side, so the points are concyclic (converse)', points: 1, dimension: synthesis}
      - {id: clear, description: 'Clearly set out, with a reason for each step', points: 1, dimension: clarity}
  solution: |
    From $AX \times XB = CX \times XD$, $\dfrac{AX}{CX} = \dfrac{XD}{XB}$. Also $\angle AXC = \angle DXB$ (vertically opposite), so triangles $AXC$ and $DXB$ are similar (two pairs of sides in the same ratio with the included angles equal). Hence $\angle CAX = \angle BDX$, i.e. $\angle CAB = \angle CDB$.
    Segment $BC$ subtends equal angles at $A$ and $D$, which are on the same side of $BC$. By the converse of angles on the same arc, $A$, $B$, $C$ and $D$ are concyclic.
- id: spec.geometry.chord-secant-lengths.harmonic-quadrilateral
  skills: {primary: spec.geometry.chord-secant-lengths}
  rating: 1790
  responseSkills: {proof: 1790, synthesis: 1780, clarity: 1680}
  stem: |
    From an outside point $M$, tangents touch a circle at $S$ and $T$, and a secant cuts it at $A$ and $B$. Prove that $SA \times TB = SB \times TA$.
  parts:
  - id: a
    rubric:
      criteria:
      - {id: sim1, description: 'Triangles MSA and MBS are similar (alternate segment, common angle), so SA/SB = MS/MB', points: 2, dimension: proof}
      - {id: sim2, description: Likewise triangles MTA and MBT give TA/TB = MT/MB, points: 1, dimension: proof}
      - {id: equal, description: 'MS = MT (equal tangents), so SA/SB = TA/TB', points: 1, dimension: proof}
      - {id: conclude, description: Cross-multiplies to the result, points: 1, dimension: clarity}
  solution: |
    Triangles $MSA$ and $MBS$ share the angle at $M$, and $\angle MSA = \angle MBS$ by the alternate segment theorem. So they are similar, and $\dfrac{SA}{BS} = \dfrac{MS}{MB}$. In the same way, $\dfrac{TA}{BT} = \dfrac{MT}{MB}$.
    The tangents are equal, $MS = MT$, so $\dfrac{SA}{SB} = \dfrac{TA}{TB}$, i.e. $SA \times TB = SB \times TA$.
