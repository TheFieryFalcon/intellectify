- id: spec.vectors-2d.geometric.parallelogram-diagonal
  title: "Diagonal of a Parallelogram"
  skills: { primary: spec.vectors-2d.geometric }
  subsection: "Adding and subtracting"
  rating: 1150
  responseSkills: {reading: 1150, calculation: 1100}
  stem: |
    $OABC$ is a parallelogram, with $\overrightarrow{OA} = \mathbf{a}$ and $\overrightarrow{OC} = \mathbf{c}$. Find $\overrightarrow{OB}$ in terms of $\mathbf{a}$ and $\mathbf{c}$.
  parts:
    - id: a
      answer: { type: expression, key: 'a+c', vars: { a: {}, c: {} } }
  solution: |
    Opposite sides are equal vectors, so $\overrightarrow{AB} = \overrightarrow{OC} = \mathbf{c}$. Then $\overrightarrow{OB} = \overrightarrow{OA} + \overrightarrow{AB} = \mathbf{a} + \mathbf{c}$.
  verify: |
    def answers():
        a, c = symbols("a c")
        return {"a": a + c}

- id: spec.vectors-2d.geometric.parallelogram-other-diagonal
  title: "Other Diagonal of a Parallelogram"
  skills: { primary: spec.vectors-2d.geometric }
  subsection: "Adding and subtracting"
  rating: 1200
  responseSkills: {reading: 1200, calculation: 1150}
  stem: |
    $OABC$ is a parallelogram, with $\overrightarrow{OA} = \mathbf{a}$ and $\overrightarrow{OC} = \mathbf{c}$. Find $\overrightarrow{AC}$ in terms of $\mathbf{a}$ and $\mathbf{c}$.
  parts:
    - id: a
      answer: { type: expression, key: 'c-a', vars: { a: {}, c: {} } }
  solution: |
    Go from $A$ back to $O$, then to $C$: $\overrightarrow{AC} = -\mathbf{a} + \mathbf{c} = \mathbf{c} - \mathbf{a}$.
  verify: |
    def answers():
        a, c = symbols("a c")
        return {"a": c - a}

