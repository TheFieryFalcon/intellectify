  stem: |
    Two circles meet at $A$ and $B$. $AC$ is a diameter of the first circle and $AD$ is a diameter of the second. Prove that $C$, $B$ and $D$ lie on one straight line.

    ```diagram
    view: [-3, 3.4, -2.4, 2.3]
    width: 280
    points: { A: [-0.2, 1.386], B: [-0.2, -1.386], C: [-1.8, -1.386], D: [2.4, -1.386], P1: [-1, 0], P2: [1.1, 0] }
